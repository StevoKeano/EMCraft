<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D Surface Plotter — z = f(x, y)</title>

<!-- Libraries -->
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.0.0/math.min.js"></script>

<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --panel-2: #171b24;
    --border: #262c38;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --accent: #5b8cff;
    --accent-2: #7c5bff;
    --danger: #ff5c6c;
    --ok: #3ddc97;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overflow: hidden;
  }

  #app {
    display: flex;
    height: 100vh;
    width: 100vw;
  }

  /* ---------- Sidebar ---------- */
  #sidebar {
    flex: 0 0 340px;
    width: 340px;
    height: 100%;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border-right: 1px solid var(--border);
    padding: 18px 18px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  #sidebar::-webkit-scrollbar { width: 8px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .brand .logo {
    width: 34px; height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid; place-items: center;
    font-size: 18px;
    box-shadow: 0 4px 14px rgba(91,140,255,.35);
  }
  .brand h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 650;
    letter-spacing: .2px;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--muted);
  }

  .section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.1px;
    color: var(--muted);
    font-weight: 700;
  }

  label.field-label {
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
  }

  input[type="text"],
  input[type="number"],
  select {
    width: 100%;
    background: #0e1118;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius);
    padding: 10px 12px;
    font-size: 13px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,140,255,.18);
  }

  input[type="text"].eq {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    letter-spacing: .3px;
  }

  .row {
    display: flex;
    gap: 10px;
  }
  .row > div { flex: 1; display: flex; flex-direction: column; gap: 6px; }

  .btn {
    width: 100%;
    border: none;
    border-radius: var(--radius);
    padding: 11px 14px;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    cursor: pointer;
    transition: transform .08s, filter .15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(1px); }

  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    font-weight: 600;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--accent); filter: none; }

  /* Range slider */
  .slider-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .slider-value {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--accent);
    background: rgba(91,140,255,.12);
    padding: 2px 8px;
    border-radius: 6px;
  }
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 6px;
    background: #0e1118;
    border: 1px solid var(--border);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0b0d12;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(91,140,255,.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid #0b0d12;
    cursor: pointer;
  }

  /* Checkbox */
  .check {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    color: var(--text);
    cursor: pointer;
    user-select: none;
  }
  .check input[type="checkbox"] {
    width: 17px; height: 17px;
    accent-color: var(--accent);
    cursor: pointer;
  }

  /* Error banner */
  #error {
    display: none;
    background: rgba(255, 92, 108, .12);
    border: 1px solid rgba(255, 92, 108, .45);
    color: #ffb3bb;
    font-size: 12.5px;
    line-height: 1.45;
    padding: 10px 12px;
    border-radius: var(--radius);
    word-break: break-word;
  }
  #error.show { display: block; }

  /* Status line */
  #status {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  #status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 8px rgba(61,220,151,.7);
  }
  #status.err .dot { background: var(--danger); box-shadow: 0 0 8px rgba(255,92,108,.7); }

  .hint {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
  }
  .hint code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: var(--accent);
    background: rgba(91,140,255,.1);
    padding: 1px 5px;
    border-radius: 4px;
  }

  /* ---------- Plot area ---------- */
  #plot-wrap {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    position: relative;
    background: radial-gradient(circle at 50% 40%, #141a26 0%, #0b0d12 70%);
  }
  #plot {
    width: 100%;
    height: 100%;
  }

  #badge {
    position: absolute;
    top: 14px;
    left: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 12px;
    color: var(--muted);
    background: rgba(11,13,18,.65);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 8px;
    pointer-events: none;
    max-width: 60%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---------- Responsive ---------- */
  @media (max-width: 820px) {
    #app { flex-direction: column; }
    #sidebar {
      flex: 0 0 auto;
      width: 100%;
      height: auto;
      max-height: 46vh;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    #plot-wrap { flex: 1 1 auto; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- ================= SIDEBAR ================= -->
  <aside id="sidebar">
    <div class="brand">
      <div class="logo">∑</div>
      <div>
        <h1>3D Surface Plotter</h1>
        <p>Interactive z = f(x, y)</p>
      </div>
    </div>

    <!-- Equation -->
    <div class="section">
      <div class="section-title">Equation</div>
      <label class="field-label" for="equation">f(x, y)</label>
      <input id="equation" class="eq" type="text" value="x^3 - 3*x*y^2"
             placeholder="e.g. x^2 - y^2" autocomplete="off" spellcheck="false" />
      <div class="hint">
        Supports <code>+ - * / ^</code>, <code>sin</code>, <code>cos</code>, <code>exp</code>,
        <code>sqrt</code>, <code>log</code>, <code>abs</code>, <code>pi</code>, <code>e</code>.
      </div>
    </div>

    <!-- Presets -->
    <div class="section">
      <div class="section-title">Presets</div>
      <select id="preset">
        <option value="x^3 - 3*x*y^2">Monkey Saddle</option>
        <option value="x^2 - y^2">Hyperbolic Paraboloid</option>
        <option value="exp(-(x^2 + y^2))">Gaussian Bell</option>
        <option value="sin(x^2 + y^2) / (x^2 + y^2 + 0.1)">Ripple Wave</option>
        <option value="(1 - (x^2 + y^2)) * exp(-(x^2 + y^2)/2)">Mexican Hat</option>
      </select>
    </div>

    <!-- Domain -->
    <div class="section">
      <div class="section-title">Domain</div>
      <div class="row">
        <div>
          <label class="field-label" for="xmin">X Min</label>
          <input id="xmin" type="number" value="-5" step="0.5" />
        </div>
        <div>
          <label class="field-label" for="xmax">X Max</label>
          <input id="xmax" type="number" value="5" step="0.5" />
        </div>
      </div>
      <div class="row">
        <div>
          <label class="field-label" for="ymin">Y Min</label>
          <input id="ymin" type="number" value="-5" step="0.5" />
        </div>
        <div>
          <label class="field-label" for="ymax">Y Max</label>
          <input id="ymax" type="number" value="5" step="0.5" />
        </div>
      </div>
    </div>

    <!-- Resolution -->
    <div class="section">
      <div class="section-title">Resolution</div>
      <div class="slider-head">
        <label class="field-label" for="resolution">Grid Resolution</label>
        <span class="slider-value" id="res-value">60</span>
      </div>
      <input id="resolution" type="range" min="20" max="150" step="1" value="60" />
    </div>

    <!-- Visuals -->
    <div class="section">
      <div class="section-title">Visuals</div>
      <label class="field-label" for="colorscale">Colorscale</label>
      <select id="colorscale">
        <option value="Viridis" selected>Viridis</option>
        <option value="Plasma">Plasma</option>
        <option value="Jet">Jet</option>
        <option value="Portland">Portland</option>
        <option value="Cividis">Cividis</option>
      </select>
      <label class="check">
        <input id="contours" type="checkbox" />
        <span>Show contour lines on Z-axis</span>
      </label>
    </div>

    <!-- Actions -->
    <div class="section">
      <button class="btn" id="render-btn" type="button">Render Surface</button>
      <button class="btn btn-ghost" id="reset-btn" type="button">Reset to Defaults</button>
    </div>

    <!-- Error + status -->
    <div id="error" role="alert" aria-live="polite"></div>
    <div id="status"><span class="dot"></span><span id="status-text">Ready</span></div>
  </aside>

  <!-- ================= PLOT ================= -->
  <main id="plot-wrap">
    <div id="badge">z = x^3 - 3*x*y^2</div>
    <div id="plot"></div>
  </main>
</div>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ *
   *  Element references
   * ------------------------------------------------------------------ */
  const el = {
    equation:   document.getElementById("equation"),
    preset:     document.getElementById("preset"),
    xmin:       document.getElementById("xmin"),
    xmax:       document.getElementById("xmax"),
    ymin:       document.getElementById("ymin"),
    ymax:       document.getElementById("ymax"),
    resolution: document.getElementById("resolution"),
    resValue:   document.getElementById("res-value"),
    colorscale: document.getElementById("colorscale"),
    contours:   document.getElementById("contours"),
    renderBtn:  document.getElementById("render-btn"),
    resetBtn:   document.getElementById("reset-btn"),
    error:      document.getElementById("error"),
    status:     document.getElementById("status"),
    statusText: document.getElementById("status-text"),
    badge:      document.getElementById("badge"),
    plot:       document.getElementById("plot")
  };

  const DEFAULTS = {
    equation: "x^3 - 3*x*y^2",
    xmin: -5, xmax: 5,
    ymin: -5, ymax: 5,
    resolution: 60,
    colorscale: "Viridis",
    contours: false
  };

  /* ------------------------------------------------------------------ *
   *  UI helpers
   * ------------------------------------------------------------------ */
  function showError(message) {
    el.error.textContent = message;
    el.error.classList.add("show");
    el.status.classList.add("err");
    el.statusText.textContent = "Error";
  }

  function clearError() {
    el.error.textContent = "";
    el.error.classList.remove("show");
    el.status.classList.remove("err");
  }

  function setStatus(text) {
    el.statusText.textContent = text;
  }

  /* ------------------------------------------------------------------ *
   *  Core rendering
   * ------------------------------------------------------------------ */
  function render() {
    clearError();

    const expression = el.equation.value.trim();
    if (!expression) {
      showError("Please enter a mathematical expression for f(x, y).");
      return;
    }

    const xmin = parseFloat(el.xmin.value);
    const xmax = parseFloat(el.xmax.value);
    const ymin = parseFloat(el.ymin.value);
    const ymax = parseFloat(el.ymax.value);

    if (!Number.isFinite(xmin) || !Number.isFinite(xmax)) {
      showError("X Min and X Max must be valid numbers.");
      return;
    }
    if (!Number.isFinite(ymin) || !Number.isFinite(ymax)) {
      showError("Y Min and Y Max must be valid numbers.");
      return;
    }
    if (xmin >= xmax) {
      showError("X Min must be strictly less than X Max.");
      return;
    }
    if (ymin >= ymax) {
      showError("Y Min must be strictly less than Y Max.");
      return;
    }

    const N = Math.max(20, Math.min(150, parseInt(el.resolution.value, 10) || 60));

    /* Compile ONCE — this is the key performance win. */
    let compiled;
    try {
      compiled = math.compile(expression);
    } catch (err) {
      showError("Invalid expression: " + (err && err.message ? err.message : String(err)));
      return;
    }

    /* Build the grid. */
    const xs = new Array(N);
    const ys = new Array(N);
    const z = new Array(N);

    const dx = (xmax - xmin) / (N - 1);
    const dy = (ymax - ymin) / (N - 1);

    for (let i = 0; i < N; i++) {
      xs[i] = xmin + i * dx;
      ys[i] = ymin + i * dy;
    }

    let badPoints = 0;

    for (let i = 0; i < N; i++) {
      const xv = xs[i];
      const row = new Array(N);
      for (let j = 0; j < N; j++) {
        const yv = ys[j];
        let value;
        try {
          value = compiled.evaluate({ x: xv, y: yv });
        } catch (err) {
          value = NaN;
        }

        // Normalize: only accept finite real numbers; everything else -> null
        if (typeof value !== "number" || !Number.isFinite(value)) {
          row[j] = null;
          badPoints++;
        } else {
          row[j] = value;
        }
      }
      z[i] = row;
    }

    /* Plotly trace */
    const showContours = el.contours.checked;

    const trace = {
      type: "surface",
      x: xs,
      y: ys,
      z: z,
      colorscale: el.colorscale.value,
      contours: {
        z: {
          show: showContours,
          usecolormap: true,
          highlightcolor: "#ffffff",
          project: { z: true }
        }
      },
      colorbar: {
        title: "z",
        thickness: 14,
        len: 0.75,
        outlinewidth: 0,
        tickfont: { color: "#8b93a7", size: 11 },
        titlefont: { color: "#8b93a7", size: 12 }
      },
      lighting: {
        ambient: 0.62,
        diffuse: 0.85,
        specular: 0.28,
        roughness: 0.65
      },
      hovertemplate:
        "x: %{x:.3f}<br>y: %{y:.3f}<br>z: %{z:.3f}<extra></extra>"
    };

    const layout = {
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor: "rgba(0,0,0,0)",
      margin: { l: 0, r: 0, t: 10, b: 0 },
      font: { color: "#e6e9f0", family: "ui-sans-serif, system-ui, sans-serif" },
      scene: {
        xaxis: {
          title: "x",
          gridcolor: "#2a3140",
          zerolinecolor: "#3a4254",
          backgroundcolor: "rgba(0,0,0,0)",
          tickfont: { color: "#8b93a7", size: 11 }
        },
        yaxis: {
          title: "y",
          gridcolor: "#2a3140",
          zerolinecolor: "#3a4254",
          backgroundcolor: "rgba(0,0,0,0)",
          tickfont: { color: "#8b93a7", size: 11 }
        },
        zaxis: {
          title: "z",
          gridcolor: "#2a3140",
          zerolinecolor: "#3a4254",
          backgroundcolor: "rgba(0,0,0,0)",
          tickfont: { color: "#8b93a7", size: 11 }
        },
        camera: {
          eye: { x: 1.55, y: 1.55, z: 1.15 },
          up: { x: 0, y: 0, z: 1 }
        },
        aspectmode: "auto"
      }
    };

    const config = {
      responsive: true,
      displaylogo: false,
      displayModeBar: true,
      modeBarButtonsToRemove: ["toImage", "sendDataToCloud"],
      scrollZoom: true
    };

    try {
      Plotly.react(el.plot, [trace], layout, config);
    } catch (err) {
      showError("Rendering failed: " + (err && err.message ? err.message : String(err)));
      return;
    }

    el.badge.textContent = "z = " + expression;

    if (badPoints > 0) {
      setStatus("Rendered — " + badPoints + " undefined point(s) skipped");
    } else {
      setStatus("Rendered " + N + "×" + N + " grid");
    }
  }

  /* ------------------------------------------------------------------ *
   *  Debounced auto-render on input changes
   * ------------------------------------------------------------------ */
  let debounceTimer = null;
  function scheduleRender(delay) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, delay == null ? 220 : delay);
  }

  /* ------------------------------------------------------------------ *
   *  Event wiring
   * ------------------------------------------------------------------ */
  el.equation.addEventListener("input", () => scheduleRender(260));
  el.equation.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      clearTimeout(debounceTimer);
      render();
    }
  });

  el.preset.addEventListener("change", () => {
    el.equation.value = el.preset.value;
    clearTimeout(debounceTimer);
    render(); // immediate re-render
  });

  [el.xmin, el.xmax, el.ymin, el.ymax].forEach((input) => {
    input.addEventListener("input", () => scheduleRender(260));
  });

  el.resolution.addEventListener("input", () => {
    el.resValue.textContent = el.resolution.value;
    scheduleRender(180);
  });

  el.colorscale.addEventListener("change", () => scheduleRender(0));
  el.contours.addEventListener("change", () => scheduleRender(0));

  el.renderBtn.addEventListener("click", () => {
    clearTimeout(debounceTimer);
    render();
  });

  el.resetBtn.addEventListener("click", () => {
    el.equation.value = DEFAULTS.equation;
    el.xmin.value = DEFAULTS.xmin;
    el.xmax.value = DEFAULTS.xmax;
    el.ymin.value = DEFAULTS.ymin;
    el.ymax.value = DEFAULTS.ymax;
    el.resolution.value = DEFAULTS.resolution;
    el.resValue.textContent = DEFAULTS.resolution;
    el.colorscale.value = DEFAULTS.colorscale;
    el.contours.checked = DEFAULTS.contours;
    el.preset.selectedIndex = 0;
    clearTimeout(debounceTimer);
    render();
  });

  /* ------------------------------------------------------------------ *
   *  Responsive resizing
   * ------------------------------------------------------------------ */
  window.addEventListener("resize", () => {
    Plotly.Plots.resize(el.plot);
  });

  if (typeof ResizeObserver !== "undefined") {
    const ro = new ResizeObserver(() => {
      Plotly.Plots.resize(el.plot);
    });
    ro.observe(el.plot);
  }

  /* ------------------------------------------------------------------ *
   *  Boot
   * ------------------------------------------------------------------ */
  el.resValue.textContent = el.resolution.value;
  render();
})();
</script>
</body>
</html>
