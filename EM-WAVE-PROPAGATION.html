<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EM-WAVE-PROPAGATION — Kraus &amp; Fleisch Ch. 4</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #0b0f19;
        --panel: rgba(15, 23, 42, 0.86);
        --border: rgba(56, 189, 248, 0.22);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #68d391;
        --bad: #fc8181;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13px;
      }
      #shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      #topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        background: rgba(2, 6, 23, 0.6);
      }
      #topbar h1 {
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 15px;
        color: #f1f5f9;
      }
      #topbar .sub {
        color: var(--muted);
        font-size: 12px;
      }
      #topbar .badge {
        margin-left: auto;
        font-size: 11px;
        color: var(--accent);
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 3px 9px;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      #body {
        display: grid;
        grid-template-columns: 268px 1fr;
        min-height: 0;
      }
      #sidebar {
        border-right: 1px solid rgba(56, 189, 248, 0.12);
        background: rgba(2, 6, 23, 0.45);
        overflow-y: auto;
        padding: 10px 8px;
      }
      #sidebar h2 {
        margin: 0;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        padding: 6px 8px 10px;
        font-weight: 600;
      }
      #module-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mod-btn {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        line-height: 1.35;
        cursor: pointer;
      }
      .mod-btn:hover {
        background: rgba(56, 189, 248, 0.08);
      }
      .mod-btn.active {
        background: rgba(56, 189, 248, 0.16);
        border-color: rgba(56, 189, 248, 0.4);
      }
      .mod-btn .num {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 18px;
        margin-top: 1px;
      }
      #main {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #stage {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: #0a0e13;
      }
      #stage canvas.webgl,
      #chart-canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #chart-canvas {
        display: none;
        z-index: 2;
        pointer-events: none;
      }
      #controls {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 295px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(14px);
        padding: 12px 14px;
        font-size: 12px;
        z-index: 10;
      }
      .ctl {
        margin-bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }
      .ctl:last-child {
        margin-bottom: 0;
      }
      .ctl label {
        color: var(--muted);
        font-size: 11px;
        flex: 1 1 auto;
      }
      .ctl .val {
        color: var(--accent);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .ctl input[type="range"] {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        order: 3;
        background: rgba(56, 189, 248, 0.2);
        outline: none;
        -webkit-appearance: none;
      }
      .ctl input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      }
      .ctl input[type="checkbox"] {
        accent-color: var(--accent);
      }
      .ctl select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 7px;
        background: rgba(2, 6, 23, 0.75);
        color: var(--text);
        border: 1px solid rgba(56, 189, 248, 0.25);
        font-size: 12px;
        outline: none;
      }
      #hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 390px;
        max-width: calc(100% - 330px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(14px);
        padding: 12px 14px;
        font-size: 12px;
        z-index: 10;
      }
      #hud-title {
        font-weight: 600;
        color: #f1f5f9;
        font-size: 12px;
        margin-bottom: 6px;
      }
      #hud-eq {
        color: #cbd5e1;
        min-height: 20px;
        margin-bottom: 8px;
      }
      #hud-eq .katex {
        font-size: 0.95em;
      }
      #hud-values {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 12px;
      }
      #hud-values .k {
        color: var(--muted);
        font-size: 11px;
      }
      #hud-values .v {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        text-align: right;
      }
      #bottom {
        height: 31vh;
        min-height: 185px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid rgba(56, 189, 248, 0.12);
        background: rgba(2, 6, 23, 0.5);
      }
      #lesson,
      #quiz {
        overflow-y: auto;
        padding: 14px 16px;
      }
      #lesson {
        border-right: 1px solid rgba(56, 189, 248, 0.12);
      }
      #lesson h3,
      #quiz h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #f1f5f9;
      }
      #lesson p {
        margin: 0 0 8px;
        font-size: 12px;
        line-height: 1.55;
        color: #cbd5e1;
      }
      #lesson .eq,
      #lesson .eqblock {
        margin: 8px 0;
        color: #e2e8f0;
      }
      .qcard {
        margin-bottom: 12px;
      }
      .qcard .qtext {
        font-size: 12px;
        color: #e2e8f0;
        margin-bottom: 6px;
      }
      .qcard .opts {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .qcard .opts button {
        text-align: left;
        padding: 5px 9px;
        border-radius: 6px;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.7);
        color: #cbd5e1;
        border: 1px solid rgba(56, 189, 248, 0.18);
        font-size: 11.5px;
      }
      .qcard .opts button:hover {
        background: rgba(56, 189, 248, 0.12);
      }
      .qcard .opts button.correct {
        border-color: var(--ok);
        background: rgba(104, 211, 145, 0.18);
        color: #f0fff4;
      }
      .qcard .opts button.wrong {
        border-color: var(--bad);
        background: rgba(252, 129, 129, 0.18);
        color: #fff5f5;
      }
      .qcard .fb {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      @media (max-width: 900px) {
        #body {
          grid-template-columns: 1fr;
        }
        #sidebar {
          display: none;
        }
        #controls {
          width: 240px;
        }
        #hud {
          width: calc(100% - 24px);
          max-width: none;
        }
        #bottom {
          grid-template-columns: 1fr;
          height: 40vh;
        }
        #lesson {
          border-right: none;
          border-bottom: 1px solid rgba(56, 189, 248, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <h1>EM-WAVE-PROPAGATION</h1>
        <span class="sub"
          >Kraus &amp; Fleisch · Electromagnetics with Applications · Ch. 4 Wave
          Propagation, Attenuation, Polarization, Reflection, Refraction &amp;
          Diffraction</span
        >
        <span class="badge" id="status-badge">0 / 0</span>
      </header>
      <div id="body">
        <aside id="sidebar">
          <h2>Chapter 4 Modules</h2>
          <div id="module-list"></div>
        </aside>
        <section id="main">
          <div id="stage">
            <canvas id="chart-canvas"></canvas>
            <div id="controls"></div>
            <div id="hud">
              <div id="hud-title">—</div>
              <div id="hud-eq"></div>
              <div id="hud-values"></div>
            </div>
          </div>
          <div id="bottom">
            <div id="lesson"></div>
            <div id="quiz"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const stageEl = document.getElementById("stage");
      const chartEl = document.getElementById("chart-canvas");
      const controlsEl = document.getElementById("controls");
      const hudTitle = document.getElementById("hud-title");
      const hudEq = document.getElementById("hud-eq");
      const hudValues = document.getElementById("hud-values");
      const lessonEl = document.getElementById("lesson");
      const quizEl = document.getElementById("quiz");
      const moduleList = document.getElementById("module-list");
      const badgeEl = document.getElementById("status-badge");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      const initW = Math.max(1, stageEl.clientWidth || window.innerWidth - 268);
      const initH = Math.max(
        1,
        stageEl.clientHeight || Math.round(window.innerHeight * 0.6),
      );
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(initW, initH);
      renderer.setClearColor(0x0a0e13, 1);
      renderer.domElement.classList.add("webgl");
      renderer.domElement.style.outline = "none";
      stageEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0e13, 0.025);
      const camera = new THREE.PerspectiveCamera(50, initW / initH, 0.1, 200);
      camera.position.set(4.8, 3.6, 5.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enableZoom = true;
      controls.enableRotate = true;
      controls.enablePan = true;
      controls.minDistance = 1.5;
      controls.maxDistance = 40;

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 8, 6);
      scene.add(dirLight);

      const content = new THREE.Group();
      scene.add(content);
      const sharedArrowGeoms = new Set();

      function disposeObj(o) {
        o.traverse((n) => {
          const isShared =
            sharedArrowGeoms.has(n.geometry) ||
            n.isArrowHelper ||
            (n.parent && n.parent.isArrowHelper);
          if (!isShared && n.geometry) n.geometry.dispose();
          if (n.material) {
            if (Array.isArray(n.material))
              n.material.forEach((m) => m.dispose());
            else n.material.dispose();
          }
        });
      }

      function clearContent() {
        while (content.children.length) disposeObj(content.children.pop());
        sharedArrowGeoms.clear();
      }

      function addAxes(group, len = 3.2) {
        const mk = (color, a, b) =>
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([a, b]),
            new THREE.LineBasicMaterial({
              color,
              transparent: true,
              opacity: 0.75,
            }),
          );
        group.add(
          mk(
            0xef4444,
            new THREE.Vector3(-len, 0, 0),
            new THREE.Vector3(len, 0, 0),
          ),
        );
        group.add(
          mk(
            0x22c55e,
            new THREE.Vector3(0, -len, 0),
            new THREE.Vector3(0, len, 0),
          ),
        );
        group.add(
          mk(
            0x3b82f6,
            new THREE.Vector3(0, 0, -len),
            new THREE.Vector3(0, 0, len),
          ),
        );
      }

      function addGrid(group, size = 8, y = -2.2) {
        const g = new THREE.GridHelper(size, 16, 0x1e2a36, 0x1e2a36);
        g.position.y = y;
        group.add(g);
      }

      function addArrowField(vectors, color = 0x7fd1ff) {
        const g = new THREE.Group();
        const pool = [];

        const normalizeEntry = (v) => {
          if (!v) return null;
          if (v.isVector3) {
            return {
              origin: new THREE.Vector3(0, 0, 0),
              dir: v,
              len: v.length(),
              color,
            };
          }
          if (v.dir && v.origin) {
            const mag = v.dir.length();
            return {
              origin: v.origin,
              dir: v.dir,
              len: v.len !== undefined ? v.len : Math.min(mag, 2.0),
              color: v.color ?? color,
            };
          }
          return null;
        };

        g.setVectors = (newVectors) => {
          const list = newVectors || [];
          for (let i = 0; i < list.length; i++) {
            const item = normalizeEntry(list[i]);
            let arrow = pool[i];
            if (!arrow) {
              arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, 0, 0),
                0.5,
                color,
                0.12,
                0.07,
              );
              if (arrow.line && arrow.line.geometry)
                sharedArrowGeoms.add(arrow.line.geometry);
              if (arrow.cone && arrow.cone.geometry)
                sharedArrowGeoms.add(arrow.cone.geometry);
              pool.push(arrow);
              g.add(arrow);
            }
            if (!item || item.len < 1e-4 || item.dir.lengthSq() < 1e-12) {
              arrow.visible = false;
              continue;
            }
            arrow.visible = true;
            arrow.position.copy(item.origin);
            arrow.setDirection(item.dir.clone().normalize());
            arrow.setLength(
              item.len,
              Math.min(0.25, item.len * 0.35),
              Math.min(0.15, item.len * 0.22),
            );
            arrow.setColor(item.color);
          }
          for (let i = list.length; i < pool.length; i++) {
            pool[i].visible = false;
          }
        };

        g.setVectors(vectors);
        content.add(g);
        return g;
      }

      function renderMath(el, tex, display = true) {
        if (window.katex) {
          try {
            katex.render(tex, el, {
              throwOnError: false,
              displayMode: display,
            });
            return;
          } catch (e) {}
        }
        el.textContent = tex;
      }

      function renderAllMath(root) {
        root.querySelectorAll("[data-tex]").forEach((el) => {
          renderMath(
            el,
            el.getAttribute("data-tex"),
            el.classList.contains("eq") || el.classList.contains("eqblock"),
          );
        });
      }

      function setHud(title, eqTex, rows) {
        hudTitle.textContent = title;
        renderMath(hudEq, eqTex, true);
        hudValues.innerHTML = (rows || [])
          .map(
            (r) => `<span class="k">${r.k}</span><span class="v">${r.v}</span>`,
          )
          .join("");
      }

      function fmt(v, d = 3) {
        return isFinite(v) ? (v >= 0 ? "+" : "") + v.toFixed(d) : "—";
      }

      const modules = [];

      modules.push({
        id: "waves_in_space",
        title: "4-2 Waves in Space",
        controls: [
          {
            id: "f",
            label: "Frequency f (MHz)",
            type: "range",
            min: 10,
            max: 1000,
            step: 1,
            value: 300,
          },
          {
            id: "E0",
            label: "Amplitude E0 (V/m)",
            type: "range",
            min: 1,
            max: 10,
            step: 0.1,
            value: 5,
          },
          {
            id: "er",
            label: "Relative permittivity εr",
            type: "range",
            min: 1,
            max: 9,
            step: 0.1,
            value: 1,
          },
          {
            id: "ur",
            label: "Relative permeability μr",
            type: "range",
            min: 1,
            max: 4,
            step: 0.1,
            value: 1,
          },
          { id: "animate", label: "Animate wave", type: "check", value: true },
        ],
        state: { f: 300, E0: 5, er: 1, ur: 1, animate: true, t: 0 },

        build() {
          addGrid(content, 10, -2.2);
          this.arrowsE = addArrowField([], 0xff5533);
          this.arrowsH = addArrowField([], 0x33aaff);
          this.axis = new THREE.Mesh(
            new THREE.CylinderGeometry(0.015, 0.015, 11, 8),
            new THREE.MeshBasicMaterial({ color: 0x888888 }),
          );
          this.axis.rotation.x = Math.PI / 2;
          content.add(this.axis);
          this.update();
        },

        update() {
          const st = this.state;
          const Z0 = 376.73;
          const Z = Z0 * Math.sqrt(st.ur / st.er);
          const c = 299792458;
          const v = c / Math.sqrt(st.er * st.ur);
          const fHz = st.f * 1e6;
          const lambda = v / fHz;
          const betaVis = ((2 * Math.PI) / lambda) * 0.35;
          const omegaVis = 3.2 * (st.f / 300);

          const N = 40;
          const Evecs = [],
            Hvecs = [];
          for (let i = 0; i < N; i++) {
            const z = -5 + i * (10 / (N - 1));
            const ph = omegaVis * st.t - betaVis * z;
            const Ey = st.E0 * Math.cos(ph);
            const Hx = -(st.E0 / Z) * Math.cos(ph);
            const origin = new THREE.Vector3(0, 0, z);
            Evecs.push({ origin, dir: new THREE.Vector3(0, Ey * 0.35, 0) });
            Hvecs.push({ origin, dir: new THREE.Vector3(Hx * 120, 0, 0) });
          }

          this.arrowsE.setVectors(Evecs);
          this.arrowsH.setVectors(Hvecs);

          setHud(
            "TEM wave propagating in +z",
            "E_y=E_0\\cos(\\omega t-\\beta z),\\quad H_x=-\\frac{E_0}{Z}\\cos(\\omega t-\\beta z)",
            [
              { k: "Z (Ω)", v: Z.toFixed(1) },
              { k: "v (m/s)", v: v.toExponential(2) },
              { k: "λ (m)", v: lambda.toFixed(3) },
            ],
          );
        },

        tick(dt) {
          if (this.state.animate) {
            this.state.t += dt;
            this.update();
          }
        },

        lesson: `<p>A uniform plane wave travelling in <b>+z</b> has transverse fields. For a TEM wave, <b>E</b> (orange, along <i>y</i>) and <b>H</b> (blue, along <i>x</i>) are perpendicular to each other and to the propagation direction.</p>
  <p>With <b>E</b> along y and <b>H</b> along x: <code>Ey = E0 cos(ωt − βz)</code>, <code>Hx = −(E0/Z) cos(ωt − βz)</code>.</p>
  <p>The wave impedance is <code>Z = 376.73 √(μr/εr)</code> Ω, the phase velocity is <code>v = c/√(εr μr)</code>, and the wavelength is <code>λ = v/f</code>.</p>`,

        quiz: [
          {
            q: "For a TEM wave in a lossless medium, E and H are:",
            options: [
              "Parallel to each other",
              "Perpendicular to each other and to the propagation direction",
              "Both longitudinal",
              "At 45° to the propagation direction",
            ],
            answer: 1,
          },
          {
            q: "If εr increases while μr stays 1, the wave impedance Z:",
            options: [
              "Increases",
              "Decreases",
              "Stays the same",
              "Becomes zero",
            ],
            answer: 1,
          },
        ],
      });

      modules.push({
        id: "traveling_standing_waves",
        title: "4-3 Traveling and Standing Waves",
        controls: [
          {
            id: "rho",
            label: "Reflection coefficient ρ = E⁻/E⁺",
            type: "range",
            min: 0,
            max: 1,
            step: 0.01,
            value: 0.5,
          },
          {
            id: "phi_deg",
            label: "Reflected phase φ (deg)",
            type: "range",
            min: -180,
            max: 180,
            step: 1,
            value: 180,
          },
          { id: "animate", label: "Animate waves", type: "check", value: true },
        ],
        build() {
          if (!this.state)
            this.state = { rho: 0.5, phi_deg: 180, animate: true };
          this.t = 0;
          this.group = new THREE.Group();
          content.add(this.group);

          const axisMat = new THREE.MeshStandardMaterial({
            color: 0x334155,
            roughness: 0.8,
          });
          const axis = new THREE.Mesh(
            new THREE.CylinderGeometry(0.025, 0.025, 12, 12),
            axisMat,
          );
          axis.rotation.z = Math.PI / 2;
          axis.position.x = 0;

        update() {
          const st = this.state;
          const rho = st.rho;
          const phi = (st.phi_deg * Math.PI) / 180;
          const k = Math.PI / 2;
          const omega = 2.0;
          const t = this.t;

          const posF = [],
            posR = [],
            posT = [],
            posET = [],
            posEB = [];
          for (let i = 0; i < this.N; i++) {
            const x = this.xs[i];
            const ef = Math.cos(k * x - omega * t);
            const er = rho * Math.cos(k * x + omega * t + phi);
            const et = ef + er;
            posF.push(x, ef, 0);
            posR.push(x, er, 0);
            posT.push(x, et, 0);
            posET.push(x, 1 + rho, 0);
            posEB.push(x, -(1 + rho), 0);
          }

          this.forward.geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(posF, 3),
          );
          this.reflected.geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(posR, 3),

            new THREE.Float32BufferAttribute(posET, 3),
          );
          this.envBot.geometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(posEB, 3),
          );

          const phase = phi / 2;
          const xMax = -phase / k;
          const xMin = (Math.PI / 2 - phase) / k;
          this.maxMark.position.set(xMax, 1 + rho, 0);
          this.minMark.position.set(xMin, 0, 0);

          const vswr = rho >= 1 ? Infinity : (1 + rho) / (1 - rho);
          const emaxVal = 1 + rho;

          setHud(
            "Traveling and Standing Waves",
            "E(x,t)=E^+\\cos(kx-\\omega t)+\\rho E^+\\cos(kx+\\omega t+\\phi)",

              { k: "VSWR", v: isFinite(vswr) ? vswr.toFixed(2) : "∞" },

        lesson: `<p>For a material with conductivity σ and complex permittivity ε = ε′ − jε″, the loss tangent is <b>tan δ = (σ + ωε″)/(ωε′)</b>. Small tan δ means a good dielectric; tan δ ≈ 1 is quasi-conductive; large tan δ means a good conductor. The red phasor is conduction current density Jc = σE; the blue phasor is displacement current density Jd = ωε′E.</p>`,

      modules.push({

        update() {

          const w = 2 * Math.PI * f;
          const mu = 4e-7 * Math.PI;
          const eps = 8.854e-12;

          const cmul = (a, b) => [
            a[0] * b[0] - a[1] * b[1],
            a[0] * b[1] + a[1] * b[0],
          ];
          const csqrt = (a) => {
            const r = Math.hypot(a[0], a[1]);
            const re = Math.sqrt((r + a[0]) / 2);
            const im = Math.sign(a[1] || 1) * Math.sqrt((r - a[0]) / 2);
            return [re, im];
          };

          const jwmu = [0, w * mu];
          const a = [sigma, w * eps];
          const g = csqrt(cmul(jwmu, a));
          const alpha = g[0];
          const beta = g[1];
          const delta = 1 / alpha;
          const Zc = csqrt(
            cmul(jwmu, [
              sigma / (sigma * sigma + w * eps * (w * eps)),

              { k: "α", v: alpha.toFixed(2) + " Np/m" },
              { k: "dB/m", v: dBm.toFixed(2) },
              { k: "δ_s", v: delta.toFixed(3) + " m" },
              { k: "|Z_c|", v: Math.hypot(Zc[0], Zc[1]).toFixed(2) + " Ω" },
            ],
          );
        },
        tick(dt) {
          const st = this.state;
          if (!st.animate) return;
          this.t += dt;
          const f = st.freq_MHz * 1e6;
          const w = 2 * Math.PI * f;
          const sigma = st.sigma;
          const mu = 4e-7 * Math.PI;
          const eps = 8.854e-12;

          const cmul = (a, b) => [
            a[0] * b[0] - a[1] * b[1],
            a[0] * b[1] + a[1] * b[0],
          ];
          const csqrt = (a) => {
            const r = Math.hypot(a[0], a[1]);
            const re = Math.sqrt((r + a[0]) / 2);
            const im = Math.sign(a[1] || 1) * Math.sqrt((r - a[0]) / 2);
            return [re, im];
          };
          const g = csqrt(cmul([0, w * mu], [sigma, w * eps]));
          const beta = g[1];
          const alpha = g[0];
          const omegaVis = 4.0;

          const N = 160;
          const ePos = this.eLine.geometry.attributes.position.array;

          }
          this.eLine.geometry.attributes.position.needsUpdate = true;
          this.hLine.geometry.attributes.position.needsUpdate = true;
        },
        lesson:
          "<p>In a conducting medium, the propagation constant is <b>γ = α + jβ = √(jωμ(σ + jωε))</b>. The real part α gives attenuation; the imaginary part β gives phase. The skin depth is <b>δ_s = 1/α</b>, the distance over which the field falls by 1/e. The characteristic impedance is <b>Z_c = √(jωμ/(σ + jωε))</b>. Higher σ or higher f increases α and shrinks δ_s. The 3D view shows decaying E (blue) and H (orange) waves and the green skin-depth plane.</p>",

      modules.push({

        build() {
          if (!this.state)
            this.state = { theta_i: 56.3, n1: 1, n2: 1.5, delta_i: 90 };
          this.group = new THREE.Group();
          this.inc = new THREE.Group();
          this.ref = new THREE.Group();
          this.group.add(this.inc, this.ref);
          content.add(this.group);
          this.incEll = new THREE.LineLoop(

          );
          this.refEll = new THREE.LineLoop(
            new THREE.BufferGeometry(),
            new THREE.LineBasicMaterial({ color: 0xff7043 }),
          );
          this.inc.add(this.incEll);
          this.ref.add(this.refEll);
          this.plane = new THREE.Mesh(
            new THREE.PlaneGeometry(6, 6),
            new THREE.MeshBasicMaterial({
              color: 0x223344,
              transparent: true,
              opacity: 0.25,
              side: THREE.DoubleSide,
            }),
          );
          this.plane.rotation.x = -Math.PI / 2;
          this.group.add(this.plane);
          this.normal = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(0, 0, 0),
              new THREE.Vector3(0, 3, 0),
            ]),
            new THREE.LineBasicMaterial({ color: 0x888888 }),
          );
          this.group.add(this.normal);
          this.update();
        },
        update() {
          const st = this.state;
          const th = (st.theta_i * Math.PI) / 180;
          const d = (st.delta_i * Math.PI) / 180;
          const n1 = st.n1,
            n2 = st.n2;
          const s1 = Math.sin(th),
            c1 = Math.cos(th);
          const s2 = (n1 * s1) / n2;
          const tir = s2 > 1;
          const c2 = tir
            ? Math.sqrt(s2 * s2 - 1)
            : Math.sqrt(Math.max(0, 1 - s2 * s2));
          const rp = (n2 * c1 - n1 * c2) / (n2 * c1 + n1 * c2);
          const rs = (n1 * c1 - n2 * c2) / (n1 * c1 + n2 * c2);
          const rhoP = new THREE.Vector2(rp, 0);
          const rhoS = new THREE.Vector2(rs, 0);
          const E0 = new THREE.Vector2(Math.cos(d / 2), Math.sin(d / 2));
          const Ep = new THREE.Vector2(E0.x * rhoP.x, E0.y * rhoP.y);
          const Es = new THREE.Vector2(E0.x * rhoS.x, E0.y * rhoS.y);
          const arIn = Math.abs(E0.y / (E0.x || 1e-9));
          const arRef = Math.abs(Es.y / (Ep.x || 1e-9));
          const makeEllipse = (a, b, phase) => {
            const pts = [];
            for (let i = 0; i <= 64; i++) {
              const t = (i / 64) * Math.PI * 2;
              const x = a * Math.cos(t);
              const y = b * Math.sin(t + phase);
              pts.push(new THREE.Vector3(x, y, 0));
            }
            return pts;
          };
          const incPts = makeEllipse(1, Math.min(arIn, 5), 0);
          const refPts = makeEllipse(1, Math.min(arRef, 5), 0);
          this.incEll.geometry.setFromPoints(incPts);
          this.refEll.geometry.setFromPoints(refPts);
          this.inc.position.set(-2.2, 0.8, 0);
          this.ref.position.set(2.2, 0.8, 0);
          this.inc.rotation.y = -th;
          this.ref.rotation.y = th;
          this.incEll.material.color.setHex(0x4fc3f7);
          this.refEll.material.color.setHex(0xff7043);
          const brew = Math.abs(rp) < 0.02 ? " (Brewster)" : "";
          setHud(
            "Elliptical oblique incidence",
            "\\rho_\\perp,\\ \\rho_\\parallel\\ \\text{complex}",
            [
              { k: "AR_in", v: arIn.toFixed(3) },
              { k: "AR_ref", v: arRef.toFixed(3) },
              { k: "TIR", v: tir ? "yes" : "no" + brew },
            ],
          );
        },
        tick(dt) {
          this.group.rotation.y += dt * 0.15;
        },
        lesson: `<p>An elliptical wave has two orthogonal components. At oblique incidence the complex reflection coefficients <b>rho_perp</b> and <b>rho_par</b> act on them separately, so the reflected ellipse generally changes shape and orientation.</p><p>Brewster angle filtering occurs when one coefficient vanishes; total internal reflection occurs when <i>n1 sin theta_i / n2 &gt; 1</i>.</p>`,
        quiz: [
          {
            q: "At Brewster incidence, which reflected component can vanish?",
            options: ["rho_par", "rho_perp", "both", "neither"],
            answer: 0,
          },
          {
            q: "Total internal reflection requires:",
            options: [
              "n1 > n2 and theta_i above critical",
              "n1 < n2",
              "normal incidence",
              "delta_i = 0",
            ],
            answer: 0,
          },
        ],
      });

        update() {
          const st = this.state;

          const b = Math.PI * aL * Math.sin(0.35);
          const I = Math.pow(Math.sin(b) / b, 2);
          const firstNull =
            aL >= 1 ? Math.asin(1 / aL).toFixed(3) + " rad" : "none";

          for (let i = 0; i < this.wavelets.length; i++) {
            const w = this.wavelets[i];
            const on = i < n;
            w.visible = on;
            if (!on) continue;
            const y = (i - (n - 1) / 2) * (2.4 / Math.max(1, n - 1));
            w.position.set(-3.15, y, 0);
            const phase = st.t * 3 + i * 0.7;
            w.scale.setScalar(0.8 + 0.35 * Math.sin(phase));

          setHud(
            "Single-slit Fraunhofer diffraction",
            "I(\\theta)=I_0\\left(\\frac{\\sin b}{b}\\right)^2,\\quad b=\\frac{\\pi a}{\\lambda}\\sin\\theta",
            [
              { k: "a / lambda", v: aL.toFixed(2) },
              { k: "first null", v: firstNull },
              { k: "I at 0.35 rad", v: I.toFixed(3) },

        },

        tick(dt) {
          if (this.state.animate) {
            this.state.t += dt;
            this.update();
          }
        },

        lesson: `
    <p><b>Huygens principle:</b> every point on the slit acts as a source of spherical wavelets. Their superposition produces the Fraunhofer single-slit pattern.</p>
    <p>The intensity is <b>I(theta) = I0 (sin b / b)^2</b>, with <b>b = (pi a / lambda) sin theta</b>. The first minimum occurs when <b>a sin theta = lambda</b>, i.e. <b>theta = arcsin(lambda / a)</b>.</p>
    <p>Increase <b>a / lambda</b> to narrow the central lobe; increase the number of wavelets to see the sampling of the slit more finely.</p>
  `,

        quiz: [

            options: [

      modules.push({

          {

        ],
        build() {
          this.group = new THREE.Group();

          const slabMat = new THREE.MeshStandardMaterial({

          this.slab = new THREE.Mesh(

          );
          this.slab.position.set(0, 0, 0);
          this.group.add(this.slab);

            new THREE.EdgesGeometry(this.slab.geometry),
            new THREE.LineBasicMaterial({ color: 0x93c5fd }),
          );
          this.slab.add(edge);

          this.wave = new THREE.Group();
          this.group.add(this.wave);
          this.waveLines = [];
          for (let i = 0; i < 9; i++) {
            const g = new THREE.BufferGeometry().setFromPoints([
              new THREE.Vector3(-2.2, -1.1 + i * 0.275, 0.22),
              new THREE.Vector3(2.2, -1.1 + i * 0.275, 0.22),

            const l = new THREE.Line(

              new THREE.LineBasicMaterial({
                color: 0xfbbf24,
                transparent: true,
                opacity: 0.8,
              }),
            );
            this.wave.add(l);
            this.waveLines.push(l);
          }

          this.arc = new THREE.Group();
          this.group.add(this.arc);
          this.arcMat = new THREE.LineBasicMaterial({ color: 0x22c55e });
          this.arcLine = new THREE.Line(
            new THREE.BufferGeometry(),
            this.arcMat,
          );
          this.arc.add(this.arcLine);
          this.arcDot = new THREE.Mesh(

          const lambda0 = 0.299792458 / f;
          const lambdaEff = lambda0 / Math.sqrt(eps);
          const d = lambdaEff / 2;
          const plf = Math.cos(gamma / 2) ** 2;
          const plfDb = 10 * Math.log10(Math.max(plf, 1e-12));

          this.slab.scale.z = Math.max(0.25, Math.min(2.2, (d / lambda0) * 4));

          const phase = ((2 * Math.PI * d) / lambdaEff) % (2 * Math.PI);
          this.waveLines.forEach((l, i) => {

          const r = 1.25;
          const pts = [];
          const a0 = -Math.PI / 2;
          const a1 = a0 + gamma;
          for (let i = 0; i <= 48; i++) {

            pts.push(new THREE.Vector3(r * Math.cos(a), r * Math.sin(a), 0.55));

          this.arcLine.geometry.dispose();
          this.arcLine.geometry = new THREE.BufferGeometry().setFromPoints(pts);
          this.arcDot.position.set(r * Math.cos(a1), r * Math.sin(a1), 0.55);

          setHud(

          );

        tick(dt) {
          this.group.rotation.y += dt * 0.15;
        },
        lesson: `<div style="max-width:760px;line-height:1.45">
    <h3>Radome thickness and polarization loss</h3>
    <p>A half-wave radome uses a slab thickness that is one half of the effective wavelength inside the dielectric:
    <b>d = m λ₀ / (2√ε_r)</b>. At this thickness the transmitted wave recombines in phase, reducing reflection.</p>
    <p>The polarization loss factor for a linearly polarized wave misaligned by angle γ_p is
    <b>PLF = cos²(γ_p/2)</b>. In dB, <b>PLF_dB = 10 log₁₀(PLF)</b>. The 3D view shows the radome slab, an idealized standing-wave pattern, and a Stokes arc representing the polarization angle.</p>
    <p>Try changing ε_r and frequency: higher ε_r shortens λ_eff and therefore reduces the required radome thickness. Increasing γ_p lowers PLF and increases polarization mismatch loss.</p>
  </div>`,
        quiz: [

            options: [

              "d = λ₀ / √ε_r",

        controlsEl.innerHTML = "";

          if (!(c.id in mod.state)) mod.state[c.id] = c.value;
          const row = document.createElement("div");
          row.className = "ctl";
          const lab = document.createElement("label");
          lab.textContent = c.label || c.id;
          row.appendChild(lab);
          if (c.type === "select") {
            const sel = document.createElement("select");
            (c.options || []).forEach((opt) => {
              const o = document.createElement("option");
              o.value = opt;
              o.textContent = opt;
              if (opt === mod.state[c.id]) o.selected = true;
              sel.appendChild(o);
            });
            sel.addEventListener("change", () => {
              mod.state[c.id] = sel.value;
              mod.update();
            });
            row.appendChild(sel);
          } else if (c.type === "check") {
            const inp = document.createElement("input");
            inp.type = "checkbox";
            inp.checked = !!mod.state[c.id];
            inp.addEventListener("change", () => {
              mod.state[c.id] = inp.checked;
              mod.update();
            });
            row.appendChild(inp);
          } else {
            const inp = document.createElement("input");
            inp.type = "range";
            inp.min = c.min ?? 0;
            inp.max = c.max ?? 1;
            inp.step = c.step ?? 0.01;
            inp.value = mod.state[c.id];
            const val = document.createElement("span");
            val.className = "val";
            val.textContent = Number(mod.state[c.id]).toFixed(2);
            inp.addEventListener("input", () => {
              mod.state[c.id] = parseFloat(inp.value);
              val.textContent = Number(mod.state[c.id]).toFixed(2);
              mod.update();
            });
            row.appendChild(inp);
            row.appendChild(val);
          }

      }

      function onResize() {
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width || stageEl.clientWidth));
        const h = Math.max(1, Math.round(rect.height || stageEl.clientHeight));
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        chartEl.width = Math.round(
          w * Math.min(window.devicePixelRatio || 1, 2),
        );
        chartEl.height = Math.round(
          h * Math.min(window.devicePixelRatio || 1, 2),
        );
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.update === "function") {
          mod.update();
          renderer.render(scene, camera);
        }
      }

      buildModuleList();
      selectModule(0);
      window.addEventListener("resize", onResize);
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);
      onResize();

      let last = performance.now();
      function animate(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.tick === "function") mod.tick(dt);
        controls.update();
        if (
          !Number.isFinite(camera.position.x) ||
          !Number.isFinite(camera.position.y) ||
          !Number.isFinite(camera.position.z)
        ) {
          camera.position.set(4.8, 3.6, 5.8);
          controls.target.set(0, 0, 0);
          controls.update();
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
