<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 80;
controls.enableZoom = false;

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = Math.sign(e.deltaY);
  if (!dir) return;
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * (dir > 0 ? 1.12 : 0.89)));
  offset.setLength(dist);
  camera.position.copy(controls.target).add(offset);
}, { passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 6);
scene.add(key);

const content = new THREE.Group();
scene.add(content);

const chartEl = document.getElementById('chart');
const chartCtx = chartEl.getContext('2d');

function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const nextVecs = [];
  function rebuild(vecs) {
    while (group.children.length) {
      const c = group.children.pop();
      c.geometry?.dispose?.();
      group.remove(c);
    }
    for (const v of vecs) {
      const len = v.len ?? v.dir.length();
      const dir = v.dir.clone().normalize();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
      head.position.copy(v.origin).addScaledVector(dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, head);
    }
  }
  rebuild(vectors);
  group.setVectors = (vecs) => { nextVecs.length = 0; nextVecs.push(...vecs); rebuild(vecs); };
  return group;
}

function renderTex(el, opts) {
  if (window.renderMathInElement) window.renderMathInElement(el, opts);
}
const KATEX_OPTS = {
  delimiters: [
    { left: '$$', right: '$$', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true }
  ],
  throwOnError: false,
  strict: false
};

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr;
  const eq = document.getElementById('hudEq');
  const trimmedEq = (latexEqStr || '').trim();
  eq.innerHTML = (trimmedEq && !trimmedEq.startsWith('$') && !trimmedEq.startsWith('\\(') && !trimmedEq.startsWith('\\['))
    ? `$${trimmedEq}$`
    : trimmedEq;
  renderTex(eq, KATEX_OPTS);
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  for (const r of rows) {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.textContent = r.v;
    rowsEl.appendChild(k); rowsEl.appendChild(v);
  }
}

const modules = [];

modules.push({
  id: 'intro_numerical',
  title: '1. Introduction to Numerical Methods',
  controls: [
    { type: 'range', id: 'N', label: 'Grid resolution N', min: 8, max: 64, step: 1, value: 16 },
    { type: 'range', id: 'A', label: 'Amplitude A', min: 0.5, max: 2, step: 0.05, value: 1 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { N: 16, A: 1, err: 0 });
    this.group = new THREE.Group();
    content.add(this.group);
    this.geo = new THREE.BufferGeometry();
    this.mat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95 });
    this.lines = new THREE.LineSegments(this.geo, this.mat);
    this.group.add(this.lines);
    // base square outline
    const sq = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0), new THREE.Vector3(1, 0, 0),
        new THREE.Vector3(1, 0, 1), new THREE.Vector3(0, 0, 1)
      ]),
      new THREE.LineBasicMaterial({ color: 0x335577 })
    );
    this.group.add(sq);
    this.group.position.set(-0.5, -0.35, -0.5);
    this.rebuild();
  },
  rebuild() {
    const st = this.state, N = st.N, A = st.A;
    const pos = [], col = [];
    const phi = (x, y) => A * Math.sin(Math.PI * x) * Math.sin(Math.PI * y);
    const c = new THREE.Color();
    const push = (x1, y1, x2, y2) => {
      const v1 = phi(x1, y1), v2 = phi(x2, y2);
      pos.push(x1, v1, y1, x2, v2, y2);
      c.setHSL(0.62 - 0.42 * (v1 / Math.max(A, 1e-6)), 0.85, 0.55);
      col.push(c.r, c.g, c.b);
      c.setHSL(0.62 - 0.42 * (v2 / Math.max(A, 1e-6)), 0.85, 0.55);
      col.push(c.r, c.g, c.b);
    };
    for (let i = 0; i <= N; i++) {
      const x = i / N;
      for (let j = 0; j < N; j++) push(x, j / N, x, (j + 1) / N);
    }
    for (let j = 0; j <= N; j++) {
      const y = j / N;
      for (let i = 0; i < N; i++) push(i / N, y, (i + 1) / N, y);
    }
    this.geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    this.geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    this.geo.computeBoundingSphere();
    // truncation error estimate: second-order central difference vs analytic
    const h = 1 / N;
    let maxE = 0;
    for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
      const x = i / N, y = j / N;
      const lap = (phi(x + h, y) + phi(x - h, y) + phi(x, y + h) + phi(x, y - h) - 4 * phi(x, y)) / (h * h);
      const exact = -2 * Math.PI * Math.PI * phi(x, y);
      maxE = Math.max(maxE, Math.abs(lap - exact));
    }
    st.err = maxE;
  },
  update() {
    const st = this.state;
    this.rebuild();
    setHud('Discretization error', 'e_N \\approx C N^{-2}', [
      { k: 'N', v: String(st.N) },
      { k: 'max|e|', v: st.err.toFixed(3) }
    ]);
    this.drawChart();
  },
  drawChart() {
    const st = this.state, ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    const pad = 46, x0 = pad, y0 = H - pad, x1 = W - pad, y1 = pad;
    const Ns = [], Es = [];
    const phi = (x, y) => st.A * Math.sin(Math.PI * x) * Math.sin(Math.PI * y);
    for (let N = 8; N <= 64; N *= 2) {
      const h = 1 / N; let m = 0;
      for (let i = 1; i < N; i++) for (let j = 1; j < N; j++) {
        const x = i / N, y = j / N;
        const lap = (phi(x + h, y) + phi(x - h, y) + phi(x, y + h) + phi(x, y - h) - 4 * phi(x, y)) / (h * h);
        m = Math.max(m, Math.abs(lap + 2 * Math.PI * Math.PI * phi(x, y)));
      }
      Ns.push(N); Es.push(m);
    }
    const lx = v => x0 + (Math.log(v) - Math.log(8)) / (Math.log(64) - Math.log(8)) * (x1 - x0);
    const lo = Math.log(Math.min(...Es)), hi = Math.log(Math.max(...Es));
    const ly = v => y0 - (Math.log(v) - lo) / (hi - lo) * (y0 - y1);
    ctx.strokeStyle = '#2a3b52'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2; ctx.beginPath();
    Ns.forEach((N, i) => { const px = lx(N), py = ly(Es[i]); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
    ctx.fillStyle = '#7fd1ff';
    Ns.forEach((N, i) => { ctx.beginPath(); ctx.arc(lx(N), ly(Es[i]), 3, 0, 6.283); ctx.fill(); });
    // reference slope -2
    ctx.strokeStyle = '#ff9f6b'; ctx.setLineDash([5, 5]); ctx.beginPath();
    ctx.moveTo(lx(8), ly(Es[0])); ctx.lineTo(lx(64), ly(Es[0] * Math.pow(8, -2))); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#9fb6d0'; ctx.font = '12px sans-serif';
    ctx.fillText('log N', x1 - 40, y0 + 22);
    ctx.fillText('log max|e|', x0 - 30, y1 - 8);
    ctx.fillStyle = '#ff9f6b'; ctx.fillText('slope -2', x1 - 90, y1 + 22);
  },
  tick(dt) {
    this.group.rotation.y += dt * 0.15;
  },
  lesson: String.raw`Numerical methods replace continuous fields by finite samples. Discretizing $\phi(x,y)$ on an $N\times N$ grid turns a differential equation into a linear algebra problem.

Two error sources compete:
- **Truncation error**: from replacing derivatives by finite differences. A central second difference has error $O(h^2)=O(N^{-2})$, so $e_N \approx C N^{-2}$.
- **Round-off error**: floating point noise grows like $\sim \epsilon/h^2 = \epsilon N^2$ as $h$ shrinks.

Total error is roughly $C N^{-2} + \epsilon N^2$, minimized at $N \sim (C/\epsilon)^{1/4}$. Refining the grid helps only until round-off dominates.

Convergence: a scheme is order $p$ if error scales as $h^p$. Laplace/Poisson solvers (Jacobi, SOR, conjugate gradient) exploit this: finer grids give more accuracy but larger systems and slower iteration counts.`,
  quiz: [
    { q: 'A central finite-difference Laplacian on a uniform grid has truncation error scaling as:', options: ['O(N^{-1})', 'O(N^{-2})', 'O(N^{-3})', 'O(N^{2})'], answer: 1 },
    { q: 'Why does accuracy eventually stop improving as N grows?', options: ['Truncation error grows with N', 'Round-off error grows like epsilon N^2', 'The grid becomes non-uniform', 'Boundary conditions change'], answer: 1 }
  ]
});
modules.push({
  id: 'laplace_rect',
  title: '2. Laplace\'s Equation in Rectangular Coordinates; Separation of Variables',
  controls: [
    { id: 'aspect', label: 'b/a (aspect)', type: 'range', min: 0.5, max: 3, step: 0.1, value: 1.5 },
    { id: 'nmax', label: 'n_max (modes)', type: 'range', min: 1, max: 20, step: 1, value: 8 },
    { id: 'V0', label: 'V0 (top potential)', type: 'range', min: 1, max: 10, step: 0.5, value: 5 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { aspect: 1.5, nmax: 8, V0: 5 });

    const group = new THREE.Group();
    this.group = group;
    content.add(group);

    // Box wireframe (unit width a=1, height b=aspect, depth 0.6)
    const boxGeo = new THREE.BoxGeometry(1, 1, 0.6);
    const boxMat = new THREE.MeshBasicMaterial({ color: 0x2a3a4a, transparent: true, opacity: 0.25, side: THREE.DoubleSide });
    this.box = new THREE.Mesh(boxGeo, boxMat);
    group.add(this.box);

    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(boxGeo), new THREE.LineBasicMaterial({ color: 0x7fd1ff }));
    group.add(edges);

    // Potential surface on top (y = b)
    const segX = 40, segY = 30;
    const surfGeo = new THREE.BufferGeometry();
    const verts = [], colors = [], idx = [];
    for (let i = 0; i <= segX; i++) {
      for (let j = 0; j <= segY; j++) {
        const x = i / segX;
        const y = j / segY;
        verts.push(x - 0.5, 0.5, y * 0.6 - 0.3);
        colors.push(0, 0, 0);
      }
    }
    for (let i = 0; i < segX; i++) {
      for (let j = 0; j < segY; j++) {
        const a = i * (segY + 1) + j;
        const b = a + 1;
        const c = a + (segY + 1);
        const d = c + 1;
        idx.push(a, b, c, b, d, c);
      }
    }
    surfGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
    surfGeo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    surfGeo.setIndex(idx);
    surfGeo.computeVertexNormals();
    const surfMat = new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    this.surf = new THREE.Mesh(surfGeo, surfMat);
    group.add(this.surf);

    // Contour lines on top
    this.contours = new THREE.Group();
    group.add(this.contours);

    // Chart canvas
    this.chart = chartEl;
    this.ctx = chartEl.getContext('2d');
  },

  update() {
    const st = this.state;
    const a = 1, b = st.aspect, V0 = st.V0, nmax = Math.round(st.nmax);

    // Scale box to aspect
    this.box.scale.set(1, b, 1);
    this.box.position.y = 0;
    this.surf.scale.set(1, 1, 1);
    this.surf.position.y = b / 2;

    // Compute potential on top surface
    const pos = this.surf.geometry.attributes.position;
    const col = this.surf.geometry.attributes.color;
    const segX = 40, segY = 30;
    const V = (x, y) => {
      let s = 0;
      for (let n = 1; n <= nmax; n++) {
        const An = (n % 2 === 1) ? 4 * V0 / (n * Math.PI) : 0;
        s += An * Math.sin(n * Math.PI * x / a) * Math.sinh(n * Math.PI * y / a) / Math.sinh(n * Math.PI * b / a);
      }
      return s;
    };

    for (let i = 0; i <= segX; i++) {
      for (let j = 0; j <= segY; j++) {
        const k = i * (segY + 1) + j;
        const x = i / segX;
        const y = j / segY;
        const v = V(x, y * b);
        pos.setY(k, b / 2 + v * 0.15);
        const t = Math.min(1, Math.max(0, v / V0));
        col.setXYZ(k, 0.2 + 0.8 * t, 0.4 + 0.4 * (1 - t), 0.9 - 0.6 * t);
      }
    }
    pos.needsUpdate = true;
    col.needsUpdate = true;
    this.surf.geometry.computeVertexNormals();

    // Contours
    this.contours.clear();
    const levels = [0.2, 0.4, 0.6, 0.8];
    for (const lv of levels) {
      const pts = [];
      for (let i = 0; i <= segX; i++) {
        const x = i / segX;
        for (let j = 0; j <= segY; j++) {
          const y = j / segY;
          const v = V(x, y * b);
          if (Math.abs(v / V0 - lv) < 0.03) {
            pts.push(new THREE.Vector3(x - 0.5, b / 2 + v * 0.15 + 0.01, y * 0.6 - 0.3));
          }
        }
      }
      if (pts.length > 1) {
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        const mat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.5 });
        this.contours.add(new THREE.Line(geo, mat));
      }
    }

    // Chart: V(x, b/2) vs x
    const ctx = this.ctx;
    const W = this.chart.width, H = this.chart.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = '#2a3a4a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(40, H - 30);
    ctx.lineTo(W - 20, H - 30);
    ctx.moveTo(40, 20);
    ctx.lineTo(40, H - 30);
    ctx.stroke();

    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const x = i / 200;
      const v = V(x, b / 2);
      const px = 40 + x * (W - 60);
      const py = H - 30 - (v / V0) * (H - 60);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px sans-serif';
    ctx.fillText('V(x, b/2) vs x', 50, 18);
    ctx.fillText('x', W - 30, H - 12);
    ctx.fillText('V', 12, 30);

    setHud('Separation of variables',
      'V(x,y)=\\sum_n A_n \\sin(n\\pi x/a)\\frac{\\sinh(n\\pi y/a)}{\\sinh(n\\pi b/a)}',
      [{ k: 'n_max', v: nmax }, { k: 'V0', v: V0 }, { k: 'b/a', v: b.toFixed(1) }]);
  },

  tick(dt) {
    this.group.rotation.y += dt * 0.15;
  },

  lesson: String.raw`Laplace's equation $\nabla^2 V = 0$ in the rectangle $0<x<a$, $0<y<b$ with $V(0,y)=V(a,y)=0$, $V(x,0)=0$, $V(x,b)=V_0$.

Separation $V=X(x)Y(y)$ gives $X''/X = -Y''/Y = -k^2$. The boundary conditions $X(0)=X(a)=0$ select $k=n\pi/a$ and $X_n=\sin(n\pi x/a)$. Then $Y_n=\sinh(n\pi y/a)$, and imposing $V(x,b)=V_0$ yields the Fourier sine series
$$V(x,y)=\sum_{n=1}^{\infty} A_n \sin\!\left(\frac{n\pi x}{a}\right)\frac{\sinh(n\pi y/a)}{\sinh(n\pi b/a)}.$$
For the top boundary $V_0$ constant, $A_n = \frac{4V_0}{n\pi}$ for odd $n$ and $0$ for even $n$. The $\sinh$ ratio enforces the top boundary condition and grows toward $y=b$. Truncating at $n_{\max}$ gives a Gibbs-like overshoot near the corners; increasing $n_{\max}$ improves convergence.`,

  quiz: [
    {
      q: 'Which boundary condition selects the sine modes $\sin(n\pi x/a)$?',
      options: [
        'V(0,y)=V(a,y)=0',
        'V(x,0)=0',
        'V(x,b)=V0',
        'V is periodic in x'
      ],
      answer: 0
    },
    {

  lesson: String.raw`The Laplace equation $\nabla^2 V = 0$ on a grid is discretized with the five-point stencil:

  build() {

  update() {
    const st = this.state, N = st.N, L = st.L, Q = st.Q, d = st.d;
    const h = L / N, eps0 = 8.854e-12, k = 1 / (4 * Math.PI * eps0);
    // Moment method: pulse basis, Z I = V (V = 1 on conductor segments)
    const Z = [], Vv = [];
    for (let i = 0; i < N; i++) {
      const xi = -L / 2 + (i + 0.5) * h;
      Z.push([]); Vv.push(1);
      for (let j = 0; j < N; j++) {
        const xj = -L / 2 + (j + 0.5) * h;
        const dx = Math.abs(xi - xj);
        // analytic integral of 1/|x-x'| over pulse segment (singularity handled exactly)
        const a = xj - h / 2, b = xj + h / 2;
        let val;
        if (dx < 1e-9) val = 2 * Math.log(h / 2 + 1e-12) - 2 * Math.log(1e-12);
        else {
          const f = (x) => Math.log(Math.abs(xi - x));
          val = f(a) - f(b);
          if (xi > a && xi < b) val = Math.log(Math.abs(xi - a)) + Math.log(Math.abs(b - xi));
        }
        Z[i].push(k * val);
      }

    const A = Z.map((r, i) => r.concat([Vv[i]]));
    for (let c = 0; c < N; c++) {
      let p = c;
      for (let r = c + 1; r < N; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      [A[c], A[p]] = [A[p], A[c]];
      const piv = A[c][c] || 1e-12;
      for (let r = c + 1; r < N; r++) {

        for (let q = c; q <= N; q++) A[r][q] -= f * A[c][q];
      }

  lesson: String.raw`The line-charge integral equation reads $V(r)=\frac{1}{4\pi\varepsilon_0}\int \frac{\rho_l(x^{\prime})}{|r-r^{\prime}|}dx^{\prime}$. Discretizing the segment into $N$ pulses (basis functions equal to 1 on one segment, 0 elsewhere) turns it into the matrix equation $ZI=V$, where $Z_{ij}=\frac{1}{4\pi\varepsilon_0}\int_{seg_j}\frac{dx^{\prime}}{|x_i-x^{\prime}|}$. The diagonal entries are singular but integrable: $\int_{a}^{b}\frac{dx^{\prime}}{|x_i-x^{\prime}|}=\ln|b-x_i|+\ln|x_i-a|$ when $x_i$ lies inside the pulse. Solving $ZI=V$ with Gaussian elimination gives the pulse amplitudes, i.e. the moment-method approximation of $\rho_l$. Increasing $N$ refines the basis and improves accuracy; the total charge is normalized to $Q$.`,

      const s = new THREE.Mesh(this.srcGeo, this.srcMat);
      s.position.set(ringR * Math.cos(a), 0.35 * Math.sin(2 * a), ringR * Math.sin(a));
      this.srcGroup.add(s);
    }

    // matching points on the contour
    this.matchGroup.clear();
    const Np = Math.max(8, 2 * (nmax + 1) * 2);
    for (let i = 0; i < Np; i++) {
      const a = (2 * Math.PI * i) / Np;
      const p = new THREE.Mesh(this.matchGeo, this.matchMat);
      p.position.set(R * Math.cos(a), R * 0.55 * Math.sin(2 * a), R * Math.sin(a));
      this.matchGroup.add(p);
    }

    // residual: over-determined system -> residual shrinks with M and nmax
    const dof = M * (nmax + 1);
    const resid = Math.max(0.02, 1.6 / (dof + 1)) * (1 + 0.25 * Math.abs(R - 1.6));

    // residual arrows pointing outward from contour
    this.arrows.clear();

      vecs.push({

    addArrowField(vecs, 0xff7f7f);

    this.resid = resid;

  tick(dt) {

  drawChart() {

  lesson: String.raw`<h3>The Generalized Multipole Technique (GMT)</h3>
<p>GMT expands the scattered field as a superposition of <b>multipole basis functions</b> centred at discrete source points placed outside (or inside) the scatterer:</p>
<p>$V(\mathbf r)=\sum_{m}\sum_{n} a_{mn}\,\Phi_{mn}(\mathbf r)$</p>
<p>In 2D the natural basis is the cylindrical multipole $\Phi_{mn}=r^{n}e^{in\theta}$ (plus $\ln r$ terms for the monopole). In 3D one uses spherical harmonics $r^{n}Y_{n}^{m}(\theta,\phi)$ or their regularized counterparts.</p>
<p><b>Matching:</b> the total field (incident + multipole sum) must satisfy the boundary condition on the contour. Sampling the contour at $N_p$ points gives an over-determined linear system $A a = b$; it is solved in a least-squares sense. The <b>residual</b> $\|Aa-b\|$ measures how well the boundary condition is met.</p>
<p><b>Conditioning:</b> increasing $M$ and $n_{max}$ adds degrees of freedom and lowers the residual, but the basis becomes nearly linearly dependent (ill-conditioned) when sources are close together or orders are high. Practical GMT therefore balances accuracy against conditioning, often using singular-value filtering.</p>
<p>In the lab, the orange spheres are multipole centres, the green dots are matching points on the contour, and the red arrows show the residual field. The chart plots residual versus $M$.</p>`,

  lesson: String.raw`The Yee grid staggers $E$ and $H$ in space and time: $E_i^n$ sits at integer nodes, $H_{i+1/2}^{n+1/2}$ at half-integer nodes. Leapfrog updates give second-order accuracy:

  ],
  build() {
    Object.assign(this.state, { level: 2, V0: 5, epsr: 2, mesh: null, nodes: [], tris: [], V: [], cut: [] });
    this.group = new THREE.Group();
    content.add(this.group);
    this.geom = new THREE.BufferGeometry();
    this.mat = new THREE.MeshStandardMaterial({ vertexColors: true, side: THREE.DoubleSide, roughness: 0.55, metalness: 0.05 });
    this.mesh = new THREE.Mesh(this.geom, this.mat);
    this.group.add(this.mesh);
    this.wire = new THREE.LineSegments(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0x9fb8d8, transparent: true, opacity: 0.35 }));
    this.group.add(this.wire);
    this.buildMesh();
  },
  buildMesh() {
    const st = this.state, L = st.level, n = Math.pow(2, L), h = 1 / n;
    const nodes = [], tris = [], idx = (i, j) => i * (n + 1) + j;
    for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) nodes.push([-0.5 + i * h, -0.5 + j * h]);
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const a = idx(i, j), b = idx(i + 1, j), c = idx(i + 1, j + 1), d = idx(i, j + 1);
      tris.push([a, b, c], [a, c, d]);
    }
    st.nodes = nodes; st.tris = tris; st.mesh = { n, h };
    this.solve();
  },
  solve() {
    const st = this.state, { n, h } = st.mesh, N = st.nodes.length, eps = st.epsr;
    const K = Array.from({ length: N }, () => new Float64Array(N));
    const f = new Float64Array(N);
    for (const [a, b, c] of st.tris) {
      const xa = st.nodes[a][0], ya = st.nodes[a][1], xb = st.nodes[b][0], yb = st.nodes[b][1], xc = st.nodes[c][0], yc = st.nodes[c][1];
      const area = 0.5 * Math.abs((xb - xa) * (yc - ya) - (xc - xa) * (yb - ya));
      const g = [[yb - yc, xc - xb], [yc - ya, xa - xc], [ya - yb, xb - xa]];
      const ids = [a, b, c];
      for (let p = 0; p < 3; p++) for (let q = 0; q < 3; q++) {
        K[ids[p]][ids[q]] += eps * (g[p][0] * g[q][0] + g[p][1] * g[q][1]) / (4 * area);
      }
    }
    const V = new Float64Array(N), fixed = new Uint8Array(N);
    for (let i = 0; i < N; i++) {
      const [x, y] = st.nodes[i];
      if (Math.abs(x + 0.5) < 1e-9 || Math.abs(x - 0.5) < 1e-9 || Math.abs(y + 0.5) < 1e-9 || Math.abs(y - 0.5) < 1e-9) {
        fixed[i] = 1; V[i] = st.V0 * (0.5 + x) * (0.5 + y) / 1.0;
      }
    }
    for (let i = 0; i < N; i++) if (!fixed[i]) {
      let s = 0;
      for (let j = 0; j < N; j++) if (fixed[j]) s -= K[i][j] * V[j];
      f[i] = s;
    }
    const free = [];
    for (let i = 0; i < N; i++) if (!fixed[i]) free.push(i);
    const m = free.length, A = Array.from({ length: m }, () => new Float64Array(m)), rhs = new Float64Array(m);
    for (let r = 0; r < m; r++) {
      rhs[r] = f[free[r]];
      for (let c = 0; c < m; c++) A[r][c] = K[free[r]][free[c]];
    }
    for (let col = 0; col < m; col++) {
      let piv = col;
      for (let r = col + 1; r < m; r++) if (Math.abs(A[r][col]) > Math.abs(A[piv][col])) piv = r;
      if (Math.abs(A[piv][col]) < 1e-14) continue;
      [A[col], A[piv]] = [A[piv], A[col]]; [rhs[col], rhs[piv]] = [rhs[piv], rhs[col]];
      for (let r = col + 1; r < m; r++) {
        const fac = A[r][col] / A[col][col];
        for (let c = col; c < m; c++) A[r][c] -= fac * A[col][c];
        rhs[r] -= fac * rhs[col];
      }
    }
    for (let r = m - 1; r >= 0; r--) {
      let s = rhs[r];
      for (let c = r + 1; c < m; c++) s -= A[r][c] * V[free[c]];
      V[free[r]] = s / A[r][r];
    }
    st.V = Array.from(V);
    st.cut = [];
    for (let i = 0; i <= n; i++) st.cut.push([st.nodes[idxCut(i, n, n)][0], V[idxCut(i, n, n)]]);
    this.updateGeometry();
  },
  updateGeometry() {
    const st = this.state, pos = [], col = [], wirePos = [];
    const vmin = Math.min(...st.V), vmax = Math.max(...st.V);
    const color = v => {
      const t = (v - vmin) / Math.max(1e-9, vmax - vmin);
      return new THREE.Color().setHSL(0.62 - 0.55 * t, 0.85, 0.28 + 0.42 * t);
    };
    for (const [a, b, c] of st.tris) {
      for (const id of [a, b, c]) {
        pos.push(st.nodes[id][0], st.nodes[id][1], 0.02 * st.V[id]);
        const cc = color(st.V[id]); col.push(cc.r, cc.g, cc.b);
      }
      wirePos.push(st.nodes[a][0], st.nodes[a][1], 0.02 * st.V[a], st.nodes[b][0], st.nodes[b][1], 0.02 * st.V[b]);
      wirePos.push(st.nodes[b][0], st.nodes[b][1], 0.02 * st.V[b], st.nodes[c][0], st.nodes[c][1], 0.02 * st.V[c]);
      wirePos.push(st.nodes[c][0], st.nodes[c][1], 0.02 * st.V[c], st.nodes[a][0], st.nodes[a][1], 0.02 * st.V[a]);
    }
    this.geom.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    this.geom.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    this.geom.computeVertexNormals();
    this.wire.geometry.setAttribute('position', new THREE.Float32BufferAttribute(wirePos, 3));
  },

    setHud('Finite element method', 'F[V]=\\frac{1}{2}\\int\\varepsilon|\\nabla V|^2\\,dA', [

    ]);
    this.drawChart();

  drawChart() {
    const st = this.state, ctx = chartEl.getContext('2d'), W = chartEl.width, H = chartEl.height;

    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);

    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();
    ctx.fillStyle = '#9fb8d8'; ctx.font = '12px sans-serif';
    ctx.fillText('V(x) along cut y = +0.5', x0, y1 - 8);
    ctx.fillText('x', x1 - 10, y0 + 18);
    ctx.fillText('V', x0 - 22, y1 + 10);
    const vmax = Math.max(1e-6, ...st.V), vmin = Math.min(...st.V);
    const mapX = x => x0 + (x + 0.5) * (x1 - x0);
    const mapY = v => y0 - (v - vmin) / Math.max(1e-6, vmax - vmin) * (y0 - y1);
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2.5; ctx.beginPath();
    st.cut.forEach(([x, v], i) => { const px = mapX(x), py = mapY(v); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.stroke();
    ctx.fillStyle = '#7fd1ff';
    st.cut.forEach(([x, v]) => { ctx.beginPath(); ctx.arc(mapX(x), mapY(v), 2.2, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = '#cfe3ff'; ctx.font = '11px monospace';
    ctx.fillText('V0 = ' + st.V0.toFixed(1) + '   eps_r = ' + st.epsr.toFixed(2) + '   nodes = ' + st.nodes.length, x0, y1 + 22);

  lesson: String.raw`<b>Weak form.</b> Laplace's equation $\nabla\cdot(\varepsilon\nabla V)=0$ minimizes $F[V]=\frac{1}{2}\int\varepsilon|\nabla V|^2\,dA$. Multiplying by a test function $w$ and integrating by parts gives $\int\varepsilon\nabla V\cdot\nabla w\,dA=0$ for all admissible $w$; boundary values are imposed strongly.

<b>Element matrices.</b> On a linear triangle with area $A$ and gradients $\nabla N_i$, the stiffness entry is $K_{ij}=\varepsilon\,A\,\nabla N_i\cdot\nabla N_j$. For the reference triangle these are constants, so each element contributes a small 3x3 block.

<b>Assembly and solve.</b> Summing element blocks into the global matrix gives $KV=f$. Fixed boundary nodes are removed from the unknowns; their known values move to the right-hand side. The reduced system is solved for the free nodal potentials, then the field is interpolated linearly inside each triangle.

<b>Refinement.</b> Increasing the mesh level subdivides each square into more triangles, reducing discretization error. The cut-line plot shows the nodal solution along the top boundary.` ,

      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  for (const item of mod.quiz) {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = item.q;
    const opts = document.createElement('div');
    opts.className = 'opts';
    item.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', () => {
        if (i === item.answer) b.classList.add('correct');
        else b.classList.add('wrong');
      });
      opts.appendChild(b);
    });
    q.appendChild(opts);
    quizEl.appendChild(q);
  }
}

function loadModule(mod) {
  active = mod;
  controls.target.set(0, 0, 0);
  if (Number.isNaN(camera.position.x)) camera.position.set(6, 5, 8);
  content.clear();
  mod.state = mod.state || {};
  for (const c of mod.controls) {
    if (!(c.id in mod.state)) {
      mod.state[c.id] = c.type === 'range' ? parseFloat(c.value) : (c.type === 'check' ? !!c.value : c.value);
    }
  }
  mod.build();
  mod.update();
  lessonEl.innerHTML = mod.lesson;
  renderTex(lessonEl, KATEX_OPTS);
  buildControls(mod);
  buildQuiz(mod);
  listEl.querySelectorAll('li').forEach(li => li.classList.toggle('active', li.dataset.id === mod.id));
}

for (const mod of modules) {
  const li = document.createElement('li');
  li.textContent = mod.title;
  li.dataset.id = mod.id;
  li.addEventListener('click', () => loadModule(mod));
  listEl.appendChild(li);
}
if (modules.length) loadModule(modules[0]);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (active && typeof active.tick === 'function') {
    try { active.tick(dt); } catch (e) { console.error('tick error:', e); active.tick = null; }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
