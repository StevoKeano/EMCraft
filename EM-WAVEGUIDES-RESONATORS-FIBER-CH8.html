<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electromagnetics with Applications — Ch. 8: Waveguides, Resonators, and Fiber Optics</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0b1018;
      --panel: #121a26;
      --panel-2: #182232;
      --text: #e6edf7;
      --muted: #93a4bc;
      --accent: #49b6ff;
      --accent-2: #34d399;
      --border: #253449;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 330px 1fr;
      grid-template-rows: 54px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    header {
      grid-column: 1 / -1;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
    }
    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    header .meta {
      font-size: 12px;
      color: var(--muted);
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    select, input[type="range"] {
      width: 100%;
    }
    .box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .box h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 0 0 8px 0;
    }
    .ctrl { margin-bottom: 10px; }
    .ctrl:last-child { margin-bottom: 0; }
    .ctrl label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    main {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 250px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }
    #sceneWrap {
      grid-row: 1 / -1;
      position: relative;
      background: #070b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(12, 18, 28, 0.86);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 250px;
      max-width: 390px;
      pointer-events: none;
    }
    #hudTitle { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    #hudEq { font-size: 13px; margin-bottom: 8px; overflow-x: auto; }
    .hudRow { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-top: 1px solid rgba(255,255,255,0.05); }
    .hudRow span:first-child { color: var(--muted); }
    #chartWrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    #chartEl { width: 100%; height: 100%; flex: 1; background: #090e16; border-radius: 6px; }
    #infoWrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
    }
    .quizOpt { display: block; margin: 4px 0; font-size: 12px; cursor: pointer; }
    @media (max-width: 820px) {
      body {
        display: flex;
        flex-direction: column;
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
      }
      header { padding: 8px 12px; height: auto; flex-wrap: wrap; }
      header h1 { font-size: 13px; }
      aside { border-right: none; border-bottom: 1px solid var(--border); overflow-y: visible; }
      main {
        display: flex;
        flex-direction: column;
        overflow: visible;
      }
      #sceneWrap { height: 52vh; min-height: 300px; }
      #chartWrap { height: 220px; }
      #infoWrap { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Kraus &amp; Fleisch — Electromagnetics with Applications · Ch. 8: Waveguides, Resonators, and Fiber Optics</h1>
    <div class="meta">3D WebGL + 2D Analytical Plot + Interactive Lab</div>
  </header>
  <aside>
    <div class="box">
      <h2>Section Module</h2>
      <select id="modSelect"></select>
    </div>
    <div class="box">
      <h2>Parameters</h2>
      <div id="controlsHost"></div>
    </div>
    <div class="box">
      <h2>Quick Check</h2>
      <div id="quizHost"></div>
    </div>
  </aside>
  <main>
    <div id="sceneWrap">
      <div id="hud">
        <div id="hudTitle">Ready</div>
        <div id="hudEq"></div>
        <div id="hudRows"></div>
      </div>
    </div>
    <div id="infoWrap"><div id="lessonHost"></div></div>
    <div id="chartWrap"><canvas id="chartEl" width="600" height="210"></canvas></div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const sceneWrap = document.getElementById('sceneWrap');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(sceneWrap.clientWidth || 800, sceneWrap.clientHeight || 600);
    sceneWrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b11);
    const camera = new THREE.PerspectiveCamera(45, (sceneWrap.clientWidth || 800) / (sceneWrap.clientHeight || 600), 0.1, 200);
    camera.position.set(5, 4, 7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(6, 10, 8);
    scene.add(dirLight);
    scene.add(new THREE.GridHelper(12, 12, 0x26354d, 0x131c2a));

    const content = new THREE.Group();
    scene.add(content);

    const chartEl = document.getElementById('chartEl');

    function addArrowField(vectors, color = 0x7fd1ff) {
      const group = new THREE.Group();
      const arrowObjs = (vectors || []).map((v) => {
        const origin = v.origin ? v.origin.clone() : new THREE.Vector3();
        const dir = v.dir ? v.dir.clone().normalize() : new THREE.Vector3(0, 1, 0);
        const len = v.len ?? 1.0;
        const arr = new THREE.ArrowHelper(dir, origin, Math.max(len, 0.05), color, Math.min(0.28, len * 0.3), Math.min(0.16, len * 0.18));
        group.add(arr);
        return arr;
      });
      content.add(group);
      return {
        group,
        setVectors(nextVecs) {
          (nextVecs || []).forEach((v, i) => {
            if (!arrowObjs[i]) return;
            if (v.origin) arrowObjs[i].position.copy(v.origin);
            if (v.dir) arrowObjs[i].setDirection(v.dir.clone().normalize());
            if (typeof v.len === 'number') {
              const l = Math.max(v.len, 0.05);
              arrowObjs[i].setLength(l, Math.min(0.28, l * 0.3), Math.min(0.16, l * 0.18));
            }
          });
        }
      };
    }

    function setHud(titleStr, latexEqStr, rows) {
      document.getElementById('hudTitle').textContent = titleStr || '';
      const eqEl = document.getElementById('hudEq');
      if (window.katex && latexEqStr) {
        try { window.katex.render(latexEqStr, eqEl, { throwOnError: false }); }
        catch (_) { eqEl.textContent = latexEqStr; }
      } else {
        eqEl.textContent = latexEqStr || '';
      }
      const rowsEl = document.getElementById('hudRows');
      rowsEl.innerHTML = (rows || []).map((r) => `<div class="hudRow"><span>${r.k}</span><span>${r.v}</span></div>`).join('');
    }

    const modules = [];

    modules.push({
  id: 'wg_intro_guided_waves',
  title: '8-1 Introduction: Guided Electromagnetic Waves',
  controls: [
    { id: 'freq_GHz', label: 'Operating frequency f (GHz)', type: 'range', min: 2.0, max: 20.0, step: 0.2, value: 10.0 },
    { id: 'fc_GHz', label: 'Cutoff frequency f_c (GHz)', type: 'range', min: 1.0, max: 12.0, step: 0.2, value: 6.0 },
    { id: 'animate_wave', label: 'Animate wave', type: 'check', value: true }
  ],

  build() {
    const g = new THREE.Group();
    const L = 14, a = 2.2, b = 1.1, t = 0.09;

    // Hollow rectangular pipe: four translucent walls
    const wallMat = new THREE.MeshStandardMaterial({
      color: 0x2f6f9f, emissive: 0x0d2b44, metalness: 0.6, roughness: 0.35,
      transparent: true, opacity: 0.28, side: THREE.DoubleSide
    });
    const walls = [
      { w: a, h: t, x: 0, y: b / 2 },
      { w: a, h: t, x: 0, y: -b / 2 },
      { w: t, h: b, x: a / 2, y: 0 },
      { w: t, h: b, x: -a / 2, y: 0 }
    ];
    for (const wl of walls) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(wl.w, wl.h, L), wallMat);
      m.position.set(wl.x, wl.y, 0);
      g.add(m);
    }

    // Bright edge lines along the pipe
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x7fd1ff });
    const corners = [[a / 2, b / 2], [a / 2, -b / 2], [-a / 2, -b / 2], [-a / 2, b / 2]];
    for (const c of corners) {
      const geo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(c[0], c[1], -L / 2), new THREE.Vector3(c[0], c[1], L / 2)
      ]);
      g.add(new THREE.Line(geo, edgeMat));
    }
    // Cross-section rings
    for (let i = 0; i <= 6; i++) {
      const z = -L / 2 + (i * L) / 6;
      const pts = corners.map(c => new THREE.Vector3(c[0], c[1], z));
      pts.push(pts[0].clone());
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),
        new THREE.LineBasicMaterial({ color: 0x3f8fc0, transparent: true, opacity: 0.5 })));
    }

    // Axis line (z)
    g.add(new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, -L / 2 - 0.6), new THREE.Vector3(0, 0, L / 2 + 0.6)
      ]),
      new THREE.LineDashedMaterial({ color: 0x9ad8ff, dashSize: 0.25, gapSize: 0.15 })
    ));

    // E field arrows (transverse, vertical) and H field arrows (transverse, horizontal)
    const eArrows = addArrowField([], 0xff6b6b);
    const hArrows = addArrowField([], 0x7fd1ff);
    g.add(eArrows.group, hArrows.group);

    // Phase marker (plane) and group packet marker
    const phasePlane = new THREE.Mesh(
      new THREE.PlaneGeometry(a * 0.95, b * 0.95),
      new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
    );
    g.add(phasePlane);

    const packet = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0x9bff9b, emissive: 0x2f8f2f, roughness: 0.4 })
    );
    g.add(packet);

    content.add(g);
    this.meshRefs = { g, eArrows, hArrows, phasePlane, packet, L, a, b };
    this.t = 0;
  },

  update() {
    const st = this.state;
    const f = st.freq_GHz, fc = st.fc_GHz;
    const c = 3.0e8; // m/s
    const ratio = f / fc;
    const propagating = ratio > 1.0;
    const s = propagating ? Math.sqrt(1 - 1 / (ratio * ratio)) : 0;
    const vp = propagating ? 1 / s : Infinity;
    const vg = propagating ? s : 0;
    const lambdaG = propagating ? (c / (f * 1e9)) / s : Infinity; // meters

    const { eArrows, hArrows, phasePlane, packet, L, a, b } = this.meshRefs;

    // Field arrows: sample along z, transverse E (y) and H (x)
    const N = 14;
    const ev = [], hv = [];
    const kz = propagating ? (2 * Math.PI * f * 1e9 / c) * s : 0;
    const amp = propagating ? 1.0 : 0.0;
    for (let i = 0; i < N; i++) {
      const z = -L / 2 + (i + 0.5) * (L / N);
      const ph = kz * z - this.t * 2 * Math.PI * 0.6;
      const e = Math.sin(ph) * amp;
      const h = Math.cos(ph) * amp;
      ev.push({
        origin: new THREE.Vector3(0, -b * 0.35, z),
        dir: new THREE.Vector3(0, 1, 0),
        len: 0.55 * Math.abs(e) + 0.02
      });
      hv.push({
        origin: new THREE.Vector3(-a * 0.35, 0, z),
        dir: new THREE.Vector3(1, 0, 0),
        len: 0.55 * Math.abs(h) + 0.02
      });
    }
    eArrows.setVectors(ev);
    hArrows.setVectors(hv);

    // Markers
    const zPhase = -L / 2 + ((this.t * 0.6) % 1) * L;
    phasePlane.position.set(0, 0, zPhase);
    phasePlane.visible = propagating;
    const zPacket = -L / 2 + ((this.t * 0.6 * s) % 1) * L;
    packet.position.set(0, 0, zPacket);
    packet.visible = propagating;

    // ---- 2D chart ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const padL = 60, padR = 30, padT = 40, padB = 50;
    const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
    const xmin = 1.0, xmax = 3.0, ymin = 0, ymax = 3.0;
    const X = u => x0 + (u - xmin) / (xmax - xmin) * (x1 - x0);
    const Y = v => y1 - (v - ymin) / (ymax - ymin) * (y1 - y0);

    // grid
    ctx.strokeStyle = '#1e2b3d'; ctx.lineWidth = 1;
    for (let u = 1.0; u <= 3.0001; u += 0.25) {
      ctx.beginPath(); ctx.moveTo(X(u), y0); ctx.lineTo(X(u), y1); ctx.stroke();
    }
    for (let v = 0; v <= 3.0001; v += 0.5) {
      ctx.beginPath(); ctx.moveTo(x0, Y(v)); ctx.lineTo(x1, Y(v)); ctx.stroke();
    }
    // axes
    ctx.strokeStyle = '#5b7fa6'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();

    // labels
    ctx.fillStyle = '#9ad8ff'; ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('f / f_c', x1 - 60, y1 + 30);
    ctx.save(); ctx.translate(18, y0 + 60); ctx.rotate(-Math.PI / 2);
    ctx.fillText('v / c', 0, 0); ctx.restore();
    for (let u = 1.0; u <= 3.0001; u += 0.5) {
      ctx.fillStyle = '#7fa8cc'; ctx.fillText(u.toFixed(1), X(u) - 10, y1 + 18);
    }
    for (let v = 0; v <= 3.0001; v += 1) {
      ctx.fillStyle = '#7fa8cc'; ctx.fillText(v.toFixed(0), x0 - 22, Y(v) + 4);
    }

    // vp/c curve
    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const u = 1.0 + (i / 200) * 2.0;
      if (u <= 1.0) continue;
      const v = 1 / Math.sqrt(1 - 1 / (u * u));
      if (v > ymax) continue;
      const px = X(u), py = Y(v);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // vg/c curve
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const u = 1.0 + (i / 200) * 2.0;
      const v = Math.sqrt(Math.max(0, 1 - 1 / (u * u)));
      const px = X(u), py = Y(v);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // product curve (should be 1)
    ctx.strokeStyle = '#9bff9b'; ctx.lineWidth = 1.5; ctx.setLineDash([6, 5]);
    ctx.beginPath();
    ctx.moveTo(X(1.02), Y(1)); ctx.lineTo(X(3), Y(1)); ctx.stroke();
    ctx.setLineDash([]);

    // operating point
    if (ratio > 1.0 && vp <= ymax) {
      ctx.fillStyle = '#ffd166';
      ctx.beginPath(); ctx.arc(X(ratio), Y(vp), 5, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(X(ratio), Y(vg), 5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(ratio), Y(vg)); ctx.lineTo(X(ratio), Y(vp)); ctx.stroke();
    }

    // legend
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillStyle = '#ff6b6b'; ctx.fillText('v_p / c', x1 - 150, y0 + 14);
    ctx.fillStyle = '#7fd1ff'; ctx.fillText('v_g / c', x1 - 90, y0 + 14);
    ctx.fillStyle = '#9bff9b'; ctx.fillText('v_p v_g / c^2 = 1', x1 - 220, y0 + 30);

    // ---- HUD ----
    setHud(
      'Guided Waves & Dispersion',
      'v_p = \\frac{c}{\\sqrt{1-(f_c/f)^2}},\\quad v_g = c\\sqrt{1-(f_c/f)^2},\\quad v_p v_g = c^2',
      [
        { k: 'State', v: propagating ? 'Propagating (β real)' : 'Cutoff / evanescent (α > 0)' },
        { k: 'v_p / c', v: propagating ? vp.toFixed(3) : '—' },
        { k: 'v_g / c', v: propagating ? vg.toFixed(3) : '0' },
        { k: 'λ_g (cm)', v: propagating ? (lambdaG * 100).toFixed(2) : '∞' }
      ]
    );
  },

  tick(dt) {
    if (this.state.animate_wave) this.t += dt;
    this.update();
  },

  lesson: `<p>In a hollow conducting waveguide the field is confined to the interior, so energy no longer spreads as 1/r². The axial dependence is <em>e^{jωt − γz}</em> with γ = α + jβ. Above the cutoff frequency f_c the guide is lossless (α = 0) and β = (ω/c)√(1 − (f_c/f)²).</p>
  <p>The phase velocity v_p = ω/β = c/√(1 − (f_c/f)²) exceeds c, while the group (energy) velocity v_g = dω/dβ = c√(1 − (f_c/f)²) is less than c. Their product is exactly c², so no signal travels faster than light. As f → f_c⁺, v_g → 0 and v_p → ∞ (the guide wavelength λ_g = 2π/β → ∞); below cutoff the wave is evanescent and carries no net power.</p>`,

  quiz: [
    { q: 'For a lossless guide above cutoff, which relation holds?', options: ['v_p v_g = c²', 'v_p = v_g = c', 'v_p + v_g = c', 'v_p v_g = c'], answer: 0 },
    { q: 'As f approaches f_c from above, the group velocity v_g tends to:', options: ['c', 'zero', 'infinity', 'c/2'], answer: 1 },
    { q: 'Below cutoff frequency the axial propagation constant γ is:', options: ['purely imaginary', 'purely real (α > 0, β = 0)', 'zero', 'complex with β > α'], answer: 1 }
  ]
});
modules.push({
  id: 'circuits_lines_guides_comparison',
  title: '8-2 Circuits, Lines, and Guides: A Comparison',
  controls: [
    { id: 'freq_GHz', label: 'Frequency f (GHz)', type: 'range', min: 0.1, max: 30.0, step: 0.5, value: 10.0 },
    { id: 'struct_type', label: 'Structure', type: 'select', options: ['Lumped Circuit (1 cm)', 'Coaxial Line (TEM)', 'Hollow Waveguide (a=2.29 cm)'], value: 'Hollow Waveguide (a=2.29 cm)' },
    { id: 'eps_r', label: 'Dielectric fill eps_r', type: 'range', min: 1.0, max: 4.0, step: 0.2, value: 1.0 }
  ],

  build() {
    const g = new THREE.Group();
    content.add(g);
    this.group = g;
    this.meshRefs = {};

    const mkMat = (c, e = 0.35) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: e, metalness: 0.6, roughness: 0.35 });

    // ---- Lumped circuit: a small loop with a capacitor gap (left) ----
    const lump = new THREE.Group();
    lump.position.set(-3.2, 0, 0);
    const wireMat = mkMat(0xffb347, 0.25);
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.62, 0.055, 10, 40), wireMat);
    loop.rotation.x = Math.PI / 2;
    lump.add(loop);
    const gap = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.16, 0.16), mkMat(0xffe066, 0.5));
    gap.position.set(0.62, 0, 0);
    lump.add(gap);
    const src = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.28, 12), mkMat(0x9be7ff, 0.5));
    src.position.set(-0.62, 0, 0);
    lump.add(src);
    g.add(lump);
    this.meshRefs.lump = lump;

    // ---- Coaxial line (middle): inner conductor + outer shell ----
    const coax = new THREE.Group();
    coax.position.set(0, 0, 0);
    const inner = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 2.6, 16), mkMat(0xffd166, 0.4));
    inner.rotation.z = Math.PI / 2;
    coax.add(inner);
    const shell = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 2.6, 24, 1, true), new THREE.MeshStandardMaterial({ color: 0x6fb3ff, emissive: 0x2b6cb0, emissiveIntensity: 0.25, metalness: 0.8, roughness: 0.3, side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));
    shell.rotation.z = Math.PI / 2;
    coax.add(shell);
    const capA = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.06, 24), mkMat(0x6fb3ff, 0.3));
    capA.rotation.z = Math.PI / 2; capA.position.x = 1.3; coax.add(capA);
    const capB = capA.clone(); capB.position.x = -1.3; coax.add(capB);
    g.add(coax);
    this.meshRefs.coax = coax;

    // ---- Hollow rectangular waveguide (right) ----
    const wg = new THREE.Group();
    wg.position.set(3.2, 0, 0);
    const a = 1.15, b = 0.55, L = 2.6;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x8ee6c8, emissive: 0x2f8f6b, emissiveIntensity: 0.3, metalness: 0.85, roughness: 0.25, side: THREE.DoubleSide, transparent: true, opacity: 0.6 });
    const box = new THREE.Mesh(new THREE.BoxGeometry(L, b, a), wallMat);
    wg.add(box);
    // inner cavity hint (dark)
    const cav = new THREE.Mesh(new THREE.BoxGeometry(L * 0.98, b * 0.85, a * 0.85), new THREE.MeshStandardMaterial({ color: 0x0b1a24, emissive: 0x0b1a24, emissiveIntensity: 0.1, roughness: 0.9 }));
    wg.add(cav);
    // TE10 field: E along y, sinusoid across a (z axis here)
    const fieldGroup = new THREE.Group();
    for (let i = 0; i < 9; i++) {
      const x = -L / 2 + (i + 0.5) * (L / 9);
      const amp = Math.sin(Math.PI * (i + 0.5) / 9);
      const bar = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.42 * amp + 0.02, 0.05), mkMat(0xff6b6b, 0.7));
      bar.position.set(x, 0, 0);
      fieldGroup.add(bar);
    }
    wg.add(fieldGroup);
    this.meshRefs.wg = wg;
    this.meshRefs.wgField = fieldGroup;

    // ---- TEM field arrows for coax ----
    const arrows = [];
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      arrows.push({
        origin: new THREE.Vector3(-1.0 + (i % 2) * 0.5, Math.cos(ang) * 0.12, Math.sin(ang) * 0.12),
        dir: new THREE.Vector3(0, Math.cos(ang), Math.sin(ang)),
        len: 0.28
      });
    }
    this.arrowField = addArrowField(arrows, 0xffe066);
    this.arrowField.group.position.set(0, 0, 0);
    g.add(this.arrowField.group);

    // labels via small emissive spheres? keep simple: no text in 3D
    this.meshRefs.lumpMat = wireMat;
    this.meshRefs.coaxShell = shell;
    this.meshRefs.wgWall = wallMat;
  },

  update() {
    const st = this.state;
    const f = st.freq_GHz;              // GHz
    const er = st.eps_r;
    const c = 2.998e8;                  // m/s
    const lambda = c / (f * 1e9 * Math.sqrt(er)); // m
    const lambdaCm = lambda * 100;

    const type = st.struct_type;
    const isLump = type.startsWith('Lumped');
    const isCoax = type.startsWith('Coaxial');
    const isWg = type.startsWith('Hollow');

    // highlight active structure
    const dim = (m, on) => { m.emissiveIntensity = on ? 0.85 : 0.12; m.opacity = m.transparent ? (on ? 0.75 : 0.3) : 1; };
    dim(this.meshRefs.lumpMat, isLump);
    dim(this.meshRefs.coaxShell, isCoax);
    dim(this.meshRefs.wgWall, isWg);

    // waveguide cutoff TE10: fc = c/(2a sqrt(er)), a = 2.29 cm
    const aM = 0.0229;
    const fcTE10 = c / (2 * aM * Math.sqrt(er)) / 1e9; // GHz
    const wgOn = f > fcTE10;
    this.meshRefs.wgField.visible = isWg && wgOn;
    this.meshRefs.wgField.children.forEach((bar, i) => {
      const amp = Math.sin(Math.PI * (i + 0.5) / 9);
      bar.scale.y = wgOn ? (0.6 + 0.6 * amp) : 0.15;
    });

    // coax TEM arrows: always present, amplitude ~ 1/sqrt(er)
    this.arrowField.group.visible = isCoax;
    this.arrowField.setVectors(this.arrowField.group.userData.vecs || []);

    // lumped: electrical size d/lambda with d = 1 cm
    const dLump = 0.01;
    const sizeLump = dLump / lambda;
    const sizeCoax = 0.0084 / lambda; // outer radius 0.42 in scene ~ 0.84 cm diameter
    const sizeWg = aM / lambda;

    // ---- 2D chart: usable regime vs frequency ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a1420'; ctx.fillRect(0, 0, W, H);

    const padL = 62, padR = 22, padT = 34, padB = 46;
    const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
    const fMin = 0.1, fMax = 30;
    const X = (fg) => x0 + (fg - fMin) / (fMax - fMin) * (x1 - x0);
    const Y = (v) => y1 - v * (y1 - y0); // v in 0..1

    // grid
    ctx.strokeStyle = '#1d2c3d'; ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      const xg = x0 + i / 10 * (x1 - x0);
      ctx.beginPath(); ctx.moveTo(xg, y0); ctx.lineTo(xg, y1); ctx.stroke();
      ctx.fillStyle = '#7f9bb3'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText((fMin + i / 10 * (fMax - fMin)).toFixed(1), xg, y1 + 16);
    }
    for (let i = 0; i <= 5; i++) {
      const yg = y0 + i / 5 * (y1 - y0);
      ctx.beginPath(); ctx.moveTo(x0, yg); ctx.lineTo(x1, yg); ctx.stroke();
    }
    ctx.fillStyle = '#9fb6cc'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Frequency f (GHz)', (x0 + x1) / 2, H - 8);
    ctx.save(); ctx.translate(16, (y0 + y1) / 2); ctx.rotate(-Math.PI / 2);
    ctx.fillText('Usable regime (1 = usable)', 0, 0); ctx.restore();

    // Lumped: usable while d << lambda  -> lambda > 10*d = 0.1 m -> f < c/(0.1 sqrt(er))
    const fLumpMax = c / (0.1 * Math.sqrt(er)) / 1e9;
    // Coax TEM: usable from DC up to where transverse size < lambda/2 -> f < c/(2*0.0084*sqrt(er))
    const fCoaxMax = c / (2 * 0.0084 * Math.sqrt(er)) / 1e9;
    // WG: usable above fcTE10
    const fc = fcTE10;

    const drawBand = (fA, fB, color, label, yOff) => {
      const xa = X(Math.max(fMin, fA)), xb = X(Math.min(fMax, fB));
      if (xb > xa) {
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.22;
        ctx.fillRect(xa, y0 + yOff, xb - xa, y1 - y0 - yOff - 6);
        ctx.globalAlpha = 1;
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(xa, y0 + yOff); ctx.lineTo(xb, y0 + yOff); ctx.stroke();
      }
      ctx.fillStyle = color; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText(label, x0 + 6, y0 + yOff - 6);
    };

    drawBand(0, fLumpMax, '#ffb347', 'Lumped circuit (d << lambda)', 22);
    drawBand(0, fCoaxMax, '#6fb3ff', 'Coax TEM (f_c = 0)', 62);
    drawBand(fc, fMax, '#8ee6c8', 'Hollow WG TE10 (f > f_c)', 102);

    // cutoff marker
    if (fc < fMax) {
      ctx.strokeStyle = '#8ee6c8'; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(fc), y0); ctx.lineTo(X(fc), y1); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#8ee6c8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('f_c = ' + fc.toFixed(2) + ' GHz', X(fc), y0 - 8);
    }

    // current frequency marker
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(X(f), y0); ctx.lineTo(X(f), y1); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('f = ' + f.toFixed(1) + ' GHz', X(f), y1 - 6);

    // ---- HUD ----
    let modes, regime;
    if (isLump) {
      modes = 'Quasi-static V, I (no wave)';
      regime = sizeLump < 0.1 ? 'Lumped (d << lambda)' : 'Distributed effects appear';
    } else if (isCoax) {
      modes = 'TEM (f_c = 0)';
      regime = 'TEM line, usable to DC';
    } else {
      modes = wgOn ? 'TE10 (and higher TE/TM)' : 'Below cutoff: evanescent only';
      regime = wgOn ? 'Guided wave (f > f_c)' : 'Cutoff / no propagation';
    }

    setHud(
      'Circuits vs. Lines vs. Waveguides',
      '\\lambda = \\frac{c}{f\\sqrt{\\varepsilon_r}},\\quad f_{c,\\mathrm{TEM}} = 0,\\quad f_{c,\\mathrm{TE}_{10}} = \\frac{c}{2a\\sqrt{\\varepsilon_r}}',
      [
        { k: 'Wavelength lambda', v: lambdaCm.toFixed(2) + ' cm' },
        { k: 'Electrical size d/lambda', v: (isLump ? sizeLump : isCoax ? sizeCoax : sizeWg).toFixed(3) },
        { k: 'Supported modes', v: modes },
        { k: 'Regime', v: regime }
      ]
    );
  },

  tick(dt) {
    // gentle rotation of the whole comparison for depth perception
    if (this.group) this.group.rotation.y = Math.sin(performance.now() * 0.0004) * 0.18;
  },

  lesson: `<p><b>Circuits vs. lines vs. guides.</b> A lumped circuit is valid when every dimension satisfies <i>d &lt;&lt; lambda</i>; then voltages and currents are quasi-static and Kirchhoff's laws apply. A <b>two-conductor transmission line</b> (coax, twin-lead, microstrip) supports a TEM mode with <i>f_c = 0</i>, so it works down to DC; its phase velocity is <i>v_p = c / sqrt(eps_r)</i> and it is "distributed" once its transverse size approaches <i>lambda/2</i>. A <b>hollow single-conductor waveguide</b> cannot support TEM: with only one conductor there is no pair of isolated conductors to define a static potential, and <i>div x H = 0</i> admits no non-trivial transverse static field. It propagates only TE or TM modes above a cutoff, e.g. <i>f_c = c/(2a sqrt(eps_r))</i> for TE10 in a rectangular guide of width <i>a</i>. Below cutoff the fields are evanescent and decay exponentially.</p>`,
  quiz: [
    { q: 'Why can a coaxial line operate down to DC while a hollow waveguide cannot?', options: ['The coax has two conductors supporting a TEM mode with f_c = 0', 'The coax has a higher cutoff frequency', 'The waveguide has no dielectric', 'The coax is always shorter than lambda'], answer: 0 },
    { q: 'For a rectangular hollow waveguide of width a = 2.29 cm filled with air, the TE10 cutoff is approximately:', options: ['6.55 GHz', '13.1 GHz', '3.28 GHz', '0 GHz'], answer: 0 },
    { q: 'A lumped-circuit approximation is justified when:', options: ['d << lambda', 'd >> lambda', 'd = lambda/2 exactly', 'the guide is hollow'], answer: 0 }
  ]
});
modules.push({
  id: 'te_parallel_plane_guide',
  title: '8-3 TE Mode Wave in Infinite-Parallel-Plane Guide',
  controls: [
    { id: 'b_cm', label: 'Plate separation b (cm)', type: 'range', min: 1.0, max: 6.0, step: 0.2, value: 3.0 },
    { id: 'freq_GHz', label: 'Frequency f (GHz)', type: 'range', min: 2.0, max: 25.0, step: 0.5, value: 12.0 },
    { id: 'mode_m', label: 'TE_m mode index m', type: 'range', min: 1, max: 3, step: 1, value: 1 }
  ],

  build() {
    const C = 2.99792458e8, ETA0 = 376.730313;
    this.C = C; this.ETA0 = ETA0;

    // ---- plates ----
    const plateMat = new THREE.MeshStandardMaterial({
      color: 0x9fb6cc, metalness: 0.85, roughness: 0.28,
      emissive: 0x223344, emissiveIntensity: 0.5
    });
    this.plateGeo = new THREE.BoxGeometry(1, 0.06, 1);
    this.plateTop = new THREE.Mesh(this.plateGeo, plateMat);

    const glowMat = new THREE.MeshStandardMaterial({
      color: 0x1b3a55, transparent: true, opacity: 0.22,
      emissive: 0x2a6fa8, emissiveIntensity: 0.35, side: THREE.DoubleSide
    });
    this.slab = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), glowMat);
    content.add(this.slab);

    // ---- bouncing ray paths (two zig-zag polylines) ----
    this.rayMat = new THREE.LineBasicMaterial({ color: 0xffd166 });
    this.rayMat2 = new THREE.LineBasicMaterial({ color: 0x7fd1ff });
    this.rayA = new THREE.Line(new THREE.BufferGeometry(), this.rayMat);
    this.rayB = new THREE.Line(new THREE.BufferGeometry(), this.rayMat2);
    content.add(this.rayA, this.rayB);

    // ---- transverse E_x arrow field ----
    this.field = addArrowField([], 0x66ffcc);
    content.add(this.field.group);

    // ---- plate edge frame lines ----
    const edgeMat = new THREE.LineBasicMaterial({ color: 0x5f8fb8 });
    const edgeGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-1, 0, -1), new THREE.Vector3(1, 0, -1),
      new THREE.Vector3(1, 0, 1), new THREE.Vector3(-1, 0, 1),
      new THREE.Vector3(-1, 0, -1)
    ]);
    this.frame = new THREE.Line(edgeGeo, edgeMat);
    content.add(this.frame);

    this.meshRefs = { plates: [this.plateTop, this.plateBot], rays: [this.rayA, this.rayB] };
  },

  update() {
    const st = this.state;
    const C = this.C, ETA0 = this.ETA0;
    const b = st.b_cm / 100;                 // metres
    const f = st.freq_GHz * 1e9;             // Hz
    const m = Math.round(st.mode_m);
    const epsr = 1.0;
    const eta = ETA0 / Math.sqrt(epsr);

    const fc = m * C / (2 * b * Math.sqrt(epsr));
    const ratio = f / fc;
    const above = ratio > 1;
    const s = above ? Math.sqrt(1 - 1 / (ratio * ratio)) : 0;
    const Zte = above ? eta / s : Infinity;
    const lambda0 = C / f;
    const lambda_g = above ? lambda0 / s : Infinity;

    // bounce angle measured from the plate normal: sin(theta) = fc/f
    const theta = above ? Math.asin(fc / f) : Math.PI / 2;
    const thetaDeg = theta * 180 / Math.PI;

    // ---- geometry scaling: guide length 1.6, width 1.0, height = b (scaled) ----
    const L = 1.6, Wd = 1.0;
    const h = Math.min(1.2, Math.max(0.15, b * 6)); // visual height of gap
    const y0 = -h / 2, y1 = h / 2;

    this.plateTop.position.set(0, y1 + 0.03, 0);
    this.plateTop.scale.set(L, 1, Wd);
    this.plateBot.position.set(0, y0 - 0.03, 0);
    this.plateBot.scale.set(L, 1, Wd);

    this.slab.position.set(0, 0, 0);
    this.slab.scale.set(L, h, Wd);

    this.frame.position.set(0, y0, 0);
    this.frame.scale.set(L / 2, 1, Wd / 2);

    // ---- zig-zag rays: bounce between y0 and y1 along z ----
    const nBounce = 6;
    const ptsA = [], ptsB = [];
    const zStart = -L / 2, zEnd = L / 2;
    const dz = (zEnd - zStart) / nBounce;
    for (let i = 0; i <= nBounce; i++) {
      const z = zStart + i * dz;
      const y = (i % 2 === 0) ? y0 : y1;
      ptsA.push(new THREE.Vector3(-Wd * 0.28, y, z));
      ptsB.push(new THREE.Vector3(Wd * 0.28, (i % 2 === 0) ? y1 : y0, z));
    }
    this.rayA.geometry.dispose();
    this.rayA.geometry = new THREE.BufferGeometry().setFromPoints(ptsA);
    this.rayB.geometry.dispose();
    this.rayB.geometry = new THREE.BufferGeometry().setFromPoints(ptsB);

    // ---- transverse E_x arrows across y in [0, b] ----
    const N = 14;
    const vecs = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N;                       // y/b
      const yv = y0 + t * h;
      const amp = Math.sin(m * Math.PI * t);
      const len = 0.42 * Math.abs(amp);
      if (len < 0.02) continue;
      const dir = new THREE.Vector3(amp >= 0 ? 1 : -1, 0, 0);
      vecs.push({ origin: new THREE.Vector3(0, yv, 0), dir, len });
    }
    this.field.setVectors(vecs);

    // ---- 2D chart ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const padL = 52, padR = 18, padT = 26, padB = 42;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // left panel: standing wave sin(m pi y/b)
    const leftW = plotW * 0.52;
    const x0 = padL, yTop = padT, yBot = padT + plotH;

    ctx.strokeStyle = '#2a3b52'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, yTop); ctx.lineTo(x0, yBot); ctx.lineTo(x0 + leftW, yBot);
    ctx.stroke();

    // zero axis
    ctx.strokeStyle = '#3d5570';
    ctx.beginPath();
    ctx.moveTo(x0, (yTop + yBot) / 2); ctx.lineTo(x0 + leftW, (yTop + yBot) / 2);
    ctx.stroke();

    // standing wave curve
    ctx.strokeStyle = '#66ffcc'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const t = i / 200;
      const v = Math.sin(m * Math.PI * t);
      const px = x0 + t * leftW;
      const py = (yTop + yBot) / 2 - v * (plotH * 0.42);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // labels
    ctx.fillStyle = '#9fb6cc'; ctx.font = '12px sans-serif';
    ctx.fillText('E_x / E_0', x0 + 4, yTop - 8);
    ctx.fillText('y/b', x0 + leftW - 22, yBot + 20);
    ctx.fillText('0', x0 - 12, (yTop + yBot) / 2 + 4);
    ctx.fillText('1', x0 + leftW - 4, yBot + 20);

    // right panel: bounce angle vs f/f_c
    const rx0 = padL + leftW + 34;
    const rW = plotW - leftW - 34;
    ctx.strokeStyle = '#2a3b52';
    ctx.beginPath();
    ctx.moveTo(rx0, yTop); ctx.lineTo(rx0, yBot); ctx.lineTo(rx0 + rW, yBot);
    ctx.stroke();

    // curve theta(f/fc) = asin(fc/f), plotted for ratio in [1, 4]
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.2;
    ctx.beginPath();
    const rMin = 1.0, rMax = 4.0;
    for (let i = 0; i <= 200; i++) {
      const r = rMin + (rMax - rMin) * i / 200;
      const th = Math.asin(1 / r) * 180 / Math.PI;
      const px = rx0 + (r - rMin) / (rMax - rMin) * rW;
      const py = yBot - (th / 90) * plotH;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // marker at current f/fc
    if (above && ratio <= rMax) {
      const px = rx0 + (ratio - rMin) / (rMax - rMin) * rW;
      const py = yBot - (thetaDeg / 90) * plotH;
      ctx.fillStyle = '#ff6b6b';
      ctx.beginPath(); ctx.arc(px, py, 4.5, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#9fb6cc'; ctx.font = '12px sans-serif';
    ctx.fillText('Bounce angle (deg)', rx0 + 4, yTop - 8);
    ctx.fillText('f / f_c', rx0 + rW - 42, yBot + 20);
    ctx.fillText('90', rx0 - 22, yTop + 6);
    ctx.fillText('0', rx0 - 14, yBot + 4);

    // ---- HUD ----
    const fcGHz = fc / 1e9;
    const fmt = (v, d = 2) => (isFinite(v) ? v.toFixed(d) : '—');
    setHud(
      'Parallel-Plane TE_m Mode',
      'f_c = \\frac{m c}{2b\\sqrt{\\varepsilon_r}},\\quad Z_{\\mathrm{TE}} = \\frac{\\eta}{\\sqrt{1-(f_c/f)^2}}',
      [
        { k: 'f_c', v: fmt(fcGHz) + ' GHz' },
        { k: 'Bounce Angle', v: fmt(thetaDeg, 1) + ' deg' },
        { k: 'Z_TE', v: fmt(Zte, 1) + ' ohms' },
        { k: 'lambda_g', v: fmt(lambda_g * 100, 2) + ' cm' }
      ]
    );
  },

  tick(dt) {
    // gentle shimmer on the ray lines
    const t = performance.now() * 0.001;
    this.rayMat.color.setHSL(0.11, 0.9, 0.55 + 0.12 * Math.sin(t * 2.0));
    this.rayMat2.color.setHSL(0.55, 0.85, 0.55 + 0.12 * Math.sin(t * 2.0 + 1.3));
  },

  lesson: `<p>Two infinite conducting plates at y = 0 and y = b form a parallel-plane guide. A TE_m mode has E_z = 0 and E_x = E_0 sin(mπy/b) e^{-jβz}, with H_y related by the wave impedance. The transverse resonance condition gives the cutoff wavelength λ_c = 2b/m and cutoff frequency f_c = m c /(2b√ε_r). Below f_c the mode is evanescent; above it the wave propagates with guide wavelength λ_g = λ_0/√(1−(f_c/f)²) and wave impedance Z_TE = η/√(1−(f_c/f)²), where η = 376.73/√ε_r Ω. Physically the mode is a superposition of two plane waves obliquely bouncing between the plates; the bounce angle θ from the plate normal satisfies sin θ = f_c/f, so at cutoff θ = 90° (grazing) and as f → ∞ the rays become normal to the plates. Increasing b lowers f_c and allows more modes; higher m raises f_c and adds more transverse nodes.</p>`,
  quiz: [
    { q: 'For a parallel-plane guide with separation b, the cutoff wavelength of TE_m is:', options: ['λ_c = b/m', 'λ_c = 2b/m', 'λ_c = m b/2', 'λ_c = 2m b'], answer: 1 },
    { q: 'As f approaches f_c from above, the wave impedance Z_TE:', options: ['approaches η', 'approaches 0', 'approaches infinity', 'stays equal to η'], answer: 2 },
    { q: 'The bounce angle θ measured from the plate normal satisfies:', options: ['cos θ = f_c/f', 'sin θ = f_c/f', 'tan θ = f/f_c', 'sin θ = f/f_c'], answer: 1 }
  ]
});
modules.push({
  id: 'hollow_rectangular_waveguide',
  title: '8-4 The Hollow Rectangular Waveguide',
  controls: [
    { id: 'a_cm', label: 'Broad wall a (cm)', type: 'range', min: 1.5, max: 5.0, step: 0.1, value: 2.3 },
    { id: 'b_cm', label: 'Narrow wall b (cm)', type: 'range', min: 0.7, max: 2.5, step: 0.1, value: 1.0 },
    { id: 'freq_GHz', label: 'Operating frequency f (GHz)', type: 'range', min: 4.0, max: 22.0, step: 0.2, value: 10.0 },
    { id: 'mode_sel', label: 'Mode', type: 'select', options: ['TE10 (Dominant)', 'TE20', 'TE01', 'TE11 / TM11'], value: 'TE10 (Dominant)' }
  ],

  build() {
    const g = new THREE.Group();
    const L = 6.0; // guide length along z
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x9fb6c8, metalness: 0.85, roughness: 0.35, emissive: 0x223344, emissiveIntensity: 0.4 });
    const wallT = 0.06;

    const walls = [];
    const mk = (w, h, x, y) => {

      g.add(m); walls.push(m);
    };
    mk(1, wallT, 0, 0.5);   // top
    mk(1, wallT, 0, -0.5);  // bottom
    mk(wallT, 1, 0.5, 0);   // right
    mk(wallT, 1, -0.5, 0);  // left
    this.walls = walls;

    // cross-section outline at entrance
    const outline = new THREE.LineLoop(
      new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-0.5, -0.5, L / 2), new THREE.Vector3(0.5, -0.5, L / 2),
        new THREE.Vector3(0.5, 0.5, L / 2), new THREE.Vector3(-0.5, 0.5, L / 2)
      ]),

    // E-field arrows (cross-section, at entrance plane)

    g.add(this.eField.group);

    // H-field loop arrows along z

    g.add(this.hField.group);

    // propagation axis

  update() {
    const st = this.state;
    const a = st.a_cm, b = st.b_cm, f = st.freq_GHz;
    const c = 29.9792458; // GHz·cm
    const L = this.L;

    // scale cross-section: a along x, b along y
    const sx = a, sy = b;
    this.walls[0].scale.set(sx, 1, 1); this.walls[0].position.set(0, sy / 2, 0);
    this.walls[1].scale.set(sx, 1, 1); this.walls[1].position.set(0, -sy / 2, 0);
    this.walls[2].scale.set(1, sy, 1); this.walls[2].position.set(sx / 2, 0, 0);
    this.walls[3].scale.set(1, sy, 1); this.walls[3].position.set(-sx / 2, 0, 0);

    // mode parameters
    const modes = { 'TE10 (Dominant)': [1, 0], 'TE20': [2, 0], 'TE01': [0, 1], 'TE11 / TM11': [1, 1] };
    const [m, n] = modes[st.mode_sel];
    const fc = (c / 2) * Math.sqrt((m / a) ** 2 + (n / b) ** 2); // GHz
    const fc10 = c / (2 * a);
    const fc20 = c / a;
    const fc01 = c / (2 * b);
    const fc11 = (c / 2) * Math.sqrt(1 / (a * a) + 1 / (b * b));

    const propagating = f > fc;
    const eta = 376.73; // ohms
    const ratio = fc / f;
    const ZTE = propagating ? eta / Math.sqrt(1 - ratio * ratio) : Infinity;
    const lambda0 = c / f; // cm
    const lambda_g = propagating ? lambda0 / Math.sqrt(1 - ratio * ratio) : Infinity;
    const beta = propagating ? (2 * Math.PI / lambda_g) : 0;

    // E-field arrows across the broad wall (sin profile)
    const ev = [];
    const N = 14;
    for (let i = 0; i <= N; i++) {
      const x = -a / 2 + (i / N) * a;
      const amp = Math.sin(m * Math.PI * (x + a / 2) / a) * Math.cos(n * Math.PI * 0.5);
      if (Math.abs(amp) < 0.02) continue;
      ev.push({
        origin: new THREE.Vector3(x, -b / 2 + 0.02, L / 2 - 0.05),
        dir: new THREE.Vector3(0, 1, 0),
        len: 0.55 * Math.abs(amp) * b

      hv.push({ origin: new THREE.Vector3(-xw, 0, z), dir: new THREE.Vector3(0, 0, -1), len: 0.35 * s });

      ctx.fillText(v, x, padT + plotH + 20);

    ctx.fillStyle = '#8fa6bd'; ctx.font = '13px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('Frequency (GHz)', padL + plotW / 2, H - 12);

    // single-mode window TE10 -> TE20

    ctx.strokeStyle = 'rgba(80,200,140,0.6)'; ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(winX0, padT); ctx.lineTo(winX0, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(winX1, padT); ctx.lineTo(winX1, padT + plotH); ctx.stroke();
    ctx.setLineDash([]);

    // bars

      { name: 'TE10', fc: fc10, col: '#4fc3f7' },
      { name: 'TE20', fc: fc20, col: '#ffb74d' },
      { name: 'TE01', fc: fc01, col: '#ba68c8' },

      ctx.fillStyle = '#dbe7f3'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(bar.name, cx, padT + plotH + 38);

    ctx.beginPath(); ctx.moveTo(fx, padT); ctx.lineTo(fx, padT + plotH); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('f = ' + f.toFixed(1) + ' GHz', Math.min(fx + 6, W - 90), padT + 14);

    // ---- HUD ----
    const band = (fc20 - fc10).toFixed(2);
    setHud(
      'Hollow Rectangular Waveguide',
      'f_{c,mn} = \\frac{c}{2\\sqrt{\\varepsilon_r}}\\sqrt{\\left(\\frac{m}{a}\\right)^2 + \\left(\\frac{n}{b}\\right)^2}',
      [

        { k: 'f_c (GHz)', v: fc.toFixed(2) },
        { k: 'Single-Mode Band', v: fc10.toFixed(2) + ' – ' + fc20.toFixed(2) + ' GHz (' + band + ')' },
        { k: 'Z_wave (ohms)', v: isFinite(ZTE) ? ZTE.toFixed(1) : 'evanescent' },
        { k: 'lambda_g (cm)', v: isFinite(lambda_g) ? lambda_g.toFixed(2) : '—' }
      ]

  tick(dt) {

  lesson: `<p>A hollow rectangular waveguide of broad wall <em>a</em> and narrow wall <em>b</em> supports TE<sub>mn</sub> and TM<sub>mn</sub> modes whose cutoff frequencies are</p>

  <p>The dominant mode is TE<sub>10</sub> with $f_{c,10}=c/(2a\\sqrt{\\varepsilon_r})$ and cutoff wavelength $\\lambda_{c,10}=2a$. Below cutoff the mode is evanescent; above cutoff it propagates with guide wavelength $\\lambda_g=\\lambda_0/\\sqrt{1-(f_c/f)^2}$ and wave impedance $Z_{TE}=\\eta/\\sqrt{1-(f_c/f)^2}$. The single-mode bandwidth runs from $f_{c,10}$ to $f_{c,20}=c/a$, which is why practical guides are designed with $a\\approx 2b$.</p>`,

});

  // ---- Bessel helpers (integer order, series expansion) ----
  _J(n, x) {
    if (x < 0) x = -x;
    let s = 0, term = Math.pow(x / 2, n) / this._fact(n);
    for (let k = 0; k < 40; k++) {
      s += term;
      term *= -(x * x / 4) / ((k + 1) * (k + n + 1));
      if (Math.abs(term) < 1e-14) break;
    }
    return s;
  },
  _fact(m) { let f = 1; for (let i = 2; i <= m; i++) f *= i; return f; },
  _Jp(n, x) { // dJ_n/dx = (J_{n-1} - J_{n+1})/2
    return 0.5 * (this._J(n - 1, x) - this._J(n + 1, x));
  },

  build() {

      const ring = new THREE.Mesh(new THREE.TorusGeometry(1, 0.035, 12, 64), ringMat);
      ring.position.z = i === 0 ? -3 : 3;
      g.add(ring);
    }

    // cross-section disk (field plane) at z = 0
    const disk = new THREE.Mesh(
      new THREE.CircleGeometry(1, 64),
      new THREE.MeshStandardMaterial({ color: 0x0d2233, transparent: true, opacity: 0.35, side: THREE.DoubleSide })
    );
    disk.position.z = 0.02;
    g.add(disk);

    // field arrow field (rebuilt each update)
    this.field = addArrowField([], 0x9fe8ff);
    g.add(this.field.group);

    // axis line
    const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, -3.2), new THREE.Vector3(0, 0, 3.2)]);
    g.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0x4a7fa8 })));

    // mode table: [name, n, root, type]
    this.modes = {
      'TE11 (Dominant, p=1.841)': { n: 1, p: 1.841, te: true },
      'TM01 (p=2.405)': { n: 0, p: 2.405, te: false },

  update() {

      if (c.geometry && c.geometry.type === 'CircleGeometry') c.scale.set(a, a, 1);
    });

    // physics
    const c_cm = 2.998e10;             // cm/s
    const lambda_c = 2 * Math.PI * a / p;          // cm
    const f_c = c_cm / lambda_c / 1e9;             // GHz (eps_r = 1)
    const above = f > f_c;
    const lambda_g = above ? lambda_c / Math.sqrt(1 - (f_c / f) ** 2) : Infinity;

    // ---- field vectors on the cross-section ----
    const vecs = [];
    const kc = p / a;                  // 1/cm
    const R = a * 0.92;
    const rings = 5, spokes = 28;
    for (let ri = 1; ri <= rings; ri++) {
      const r = R * ri / rings;
      const jv = this._J(n, kc * r);
      const jp = this._Jp(n, kc * r);
      for (let s = 0; s < spokes; s++) {
        const th = 2 * Math.PI * s / spokes;
        const ct = Math.cos(th), stn = Math.sin(th);
        let dir;
        if (m.te) {
          // TE: transverse E is azimuthal-ish, proportional to J_n(kc r) with angular factor
          const amp = jv * Math.cos(n * th);
          dir = new THREE.Vector3(-stn, ct, 0).multiplyScalar(amp);
        } else {
          // TM: E radial, proportional to J_n'(kc r) cos(n th)
          const amp = jp * Math.cos(n * th);
          dir = new THREE.Vector3(ct, stn, 0).multiplyScalar(amp);
        }
        const len = Math.abs(dir.length());
        if (len < 0.02) continue;
        vecs.push({
          origin: new THREE.Vector3(r * ct, r * stn, 0.05),
          dir: dir.normalize(),
          len: Math.min(0.55, 0.35 * len + 0.12)
        });
      }
    }
    this.field.setVectors(vecs);

    // ---- 2D chart ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');

    ctx.fillStyle = '#0a1420'; ctx.fillRect(0, 0, W, H);

    const pad = 46;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;

    const X = u => x0 + (u / xmax) * (x1 - x0);

    // grid

    for (let i = 0; i <= 10; i++) {

      ctx.fillText('f < f_c : evanescent', x1 - 190, y1 + 18);
    }

    // ---- HUD ----
    setHud(
      'Hollow Cylindrical Waveguide',
      'f_c = \\frac{p_{nm}^{\\prime} c}{2\\pi a\\sqrt{\\varepsilon_r}},\\quad \\lambda_{c,\\mathrm{TE}_{11}} = 3.412\\,a',
      [

        { k: 'f_c (GHz)', v: f_c.toFixed(2) },
        { k: 'lambda_c (cm)', v: lambda_c.toFixed(2) },
        { k: 'lambda_g (cm)', v: isFinite(lambda_g) ? lambda_g.toFixed(2) : '— (below cutoff)' }
      ]
    );
  },

  lesson: `<p>A hollow circular waveguide of radius <em>a</em> supports TE and TM modes whose transverse

modules.push({

      const gap = dRatio * b;          // gap height d
      gapSpan = gap;
      gapCenter = 0;

      if (shape === 'Single-Ridge Waveguide') {
        // ridge from left wall toward center, leaving gap of height d
        holeShape = new THREE.Path();

        holeShape.lineTo(-hw + ridgeLen, -gap / 2);
        holeShape.lineTo(-hw + ridgeLen, gap / 2);
        holeShape.lineTo(-hw, gap / 2);
        holeShape.lineTo(-hw, -gap / 2);
      } else if (shape === 'Double-Ridge Waveguide') {

        holeShape.lineTo(-hw + ridgeLen, -gap / 2);
        holeShape.lineTo(-hw + ridgeLen, gap / 2);

        holeShape.lineTo(-hw, -gap / 2);

        hole2.lineTo(hw - ridgeLen, -gap / 2);
        hole2.lineTo(hw - ridgeLen, gap / 2);

        hole2.lineTo(hw, -gap / 2);

      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsA), gridMat));
      g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(ptsB), gridMat));
    }

    // Incident wave direction marker (propagation along +x, grazing the surface)
    const propMat = new THREE.MeshStandardMaterial({ color: 0x9fe8ff, emissive: 0x2a6f8f, metalness: 0.4, roughness: 0.4 });
    const propArrow = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 6, 12), propMat);
    propArrow.rotation.z = Math.PI / 2;
    propArrow.position.set(0, 0.35, 0);
    g.add(propArrow);
    const propTip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.45, 14), propMat);
    propTip.rotation.z = -Math.PI / 2;
    propTip.position.set(3.2, 0.35, 0);
    g.add(propTip);

    // E-field arrows (tilted forward), H-field arrows (horizontal), Poynting arrows (downward)
    this.eField = addArrowField([], 0xffd166);
    this.hField = addArrowField([], 0x7fd1ff);
    this.pField = addArrowField([], 0xff6b8a);
    g.add(this.eField.group, this.hField.group, this.pField.group);

    content.add(g);
    this.meshRefs = { ground, propArrow, propTip };
  },

  update() {
    const st = this.state;
    const sigma = Math.pow(10, st.sigma_log);
    const f = st.freq_MHz * 1e6;
    const omega = 2 * Math.PI * f;
    const mu = 4 * Math.PI * 1e-7;
    const eps0 = 8.8541878128e-12;
    const eps = eps0 * 1.0;

    // Complex surface impedance Z_s = sqrt(j w mu / (sigma + j w eps))
    const numRe = 0, numIm = omega * mu;
    const denRe = sigma, denIm = omega * eps;
    const denMag2 = denRe * denRe + denIm * denIm;
    const qRe = (numRe * denRe + numIm * denIm) / denMag2;
    const qIm = (numIm * denRe - numRe * denIm) / denMag2;
    const qMag = Math.hypot(qRe, qIm);
    const qAng = Math.atan2(qIm, qRe);
    const zMag = Math.sqrt(qMag);
    const zAng = qAng / 2;
    const Rs = zMag * Math.cos(zAng);      // Re(Z_s)
    const Xs = zMag * Math.sin(zAng);      // Im(Z_s)

    // Skin depth
    const delta = 1 / Math.sqrt(Math.PI * f * mu * sigma);

    // Wave tilt: tan(tau) = Re(Z_s) / (eta0) roughly; use tau = atan(Rs/eta0)
    const eta0 = 376.730313;
    const tau = Math.atan(Rs / eta0);

    // Power loss per unit area
    const Ht = st.H_t_Am;
    const Ploss = 0.5 * Ht * Ht * Rs;

    // ---- 3D arrows ----
    const tilt = tau; // radians
    const eArrows = [];
    const hArrows = [];
    const pArrows = [];
    const n = 7;
    for (let i = 0; i < n; i++) {
      const x = -4.5 + i * 1.5;
      // E field: tilted forward (in +x) and up, magnitude scaled
      const eLen = 1.2 + 0.5 * Math.min(1, Rs / 0.1);
      const dirE = new THREE.Vector3(Math.sin(tilt), Math.cos(tilt), 0).normalize();
      eArrows.push({ origin: new THREE.Vector3(x, 0.05, 0), dir: dirE, len: eLen });

      // H field: horizontal, along z
      hArrows.push({ origin: new THREE.Vector3(x, 0.55, 0), dir: new THREE.Vector3(0, 0, 1), len: 1.4 });

      // Poynting: downward into surface
      const pLen = 0.6 + 0.8 * Math.min(1, Ploss / 5);
      pArrows.push({ origin: new THREE.Vector3(x, 0.9, 0), dir: new THREE.Vector3(0, -1, 0), len: pLen });
    }
    this.eField.setVectors(eArrows);
    this.hField.setVectors(hArrows);
    this.pField.setVectors(pArrows);

    // ---- 2D chart ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const padL = 60, padR = 60, padT = 40, padB = 50;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // Axes
    ctx.strokeStyle = '#3a4a5e';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    // Frequency range for chart: 1..1000 MHz (log scale)
    const fMin = 1e6, fMax = 1e9;
    const logFMin = Math.log10(fMin), logFMax = Math.log10(fMax);

    // Compute curves
    const N = 200;
    const deltaPts = [], rsPts = [];
    let maxDelta = 0, maxRs = 0;
    for (let i = 0; i <= N; i++) {
      const lf = logFMin + (logFMax - logFMin) * i / N;
      const ff = Math.pow(10, lf);
      const d = 1 / Math.sqrt(Math.PI * ff * mu * sigma);
      const w = 2 * Math.PI * ff;
      const nR = 0, nI = w * mu;
      const dR = sigma, dI = w * eps;
      const dm2 = dR * dR + dI * dI;
      const qR = (nR * dR + nI * dI) / dm2;
      const qI = (nI * dR - nR * dI) / dm2;
      const qm = Math.hypot(qR, qI);
      const qa = Math.atan2(qI, qR);
      const zm = Math.sqrt(qm);
      const za = qa / 2;
      const rs = zm * Math.cos(za);
      deltaPts.push({ lf, d });
      rsPts.push({ lf, rs });
      if (d > maxDelta) maxDelta = d;
      if (rs > maxRs) maxRs = rs;
    }

    const xOf = (lf) => padL + (lf - logFMin) / (logFMax - logFMin) * plotW;
    const yDelta = (d) => padT + plotH - (d / maxDelta) * plotH;
    const yRs = (rs) => padT + plotH - (rs / maxRs) * plotH;

    // Delta curve (mm)
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    deltaPts.forEach((p, i) => {
      const x = xOf(p.lf), y = yDelta(p.d);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Rs curve (mOhm)
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    rsPts.forEach((p, i) => {
      const x = xOf(p.lf), y = yRs(p.rs);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();

    // Current frequency marker
    const curLf = Math.log10(f);
    if (curLf >= logFMin && curLf <= logFMax) {
      const x = xOf(curLf);
      ctx.strokeStyle = '#ff6b8a';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // Labels
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '13px sans-serif';
    ctx.fillText('f (MHz, log)', padL + plotW / 2 - 40, H - 12);
    ctx.fillText('δ (mm)', padL - 45, padT + 12);
    ctx.fillText('R_s (mΩ)', padL + plotW + 8, padT + 12);

    // Legend
    ctx.fillStyle = '#7fd1ff';
    ctx.fillRect(padL + 10, padT + 8, 14, 4);
    ctx.fillStyle = '#9fb3c8';
    ctx.fillText('δ', padL + 30, padT + 14);
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(padL + 70, padT + 8, 14, 4);
    ctx.fillStyle = '#9fb3c8';
    ctx.fillText('R_s', padL + 90, padT + 14);

    // ---- HUD ----
    setHud(
      'Surface Impedance & Wave Tilt',
      'Z_s = \\sqrt{\\frac{j\\omega\\mu}{\\sigma + j\\omega\\varepsilon}},\\quad P_{\\mathrm{loss}} = \\frac{1}{2}|H_t|^2 R_s',
      [
        { k: 'Skin Depth δ', v: (delta * 1000).toFixed(3) + ' mm' },
        { k: 'Surface R_s', v: (Rs * 1000).toFixed(3) + ' mΩ' },
        { k: 'Tilt Angle τ', v: (tau * 180 / Math.PI).toFixed(3) + '°' },
        { k: 'Wall Loss', v: Ploss.toFixed(3) + ' W/m²' }
      ]
    );
  },

  tick(dt) {
    // gentle pulse of the propagation marker

  lesson: `<p>A plane wave traveling <em>parallel</em> to a plane boundary of a lossy medium (conductivity σ, permittivity ε) must supply the power dissipated in the surface. This requires a small tangential electric field E_z = Z_s H_y, so the wave tilts forward by the wave-tilt angle τ = arctan(R_s/η₀).</p>
  <p>The surface impedance is Z_s = √(jωμ / (σ + jωε)). For a good conductor (σ ≫ ωε), Z_s ≈ (1+j)/(σδ) = (1+j)R_s, with skin depth δ = 1/√(π f μ σ) and surface resistance R_s = 1/(σδ). The average power dissipated per unit area is P_loss = ½|H_t|²R_s = ½|J_s|²R_s.</p>
  <p>Limiting cases: as σ → ∞, R_s → 0, τ → 0, and the wave grazes the surface without loss. As f increases, δ shrinks and R_s grows as √f. For a dielectric (σ → 0), Z_s becomes real and the tilt vanishes.</p>`,

  quiz: [
    { q: 'For a good conductor, the surface impedance is approximately:', options: ['(1+j)R_s', 'R_s', 'jωμ/σ', 'η₀'], answer: 0 },
    { q: 'The skin depth δ scales with frequency as:', options: ['δ ∝ f', 'δ ∝ 1/√f', 'δ ∝ √f', 'δ independent of f'], answer: 1 },
    { q: 'The wave-tilt angle τ arises because:', options: ['The wave is refracted at the boundary', 'A tangential E field is needed to supply surface power loss', 'The magnetic field is normal to the surface', 'The medium is a perfect dielectric'], answer: 1 }
  ]
});

  build() {
    const g = new THREE.Group();

  update() {
    const st = this.state;
    const a_mm = st.coating_mm;                 // coating thickness
    const eps = st.eps_r;
    const f = st.freq_GHz;

    // physical constants
    const c_cm = 2.998e10;                      // cm/s
    const k0 = 2 * Math.PI * f * 1e9 / c_cm;    // 1/cm

    // Approximate Goubau slow-wave beta: dielectric-loaded wire
    // beta ≈ k0 * sqrt(1 + (eps-1) * (a_cm * k0)^2 / (1 + (a_cm*k0)^2))  -- heuristic
    const q = a_cm * k0;
    const beta = k0 * Math.sqrt(1 + (eps - 1) * (q * q) / (1 + q * q));
    const alpha = Math.sqrt(Math.max(beta * beta - k0 * k0, 1e-12)); // 1/cm

    const r1e = 1 / alpha;                                           // 1/e radius (cm)

    for (let i = 1; i <= 5; i++) {
      const y = padT + plotH * (i / 5);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    }
    for (let i = 1; i <= 5; i++) {
      const x = padL + plotW * (i / 5);

      ctx.setLineDash([]);
      ctx.fillStyle = '#ffd27f';
      ctx.fillText('1/e', x - 8, padT + plotH - 8);

  lesson: `<p>An <b>open waveguide</b> (Goubau line, corrugated surface, or dielectric rod) supports a surface wave bound to the guide. Because the phase velocity satisfies <b>v_p &lt; c</b>, the field outside the guide is evanescent: it decays radially as <b>E(r) ∝ e^{-α_r r}</b> (or K₀(α_r r)), with <b>α_r = √(β² − k₀²)</b>. A straight uniform run therefore does not radiate; sharp bends, discontinuities, or impedance changes couple energy into free space. Increasing coating thickness or permittivity raises β and tightens the confinement (larger α_r, smaller 1/e radius).</p>`,

      const kx = k0 * Math.sqrt(Math.max(n1 * n1 - neff * neff, 0));
      const al = k0 * Math.sqrt(Math.max(neff * neff - n2 * n2, 0));
      const u = kx * d / 2;
      if (parity === 0) return Math.tan(u) - al / kx;
      return -1 / Math.tan(u) - al / kx;
    };
    for (let i = 0; i < N; i++) {
      const a = n2 + (n1 - n2) * i / N;
      const b = n2 + (n1 - n2) * (i + 1) / N;
      for (const p of [0, 1]) {
        const fa = f(a, p), fb = f(b, p);
        if (fa * fb < 0) {
          let lo = a, hi = b;
          for (let k = 0; k < 40; k++) {
            const m = 0.5 * (lo + hi);
            if (f(lo, p) * f(m, p) <= 0) hi = m; else lo = m;
          }
          modes.push({ neff: 0.5 * (lo + hi), parity: p });
        }
      }
    }
    modes.sort((A, B) => B.neff - A.neff);
    const nEff = modes.length ? modes[0].neff : n2;
    const mCount = modes.length;

    // 3D: scale slab thickness with d
    const hCore = Math.max(0.25, d * 0.35);
    this.meshRefs.core.scale.y = hCore;
    this.meshRefs.top.position.y = hCore + 0.8;

    const pos = this.meshRefs.ray.geometry.attributes.position.array;
    const L = 6, half = hCore / 2;
    const thetaI = Math.acos(Math.min(1, nEff / n1)); // angle from normal
    const slope = Math.tan(thetaI);
    const pts = [];
    let x = -L / 2, y = -half, dir = 1;
    pts.push(new THREE.Vector3(x, y, 0));
    while (x < L / 2) {
      const dy = dir * 2 * half;
      const dx = dy / slope;
      x += dx;
      y += dy;
      if (x > L / 2) {
        const t = (L / 2 - (x - dx)) / dx;
        pts.push(new THREE.Vector3(L / 2, (y - dy) + t * dy, 0));

      pts.push(new THREE.Vector3(x, y, 0));

  lesson: `<p>A planar dielectric slab of thickness <em>d</em> and index <em>n<sub>1</sub></em> is surrounded by cladding of index <em>n<sub>2</sub> &lt; n<sub>1</sub></em>. Rays inside the core strike the interface at angle <em>&theta;<sub>i</sub></em> measured from the normal; total internal reflection occurs when <em>&theta;<sub>i</sub> &gt; &theta;<sub>c</sub> = arcsin(n<sub>2</sub>/n<sub>1</sub>)</em>. Guidance requires the transverse resonance condition: for TE modes, <em>tan(k<sub>x</sub>d/2) = &alpha;<sub>x</sub>/k<sub>x</sub></em> (even) and <em>-cot(k<sub>x</sub>d/2) = &alpha;<sub>x</sub>/k<sub>x</sub></em> (odd), with <em>k<sub>x</sub> = k<sub>0</sub>&radic;(n<sub>1</sub><sup>2</sup> - n<sub>eff</sub><sup>2</sup>)</em> and <em>&alpha;<sub>x</sub> = k<sub>0</sub>&radic;(n<sub>eff</sub><sup>2</sup> - n<sub>2</sub><sup>2</sup>)</em>. The normalized frequency <em>V = (&pi;d/&lambda;<sub>0</sub>)&radic;(n<sub>1</sub><sup>2</sup> - n<sub>2</sub><sup>2</sup>)</em> sets the mode count: below <em>V = &pi;/2</em> no guided mode exists; each additional mode appears as <em>V</em> grows. In the cladding the field is evanescent, decaying as <em>exp(-&alpha;<sub>x</sub>|x|)</em>, carrying no net power.</p>`,

  lesson: `<p>A step-index fiber guides light by total internal reflection at the core–cladding boundary. The numerical aperture <b>NA = √(n₁² − n₂²)</b> fixes the acceptance half-angle in air, <b>θ_acc = arcsin(NA)</b>. The normalized frequency <b>V = (2πa/λ₀)·NA</b> measures how many transverse field oscillations fit across the core.</p>

  update() {

          inp.addEventListener('input', () => {
            mod.state[c.id] = Number(inp.value);
            valSpan.textContent = String(mod.state[c.id]);
            if (typeof mod.update === 'function') mod.update();
          });
          wrap.appendChild(lbl);
          wrap.appendChild(inp);
        } else if (c.type === 'select') {
          const lbl = document.createElement('label');
          lbl.textContent = c.label;
          const sel = document.createElement('select');
          (c.options || []).forEach((o) => {
            const opt = document.createElement('option');
            if (typeof o === 'string') { opt.value = o; opt.textContent = o; }
            else { opt.value = o.value; opt.textContent = o.label; }
            if (opt.value === mod.state[c.id]) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.addEventListener('change', () => {
            mod.state[c.id] = sel.value;
            if (typeof mod.update === 'function') mod.update();
          });
          wrap.appendChild(lbl);
          wrap.appendChild(sel);
        } else if (c.type === 'check') {
          const lbl = document.createElement('label');
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = Boolean(mod.state[c.id]);
          chk.addEventListener('change', () => {
            mod.state[c.id] = chk.checked;
            if (typeof mod.update === 'function') mod.update();
          });
          lbl.appendChild(chk);
          const sp = document.createElement('span');
          sp.style.marginLeft = '6px';
          sp.textContent = c.label;
          lbl.appendChild(sp);
          wrap.appendChild(lbl);
        }
        controlsHost.appendChild(wrap);
      });

      lessonHost.innerHTML = mod.lesson || '';
      renderQuiz(mod);
      if (typeof mod.build === 'function') mod.build();
      if (typeof mod.update === 'function') mod.update();
    }

    modSelect.innerHTML = modules.map((m, i) => `<option value="${i}">${m.title || m.id}</option>`).join('');
    modSelect.addEventListener('change', () => loadModule(Number(modSelect.value)));

    window.addEventListener('resize', () => {
      const w = sceneWrap.clientWidth || 800;
      const h = sceneWrap.clientHeight || 600;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    let prevT = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - prevT) / 1000, 0.05);
      prevT = now;
      controls.update();
      if (activeMod && typeof activeMod.tick === 'function') {
        try { activeMod.tick(dt); }
        catch (e) { console.warn('tick error:', e); activeMod.tick = null; }
      }
      renderer.render(scene, camera);
    }
    if (modules.length > 0) loadModule(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
