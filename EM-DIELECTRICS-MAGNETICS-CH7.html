<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electromagnetics &amp; Applications — Ch. 7: Dielectric and Magnetic Materials</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root {
      --bg: #0b1018;
      --panel: #121a26;
      --panel-2: #182232;
      --text: #e6edf7;
      --muted: #93a4bc;
      --accent: #49b6ff;
      --accent-2: #34d399;
      --border: #253449;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      display: grid;
      grid-template-columns: 330px 1fr;
      grid-template-rows: 54px 1fr;
      height: 100vh;
      overflow: hidden;
    }
    header {
      grid-column: 1 / -1;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 12px;
    }
    header h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    header .meta {
      font-size: 12px;
      color: var(--muted);
    }
    aside {
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    select, input[type="range"] {
      width: 100%;
    }
    .box {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
    }
    .box h2 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--muted);
      margin: 0 0 8px 0;
    }
    .ctrl { margin-bottom: 10px; }
    .ctrl:last-child { margin-bottom: 0; }
    .ctrl label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 4px;
    }
    main {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      grid-template-rows: 1fr 250px;
      gap: 10px;
      padding: 10px;
      overflow: hidden;
    }
    #sceneWrap {
      grid-row: 1 / -1;
      position: relative;
      background: #070b11;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    #hud {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(12, 18, 28, 0.86);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      min-width: 250px;
      max-width: 390px;
      pointer-events: none;
    }
    #hudTitle { font-size: 13px; font-weight: 600; color: var(--accent); margin-bottom: 6px; }
    #hudEq { font-size: 13px; margin-bottom: 8px; overflow-x: auto; }
    .hudRow { display: flex; justify-content: space-between; font-size: 12px; padding: 2px 0; border-top: 1px solid rgba(255,255,255,0.05); }
    .hudRow span:first-child { color: var(--muted); }
    #chartWrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
    }
    #chartEl { width: 100%; height: 100%; flex: 1; background: #090e16; border-radius: 6px; }
    #infoWrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
    }
    .quizOpt { display: block; margin: 4px 0; font-size: 12px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Kraus &amp; Fleisch — Electromagnetics &amp; Applications · Ch. 7: Dielectric &amp; Magnetic Materials</h1>
    <div class="meta">3D WebGL + 2D Analytical Plot + Interactive Lab</div>
  </header>
  <aside>
    <div class="box">
      <h2>Section Module</h2>
      <select id="modSelect"></select>
    </div>
    <div class="box">
      <h2>Parameters</h2>
      <div id="controlsHost"></div>
    </div>
    <div class="box">
      <h2>Quick Check</h2>
      <div id="quizHost"></div>
    </div>
  </aside>
  <main>
    <div id="sceneWrap">
      <div id="hud">
        <div id="hudTitle">Ready</div>
        <div id="hudEq"></div>
        <div id="hudRows"></div>
      </div>
    </div>
    <div id="infoWrap"><div id="lessonHost"></div></div>
    <div id="chartWrap"><canvas id="chartEl" width="600" height="210"></canvas></div>
  </main>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const sceneWrap = document.getElementById('sceneWrap');
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(sceneWrap.clientWidth || 800, sceneWrap.clientHeight || 600);
    sceneWrap.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b11);
    const camera = new THREE.PerspectiveCamera(45, (sceneWrap.clientWidth || 800) / (sceneWrap.clientHeight || 600), 0.1, 200);
    camera.position.set(5, 4, 7);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
controls.zoomSpeed = 0.45;

    scene.add(new THREE.AmbientLight(0xffffff, 0.75));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
    dirLight.position.set(6, 10, 8);
    scene.add(dirLight);
    scene.add(new THREE.GridHelper(12, 12, 0x26354d, 0x131c2a));

    const content = new THREE.Group();
    scene.add(content);

    const chartEl = document.getElementById('chartEl');

    function addArrowField(vectors, color = 0x7fd1ff) {
      const group = new THREE.Group();
      const arrowObjs = (vectors || []).map((v) => {
        const origin = v.origin ? v.origin.clone() : new THREE.Vector3();
        const dir = v.dir ? v.dir.clone().normalize() : new THREE.Vector3(0, 1, 0);
        const len = v.len ?? 1.0;
        const arr = new THREE.ArrowHelper(dir, origin, Math.max(len, 0.05), color, Math.min(0.28, len * 0.3), Math.min(0.16, len * 0.18));
        group.add(arr);
        return arr;
      });
      content.add(group);
      return {
        group,
        setVectors(nextVecs) {
          (nextVecs || []).forEach((v, i) => {
            if (!arrowObjs[i]) return;
            if (v.origin) arrowObjs[i].position.copy(v.origin);
            if (v.dir) arrowObjs[i].setDirection(v.dir.clone().normalize());
            if (typeof v.len === 'number') {
              const l = Math.max(v.len, 0.05);
              arrowObjs[i].setLength(l, Math.min(0.28, l * 0.3), Math.min(0.16, l * 0.18));
            }
          });
        }
      };
    }

    function setHud(titleStr, latexEqStr, rows) {
      document.getElementById('hudTitle').textContent = titleStr || '';
      const eqEl = document.getElementById('hudEq');
      if (window.katex && latexEqStr) {
        try { window.katex.render(latexEqStr, eqEl, { throwOnError: false }); }
        catch (_) { eqEl.textContent = latexEqStr; }
      } else {
        eqEl.textContent = latexEqStr || '';
      }
      const rowsEl = document.getElementById('hudRows');
      rowsEl.innerHTML = (rows || []).map((r) => `<div class="hudRow"><span>${r.k}</span><span>${r.v}</span></div>`).join('');
    }

    const modules = [];

    modules.push({
  id: 'intro_homogeneity_permittivity',
  title: '7-1 to 7-3 Introduction, Linearity/Isotropy & Permittivities',

  controls: [
    { id: 'medium', label: 'Medium', type: 'select', options: ['Vacuum (1.0)', 'Polystyrene (2.55)', 'Mica (5.4)', 'Alumina (9.8)', 'Water (80.0)'], value: 'Mica (5.4)' },
    { id: 'E_kVm', label: 'E field (kV/m)', type: 'range', min: 1, max: 100, step: 1, value: 40 },
    { id: 'anisotropy', label: 'Anisotropic tilt', type: 'range', min: 0, max: 0.5, step: 0.05, value: 0.0 }
  ],

  build() {
    const eps0 = 8.8541878e-12;
    this.eps0 = eps0;
    this.materials = [
      { name: 'Vacuum', er: 1.0, color: 0x2b3a55 },
      { name: 'Air', er: 1.0006, color: 0x33465f },
      { name: 'Polyethylene', er: 2.25, color: 0x3d6b8a },
      { name: 'Transformer Oil', er: 2.2, color: 0x3a6480 },
      { name: 'Polystyrene', er: 2.55, color: 0x4a7fa0 },
      { name: 'Quartz/SiO2', er: 3.8, color: 0x5b9bb8 },
      { name: 'Mica', er: 5.4, color: 0x6fb6c9 },
      { name: 'Alumina', er: 9.8, color: 0x8fd0d8 },
      { name: 'Distilled Water', er: 80.0, color: 0xa8e6e0 },
      { name: 'BaTiO3', er: 1200, color: 0xd8f5e8 }
    ];

    // Dielectric slab
    const slabGeo = new THREE.BoxGeometry(3.2, 2.2, 0.7);
    const slabMat = new THREE.MeshStandardMaterial({
      color: 0x6fb6c9, emissive: 0x123a44, emissiveIntensity: 0.6,
      roughness: 0.35, metalness: 0.15, transparent: true, opacity: 0.85
    });
    this.slab = new THREE.Mesh(slabGeo, slabMat);
    this.slab.position.set(0, 0, 0);
    content.add(this.slab);

    // Wireframe edges of slab
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(slabGeo),
      new THREE.LineBasicMaterial({ color: 0xbfe9f2 })
    );
    edges.position.copy(this.slab.position);
    content.add(edges);
    this.edges = edges;

    // Grid of E arrows (blue) and D arrows (amber) on the front face
    const origins = [];
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        origins.push(new THREE.Vector3(i * 0.95, j * 0.65, 0.36));
      }
    }
    this.origins = origins;

    this.eField = addArrowField(origins.map(o => ({ origin: o.clone(), dir: new THREE.Vector3(0, 0, 1), len: 1 })), 0x7fd1ff);
    this.dField = addArrowField(origins.map(o => ({ origin: o.clone(), dir: new THREE.Vector3(0, 0, 1), len: 1 })), 0xffc46b);

    // Axis hint: E direction reference line
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -1.35, 0.36), new THREE.Vector3(0, -1.35, 1.9)
    ]);
    content.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0x7fd1ff })));

    // Lights
    const l1 = new THREE.DirectionalLight(0xffffff, 1.1); l1.position.set(4, 6, 8); content.add(l1);
    const l2 = new THREE.DirectionalLight(0x88bbff, 0.6); l2.position.set(-5, -3, 4); content.add(l2);

    this.meshRefs = { slab: this.slab, edges: this.edges, eField: this.eField, dField: this.dField };
  },

  update() {
    const st = this.state;
    const eps0 = this.eps0;
    const er = parseFloat(st.medium.split('(')[1]);
    const E = st.E_kVm * 1000;              // V/m
    const D = eps0 * er * E;                // C/m^2
    const eps = eps0 * er;                  // F/m
    const tilt = st.anisotropy;

    // Slab color reflects permittivity
    const mat = this.materials.find(m => Math.abs(m.er - er) < 1e-6) || this.materials[6];
    this.slab.material.color.setHex(mat.color);
    this.slab.material.emissive.setHex(mat.color).multiplyScalar(0.25);

    // Arrow lengths: E fixed reference, D scales with er (log-compressed for display)
    const eLen = 0.55 + 0.35 * (st.E_kVm / 100);
    const dLen = 0.35 + 0.85 * Math.min(1, Math.log10(er + 1) / Math.log10(1201));

    const eDir = new THREE.Vector3(0, 0, 1);
    const dDir = new THREE.Vector3(Math.sin(tilt), 0, Math.cos(tilt)).normalize();

    this.eField.setVectors(this.origins.map(o => ({ origin: o.clone(), dir: eDir.clone(), len: eLen })));
    this.dField.setVectors(this.origins.map(o => ({ origin: o.clone(), dir: dDir.clone(), len: dLen })));

    // ---- 2D chart: bar plot of epsilon_r across materials ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    // background
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0b1420'); bg.addColorStop(1, '#060a12');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

    const padL = 70, padR = 30, padT = 40, padB = 70;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    // log scale for epsilon_r (1 .. 1200)
    const logMin = 0, logMax = Math.log10(1200);
    const xOf = i => padL + (i + 0.5) * plotW / this.materials.length;
    const yOf = v => padT + plotH * (1 - (Math.log10(Math.max(v, 1)) - logMin) / (logMax - logMin));

    // grid lines
    ctx.strokeStyle = 'rgba(120,180,220,0.18)';
    ctx.lineWidth = 1;
    const ticks = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000];
    ctx.font = '12px monospace';
    ctx.fillStyle = '#8fb8d8';
    for (const t of ticks) {
      const y = yOf(t);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.fillText(t.toString(), 8, y + 4);
    }

    // bars
    const barW = plotW / this.materials.length * 0.62;
    this.materials.forEach((m, i) => {
      const x = xOf(i);
      const y = yOf(m.er);
      const active = Math.abs(m.er - er) < 1e-6;
      ctx.fillStyle = active ? '#ffc46b' : 'rgba(127,209,255,0.55)';
      ctx.fillRect(x - barW / 2, y, barW, padT + plotH - y);
      if (active) {
        ctx.strokeStyle = '#ffe6a8'; ctx.lineWidth = 2;
        ctx.strokeRect(x - barW / 2, y, barW, padT + plotH - y);
      }
      // labels
      ctx.save();
      ctx.translate(x, padT + plotH + 12);
      ctx.rotate(-Math.PI / 5);
      ctx.fillStyle = active ? '#ffe6a8' : '#9fc6e0';
      ctx.font = '11px monospace';
      ctx.fillText(m.name, 0, 0);
      ctx.restore();
    });

    // axis titles
    ctx.fillStyle = '#cfe6f5';
    ctx.font = 'bold 14px monospace';
    ctx.fillText('Relative permittivity ε_r (log scale)', padL, 24);
    ctx.fillText('ε_r', 10, padT - 8);

    // ---- HUD ----
    setHud(
      'Permittivity, Linearity & Isotropy',
      '\\mathbf{D} = \\varepsilon_0 \\varepsilon_r \\mathbf{E}',
      [
        { k: 'ε_r', v: er.toFixed(er >= 100 ? 0 : 2) },
        { k: '|E|', v: st.E_kVm.toFixed(0) + ' kV/m' },
        { k: '|D|', v: (D * 1e6).toFixed(2) + ' µC/m²' },
        { k: 'ε', v: (eps * 1e12).toFixed(2) + ' pF/m' }
      ]
    );
  },

  tick(dt) {
    // gentle pulse of the D arrows to emphasize the response
    const t = performance.now() * 0.001;
    if (this.meshRefs && this.meshRefs.dField) {
      if (this.meshRefs.dField.group) this.meshRefs.dField.group.position.z = 0.02 * Math.sin(t * 1.6);
    }
  },

  lesson: `<p><b>Constitutive relation.</b> In a dielectric, the electric displacement is <b>D</b> = ε₀ ε_r <b>E</b>, with ε₀ = 8.8541878×10⁻¹² F/m. The relative permittivity ε_r is a dimensionless material constant.</p>
<p><b>Homogeneity, linearity, isotropy.</b> A <i>homogeneous</i> medium has ε_r constant in space; a <i>linear</i> medium has D proportional to E (no saturation); an <i>isotropic</i> medium has a scalar ε_r so that <b>D</b> is parallel to <b>E</b>. In an anisotropic crystal ε_r becomes a tensor and <b>D</b> generally tilts away from <b>E</b> — the anisotropy slider models that tilt.</p>
<p><b>Typical values.</b> Vacuum 1.0, air ≈1.0006, polyethylene 2.25, polystyrene 2.55, transformer oil 2.2, quartz/SiO₂ 3.8, mica 5.4, alumina 9.8, distilled water 80, BaTiO₃ ≈1200. Larger ε_r means more charge stored per unit field: |D| = ε₀ ε_r |E|.</p>
<p><b>Limits.</b> With ε_r = 1 (vacuum) D reduces to ε₀E; with anisotropy = 0 the medium is isotropic and <b>D</b> ∥ <b>E</b>.</p>`,

  quiz: [
    { q: 'For an isotropic, linear dielectric, which relation holds?', options: ['D = ε₀E only', 'D = ε₀ ε_r E with scalar ε_r', 'D is always perpendicular to E', 'D = E/ε_r'], answer: 1 },
    { q: 'A homogeneous medium means that ε_r is:', options: ['constant in space', 'constant in time only', 'a tensor', 'always equal to 1'], answer: 0 },
    { q: 'If E = 40 kV/m in mica (ε_r = 5.4), the magnitude of D is approximately:', options: ['1.9 µC/m²', '0.35 µC/m²', '19 µC/m²', '3.5 µC/m²'], answer: 0 }
  ]
});
modules.push({
  id: 'efield_dipole_polarization',
  title: '7-4 to 7-6 E-Field in a Dielectric, Electric Dipole & Polarization',
  controls: [
    { id: 'eps_r', label: 'Relative permittivity ε_r', type: 'range', min: 1, max: 20, step: 0.5, value: 4 },
    { id: 'E_ext', label: 'Applied field E (kV/m)', type: 'range', min: 0, max: 100, step: 2, value: 50 },
    { id: 'dipole_sep', label: 'Dipole moment scale d', type: 'range', min: 0.2, max: 2, step: 0.1, value: 1 }
  ],

  build() {
    this.meshRefs = { dipoles: [], boundPos: [], boundNeg: [], slab: null, fieldArrows: null };

    // Dielectric slab
    const slabGeo = new THREE.BoxGeometry(6, 4, 3);
    const slabMat = new THREE.MeshStandardMaterial({
      color: 0x1b3a5c, transparent: true, opacity: 0.28,
      roughness: 0.4, metalness: 0.1, emissive: 0x0a1a2a, emissiveIntensity: 0.6
    });
    const slab = new THREE.Mesh(slabGeo, slabMat);
    slab.position.set(0, 0, 0);
    content.add(slab);
    this.meshRefs.slab = slab;

    // Wireframe edges of slab
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(slabGeo),
      new THREE.LineBasicMaterial({ color: 0x7fd1ff, transparent: true, opacity: 0.7 })
    );
    content.add(edges);

    // Dipole pairs grid (3 x 3 x 2)
    const posMat = new THREE.MeshStandardMaterial({ color: 0xff5a5a, emissive: 0xff2a2a, emissiveIntensity: 0.9, roughness: 0.3 });
    const negMat = new THREE.MeshStandardMaterial({ color: 0x5aaaff, emissive: 0x2a6aff, emissiveIntensity: 0.9, roughness: 0.3 });
    const sphereGeo = new THREE.SphereGeometry(0.16, 16, 12);
    const rodGeo = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);

    for (let ix = -1; ix <= 1; ix++) {
      for (let iy = -1; iy <= 1; iy++) {
        for (let iz = -1; iz <= 1; iz += 2) {
          const g = new THREE.Group();
          const p = new THREE.Mesh(sphereGeo, posMat);
          const n = new THREE.Mesh(sphereGeo, negMat);
          const rod = new THREE.Mesh(rodGeo, new THREE.MeshStandardMaterial({ color: 0x9fb8d0, emissive: 0x334455, emissiveIntensity: 0.4 }));
          rod.rotation.z = Math.PI / 2;
          g.add(p, n, rod);
          g.position.set(ix * 1.7, iy * 1.2, iz * 0.9);
          content.add(g);
          this.meshRefs.dipoles.push({ group: g, pos: p, neg: n, rod });
        }
      }
    }

    // Bound surface charge markers on the two faces perpendicular to E (x faces)
    const bPosMat = new THREE.MeshStandardMaterial({ color: 0xffd166, emissive: 0xffaa00, emissiveIntensity: 1.0 });
    const bNegMat = new THREE.MeshStandardMaterial({ color: 0x8ecae6, emissive: 0x2a8fb0, emissiveIntensity: 1.0 });
    const bGeo = new THREE.SphereGeometry(0.11, 12, 10);
    for (let iy = -1; iy <= 1; iy++) {
      for (let iz = -1; iz <= 1; iz++) {
        const bp = new THREE.Mesh(bGeo, bPosMat);
        bp.position.set(3.02, iy * 1.2, iz * 1.0);
        content.add(bp);
        this.meshRefs.boundPos.push(bp);

        const bn = new THREE.Mesh(bGeo, bNegMat);
        bn.position.set(-3.02, iy * 1.2, iz * 1.0);
        content.add(bn);
        this.meshRefs.boundNeg.push(bn);
      }
    }

    // External field arrows
    this.meshRefs.fieldArrows = addArrowField([], 0x7fd1ff);
  },

  update() {
    const st = this.state;
    const eps_r = st.eps_r;
    const E = st.E_ext;              // kV/m
    const dScale = st.dipole_sep;

    const eps0 = 8.854e-12;
    const chi_e = eps_r - 1;
    const P = eps0 * chi_e * E * 1e3;   // C/m^2  (E in kV/m -> V/m)
    const D = eps0 * E * 1e3 + P;       // C/m^2
    const P_uC = P * 1e6;
    const D_uC = D * 1e6;
    const boundRatio = (eps_r - 1) / eps_r;

    // Align dipoles with E (x direction), scale separation
    const sep = 0.55 * dScale;
    this.meshRefs.dipoles.forEach(({ group, pos, neg, rod }) => {
      pos.position.set(sep, 0, 0);
      neg.position.set(-sep, 0, 0);
      rod.scale.set(1, 2 * sep, 1);
      rod.position.set(0, 0, 0);
      // slight tilt proportional to polarization magnitude
      const tilt = Math.min(0.35, P_uC / 40);
      group.rotation.z = tilt * 0.4;
    });

    // Bound charge visibility scales with chi_e
    const bScale = Math.min(1.6, 0.25 + chi_e * 0.12);

    // --- 2D chart ---
    const W = chartEl.width, H = chartEl.height;

    const padL = 62, padR = 22, padT = 34, padB = 46;

  tick(dt) {

  lesson: `<p><b>Energy density.</b> In a linear dielectric the electrostatic energy density is
  <em>w<sub>e</sub> = ½ E·D = ½ ε₀ε<sub>r</sub>E² = D²/(2ε)</em> (J/m³). Integrating over the volume gives the total stored energy
  <em>W<sub>e</sub> = ∫ w<sub>e</sub> dV = ½ C V²</em>. Because w<sub>e</sub> grows as E², doubling the field quadruples the stored energy.</p>

  <p><b>Limiting cases.</b> ε<sub>r</sub> → 1 recovers vacuum energy density ½ε₀E². As E → E<sub>bd</sub> the margin → 0 and avalanche ionization produces a conducting channel (spark).</p>`,

modules.push({

    // ---- 3D orientation ----

  lesson: `<p>A current loop of area <b>A</b> carrying current <b>I</b> has a magnetic dipole moment <b>m = I A n̂</b>. For an orbiting electron, <b>m_orb = −e L / (2 m_e)</b>, plus an intrinsic spin moment. In a uniform field <b>B</b>, the torque is <b>T = m × B</b> and the potential energy is <b>U_m = −m·B</b>. Torque is maximal at 90° (|T| = mB) and zero at 0° and 180°, while U_m is minimized when m aligns with B (θ = 0) and maximized when anti-aligned (θ = 180°).</p>
<p>Magnetic materials respond via the susceptibility χ_m and relative permeability μ_r = 1 + χ_m. Diamagnets have χ_m &lt; 0 (μ_r slightly below 1), paramagnets have χ_m &gt; 0 (μ_r slightly above 1), and ferromagnets have χ_m ≫ 1 with μ_r reaching 10⁴–10⁵. The internal field is enhanced by μ_r, so the same applied B produces a much larger torque and energy in a ferromagnetic medium.</p>`,

modules.push({
  id: 'magnetization_rod_solenoid',
  title: '7-14 to 7-15 Magnetization M, Magnetized Rod & Equivalent Solenoid',

  build() {
    const MU0 = 4 * Math.PI * 1e-7;

    this.meshRefs = {};

    // Rod (magnetized core)
    const rodGeo = new THREE.CylinderGeometry(0.55, 0.55, 1, 48, 1, false);

  update() {

    // H inside (long solenoid approximation) = -M + N I / L ... but for the
    // equivalent air-core solenoid with sheet current K = M, H_in = M (in the

    // We use the standard linear-medium relation: M = chi_m H, chi_m = mu_r - 1
    // => H = M / (mu_r - 1) for mu_r > 1, and B = mu0 mu_r H = mu0 (H + M).
    const chi = mu_r - 1;

    this.mArrows.setVectors(mVecs);

    for (let i = 0; i < nAx; i++) {

    // ---- 2D chart: axial profile of B and H across rod ----

  lesson: `<p><strong>Magnetization</strong> is the magnetic dipole moment per unit volume: <em>M</em> = lim<sub>&Delta;V&rarr;0</sub> (&sum; m<sub>i</sub>)/&Delta;V, in A/m. For a linear medium <em>M</em> = &chi;<sub>m</sub><em>H</em> = (&mu;<sub>r</sub>&minus;1)<em>H</em>, and the flux density is <em>B</em> = &mu;<sub>0</sub>(<em>H</em>+<em>M</em>) = &mu;<sub>0</sub>&mu;<sub>r</sub><em>H</em>.</p>

  build() {

  // Hysteresis branch model: B(H) = B_sat * tanh((H - s*Hc)/H0) with s = ±1 branch sign
  _branchB(H, s, Bsat, Hc) {

    const loop = [];
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      const H = -Hp + 2 * Hp * t;
      const B = this._branchB(H, +1, Bsat, Hc);
      loop.push({ H, B, phase: t });
    }
    for (let i = 0; i < N; i++) {
      const t = i / (N - 1);
      const H = Hp - 2 * Hp * t;
      const B = this._branchB(H, -1, Bsat, Hc);
      loop.push({ H, B, phase: 1 + t });
    }

    // Ribbon geometry: two edges offset in phase (z) direction
    const posAttr = refs.ribbon.geometry.attributes.position;
    const halfW = 0.18;
    for (let i = 0; i < loop.length; i++) {
      const p = loop[i];
      const x = p.H * 0.55;
      const y = p.B * 1.6;
      const z = (p.phase - 1) * 3.2;
      posAttr.setXYZ(i * 2, x, y, z - halfW);
      posAttr.setXYZ(i * 2 + 1, x, y, z + halfW);
    }
    posAttr.needsUpdate = true;
    refs.ribbon.geometry.computeVertexNormals();

    // Normal magnetization curve (single-valued, no hysteresis)
    const nAttr = refs.normalCurve.geometry.attributes.position;
    for (let i = 0; i < 120; i++) {
      const t = i / 119;
      const H = -Hp + 2 * Hp * t;
      const B = Bsat * Math.tanh(H / Math.max(0.35, Hc * 0.9));
      nAttr.setXYZ(i, H * 0.55, B * 1.6, -3.2);
    }
    nAttr.needsUpdate = true;

    // Marker position (animated by tick phase)
    const ph = this.phase % 1;
    const seg = ph < 0.5 ? 0 : 1;
    const tt = ph < 0.5 ? ph * 2 : (ph - 0.5) * 2;
    const Hm = seg === 0 ? -Hp + 2 * Hp * tt : Hp - 2 * Hp * tt;
    const Bm = this._branchB(Hm, seg === 0 ? +1 : -1, Bsat, Hc);
    refs.marker.position.set(Hm * 0.55, Bm * 1.6, (ph - 0.5) * 3.2);

    // Derived quantities
    const Br = this._branchB(0, -1, Bsat, Hc); // remanence on descending branch at H=0
    const Bop = this._branchB(Hp, +1, Bsat, Hc);

    // ---- 2D chart ----
    const W = chartEl.width, H2 = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H2);

    const pad = 46;
    const x0 = pad, x1 = W - pad, y0 = H2 - pad, y1 = pad;
    const HmaxPlot = Math.max(Hp * 1.15, Hc * 1.6, 1);
    const BmaxPlot = Math.max(Bsat * 1.15, 0.5);

    const mapX = (H) => x0 + (H + HmaxPlot) / (2 * HmaxPlot) * (x1 - x0);
    const mapY = (B) => y0 - (B / BmaxPlot) * (y0 - y1);

    // background
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H2);

    // grid
    ctx.strokeStyle = '#1e3350';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const x = x0 + (x1 - x0) * i / 8;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y0); ctx.stroke();
    }
    for (let j = 0; j <= 6; j++) {
      const y = y1 + (y0 - y1) * j / 6;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }

    // axes
    ctx.strokeStyle = '#7fb2e5';
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x0, mapY(0)); ctx.lineTo(x1, mapY(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mapX(0), y1); ctx.lineTo(mapX(0), y0); ctx.stroke();

    // normal curve (dashed)
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = '#9be7ff';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const H = -HmaxPlot + 2 * HmaxPlot * i / 200;
      const B = Bsat * Math.tanh(H / Math.max(0.35, Hc * 0.9));
      const px = mapX(H), py = mapY(B);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.setLineDash([]);

    // hysteresis loop (filled)
    ctx.beginPath();
    for (let i = 0; i < loop.length; i++) {
      const px = mapX(loop[i].H), py = mapY(loop[i].B);
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(47,127,255,0.22)';
    ctx.fill();
    ctx.strokeStyle = '#4d9bff';
    ctx.lineWidth = 2.4;
    ctx.stroke();

    // Br and Hc markers
    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(mapX(0), mapY(Br)); ctx.lineTo(mapX(0), mapY(0)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(mapX(-Hc), mapY(0)); ctx.lineTo(mapX(0), mapY(0)); ctx.stroke();

    ctx.fillStyle = '#ffd166';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('B_r', mapX(0) + 6, mapY(Br) - 6);
    ctx.fillText('H_c', mapX(-Hc) - 30, mapY(0) - 8);

    // operating point
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(mapX(Hp), mapY(Bop), 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffb3b3';
    ctx.fillText('op', mapX(Hp) + 8, mapY(Bop) - 8);

    // axis labels
    ctx.fillStyle = '#cfe3ff';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText('H (kA/m)', x1 - 70, mapY(0) + 22);
    ctx.fillText('B (T)', mapX(0) + 10, y1 + 14);

    // loop area (energy per cycle) — numeric integral of H dB over the loop
    let area = 0;
    for (let i = 0; i < loop.length; i++) {
      const a = loop[i], b = loop[(i + 1) % loop.length];
      area += 0.5 * (a.H + b.H) * (b.B - a.B);
    }
    const wHyst = Math.abs(area) * 1e3; // kA/m * T -> J/m^3

    setHud(
      'B-H Magnetization & Hysteresis Loop',
      'w_{\\mathrm{hyst}} = \\oint \\mathbf{H}\\cdot d\\mathbf{B},\\quad \\mathbf{B} = \\mu_0(\\mathbf{H}+\\mathbf{M})',
      [
        { k: 'B_op', v: Bop.toFixed(3) + ' T' },
        { k: 'H_op', v: Hp.toFixed(2) + ' kA/m' },
        { k: 'B_r', v: Br.toFixed(3) + ' T' },
        { k: 'H_c', v: Hc.toFixed(2) + ' kA/m' },
        { k: 'w_hyst', v: wHyst.toFixed(1) + ' J/m³' }
      ]
    );
  },

  tick(dt) {
    this.phase = (this.phase + dt * 0.18) % 1;
  },

  lesson: `<p>Section 7-18: the normal magnetization curve <em>B(H)</em> starts at the origin, steepens as magnetic domains rotate and align, then saturates at <em>B_sat = μ₀(H + M_sat)</em>. Section 7-19: real ferromagnets retain history — the loop shows <strong>remanence</strong> <em>B_r</em> at <em>H = 0</em> and <strong>coercivity</strong> <em>H_c</em>, the reverse field needed to null <em>B</em>. The enclosed area <em>∮H·dB</em> is the volumetric energy dissipated per cycle (J/m³), so wide, tall loops (hard magnets) lose more energy per cycle than narrow soft loops. Increasing <em>H_max</em> widens the loop; increasing <em>B_sat</em> raises the saturation knee; increasing <em>H_c</em> widens the loop horizontally and raises the loss.</p>`,

  quiz: [
    { q: 'What does the remanence B_r represent?', options: ['Flux density at H = 0 after saturation', 'Field needed to saturate the material', 'The slope of the normal curve at the origin', 'The area of the hysteresis loop'], answer: 0 },
    { q: 'The area enclosed by a B–H hysteresis loop equals:', options: ['Stored magnetic energy', 'Energy dissipated per unit volume per cycle', 'Permeability times H_c', 'The saturation magnetization'], answer: 1 },
    { q: 'Increasing coercivity H_c while keeping B_sat fixed will:', options: ['Narrow the loop and reduce loss', 'Widen the loop and increase loss per cycle', 'Remove hysteresis entirely', 'Shift B_r to zero'], answer: 1 }
  ]
});
modules.push({

    // stored-energy indicator bar (vertical, grows with W_m)
    const eGeo = new THREE.BoxGeometry(0.35, 1, 0.35);

    const H = st.H_kAm * 1000;            // A/m
    const mu0 = 4 * Math.PI * 1e-7;

    // Operating point on the second-quadrant demagnetization line:
    // B = Br + mu0*mu_rec*H  (H negative in 2nd quadrant); use |H| here.
    const slope = m.Br / (m.Hc * 1000);   // T per A/m (approx linear load line)
    const B = Math.max(0, m.Br - slope * H); // T
    const wm = 0.5 * B * H / 1000;        // kJ/m^3  (0.5*B*H in J/m^3 -> /1000)
    const vol = st.vol_cm3 * 1e-6;        // m^3
    const Wm = wm * 1000 * vol;           // J -> mJ? wm kJ/m^3 * vol m^3 = kJ -> *1000 = J... careful

    // 3D updates
    const refs = this.meshRefs;

    const hNorm = Math.min(1, st.H_kAm / 200);

      const y = 0.9 + 0.55 * Math.sin(a);
      const z = 0.55 * Math.cos(a);
      vecs.push({ origin: new THREE.Vector3(1.45, y, z), dir: new THREE.Vector3(1, 0.25 * Math.sin(a), 0.25 * Math.cos(a)).normalize(), len });
      vecs.push({ origin: new THREE.Vector3(-1.45, y, z), dir: new THREE.Vector3(-1, 0.25 * Math.sin(a), 0.25 * Math.cos(a)).normalize(), len });
    }
    this.arrows.setVectors(vecs);

    // 2D chart
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, Hh = chartEl.height;

    const padL = 60, padR = 20, padT = 30, padB = 46;

    // grid
    ctx.strokeStyle = '#1d2634'; ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = y0 + (y1 - y0) * i / 5;
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
    }
    for (let i = 0; i <= 8; i++) {
      const xx = x0 + (x1 - x0) * i / 8;
      ctx.beginPath(); ctx.moveTo(xx, y0); ctx.lineTo(xx, y1); ctx.stroke();
    }

    // labels
    ctx.fillStyle = '#9fb3c8'; ctx.font = '13px sans-serif';
    ctx.fillText('w_m (kJ/m^3)', x0 - 50, y0 - 8);
    ctx.fillText('|H| (kA/m)', x1 - 70, y1 + 26);
    ctx.fillText('0', x0 - 12, y1 + 16);
    ctx.fillText('200', x1 - 22, y1 + 16);

    const wMax = 400; // kJ/m^3 scale
    const toX = h => x0 + (x1 - x0) * (h / 200);

    // curves for each material
    const names = Object.keys(this.MATS);
    names.forEach((nm, idx) => {
      const mm = this.MATS[nm];

      ctx.strokeStyle = '#' + mm.color.toString(16).padStart(6, '0');
      ctx.lineWidth = nm === st.pm_type ? 3 : 1.4;
      ctx.beginPath();
      for (let h = 0; h <= 200; h += 2) {
        const Bc = Math.max(0, mm.Br - sl * h * 1000);
        const w = 0.5 * Bc * h * 1000 / 1000;
        const px = toX(h), py = toY(Math.min(w, wMax));
        if (h === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    });

    // operating point marker
    const px = toX(st.H_kAm), py = toY(Math.min(wm, wMax));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();

    setHud(

  tick(dt) {

  lesson: `<p>A permanent magnet stores magnetostatic energy in the field it produces. In a linear medium the energy density is
  <b>w_m = ½ B·H = B²/(2μ) = ½ μ H²</b> (J/m³). For a magnet of volume V the stored energy is W_m = w_m V.</p>
  <p>After the external field is removed, a permanent magnet retains a remanent magnetization M_r, giving a remanence B_r. Its
  operating point lies in the <b>second quadrant</b> of the B–H loop, where H opposes B. The demagnetization curve is
  approximately linear: B ≈ B_r + μ₀ μ_rec H (H negative). The product |B·H| peaks at <b>(BH)_max</b>, the figure of merit
  for a magnet: Ferrite ≈ 30, Alnico 5 ≈ 45, SmCo ≈ 160, NdFeB ≈ 320 kJ/m³.</p>
  <p>Limiting cases: with no applied field (H = 0) the energy density vanishes even though B_r ≠ 0 — energy is only extracted

  quiz: [

modules.push({
  id: 'demagnetization_gapless',
  title: '7-23 to 7-24 Demagnetization & Gapless Magnetic Circuit',

  controls: [
    { id: 'N_turns', label: 'Coil turns N', type: 'range', min: 50, max: 1000, step: 25, value: 300 },

  build() {

    const coreMat = new THREE.MeshStandardMaterial({
      color: 0x3a4a63, emissive: 0x14202e, metalness: 0.55, roughness: 0.45
    });

    ];
    for (const b of bars) {

      m.position.set(...b.p);
      m.scale.set(...b.s);

    // --- Copper winding turns (compact loop) ---

    });

  update() {
    const st = this.state;

  update() {
    const st = this.state;
    const mu0 = this.meshRefs.mu0;
    const Br = st.Br_T;
    const Hc = st.Hc_kAm * 1e3;          // A/m
    const ratio = st.ratio_lm_lg;

    // Linear demagnetization curve: B = Br + mu0*H  (H negative in 2nd quadrant)
    // Load line: B = -mu0*ratio*H  =>  Br + mu0 H = -mu0 ratio H
    // H_m = -Br / (mu0 (1 + ratio))
    const Hm = -Br / (mu0 * (1 + ratio));      // A/m
    const Bm = Br + mu0 * Hm;                  // T
    const Hg = -Hm * ratio;                    // A/m  (H_g = -(l_m/l_g) H_m)
    const Bg = mu0 * Hg;                       // T  (equals Bm)
    const gapEnergyDensity = 0.5 * Bg * Hg / 1000; // kJ/m^3

    // scale arrows by field magnitude
    const bLen = 1.2 + 2.2 * (Bm / 1.4);
    const hLenMag = 0.6 + 1.6 * Math.min(1, Math.abs(Hm) / Hc);
    const hLenGap = 0.6 + 1.6 * Math.min(1, Math.abs(Hg) / Hc);
    this.meshRefs.bArrows.setVectors([
      { origin: new THREE.Vector3(-2.4, 0.55, 0.55), dir: new THREE.Vector3(1, 0, 0), len: bLen },

    ]);
    this.meshRefs.hArrows.setVectors([
      { origin: new THREE.Vector3(-0.6, 0.0, 0.85), dir: new THREE.Vector3(-1, 0, 0), len: hLenMag },
      { origin: new THREE.Vector3(0.9, 0.0, 0.85), dir: new THREE.Vector3(1, 0, 0), len: hLenGap }
    ]);

    // ---- 2D chart ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1018';
    ctx.fillRect(0, 0, W, H);

    const padL = 60, padR = 30, padT = 30, padB = 50;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    // H axis range (negative): from -Hc to 0
    const Hmin = -Hc * 1.15;
    const Bmax = Br * 1.15;
    const xOf = h => padL + (h - Hmin) / (0 - Hmin) * plotW;
    const yOf = b => padT + plotH - (b / Bmax) * plotH;

    // grid
    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const h = Hmin + (0 - Hmin) * i / 5;
      ctx.beginPath(); ctx.moveTo(xOf(h), padT); ctx.lineTo(xOf(h), padT + plotH); ctx.stroke();
      const b = Bmax * i / 5;
      ctx.beginPath(); ctx.moveTo(padL, yOf(b)); ctx.lineTo(padL + plotW, yOf(b)); ctx.stroke();
    }

    // axes
    ctx.strokeStyle = '#7f8fa6';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();

    // labels
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '13px sans-serif';
    ctx.fillText('H (A/m)', padL + plotW / 2 - 30, H - 12);

    ctx.strokeStyle = '#7fd1ff';

    for (let i = 0; i <= 100; i++) {
      const h = Hmin + (0 - Hmin) * i / 100;
      const b = Br + mu0 * h;
      if (i === 0) ctx.moveTo(xOf(h), yOf(b)); else ctx.lineTo(xOf(h), yOf(b));
    }
    ctx.stroke();

    // load line B = -mu0*ratio*H
    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.beginPath();
    ctx.moveTo(xOf(0), yOf(0));
    ctx.lineTo(xOf(Hmin), yOf(-mu0 * ratio * Hmin));
    ctx.stroke();
    ctx.setLineDash([]);

    // operating point
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    ctx.arc(xOf(Hm), yOf(Bm), 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = '12px sans-serif';
    ctx.fillText(`OP: H=${(Hm/1e3).toFixed(1)} kA/m, B=${Bm.toFixed(3)} T`,
      Math.min(xOf(Hm) + 10, W - 220), Math.max(yOf(Bm) - 10, 20));

    setHud(
      'Permanent Magnet Operating Point with Gap',
      'H_m l_m + H_g l_g = 0,\\quad \\frac{B_m}{H_m} = -\\mu_0\\frac{l_m}{l_g}',
      [
        { k: 'B_gap', v: `${Bg.toFixed(3)} T` },
        { k: 'H_m', v: `${(Hm / 1e3).toFixed(1)} kA/m` },
        { k: 'H_gap', v: `${(Hg / 1e3).toFixed(1)} kA/m` },
        { k: 'Gap Energy Density', v: `${gapEnergyDensity.toFixed(2)} kJ/m^3` }
      ]
    );
  },

  tick(dt) {

    if (this.meshRefs && this.meshRefs.group) {
      this.meshRefs.group.rotation.y += dt * 0.15;
    }
  },

  lesson: `<p>A permanent magnet of length <em>l<sub>m</sub></em> and area <em>A</em> is coupled across an air gap of length <em>l<sub>g</sub></em>. Ampere's law around a closed path gives <strong>H<sub>m</sub>l<sub>m</sub> + H<sub>g</sub>l<sub>g</sub> = 0</strong>, so H<sub>m</sub> is opposite in sign to H<sub>g</sub>. Flux continuity (no fringing) gives B<sub>m</sub> = B<sub>g</sub> = μ<sub>0</sub>H<sub>g</sub>. Combining yields the load line <strong>B<sub>m</sub>/H<sub>m</sub> = −μ<sub>0</sub>l<sub>m</sub>/l<sub>g</sub></strong>, whose intersection with the second-quadrant demagnetization curve fixes the operating point. A larger length ratio steepens the load line and pushes the operating point toward higher B and lower |H|; a small gap ratio (large gap) drives the magnet toward coercivity and reduces gap energy density.</p>`,
  quiz: [
    { q: 'For a magnet with gap, which relation holds for the field intensities?', options: ['H_m l_m = H_g l_g', 'H_m l_m + H_g l_g = 0', 'H_m = H_g', 'H_m l_g = H_g l_m'], answer: 1 },
    { q: 'The load line slope B_m/H_m equals:', options: ['+μ0 l_m/l_g', '−μ0 l_m/l_g', '−μ0 l_g/l_m', '−l_m/l_g'], answer: 1 },
    { q: 'Increasing l_m/l_g (smaller gap) moves the operating point toward:', options: ['lower B and higher |H|', 'higher B and lower |H|', 'the origin', 'B = 0'], answer: 1 }

modules.push({

  build() {

  update() {
    const st = this.state;
    const f = st.freq_Hz, Bm = st.Bmax_T, tmm = st.lam_mm;
    const lam = st.laminated;
    const R = this.meshRefs;

    // --- geometry: laminated vs solid ---
    const tEff = lam ? tmm : 5.0;   // solid core behaves like a thick sheet
    const nVis = lam ? Math.max(2, Math.min(R.N, Math.round(8 * (0.5 / Math.max(tmm, 0.1))))) : 1;
    R.slabs.forEach((m, i) => {
      m.visible = i < nVis;
      m.scale.z = lam ? 1 : 1;
      m.position.z = lam ? (i - (nVis - 1) / 2) * (R.D / nVis) : 0;
      m.scale.z = lam ? 1 : 1;
    });
    R.g.children.forEach(c => { if (c.name === 'ins') c.visible = lam; });

    // --- eddy loops: bigger & brighter with more loss ---
    const eddyRel = f * f * Bm * Bm * (tEff * tEff) * 1e-6; // arbitrary relative units
    const hystRel = f * Bm * 1e-3;
    const total = eddyRel + hystRel;
    const eddyShare = total > 0 ? eddyRel / total : 0;

    R.loops.forEach((ring, i) => {
      const s = 0.55 + 0.9 * Math.min(1, eddyShare) * (1 + i * 0.08);
      ring.scale.setScalar(s);
      ring.material.emissiveIntensity = 0.5 + 2.2 * eddyShare;
      ring.visible = eddyShare > 0.02;
    });

    // --- skin depth (mm) ---
    const mu0 = 4 * Math.PI * 1e-7;
    const mur = 2000;                 // typical ferromagnetic relative permeability
    const sigma = 5e6;                // S/m (iron-ish)
    const delta_m = 1 / Math.sqrt(Math.PI * f * mu0 * mur * sigma);

    // --- HUD ---
    setHud(

      [
        { k: 'Skin Depth', v: delta_mm.toFixed(3) + ' mm' },
        { k: 'Eddy Share', v: (eddyShare * 100).toFixed(1) + ' %' },
        { k: 'Hyst Share', v: ((1 - eddyShare) * 100).toFixed(1) + ' %' },
        { k: 'Total Rel. Loss', v: total.toFixed(3) }
      ]
    );

    // --- 2D chart ---
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    const pad = 46;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const fMin = 50, fMax = 5000;

    // background
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    // grid
    ctx.strokeStyle = '#1e2c44';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const x = x0 + (x1 - x0) * i / 5;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y0); ctx.stroke();
      const y = y0 - (y0 - y1) * i / 5;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }

    // loss curves (normalized to max at fMax)
    const eddyAt = (ff) => ff * ff * Bm * Bm * (tEff * tEff) * 1e-6;
    const hystAt = (ff) => ff * Bm * 1e-3;
    const maxV = Math.max(eddyAt(fMax), hystAt(fMax));

    const plot = (fn, color, width) => {
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const ff = fMin + (fMax - fMin) * i / 200;
        const x = x0 + (x1 - x0) * (ff - fMin) / (fMax - fMin);
        const y = y0 - (y0 - y1) * (fn(ff) / maxV);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.stroke();
    };

    plot(eddyAt, '#4fd1ff', 3);
    plot(hystAt, '#ffb347', 3);

    // marker at current f
    const xm = x0 + (x1 - x0) * (f - fMin) / (fMax - fMin);
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(xm, y1); ctx.lineTo(xm, y0); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(xm, y0 - (y0 - y1) * (eddyAt(f) / maxV), 4, 0, Math.PI * 2); ctx.fill();

    // labels
    ctx.fillStyle = '#9fb6d4';
    ctx.font = '13px system-ui, sans-serif';
    ctx.fillText('f (Hz)', x1 - 40, y0 + 26);
    ctx.fillText('loss (rel.)', x0 - 30, y1 - 10);
    ctx.fillStyle = '#4fd1ff'; ctx.fillText('Eddy  ∝ f²', x0 + 10, y1 + 22);
    ctx.fillStyle = '#ffb347'; ctx.fillText('Hysteresis  ∝ f', x0 + 130, y1 + 22);

  },

  lesson: `<p>Under AC excitation a ferromagnetic core dissipates two loss mechanisms. <b>Hysteresis loss</b> scales linearly with frequency, <em>P<sub>h</sub> ∝ f B<sub>max</sub></em>, because each cycle traces the B–H loop once. <b>Eddy-current loss</b> scales as <em>P<sub>e</sub> ∝ f² B<sub>max</sub>² t² σ</em>: induced EMF grows with f, and the resulting current paths in a sheet of thickness t produce I²R heating that grows quadratically.</p>
<p>Skin depth <em>δ = 1/√(π f μ σ)</em> shrinks as frequency rises, confining flux and current to the surface. Laminating the core into thin insulated sheets (thickness t) breaks the large eddy loops into small ones, cutting eddy loss by roughly (t/t_solid)². At low f hysteresis dominates; at high f eddy currents dominate — hence laminated cores are essential for transformers and motors operating at power frequencies and above.</p>`,

});

    refGroup.position.set(0, 0, 0);
    g.add(refGroup);

    this.meshRefs = { g, capGroup, magGroup, refGroup, slab, gapBlock, capArrows, magArrows, refArrows, topPlate, botPlate };
  },

  update() {
    const st = this.state;
    const r = this.meshRefs;
    const mode = st.mode;
    const p1 = st.p1, p2 = st.p2, p3 = st.p3;

    r.capGroup.visible = mode === 'Capacitor w/ Dielectric';
    r.magGroup.visible = mode === 'Magnetic Gap Force';
    r.refGroup.visible = mode === 'Dielectric Refraction';

    let primary = 0, secondary = 0, fieldVal = 0, primaryLabel = '', secondaryLabel = '', fieldLabel = '';
    const eps0 = 8.854e-12, mu0 = 4 * Math.PI * 1e-7;

    if (mode === 'Capacitor w/ Dielectric') {
      const epsr = p1;
      const V = p2 * 1e3;                 // kV -> V
      const A = p3 * 1e-4;                // cm^2 -> m^2
      const d = 2e-3;                     // 2 mm plate separation
      const C0 = eps0 * A / d;
      const C = epsr * C0;
      const W = 0.5 * C * V * V;
      const sigmaFree = C * V / A;
      const sigmaBound = sigmaFree * (1 - 1 / epsr);
      primary = C * 1e9;                  // nF
      secondary = W * 1e3;                // mJ
      fieldVal = V / d;                   // V/m
      primaryLabel = 'Capacitance C [nF]';
      secondaryLabel = 'Stored Energy W [mJ]';
      fieldLabel = 'E-field [kV/m]';
      // visual: slab thickness scales with epsr
      r.slab.scale.y = 0.6 + 0.05 * epsr;
      r.slab.material.opacity = 0.45 + 0.03 * epsr;
      r.capArrows.setVectors([
        { origin: new THREE.Vector3(-1.0, -0.9, 0), dir: new THREE.Vector3(0, 1, 0), len: 1.6 },
        { origin: new THREE.Vector3(0.0, -0.9, 0), dir: new THREE.Vector3(0, 1, 0), len: 1.6 },
        { origin: new THREE.Vector3(1.0, -0.9, 0), dir: new THREE.Vector3(0, 1, 0), len: 1.6 }
      ]);
    } else if (mode === 'Magnetic Gap Force') {
      const NI = p1 * 100;                // 100 A-t units -> A-t
      const lg = p2 * 1e-4;               // 0.1 mm -> m
      const A = p3 * 1e-4;                // cm^2 -> m^2
      const lc = 0.5;                     // core path length [m]
      const mur = 1000;
      // reluctance: core + gap
      const Rc = lc / (mur * mu0 * A);
      const Rg = lg / (mu0 * A);
      const Phi = NI / (Rc + Rg);
      const B = Phi / A;
      const F = B * B * A / (2 * mu0);
      primary = Phi * 1e6;                // uWb
      secondary = F;                      // N
      fieldVal = B;                       // T
      primaryLabel = 'Flux Phi [uWb]';
      secondaryLabel = 'Gap Force F [N]';
      fieldLabel = 'B-field [T]';
      // visual: gap block height scales with lg
      r.gapBlock.scale.y = 0.3 + lg / 1e-3 * 0.4;
      r.gapBlock.position.y = 0.55 + (r.gapBlock.scale.y - 0.3) * 0.25;
      r.magArrows.setVectors([
        { origin: new THREE.Vector3(-1.3, -1.0, 0), dir: new THREE.Vector3(0, 1, 0), len: 2.0 },
        { origin: new THREE.Vector3(0, 1.3, 0), dir: new THREE.Vector3(1, 0, 0), len: 1.2 },
        { origin: new THREE.Vector3(1.3, 0.8, 0), dir: new THREE.Vector3(0, -1, 0), len: 0.6 }
      ]);
    } else {
      const epsr2 = p1;
      const theta1 = p2 * Math.PI / 180;
      const epsr1 = p3;
      // Snell-like for D: tan(theta2) = (eps_r2/eps_r1) tan(theta1) for E refraction
      const theta2 = Math.atan((epsr2 / epsr1) * Math.tan(theta1));
      const D1 = eps0 * epsr1 * 1e6;      // arbitrary scale
      const D2 = eps0 * epsr2 * 1e6;
      primary = theta2 * 180 / Math.PI;   // deg
      secondary = D2 / D1;                // ratio
      fieldVal = theta2;
      primaryLabel = 'Refracted angle theta2 [deg]';
      secondaryLabel = 'D2/D1 ratio';
      fieldLabel = 'theta2 [rad]';
      // visual: rotate arrows
      const dir1 = new THREE.Vector3(Math.sin(theta1), Math.cos(theta1), 0);
      const dir2 = new THREE.Vector3(Math.sin(theta2), Math.cos(theta2), 0);
      r.refArrows.setVectors([
        { origin: new THREE.Vector3(-1.2, -1.4, 0), dir: dir1, len: 1.6 },
        { origin: new THREE.Vector3(0.6, 0.0, 0), dir: dir2, len: 1.4 }
      ]);
    }

    // ---- 2D chart: sweep primary output vs p1 ----
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const padL = 60, padR = 20, padT = 30, padB = 45;
    const plotW = W - padL - padR, plotH = H - padT - padB;

    // grid
    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + plotH * i / 5;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(W - padR, y); ctx.stroke();
    }
    for (let i = 0; i <= 5; i++) {
      const x = padL + plotW * i / 5;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, H - padB); ctx.stroke();
    }

    // compute sweep
    const N = 60;
    const xs = [], ys = [];
    for (let i = 0; i <= N; i++) {
      const p1v = 1 + (20 - 1) * i / N;
      let val = 0;
      if (mode === 'Capacitor w/ Dielectric') {
        const V = p2 * 1e3, A = p3 * 1e-4, d = 2e-3;
        val = (eps0 * p1v * A / d) * 1e9;
      } else if (mode === 'Magnetic Gap Force') {
        const NI = p1v * 100, lg = p2 * 1e-4, A = p3 * 1e-4;
        const Rc = 0.5 / (1000 * mu0 * A), Rg = lg / (mu0 * A);
        val = (NI / (Rc + Rg)) * 1e6;
      } else {
        const theta1 = p2 * Math.PI / 180;
        val = Math.atan((p1v / p3) * Math.tan(theta1)) * 180 / Math.PI;
      }
      xs.push(p1v); ys.push(val);
    }
    const yMin = Math.min(...ys), yMax = Math.max(...ys);
    const yRange = Math.max(yMax - yMin, 1e-9);

    // curve
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const x = padL + plotW * (xs[i] - 1) / 19;
      const y = padT + plotH * (1 - (ys[i] - yMin) / yRange);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // current marker
    const curX = padL + plotW * (p1 - 1) / 19;
    const curY = padT + plotH * (1 - (primary - yMin) / yRange);
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(curX, curY, 5, 0, Math.PI * 2); ctx.fill();

    // labels
    ctx.fillStyle = '#9fb6d6';
    ctx.font = '12px sans-serif';
    ctx.fillText(primaryLabel, padL, padT - 10);
    ctx.fillText('p1 sweep', W - padR - 70, H - 12);
    ctx.fillText(yMax.toFixed(2), 8, padT + 10);
    ctx.fillText(yMin.toFixed(2), 8, H - padB);

    setHud(
      'Ch. 7 Problems & Capstone Solver',
      '\\mathbf{D}=\\varepsilon\\mathbf{E},\\quad \\mathbf{B}=\\mu\\mathbf{H},\\quad F_{\\mathrm{gap}}=\\frac{B^2 A}{2\\mu_0}',
      [
        { k: 'Mode', v: mode },
        { k: 'Primary Output', v: primary.toFixed(3) + ' ' + primaryLabel },
        { k: 'Secondary Metric', v: secondary.toFixed(3) + ' ' + secondaryLabel },
        { k: 'Energy/Field', v: fieldVal.toFixed(3) + ' ' + fieldLabel }
      ]
    );
  },

  tick(dt) {
    const r = this.meshRefs;
    if (!r) return;
    r.g.rotation.y += dt * 0.15;
  },

  lesson: `<p>Chapter 7 capstone synthesis: dielectrics modify capacitance via <em>C = eps_r C_0</em> and store energy <em>W = ½ C V²</em>; bound charge density is <em>sigma_b = sigma_f(1 - 1/eps_r)</em>. Magnetic circuits obey MMF = NI = Phi(R_core + R_gap), with gap reluctance <em>R_g = l_g/(mu_0 A)</em>; the attractive gap force is <em>F = B²A/(2mu_0)</em>. At dielectric interfaces, normal D is continuous (no free charge) while tangential E is continuous, giving refraction <em>tan theta_2 = (eps_r2/eps_r1) tan theta_1</em>. Limiting cases: eps_r → 1 recovers vacuum; l_g → 0 maximizes flux and force; theta_1 → 0 gives no refraction.</p>`,
  quiz: [
    { q: 'A dielectric slab with eps_r = 4 replaces vacuum in a capacitor. The capacitance becomes:', options: ['C_0/4', '4 C_0', '2 C_0', 'unchanged'], answer: 1 },
    { q: 'For a magnetic circuit with fixed NI, increasing the air gap l_g causes the gap force to:', options: ['increase', 'decrease', 'stay constant', 'oscillate'], answer: 1 },
    { q: 'At a dielectric interface with no free surface charge, which quantity is continuous across the boundary?', options: ['Normal D', 'Tangential D', 'Normal E', 'Total E magnitude'], answer: 0 }
  ]
});
/* === UI CONTROLLER === */
    const modSelect = document.getElementById('modSelect');
    const controlsHost = document.getElementById('controlsHost');
    const lessonHost = document.getElementById('lessonHost');
    const quizHost = document.getElementById('quizHost');
    let activeMod = null;

    function renderQuiz(mod) {
      const items = mod.quiz || [];
      quizHost.innerHTML = items.map((qItem, qi) => `
        <div style="margin-bottom:8px;">
          <div style="font-size:12px;font-weight:600;margin-bottom:3px;">${qi + 1}. ${qItem.q}</div>
          ${(qItem.options || []).map((opt, oi) => `
            <label class="quizOpt"><input type="radio" name="q_${mod.id}_${qi}" data-qi="${qi}" data-oi="${oi}" /> ${opt}</label>
          `).join('')}
          <div id="qfb_${mod.id}_${qi}" style="font-size:11px;color:var(--accent-2);margin-top:2px;"></div>
        </div>
      `).join('');
      quizHost.querySelectorAll('input[type="radio"]').forEach((inp) => {
        inp.addEventListener('change', () => {
          const qi = Number(inp.dataset.qi);
          const oi = Number(inp.dataset.oi);
          const ans = items[qi].answer;
          const fb = document.getElementById(`qfb_${mod.id}_${qi}`);
          fb.textContent = oi === ans ? 'Correct.' : `Not quite — answer: ${items[qi].options[ans]}`;
        });
      });
    }

    function loadModule(idx) {
      if (!modules.length) return;
      const mod = modules[Math.max(0, Math.min(modules.length - 1, idx))];
      activeMod = mod;
      while (content.children.length > 0) {
        content.remove(content.children[0]);
      }
      mod.state = {};
      (mod.controls || []).forEach((c) => { mod.state[c.id] = c.value; });

      controlsHost.innerHTML = '';
      (mod.controls || []).forEach((c) => {
        const wrap = document.createElement('div');
        wrap.className = 'ctrl';
        if (c.type === 'range') {
          const lbl = document.createElement('label');
          const valSpan = document.createElement('span');
          valSpan.textContent = String(mod.state[c.id]);
          lbl.innerHTML = `<span>${c.label}</span>`;
          lbl.appendChild(valSpan);
          const inp = document.createElement('input');
          inp.type = 'range';
          inp.min = c.min; inp.max = c.max; inp.step = c.step; inp.value = mod.state[c.id];
          inp.addEventListener('input', () => {
            mod.state[c.id] = Number(inp.value);
            valSpan.textContent = String(mod.state[c.id]);
            if (typeof mod.update === 'function') mod.update();
          });
          wrap.appendChild(lbl);
          wrap.appendChild(inp);
        } else if (c.type === 'select') {
          const lbl = document.createElement('label');
          lbl.textContent = c.label;
          const sel = document.createElement('select');
          (c.options || []).forEach((o) => {
            const opt = document.createElement('option');
            if (typeof o === 'string') { opt.value = o; opt.textContent = o; }
            else { opt.value = (typeof o === 'object' && o !== null) ? o.value : o; opt.textContent = (typeof o === 'object' && o !== null) ? (o.label ?? o.value) : o; }
            if (opt.value === mod.state[c.id]) opt.selected = true;
            sel.appendChild(opt);
          });
          sel.addEventListener('change', () => {
            mod.state[c.id] = sel.value;
            if (typeof mod.update === 'function') mod.update();
          });
          wrap.appendChild(lbl);
          wrap.appendChild(sel);
        } else if (c.type === 'check') {
          const lbl = document.createElement('label');
          const chk = document.createElement('input');
          chk.type = 'checkbox';
          chk.checked = Boolean(mod.state[c.id]);
          chk.addEventListener('change', () => {
            mod.state[c.id] = chk.checked;
            if (typeof mod.update === 'function') mod.update();
          });
          lbl.appendChild(chk);
          const sp = document.createElement('span');
          sp.style.marginLeft = '6px';
          sp.textContent = c.label;
          lbl.appendChild(sp);
          wrap.appendChild(lbl);
        }
        controlsHost.appendChild(wrap);
      });

      lessonHost.innerHTML = mod.lesson || '';
      renderQuiz(mod);
      if (typeof mod.build === 'function') mod.build();
      if (typeof mod.update === 'function') mod.update();
    }

    modSelect.innerHTML = modules.map((m, i) => `<option value="${i}">${m.title || m.id}</option>`).join('');
    modSelect.addEventListener('change', () => loadModule(Number(modSelect.value)));

    window.addEventListener('resize', () => {
      const w = sceneWrap.clientWidth || 800;
      const h = sceneWrap.clientHeight || 600;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    });

    let prevT = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min((now - prevT) / 1000, 0.05);
      prevT = now;
      controls.update();
      if (activeMod && typeof activeMod.tick === 'function') { try { activeMod.tick(dt); } catch (e) { console.warn('tick error:', e); activeMod.tick = null; } }
      renderer.render(scene, camera);
    }
    if (modules.length > 0) loadModule(0);
    requestAnimationFrame(animate);
  </script>
</body>
</html>
