<title>EM Lab — Electromagnetics à la Kraus</title>
<meta name="description" content="Interactive electromagnetics learning lab inspired by John D. Kraus's Electromagnetics: field concepts, Gauss's law, potential, capacitance, magnetism, Faraday induction, Maxwell's equations, wave propagation, the Smith chart, and antenna radiation." />

<style>
  :root {
    --bg: #0b0f19;
    --panel: rgba(15, 23, 42, 0.86);
    --border: rgba(56, 189, 248, 0.22);

    --e: #38bdf8;

    --warn: #fbbf24;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);

  #shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }

  #topbar {

  #topbar .brand { font-weight: 700; letter-spacing: 0.04em; font-size: 15px; }

  #progress-bar { height: 100%; width: 0%; background: var(--accent); transition: width .25s; }

  #body { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100%; min-height: 0; overflow: hidden; }

  #stage { flex: 1; position: relative; min-height: 0; min-width: 0; overflow: hidden; }
  #stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; }

  .ctl .name { color: var(--muted); font-size: 11px; }
  .ctl .val { color: var(--accent); font-size: 11px; font-variant-numeric: tabular-nums; }
  input[type="range"] {

  }
  select {

  /* Dynamically generated UI controller styles */
  .module-btn {
    display: flex; align-items: center; gap: 8px;

  .module-btn:hover { background: rgba(56,189,248,0.08); }

  }
  .control-row {
    display: flex; flex-direction: column; gap: 5px;
    margin-bottom: 10px;
  }
  .control-row .control-top {
    display: flex; justify-content: space-between; align-items: center;
  }
  .control-label { color: var(--muted); font-size: 11px; }
  .control-val { color: var(--accent); font-size: 11px; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .control-row.is-check {

  }
  .control-row input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }
  .quiz-card {
    background: rgba(15, 23, 42, 0.55);

  }
  .quiz-prompt { font-size: 12px; color: #e2e8f0; margin: 0 0 6px; font-weight: 500; }
  .quiz-options { display: flex; flex-direction: column; gap: 3px; }
  .quiz-option {

  @media (max-width: 900px) {

</style>

<body>

<div id="shell">
  <header id="topbar">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   0. DOM REFERENCES
   ============================================================ */
const stageEl   = document.getElementById('stage');
const chartEl   = document.getElementById('chart-canvas');
const controlsEl= document.getElementById('controls');
const hudTitle  = document.getElementById('hud-title');
const hudEq     = document.getElementById('hud-eq');
const hudValues = document.getElementById('hud-values');
const lessonEl  = document.getElementById('lesson');
const quizEl    = document.getElementById('quiz');
const moduleList= document.getElementById('module-list');
const progressBar = document.getElementById('progress-bar');
const progressLabel = document.getElementById('progress-label');

/* ============================================================
   1. THREE.JS SETUP
   ============================================================ */
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
} catch (err) {
  const msg = document.createElement('div');
  msg.style.cssText = 'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f87171;padding:24px;text-align:center;font-size:14px;z-index:50;';
  msg.textContent = 'WebGL failed to initialize: ' + (err && err.message ? err.message : err);
  stageEl.appendChild(msg);
  throw err;
}
const initW = Math.max(1, stageEl.clientWidth || window.innerWidth - 232);
const initH = Math.max(1, stageEl.clientHeight || Math.round(window.innerHeight * 0.6));
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(initW, initH);
renderer.setClearColor(0x0b0f19, 1);
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.inset = '0';
renderer.domElement.style.width = '100%';
renderer.domElement.style.height = '100%';
renderer.domElement.style.display = 'block';
stageEl.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0f19, 0.03);

const camera = new THREE.PerspectiveCamera(50, initW / initH, 0.1, 200);
camera.position.set(4.6, 3.6, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 2;
controls.maxDistance = 30;

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
dirLight.position.set(5, 8, 6);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
rimLight.position.set(-6, -3, -5);
scene.add(rimLight);

const content = new THREE.Group();
scene.add(content);

/* ============================================================
   2. HELPERS
   ============================================================ */
function disposeObj(o) {
  o.traverse(n => {
    const isSharedArrowGeo = n.isArrowHelper || (n.parent && n.parent.isArrowHelper);
    if (!isSharedArrowGeo && n.geometry) n.geometry.dispose();
    if (n.material) {
      if (Array.isArray(n.material)) n.material.forEach(m => m.dispose());
      else n.material.dispose();
    }
  });
}

function clearContent() {
  while (content.children.length) {
    const c = content.children.pop();
    disposeObj(c);
  }
}

function addAxes(group, len = 3.2) {
  const mk = (color, a, b) => {
    const g = new THREE.BufferGeometry().setFromPoints([a, b]);
    const m = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.75 });
    return new THREE.Line(g, m);
  };
  group.add(mk(0xef4444, new THREE.Vector3(-len, 0, 0), new THREE.Vector3(len, 0, 0)));
  group.add(mk(0x22c55e, new THREE.Vector3(0, -len, 0), new THREE.Vector3(0, len, 0)));
  group.add(mk(0x3b82f6, new THREE.Vector3(0, 0, -len), new THREE.Vector3(0, 0, len)));
}

function addGrid(group, size = 8, y = -2.2) {
  const g = new THREE.GridHelper(size, 16, 0x1e293b, 0x1e293b);
  g.position.y = y;
  group.add(g);
}

function addArrowField(group, fn, opts = {}) {
  const { range = 1.8, step = 0.6, color = 0x38bdf8, scale = 0.35, maxLen = 0.55 } = opts;
  const arrows = [];
  for (let x = -range; x <= range + 1e-9; x += step) {
    for (let y = -range; y <= range + 1e-9; y += step) {
      for (let z = -range; z <= range + 1e-9; z += step) {
        const v = fn(x, y, z);
        const len = Math.hypot(v[0], v[1], v[2]);
        if (len < 1e-6) continue;
        const dir = new THREE.Vector3(v[0], v[1], v[2]).normalize();
        const L = Math.min(len * scale, maxLen);
        const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(x, y, z), L, color, L * 0.35, L * 0.2);
        group.add(arrow);
        arrows.push(arrow);
      }
    }
  }
  return arrows;
}

function renderMath(el, tex, display = true) {
  if (window.katex) {
    try {
      katex.render(tex, el, { throwOnError: false, displayMode: display });
      return;
    } catch (e) { /* fall through */ }
  }
  el.textContent = tex.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');
}

function renderAllMath(root) {
  root.querySelectorAll('[data-tex]').forEach(el => {
    renderMath(el, el.getAttribute('data-tex'), el.classList.contains('eqblock'));
  });
}

function setHud(title, eqTex, rows) {
  hudTitle.textContent = title;
  renderMath(hudEq, eqTex, true);
  hudValues.innerHTML = rows.map(r =>
    '<div class="kv"><span class="k">' + r.k + '</span><span class="v">' + r.v + '</span></div>'
  ).join('');
}

function fmt(v, d = 3) {
  if (!isFinite(v)) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(d);
}

/* ============================================================
   3. MODULE DEFINITIONS
   ============================================================ */
const modules = [];
/* ---------- 1. Electrostatics & Coulomb's Law ---------- */
modules.push({
  id: 'coulomb',
  title: "Electrostatics & Coulomb's Law",
  chapter: 'Kraus Ch. 2',
  controls: [
    { id: 'q1', label: 'Charge q1', type: 'range', min: -3, max: 3, step: 0.1, value: 1.5 },
    { id: 'q2', label: 'Charge q2', type: 'range', min: -3, max: 3, step: 0.1, value: -1.0 },
    { id: 'r', label: 'Separation r', type: 'range', min: 0.4, max: 3, step: 0.05, value: 1.4 },
  ],
  blurb: `
    <h3>Coulomb's law</h3>
    <p>Two point charges interact through the force</p>
    <div class="eqblock" data-tex="\\mathbf{F} = \\frac{1}{4\\pi\\varepsilon_0}\\frac{q_1 q_2}{r^2}\\hat{r}"></div>
    <p>Like charges repel, opposite charges attract. The field of a point charge is radial and falls off as 1/r^2:</p>
    <div class="eqblock" data-tex="\\mathbf{E} = \\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r^2}\\hat{r}"></div>
    <p class="note">Normalized units: 1/(4 pi eps0) = 1.</p>
  `,
  quiz: [
    { q: 'Doubling the separation changes the force by a factor of...', options: ['1/4', '1/2', '2', '4'], answer: 0,
      explain: 'F is proportional to 1/r^2, so doubling r gives F/4.' },
    { q: 'Two like charges...', options: ['Repel', 'Attract', 'Feel no force', 'Orbit'], answer: 0,
      explain: 'q1*q2 > 0 gives a repulsive force along r-hat.' },
  ],
  build() {
    clearContent(); addGrid(content); addAxes(content);
    camera.position.set(4.6, 3.6, 5.6); controls.target.set(0, 0, 0);
    this._charges = [];
    for (let i = 0; i < 2; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 24, 18),
        new THREE.MeshStandardMaterial({ color: 0xfbbf24, emissive: 0xfbbf24, emissiveIntensity: 0.5 }));
      content.add(m); this._charges.push(m);
    }
    this._force = new THREE.ArrowHelper(new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 0), 1, 0x34d399, 0.2, 0.12);
    content.add(this._force);
    this._arrows = [];
    this.update();
  },
  fieldFn() {
    const q1 = this.state.q1, q2 = this.state.q2, r = this.state.r;
    const p1 = [-r / 2, 0, 0], p2 = [r / 2, 0, 0];
    return (x, y, z) => {
      const out = [0, 0, 0];
      for (const pair of [[q1, p1], [q2, p2]]) {
        const q = pair[0], p = pair[1];
        const dx = x - p[0], dy = y - p[1], dz = z - p[2];
        const d = Math.hypot(dx, dy, dz);
        if (d < 0.2) continue;
        const f = q / (d * d * d);
        out[0] += f * dx; out[1] += f * dy; out[2] += f * dz;
      }
      return out;
    };
  },
  update() {
    const q1 = this.state.q1, q2 = this.state.q2, r = this.state.r;
    this._charges[0].position.set(-r / 2, 0, 0);
    this._charges[1].position.set(r / 2, 0, 0);
    for (const c of this._charges) {
      const q = c === this._charges[0] ? q1 : q2;
      const col = q >= 0 ? 0xfbbf24 : 0xf87171;
      c.material.color.set(col); c.material.emissive.set(col);
    }
    for (const a of this._arrows) { content.remove(a); disposeObj(a); }
    this._arrows = addArrowField(content, this.fieldFn(), { color: 0x38bdf8, range: 1.8, step: 0.6 });

    const F = q1 * q2 / (r * r);
    this._force.position.set(-r / 2, 0, 0);
    this._force.setDirection(new THREE.Vector3(q1 * q2 >= 0 ? 1 : -1, 0, 0));
    const fLen = Math.max(0.001, Math.min(Math.abs(F) * 0.5, 1.2)); this._force.visible = Math.abs(F) > 1e-5; this._force.setLength(fLen, Math.min(0.2, fLen * 0.35), Math.min(0.12, fLen * 0.2));

modules.push({

    <p>The scalar potential of a point charge is</p>
    <div class="eqblock" data-tex="V = \\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r}"></div>
    <p>The electric field is the negative gradient of the potential:</p>
    <div class="eqblock" data-tex="\\mathbf{E} = -\\nabla V"></div>

    { q: 'Equipotential surfaces are...', options: ['Perpendicular to field lines', 'Parallel to field lines', 'Always spheres', 'Always planes'], answer: 0,

  },
  V(x, y, z) {
    const q = this.state.q;
    const d1 = Math.hypot(x + 1, y, z) || 1e-6;
    const d2 = Math.hypot(x - 1, y, z) || 1e-6;
    return q / d1 - q / d2;
  },
  E(x, y, z) {
    const h = 1e-3;
    return [
      -(this.V(x + h, y, z) - this.V(x - h, y, z)) / (2 * h),
      -(this.V(x, y + h, z) - this.V(x, y - h, z)) / (2 * h),
      -(this.V(x, y, z + h) - this.V(x, y, z - h)) / (2 * h),
    ];

        }

    for (const a of this._arrows) { content.remove(a); disposeObj(a); }
    this._arrows = addArrowField(content, (x, y, z) => this.E(x, y, z), { color: 0x38bdf8, range: 1.8, step: 0.6 });

    const Vp = this.V(px, py, 0);
    const Ep = this.E(px, py, 0);
    setHud('Potential & Gradient',
      'V = \\frac{1}{4\\pi\\varepsilon_0}\\frac{q}{r}, \\qquad \\mathbf{E} = -\\nabla V',
      [
        { k: 'V at probe', v: fmt(Vp, 4) },
        { k: 'E at probe', v: '(' + Ep.map(v => v.toFixed(2)).join(', ') + ')' },
        { k: '|E|', v: fmt(Math.hypot(Ep[0], Ep[1], Ep[2]), 4) },
      ]);
  },
});

        { k: 'L (\u03bb)', v: fmt(L, 3) },
        { k: 'kL/2', v: fmt(kL2, 3) },
        { k: 'Broadside |E|/max', v: fmt(D, 3) },
        { k: 'Nulls', v: L >= 1 ? 'broadside' : 'none' },
      ]);
  },
  update() {
    const R = (this.state && this.state.zr !== undefined) ? this.state.zr : this._val('zr', 1.0);
    const X = (this.state && this.state.zx !== undefined) ? this.state.zx : this._val('zx', 0.5);
    const L = (this.state && this.state.len !== undefined) ? this.state.len : this._val('len', 0.5);
    const isDipole = !!(this.state && this.state.dipoleView);
    if (!isDipole) {
      chartEl.style.display = 'block';
      renderer.domElement.style.display = 'none';
      this._drawSmith(R, X);
    } else {
      chartEl.style.display = 'none';
      renderer.domElement.style.display = 'block';
      this._drawDipole(L);
    }
  },
  tick(dt) { this._t += dt; this.update(); },
});
/* ============================================================
   UI CONTROLLER
   ============================================================ */
const moduleListEl  = document.getElementById('module-list');

const STORE_KEY = 'em-kraus-lab-progress';
let activeIdx = 0;

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); }
  catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (e) {}
}
let progress = loadProgress();

function buildModuleList() {
  moduleListEl.innerHTML = '';
  modules.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'module-btn';
    btn.dataset.idx = String(i);
    btn.textContent = m.title || m.name || ('Module ' + (i + 1));
    btn.addEventListener('click', () => selectModule(i));
    moduleListEl.appendChild(btn);
  });
}

function buildControls(mod) {
  controlsEl.innerHTML = '<div class="ctl-title">Parameters</div>';
  if (!mod.state) mod.state = {};
  (mod.controls || []).forEach((c) => {
    if (!(c.id in mod.state)) mod.state[c.id] = c.value;

    const row = document.createElement('label');
    row.className = 'control-row' + (c.type === 'check' ? ' is-check' : '');

    const top = document.createElement('div');
    top.className = 'control-top';

    const name = document.createElement('span');
    name.className = 'control-label';
    name.textContent = c.label || c.id;
    top.appendChild(name);

    let valSpan = null;
    if (c.type !== 'check') {
      valSpan = document.createElement('span');
      valSpan.className = 'control-val';
      valSpan.textContent = Number(mod.state[c.id]).toFixed(2);
      top.appendChild(valSpan);
    }

    const input = document.createElement('input');
    input.id = 'ctl-' + c.id;
    input.type = c.type === 'check' ? 'checkbox' : 'range';

    if (c.type === 'check') {
      input.checked = !!mod.state[c.id];
    } else {
      input.min  = c.min  ?? 0;
      input.max  = c.max  ?? 1;
      input.step = c.step ?? 0.01;
      input.value = mod.state[c.id];
    }

    input.addEventListener('input', () => {
      mod.state[c.id] = c.type === 'check' ? input.checked : parseFloat(input.value);
      if (valSpan) valSpan.textContent = Number(mod.state[c.id]).toFixed(2);
      mod.update();
    });

    row.appendChild(top);
    row.appendChild(input);
    controlsEl.appendChild(row);
  });
}


function buildLesson(mod) {
  const raw = mod.lesson || mod.blurb || '';
  lessonEl.innerHTML = raw.trim().startsWith('<') ? raw : ('<h3>' + (mod.title || '') + '</h3><p>' + raw + '</p>');
  renderAllMath(lessonEl);
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  const key = mod.id || mod.name || String(activeIdx);
  const saved = progress[key] || {};

  (mod.quiz || []).forEach((q, qi) => {
    const card = document.createElement('div');
    card.className = 'quiz-card';

    const prompt = document.createElement('p');
    prompt.className = 'quiz-prompt';
    prompt.textContent = (qi + 1) + '. ' + q.q;
    card.appendChild(prompt);

    const opts = document.createElement('div');
    opts.className = 'quiz-options';

    q.options.forEach((opt, oi) => {
      const lab = document.createElement('label');
      lab.className = 'quiz-option';

      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = key + '-q' + qi;
      radio.value = String(oi);
      if (saved[qi] === oi) radio.checked = true;

      radio.addEventListener('change', () => {
        progress[key] = progress[key] || {};
        progress[key][qi] = oi;
        saveProgress(progress);
        updateProgress();
        gradeQuiz(mod);
      });

      const span = document.createElement('span');
      span.textContent = opt;

      lab.appendChild(radio);
      lab.appendChild(span);
      opts.appendChild(lab);
    });

    card.appendChild(opts);

    const fb = document.createElement('p');
    fb.className = 'quiz-feedback';
    fb.dataset.q = String(qi);
    card.appendChild(fb);

    quizEl.appendChild(card);
  });

  gradeQuiz(mod);
}

function gradeQuiz(mod) {
  const key = mod.id || mod.name || String(activeIdx);
  const saved = progress[key] || {};
  let correct = 0;
  const total = (mod.quiz || []).length;

  (mod.quiz || []).forEach((q, qi) => {
    const fb = quizEl.querySelector('.quiz-feedback[data-q="' + qi + '"]');
    if (!fb) return;
    const chosen = saved[qi];
    if (chosen === undefined) {
      fb.textContent = '';
      fb.className = 'quiz-feedback';
    } else if (chosen === q.answer) {
      correct++;
      fb.textContent = '\u2713 Correct';
      fb.className = 'quiz-feedback ok';
    } else {
      fb.textContent = '\u2717 Incorrect \u2014 answer: ' + q.options[q.answer];
      fb.className = 'quiz-feedback bad';
    }
  });

  return { correct, total };
}

function updateProgress() {
  let answered = 0, correct = 0, total = 0;
  modules.forEach((m, i) => {
    const key = m.id || m.name || String(i);
    const saved = progress[key] || {};
    (m.quiz || []).forEach((q, qi) => {
      total++;
      if (saved[qi] !== undefined) {
        answered++;
        if (saved[qi] === q.answer) correct++;
      }
    });
  });
  const pct = total ? Math.round((correct / total) * 100) : 0;
  if (progressBar) progressBar.style.width = pct + '%';
  if (progressLabel) progressLabel.textContent = correct + ' / ' + total + ' correct (' + pct + '%)';
}

function selectModule(idx) {
  if (idx < 0 || idx >= modules.length) return;
  activeIdx = idx;
  const mod = modules[idx];

  moduleListEl.querySelectorAll('.module-btn').forEach((b) => {
    b.classList.toggle('active', Number(b.dataset.idx) === idx);
  });

  buildControls(mod);
  buildLesson(mod);
  buildQuiz(mod);
  updateProgress();

  clearContent();
  chartEl.style.display = 'none';
  renderer.domElement.style.display = 'block';
  if (typeof mod.build === 'function') mod.build();
  else if (typeof mod.init === 'function') mod.init();
  mod._built = true;
  if (typeof mod.update === 'function') mod.update();
  renderer.render(scene, camera);
}

function onResize() {
  const rect = stageEl.getBoundingClientRect();
  const w = Math.max(1, Math.round(rect.width || stageEl.clientWidth));
  const h = Math.max(1, Math.round(rect.height || stageEl.clientHeight));
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  chartEl.width = Math.round(w * Math.min(window.devicePixelRatio || 1, 2));
  chartEl.height = Math.round(h * Math.min(window.devicePixelRatio || 1, 2));
  const mod = modules[activeIdx];
  if (mod && mod._built && typeof mod.update === 'function') {
    mod.update();
    renderer.render(scene, camera);
  }
}

/* ============================================================
   BOOT
   ============================================================ */
buildModuleList();
selectModule(0);
window.addEventListener('resize', onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);
onResize();
requestAnimationFrame(() => { onResize(); });

let last = performance.now();
function animate(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const mod = modules[activeIdx];
  if (mod && mod._built && typeof mod.tick === 'function') mod.tick(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
</script>
</body>
