{
  "imports": {

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   GLOBAL HARNESS
   ============================================================ */
const glWrap   = document.getElementById('glWrap');
const chartEl  = document.getElementById('chartEl');
const chartCtx = chartEl.getContext('2d');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(glWrap.clientWidth, glWrap.clientHeight);
renderer.setClearColor(0x0b1016, 1);
glWrap.appendChild(renderer.domElement);

const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, glWrap.clientWidth / glWrap.clientHeight, 0.1, 500);
camera.position.set(6, 5, 9);

const controls3D = new OrbitControls(camera, renderer.domElement);
controls3D.enableDamping = true;
controls3D.dampingFactor = 0.08;
controls3D.target.set(0, 0, 0);

scene.add(new THREE.AmbientLight(0x9fb6cc, 0.75));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
keyLight.position.set(8, 12, 6);
scene.add(keyLight);
const rimLight = new THREE.DirectionalLight(0x7fd1ff, 0.55);
rimLight.position.set(-8, -4, -6);
scene.add(rimLight);

/* Grid floor (visual reference only) */
const grid = new THREE.GridHelper(20, 20, 0x22303f, 0x182430);
grid.position.y = -2.2;
scene.add(grid);

/* The per-module content group. Cleared on every module switch. */
const content = new THREE.Group();
scene.add(content);

/* ---------- helpers exposed to modules ---------- */
function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  for (const v of vectors) {
    if (!v || !v.origin || !v.dir) continue;
    const dir = v.dir.clone();
    const len = (typeof v.len === 'number' && isFinite(v.len) && v.len > 0) ? v.len : dir.length();
    if (dir.lengthSq() < 1e-12) continue;
    dir.normalize();
    const shaftLen = Math.max(len * 0.82, 1e-3);
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, shaftLen, 8), mat);
    shaft.position.copy(v.origin).addScaledVector(dir, shaftLen / 2);
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    group.add(shaft);
    const head = new THREE.Mesh(new THREE.ConeGeometry(0.09, Math.max(len * 0.18, 1e-3), 10), mat);
    head.position.copy(v.origin).addScaledVector(dir, shaftLen + len * 0.09);
    head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    group.add(head);
  }
  group.setVectors = function(nextVecs) {
    while (group.children.length) {
      const c = group.children[0];
      if (c.geometry) c.geometry.dispose();
      group.remove(c);
    }
    for (const v of (nextVecs || [])) {
      if (!v || !v.origin || !v.dir) continue;
      const dir = v.dir.clone();
      const len = (typeof v.len === 'number' && isFinite(v.len) && v.len > 0) ? v.len : dir.length();
      if (dir.lengthSq() < 1e-12) continue;
      dir.normalize();
      const shaftLen = Math.max(len * 0.82, 1e-3);
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.035, shaftLen, 8), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, shaftLen / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.09, Math.max(len * 0.18, 1e-3), 10), mat);
      head.position.copy(v.origin).addScaledVector(dir, shaftLen + len * 0.09);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(head);
    }
  };
  content.add(group);
  return group;
}

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr || '';
  const eqEl = document.getElementById('hudEq');
  eqEl.textContent = '';
  if (latexEqStr) {
    if (window.katex && typeof window.katex.render === 'function') {
      try {
        window.katex.render(latexEqStr, eqEl, { throwOnError: false, displayMode: true });
      } catch (e) {
        eqEl.textContent = latexEqStr;
      }
    } else {
      eqEl.textContent = latexEqStr;
    }
  }
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  if (Array.isArray(rows)) {
    for (const r of rows) {
      if (!r) continue;
      const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k ?? '';
      const v = document.createElement('div'); v.className = 'v'; v.textContent = r.v ?? '';
      rowsEl.appendChild(k); rowsEl.appendChild(v);
    }
  }
}

/* ---------- recursive disposal (guardrail #1) ---------- */
function disposeNode(node) {
  if (!node) return;
  if (node.children && node.children.length) {
    for (const child of node.children.slice()) disposeNode(child);
  }
  if (node.geometry) {
    try { node.geometry.dispose(); } catch (e) { /* ignore */ }
  }
  if (node.material) {
    const mats = Array.isArray(node.material) ? node.material : [node.material];
    for (const m of mats) {
      if (!m) continue;
      for (const key of Object.keys(m)) {
        const val = m[key];
        if (val && typeof val === 'object' && typeof val.dispose === 'function') {
          try { val.dispose(); } catch (e) { /* ignore */ }
        }
      }
      try { m.dispose(); } catch (e) { /* ignore */ }
    }
  }
}

/* ============================================================
   MODULE REGISTRY
   ============================================================ */
const modules = [];

modules.push({
  id: 'm9_1_introduction',
  title: '1. Introduction to Bioelectromagnetics',
  controls: [
    { id: 'sigma', label: 'Tissue conductivity sigma (S/m)', type: 'range', min: 0.01, max: 1.5, step: 0.01, value: 0.5 },
    { id: 'freq', label: 'Frequency f (Hz)', type: 'range', min: 1, max: 1000, step: 1, value: 60 },
    { id: 'current', label: 'Applied current I (mA)', type: 'range', min: 0.1, max: 50, step: 0.1, value: 5 },
    { id: 'tissue', label: 'Tissue type', type: 'select', options: [
      { value: 'nerve', label: 'Nerve' },
      { value: 'muscle', label: 'Muscle' },
      { value: 'blood', label: 'Blood' },
      { value: 'fat', label: 'Fat' }
    ], value: 'nerve' }
  ],

  build() {
    const st = this.state;
    const MU0 = 4 * Math.PI * 1e-7;

    // Tissue slab
    const slab = new THREE.Mesh(
      new THREE.BoxGeometry(6, 0.6, 4),
      new THREE.MeshStandardMaterial({ color: 0x2a4a63, transparent: true, opacity: 0.35, roughness: 0.6, metalness: 0.1 })
    );
    slab.position.set(0, 0, 0);
    content.add(slab);
    this.slab = slab;

    // Electrode pair (thin cylinders) at x = -2.2 and x = +2.2
    const elecMat = new THREE.MeshStandardMaterial({ color: 0xd9b45a, metalness: 0.8, roughness: 0.3 });
    const elecGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.4, 16);
    const e1 = new THREE.Mesh(elecGeo, elecMat);
    e1.position.set(-2.2, 0.35, 0);
    const e2 = new THREE.Mesh(elecGeo, elecMat);
    e2.position.set(2.2, 0.35, 0);
    content.add(e1, e2);
    this.e1 = e1; this.e2 = e2;

    // Current arrow between electrodes
    const curArrow = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 3.4, 12),
      new THREE.MeshStandardMaterial({ color: 0xff8a3d, emissive: 0x552200 })
    );
    curArrow.rotation.z = Math.PI / 2;
    curArrow.position.set(0, 0.55, 0);
    content.add(curArrow);
    this.curArrow = curArrow;

    // Cell sphere at center
    const cell = new THREE.Mesh(
      new THREE.SphereGeometry(0.28, 24, 16),
      new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x1a4a66, transparent: true, opacity: 0.85 })
    );
    cell.position.set(0, 0.05, 0);
    content.add(cell);
    this.cell = cell;

    // Uniform E-field arrow grid across slab (5 x 3, pointing +x)
    const vecs = [];
    for (let i = 0; i < 5; i++) {
      for (let j = 0; j < 3; j++) {
        const x = -2.0 + i * 1.0;
        const z = -1.2 + j * 1.2;
        vecs.push({ origin: new THREE.Vector3(x, 0.32, z), dir: new THREE.Vector3(1, 0, 0), len: 0.55 });
      }
    }
    addArrowField(vecs, 0x7fd1ff);
    this.fieldArrows = vecs;

    // Chart setup
    this.chartCtx = chartEl.getContext('2d');
    this.chartW = chartEl.width;
    this.chartH = chartEl.height;
  },

  update() {
    const st = this.state;
    const MU0 = 4 * Math.PI * 1e-7;

    // Tissue presets
    const presets = { nerve: 0.5, muscle: 0.4, blood: 0.7, fat: 0.03 };
    if (st.tissue && presets[st.tissue] !== undefined) {
      st.sigma = presets[st.tissue];
    }

    const sigma = Math.max(1e-6, st.sigma);
    const f = Math.max(1e-6, st.freq);
    const I = st.current * 1e-3; // A

    const omega = 2 * Math.PI * f;
    const den = (Math.abs(omega * MU0 * sigma) < 1e-12 || !isFinite(omega * MU0 * sigma)) ? 1e-12 : omega * MU0 * sigma;
    const delta = Math.sqrt(2 / den);

    // Current density: assume electrode area A = 0.01 m^2
    const A = 0.01;
    const J = I / A; // A/m^2
    const E = J / sigma; // V/m  (E = rho*J = J/sigma)
    const B1cm = MU0 * I / (2 * Math.PI * 0.01); // T at r = 1 cm

    // Update electrode glow / current arrow scale
    if (this.curArrow) {
      const s = 0.6 + 0.8 * (st.current / 50);
      this.curArrow.scale.set(1, s, 1);
    }
    if (this.cell) {
      this.cell.material.opacity = 0.55 + 0.35 * Math.min(1, sigma / 1.5);
    }

    // HUD
    setHud(
      'Tissue field & skin depth',
      '\\delta = \\sqrt{\\frac{2}{\\omega \\mu_0 \\sigma}}',
      [
        { k: 'sigma', v: sigma.toFixed(3) + ' S/m' },
        { k: 'f', v: f.toFixed(0) + ' Hz' },
        { k: 'delta', v: delta.toFixed(4) + ' m' },
        { k: 'J', v: J.toFixed(2) + ' A/m²' },
        { k: 'E', v: E.toFixed(3) + ' V/m' },
        { k: 'B @1cm', v: (B1cm * 1e6).toFixed(2) + ' µT' }
      ]
    );

    // Draw chart
    this.drawChart(sigma, f, delta);
  },

  drawChart(sigma, f, delta) {
    const ctx = this.chartCtx;
    const W = this.chartW, H = this.chartH;
    const MU0 = 4 * Math.PI * 1e-7;

    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1420';
    ctx.fillRect(0, 0, W, H);

    const padL = 60, padR = 24, padT = 28, padB = 46;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // Log-x axis: f from 1 to 1000 Hz
    const fMin = 1, fMax = 1000;
    const logMin = Math.log10(fMin), logMax = Math.log10(fMax);

    // Compute delta range for y-axis (log scale)
    const dAtMin = Math.sqrt(2 / (2 * Math.PI * fMin * MU0 * sigma));
    const dAtMax = Math.sqrt(2 / (2 * Math.PI * fMax * MU0 * sigma));
    const yMin = Math.min(dAtMax, dAtMin) * 0.8;
    const yMax = Math.max(dAtMax, dAtMin) * 1.2;
    const logYMin = Math.log10(yMin), logYMax = Math.log10(yMax);

    const xOf = (fv) => padL + (Math.log10(fv) - logMin) / (logMax - logMin) * plotW;
    const yOf = (dv) => padT + plotH - (Math.log10(dv) - logYMin) / (logYMax - logYMin) * plotH;

    // Gridlines
    ctx.strokeStyle = '#1e3346';
    ctx.lineWidth = 1;
    for (let e = 0; e <= 3; e++) {
      const fv = Math.pow(10, logMin + e * (logMax - logMin) / 3);
      const x = xOf(fv);
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
      ctx.fillStyle = '#8fb6d6';
      ctx.font = '11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(fv.toFixed(0), x, padT + plotH + 18);
    }
    for (let e = 0; e <= 4; e++) {
      const dv = Math.pow(10, logYMin + e * (logYMax - logYMin) / 4);
      const y = yOf(dv);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
      ctx.fillStyle = '#8fb6d6';
      ctx.textAlign = 'right';
      ctx.fillText(dv.toFixed(3), padL - 8, y + 4);
    }

    // Axes
    ctx.strokeStyle = '#4a7fa5';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();

    // Curve
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    let guard = 0;
    for (let i = 0; i <= 200 && guard++ < 400; i++) {
      const t = i / 200;
      const fv = Math.pow(10, logMin + t * (logMax - logMin));
      const den = (Math.abs(2 * Math.PI * fv * MU0 * sigma) < 1e-12) ? 1e-12 : 2 * Math.PI * fv * MU0 * sigma;
      const dv = Math.sqrt(2 / den);
      const x = xOf(fv), y = yOf(dv);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Current operating point
    const cx = xOf(Math.min(fMax, Math.max(fMin, f)));
    const cy = yOf(Math.min(yMax, Math.max(yMin, delta)));
    ctx.fillStyle = '#ff8a3d';
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ff8a3d';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx, padT + plotH); ctx.stroke();

    // Labels
    ctx.fillStyle = '#cfe6f7';
    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('skin depth δ (m) vs f (Hz)', padL, padT - 8);
    ctx.fillStyle = '#ff8a3d';
    ctx.textAlign = 'center';
    ctx.fillText('δ = ' + delta.toFixed(4) + ' m', cx, cy - 10);
  },

  tick(dt) {
    // Lightweight animation only: gentle pulse of the cell and current arrow
    this._phase = (this._phase || 0) + dt * 1.6;
    if (this.cell) {
      const s = 1 + 0.06 * Math.sin(this._phase);
      this.cell.scale.set(s, s, s);
    }
    if (this.curArrow) {
      this.curArrow.material.emissiveIntensity = 0.6 + 0.4 * Math.sin(this._phase * 1.3);
    }
  },

  lesson: `Bioelectromagnetics studies how electric and magnetic fields interact with living tissue.

Ohm's law in tissue: E = ρ J, where ρ is tissue resistivity (Ω·m) and J is current density (A/m²). Equivalently J = σ E with conductivity σ = 1/ρ. Typical conductivities: blood ≈ 0.7 S/m, nerve ≈ 0.5 S/m, muscle ≈ 0.3–0.5 S/m, fat ≈ 0.03 S/m. Fat is the poorest conductor, which is why it attenuates current flow strongly.

Current density from an applied current: J = I / A. The magnetic flux density around a current-carrying conductor follows B = μ₀ I / (2π r). Faraday's law gives induced EMF: emf = −dΦ/dt = −A dB/dt.

At radio frequencies, fields do not penetrate tissue uniformly. The skin depth δ = √(2 / (ω μ₀ σ)) sets the depth at which the field falls to 1/e. Higher frequency or higher conductivity both reduce δ, so RF energy is absorbed near the surface.

Below roughly 1 kHz, tissue dimensions are much smaller than the electromagnetic wavelength, so the quasi-static approximation holds: fields are essentially instantaneous and the body can be treated as a resistive volume conductor.`,

  quiz: [
    {
      q: 'Which tissue type has the lowest electrical conductivity?',
      options: ['Nerve', 'Muscle', 'Blood', 'Fat'],
      answer: 3
    },
    {
      q: 'As frequency increases, the skin depth δ in tissue:',
      options: ['Increases', 'Decreases', 'Stays constant', 'Becomes zero'],
      answer: 1

  update() {

  tick(dt) {

  lesson: `The heart is modeled as a current dipole embedded in a conducting torso. In a homogeneous conductor of conductivity σ, the potential at a point r from the dipole is V(r) = (p·r̂)/(4πσr²), and the electric field is E = (1/(4πσ))·(3(p·r̂)r̂ − p)/r³. The potential falls off as 1/r², so it is strongest near the heart and weak at the body surface. An ECG lead is characterized by a lead vector L; the measured voltage is the projection V_lead = L·p = |p| cos(θ − θ_lead). Changing the dipole orientation θ therefore modulates each lead's signal sinusoidally, which is why different leads view the same cardiac activity from different angles. Lead I (0°), Lead II (60°), and Lead III (120°) form the standard Einthoven triangle.`,

  lesson: `Defibrillators and pacemakers both deliver electrical pulses to the heart, but at very different scales.

  tick(dt) {
    this.phase += dt;
    this.spark.position.x = -0.62 + Math.sin(this.phase * 6) * 0.06;
    this.spark.material.opacity = 0.35 + 0.25 * (0.5 + 0.5 * Math.sin(this.phase * 8));
    this.heart.rotation.y = Math.sin(this.phase * 0.8) * 0.12;
    this.fieldGroup.position.y = -1.6 + Math.sin(this.phase * 1.2) * 0.05;
  },

  lesson: `This capstone ties together four quantitative threads from the chapter. The axon cable model shows that the length constant lambda = sqrt(R_m/R_a) grows with membrane resistance and shrinks with axial resistance, setting how far a signal spreads before decaying. The heart dipole relation V = p·r_hat/(4*pi*sigma*r^2) shows that the potential falls as 1/r^2 and depends on tissue conductivity. The defibrillator delivers energy W = V*I*t_p, so a higher voltage, current, or pulse duration deposits more energy into the heart. Finally, the EM hazard SAR = sigma*E^2/(2*rho) shows that absorbed power per unit mass scales with the square of the incident field. Together these relations connect cable theory, cardiac electrophysiology, defibrillation therapy, and electromagnetic safety limits in real biomedical devices.`,

  quiz: [
    {
      q: 'According to the cable equation lambda = sqrt(R_m/R_a), what happens to lambda if membrane resistance R_m increases?',
      options: ['lambda decreases', 'lambda increases', 'lambda stays constant', 'lambda becomes imaginary'],
      answer: 1
    },
    {
      q: 'The specific absorption rate SAR = sigma*E^2/(2*rho) is proportional to which quantity?',
      options: ['E', 'E^2', '1/E', '1/E^2'],
      answer: 1
    }
  ]
});
/* === UI CONTROLLER === */
let currentIndex = -1;
let currentModule = null;
let lastTime = performance.now();
let rafId = 0;

function buildControls(mod) {
  const host = document.getElementById('controls');
  host.innerHTML = '';
  if (!mod.state) mod.state = {};
  for (const c of (mod.controls || [])) {
    const wrap = document.createElement('div');
    wrap.className = 'ctl';
    const label = document.createElement('label');
    label.textContent = c.label || c.id;
    wrap.appendChild(label);

    if (c.type === 'range') {
      const valSpan = document.createElement('span');
      valSpan.className = 'val';
      const input = document.createElement('input');
      input.type = 'range';
      input.min = c.min ?? 0;
      input.max = c.max ?? 1;
      input.step = c.step ?? 0.01;
      input.value = c.value ?? c.min ?? 0;
      (mod.state || (mod.state = {}))[c.id] = Number(input.value);
      valSpan.textContent = String((mod.state || (mod.state = {}))[c.id]);
      input.addEventListener('input', () => {
        (mod.state || (mod.state = {}))[c.id] = Number(input.value);
        valSpan.textContent = String((mod.state || (mod.state = {}))[c.id]);
        if (typeof mod.update === 'function') mod.update();
      });
      label.appendChild(valSpan);
      wrap.appendChild(input);
    } else if (c.type === 'select') {
      const sel = document.createElement('select');
      for (const o of (c.options || [])) {
        const opt = document.createElement('option');
        opt.value = o.value;
        opt.textContent = o.label ?? o.value;
        sel.appendChild(opt);
      }
      sel.value = c.value ?? (c.options && c.options[0] ? c.options[0].value : '');
      (mod.state || (mod.state = {}))[c.id] = sel.value;
      sel.addEventListener('change', () => {
        (mod.state || (mod.state = {}))[c.id] = sel.value;
        if (typeof mod.update === 'function') mod.update();
      });
      wrap.appendChild(sel);
    } else if (c.type === 'check') {
      const row = document.createElement('div');
      row.className = 'chk';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!c.value;
      (mod.state || (mod.state = {}))[c.id] = !!c.value;
      box.addEventListener('change', () => {
        (mod.state || (mod.state = {}))[c.id] = box.checked;
        if (typeof mod.update === 'function') mod.update();
      });
      row.appendChild(box);
      const txt = document.createElement('span');
      txt.textContent = c.label || c.id;
      row.appendChild(txt);
      wrap.appendChild(row);
    }
    host.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  const host = document.getElementById('quiz');
  host.innerHTML = '';
  const scoreEl = document.getElementById('quizScore');
  let answered = 0, correct = 0;
  const items = mod.quiz || [];
  items.forEach((item, qi) => {
    const box = document.createElement('div');
    box.className = 'q';
    const qt = document.createElement('div');
    qt.className = 'qt';
    qt.textContent = `${qi + 1}. ${item.q}`;
    box.appendChild(qt);
    const opts = item.options || [];
    opts.forEach((optText, oi) => {
      const btn = document.createElement('button');
      btn.className = 'opt';
      btn.textContent = optText;
      btn.addEventListener('click', () => {
        if (box.dataset.done === '1') return;
        box.dataset.done = '1';
        answered++;
        if (oi === item.answer) {
          btn.classList.add('right');
          correct++;
        } else {
          btn.classList.add('wrong');
          const rightBtn = box.querySelectorAll('.opt')[item.answer];
          if (rightBtn) rightBtn.classList.add('right');
        }
        scoreEl.textContent = `Score: ${correct} / ${answered} answered (${items.length} total)`;
      });
      box.appendChild(btn);
    });
    host.appendChild(box);
  });
  scoreEl.textContent = `Score: 0 / 0 answered (${items.length} total)`;
}

function loadModule(idx) {
  if (idx < 0 || idx >= modules.length) return;
  currentIndex = idx;
  currentModule = modules[idx];

  /* --- guardrail #1: free all WebGL resources before rebuilding --- */
  disposeNode(content);
  while (content.children.length) content.remove(content.children[0]);
  renderer.renderLists.dispose();

  /* reset camera to a sane default per module */
  camera.position.set(6, 5, 9);
  controls3D.target.set(0, 0, 0);
  controls3D.update();

  document.getElementById('modTitle').textContent = currentModule.title || `Module ${idx + 1}`;
  document.getElementById('modId').textContent = currentModule.id || '';
  document.getElementById('lesson').innerHTML = currentModule.lesson || '';
  document.getElementById('err').style.display = 'none';

  currentModule.state = currentModule.state || {};
  buildControls(currentModule);
  buildQuiz(currentModule);

  try {
    if (typeof currentModule.build === 'function') currentModule.build();
    buildControls(currentModule);
    if (typeof currentModule.update === 'function') currentModule.update();
  } catch (e) {
    const errEl = document.getElementById('err');
    errEl.textContent = 'Module error: ' + (e && e.message ? e.message : String(e));
    errEl.style.display = 'block';
    console.error(e);
  }

  /* highlight sidebar */
  document.querySelectorAll('.modBtn').forEach((b, i) => {
    b.classList.toggle('active', i === idx);
  });
}

function buildSidebar() {
  const nav = document.getElementById('moduleList');
  nav.innerHTML = '';
  modules.forEach((m, i) => {
    const btn = document.createElement('button');
    btn.className = 'modBtn';
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i + 1);
    btn.appendChild(num);
    btn.appendChild(document.createTextNode(m.title || m.id));
    btn.addEventListener('click', () => loadModule(i));
    nav.appendChild(btn);
  });
}

/* ============================================================
   RENDER LOOP
   ============================================================ */
function resize() {
  const w = glWrap.clientWidth, h = glWrap.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const cw = chartEl.clientWidth, ch = chartEl.clientHeight;
  if (cw > 0 && ch > 0) {
    chartEl.width = Math.floor(cw * Math.min(window.devicePixelRatio, 2));
    chartEl.height = Math.floor(ch * Math.min(window.devicePixelRatio, 2));
  }
}
window.addEventListener('resize', resize);

function tick(dt) {
  controls3D.update();
  if (currentModule && typeof currentModule.tick === 'function') {
    try {
      /* guardrail #2: tick() must only touch lightweight transform/phase state,
         never call the full update() (which redraws meshes + chart + HUD). */
      currentModule.tick(dt);
    } catch (e) {
      console.error('tick error', e);
    }
  }
  renderer.render(scene, camera);
}

function animate(now) {
  rafId = requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  tick(dt);
}

/* ============================================================
   BOOT
   ============================================================ */
function boot() {
  resize();
  buildSidebar();
  if (modules.length > 0) loadModule(0);
  lastTime = performance.now();
  rafId = requestAnimationFrame(animate);
}

/* KaTeX is loaded lazily so the page works even offline */
(function loadKatex() {
  if (window.katex) { boot(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
  s.onload = boot;
  s.onerror = boot;
  document.head.appendChild(s);
})();
</script>
