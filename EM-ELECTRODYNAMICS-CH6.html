    <script type="importmap">
      {
        "imports": {

          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"

    <style>
      :root {
        --bg: #0b0f19;
        --panel: rgba(15, 23, 42, 0.86);
        --border: rgba(56, 189, 248, 0.22);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #68d391;
        --bad: #fc8181;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13px;
      }
      #shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      #topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        background: rgba(2, 6, 23, 0.6);

      #topbar h1 {

      #main {

      #stage {

      #stage canvas.webgl {
        position: absolute;

      #chart-canvas {
        position: absolute;
        top: 12px;

        border-radius: 12px;

      }
      #controls {

      .ctl {

        gap: 4px;
      }
      .ctl:last-child {

      }
      .ctl label {
        color: var(--muted);

      }
      .ctl .val {
        color: var(--accent);

      .ctl input[type="range"] {
        width: 100%;

        border-radius: 2px;

      }
      .ctl input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);

      .ctl input[type="checkbox"] {

      #hud {

      #bottom {

      #lesson,

      @media (max-width: 900px) {

  <body>
    <div id="shell">
      <header id="topbar">
        <h1>EM-ELECTRODYNAMICS-CH6</h1>
        <span class="sub"
          >John D. Kraus &amp; Daniel A. Fleisch · Electromagnetics with
          Applications · Ch. 6 Electrodynamics</span
        >
        <span class="badge" id="status-badge">0 / 0</span>
      </header>
      <div id="body">
        <aside id="sidebar">
          <h2>Chapter 6 Modules</h2>
          <div id="module-list"></div>
        </aside>
        <section id="main">
          <div id="stage">
            <canvas id="chart-canvas"></canvas>
            <div id="controls"></div>
            <div id="hud">
              <div id="hud-title">—</div>
              <div id="hud-eq"></div>
              <div id="hud-values"></div>
            </div>
          </div>
          <div id="bottom">
            <div id="lesson"></div>
            <div id="quiz"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const stageEl = document.getElementById("stage");
      const chartEl = document.getElementById("chart-canvas");
      const controlsEl = document.getElementById("controls");
      const hudTitle = document.getElementById("hud-title");
      const hudEq = document.getElementById("hud-eq");
      const hudValues = document.getElementById("hud-values");
      const lessonEl = document.getElementById("lesson");
      const quizEl = document.getElementById("quiz");
      const moduleList = document.getElementById("module-list");
      const badgeEl = document.getElementById("status-badge");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      const initW = Math.max(1, stageEl.clientWidth || window.innerWidth - 268);
      const initH = Math.max(
        1,
        stageEl.clientHeight || Math.round(window.innerHeight * 0.6),
      );
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(initW, initH);
      renderer.setClearColor(0x0a0e13, 1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.35;
      renderer.domElement.classList.add("webgl");
      renderer.domElement.style.outline = "none";
      stageEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
      scene.environmentIntensity = 0.75;
      const camera = new THREE.PerspectiveCamera(50, initW / initH, 0.1, 200);
      camera.position.set(4.8, 3.6, 5.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enableZoom = true;
      controls.enableRotate = true;
      controls.enablePan = true;
      controls.minDistance = 1.5;
      controls.maxDistance = 40;

      scene.add(new THREE.HemisphereLight(0xdbeafe, 0x1e293b, 1.1));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.4);
      dirLight.position.set(5, 8, 6);
      scene.add(dirLight);
      const rimLight = new THREE.DirectionalLight(0x7fd1ff, 0.7);
      rimLight.position.set(-6, -3, -5);
      scene.add(rimLight);

      const content = new THREE.Group();
      scene.add(content);
      const sharedArrowGeoms = new Set();

      function disposeObj(o) {
        o.traverse((n) => {
          const isShared =
            sharedArrowGeoms.has(n.geometry) ||
            n.isArrowHelper ||
            (n.parent && n.parent.isArrowHelper);
          if (!isShared && n.geometry) n.geometry.dispose();
          if (n.material) {
            if (Array.isArray(n.material))
              n.material.forEach((m) => m.dispose());
            else n.material.dispose();
          }
        });
      }

      function clearContent() {
        while (content.children.length) disposeObj(content.children.pop());
        sharedArrowGeoms.clear();
      }

      function addAxes(group, len = 3.2) {
        const mk = (color, a, b) =>
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([a, b]),
            new THREE.LineBasicMaterial({
              color,
              transparent: true,
              opacity: 0.75,
            }),
          );
        group.add(
          mk(
            0xef4444,
            new THREE.Vector3(-len, 0, 0),
            new THREE.Vector3(len, 0, 0),
          ),
        );
        group.add(
          mk(
            0x22c55e,
            new THREE.Vector3(0, -len, 0),
            new THREE.Vector3(0, len, 0),
          ),
        );
        group.add(
          mk(
            0x3b82f6,
            new THREE.Vector3(0, 0, -len),
            new THREE.Vector3(0, 0, len),
          ),
        );
      }

      function addGrid(group, size = 8, y = -2.2) {
        const g = new THREE.GridHelper(size, 16, 0x1e2a36, 0x1e2a36);
        g.position.y = y;
        group.add(g);
      }

      function addArrowField(vectors, color = 0x7fd1ff) {
        const g = new THREE.Group();
        const pool = [];

        const normalizeEntry = (v) => {
          if (!v) return null;
          if (v.isVector3) {
            return {
              origin: new THREE.Vector3(0, 0, 0),
              dir: v,
              len: v.length(),
              color,
            };
          }
          if (v.dir && v.origin) {
            const mag = v.dir.length();
            return {
              origin: v.origin,
              dir: v.dir,
              len: v.len !== undefined ? v.len : Math.min(mag, 2.0),
              color: v.color ?? color,
            };
          }
          return null;
        };

        g.setVectors = (newVectors) => {
          const list = newVectors || [];
          for (let i = 0; i < list.length; i++) {
            const item = normalizeEntry(list[i]);
            let arrow = pool[i];
            if (!arrow) {
              arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, 0, 0),
                0.5,
                color,
                0.12,
                0.07,
              );
              if (arrow.line && arrow.line.geometry)
                sharedArrowGeoms.add(arrow.line.geometry);
              if (arrow.cone && arrow.cone.geometry)
                sharedArrowGeoms.add(arrow.cone.geometry);
              pool.push(arrow);
              g.add(arrow);
            }
            if (!item || item.len < 1e-4 || item.dir.lengthSq() < 1e-12) {
              arrow.visible = false;
              continue;
            }
            arrow.visible = true;
            arrow.position.copy(item.origin);
            arrow.setDirection(item.dir.clone().normalize());
            arrow.setLength(
              item.len,
              Math.min(0.25, item.len * 0.35),
              Math.min(0.15, item.len * 0.22),
            );
            arrow.setColor(item.color);
          }
          for (let i = list.length; i < pool.length; i++) {
            pool[i].visible = false;
          }
        };

        g.setVectors(vectors);
        content.add(g);
        return g;
      }

      function renderMath(el, tex, display = true) {
        if (window.katex) {
          try {
            katex.render(tex, el, {
              throwOnError: false,
              displayMode: display,
            });
            return;
          } catch (e) {}
        }
        el.textContent = tex;
      }

      function renderAllMath(root) {
        root.querySelectorAll("[data-tex]").forEach((el) => {
          renderMath(
            el,
            el.getAttribute("data-tex"),
            el.classList.contains("eq") || el.classList.contains("eqblock"),
          );
        });
      }

      function setHud(title, eqTex, rows) {
        hudTitle.textContent = title;
        renderMath(hudEq, eqTex, true);
        hudValues.innerHTML = (rows || [])
          .map(
            (r) => `<span class="k">${r.k}</span><span class="v">${r.v}</span>`,
          )
          .join("");
      }

      function fmt(v, d = 3) {
        return isFinite(v) ? (v >= 0 ? "+" : "") + v.toFixed(d) : "—";
      }

      const modules = [];

      modules.push({
  id: 'intro_electrodynamics',
  title: '6-1 Introduction to Electrodynamics & Lorentz Force',

  controls: [
    { id: 'particle', label: 'Particle', type: 'select', options: ['Electron (-e)', 'Proton (+e)'], value: 'Electron (-e)' },
    { id: 'E_kVm', label: 'E_y (kV/m)', type: 'range', min: 0, max: 50, step: 1, value: 20 },
    { id: 'B_mT', label: 'B_z (mT)', type: 'range', min: 0, max: 50, step: 1, value: 10 },
    { id: 'v_kms', label: 'Initial v_x (km/s)', type: 'range', min: 200, max: 5000, step: 100, value: 2000 },
    { id: 'animate', label: 'Animate trajectory', type: 'check', value: true }
  ],

  build() {
    const g = new THREE.Group();
    content.add(g);

    // ---- capacitor plates (E field along +y) ----
    const plateMat = new THREE.MeshStandardMaterial({ color: 0x2b3a55, metalness: 0.8, roughness: 0.3, emissive: 0x0a1420 });
    const plateGeo = new THREE.BoxGeometry(0.30, 0.012, 0.20);
    const topPlate = new THREE.Mesh(plateGeo, plateMat);
    topPlate.position.set(0.10, 0.10, 0);
    const botPlate = new THREE.Mesh(plateGeo, plateMat);
    botPlate.position.set(0.10, -0.10, 0);
    g.add(topPlate, botPlate);

    // ---- Helmholtz-style pole rings (B field along +z) ----
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x3d4f6b, metalness: 0.9, roughness: 0.25, emissive: 0x101a2a });
    const ringGeo = new THREE.TorusGeometry(0.13, 0.014, 12, 40);
    for (const z of [-0.16, 0.16]) {
      const r = new THREE.Mesh(ringGeo, ringMat);
      r.position.set(0.10, 0, z);
      g.add(r);
    }

    // ---- particle ----
    const pMat = new THREE.MeshStandardMaterial({ color: 0xfff2b0, emissive: 0xffcc44, emissiveIntensity: 1.6, roughness: 0.3 });
    const particle = new THREE.Mesh(new THREE.SphereGeometry(0.016, 20, 16), pMat);
    g.add(particle);

    // ---- trajectory tube ----
    const trailMat = new THREE.MeshStandardMaterial({ color: 0x66ffcc, emissive: 0x33ffaa, emissiveIntensity: 1.2, transparent: true, opacity: 0.85 });
    const trail = new THREE.Mesh(new THREE.BufferGeometry(), trailMat);
    g.add(trail);

    // ---- force arrows ----
    const feArrow = addArrowField([{ origin: new THREE.Vector3(), dir: new THREE.Vector3(0, 1, 0), len: 0.05 }], 0xffb347);
    const fmArrow = addArrowField([{ origin: new THREE.Vector3(), dir: new THREE.Vector3(0, 0, 1), len: 0.05 }], 0x7fd1ff);
    const ftArrow = addArrowField([{ origin: new THREE.Vector3(), dir: new THREE.Vector3(0, 1, 0), len: 0.05 }], 0x4dff9e);

    // ---- E field arrows (vertical) ----
    const eArrows = addArrowField([], 0xffb347);
    const eVecs = [];
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) {
      eVecs.push({ origin: new THREE.Vector3(-0.02 + i * 0.06, -0.085, -0.06 + j * 0.06), dir: new THREE.Vector3(0, 1, 0), len: 0.05 });
    }
    eArrows.setVectors(eVecs);

    // ---- B field arrows (z-directed) ----
    const bArrows = addArrowField([], 0x7fd1ff);
    const bVecs = [];
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) {
      bVecs.push({ origin: new THREE.Vector3(-0.02 + i * 0.06, -0.06 + j * 0.06, -0.10), dir: new THREE.Vector3(0, 0, 1), len: 0.05 });
    }
    bArrows.setVectors(bVecs);

    this.meshRefs = { g, particle, trail, feArrow, fmArrow, ftArrow, eArrows, bArrows };
  },

  update() {
    const st = this.state;
    const e = 1.60217663e-19;
    const m = st.particle === 'Electron (-e)' ? 9.1093837e-31 : 1.67262192e-27;
    const q = st.particle === 'Electron (-e)' ? -e : e;

    const E = st.E_kVm * 1e3;          // V/m
    const B = st.B_mT * 1e-3;          // T
    const v0 = st.v_kms * 1e3;         // m/s
    const L = 0.20;                    // interaction length (m)

    const Fe = q * E;                  // N (y)
    const Fm = q * v0 * B;             // N (y, since v x B = v_x B_z * (-y) for +x,+z)
    const Fnet = Fe + Fm;

    const vSel = B > 0 ? E / B : Infinity;

    // ---- numerical integration of trajectory ----
    const N = 160;
    const dt = (L / v0) / N;
    let x = 0, y = 0, vx = v0, vy = 0;
    const pts = [new THREE.Vector3(0, 0, 0)];
    for (let i = 0; i < N; i++) {
      const ax = (q / m) * (vy * B);       // v x B x-component = vy*B
      const ay = (q / m) * (E - vx * B);   // E_y - vx*B_z

    refs.feArrow.setVectors([{ origin: last.clone(), dir: new THREE.Vector3(0, Math.sign(Fe) || 1, 0), len: feLen }]);

  lesson: `<p>In a uniform electric field the force on a charge is <b>F = qE</b>, so the acceleration is <b>a = qE/m</b>. Between parallel plates separated by distance d with accelerating voltage V_a, the field magnitude is E = V_a/d. A charge released from rest gains kinetic energy equal to the work done by the field: <b>(1/2)mv² = |q|V_a</b>. The unit of energy convenient here is the electron-volt (eV): one electron accelerated through 1 V gains 1 eV = 1.602×10⁻¹⁹ J.</p>

    for (let i = 0; i < 3; i++) {
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.035, 12, 32), anodeMat);
      ring.rotation.y = Math.PI / 2;
      ring.position.set(-2.2 + i * 0.22, 0, 0);
      g.add(ring);
    }
    // Deflection plates (two pairs: horizontal & vertical)
    const plateMat = new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x224466, emissiveIntensity: 0.6, metalness: 0.7, roughness: 0.25 });
    const plateGeo = new THREE.BoxGeometry(1.0, 0.04, 0.5);
    const plates = [];
    for (let s = -1; s <= 1; s += 2) {
      const p = new THREE.Mesh(plateGeo, plateMat.clone());
      p.position.set(0, s * 0.35, 0);
      g.add(p); plates.push(p);
    }
    // Vertical deflection plates (for completeness, smaller)
    const vPlateGeo = new THREE.BoxGeometry(1.0, 0.5, 0.04);
    for (let s = -1; s <= 1; s += 2) {
      const p = new THREE.Mesh(vPlateGeo, plateMat.clone());
      p.position.set(0, 0, s * 0.35);
      g.add(p); plates.push(p);
    }
    // Beam line (curved inside plates, straight after)
    const beamMat = new THREE.LineBasicMaterial({ color: 0x66ffcc, transparent: true, opacity: 0.9 });
    const beamGeo = new THREE.BufferGeometry();
    const beamPts = new Float32Array(64 * 3);
    beamGeo.setAttribute('position', new THREE.BufferAttribute(beamPts, 3));
    const beam = new THREE.Line(beamGeo, beamMat);
    g.add(beam);
    // Phosphor spot
    const spot = new THREE.Mesh(
      new THREE.SphereGeometry(0.07, 16, 16),
      new THREE.MeshStandardMaterial({ color: 0x66ffcc, emissive: 0x66ffcc, emissiveIntensity: 2.0 })
    );
    spot.position.set(3.1, 0, 0);
    g.add(spot);
    // Dashed projection line to plate center
    const dashMat = new THREE.LineDashedMaterial({ color: 0x88aacc, dashSize: 0.08, gapSize: 0.06, transparent: true, opacity: 0.7 });
    const dashGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(3.1, 0, 0)]);
    const dash = new THREE.Line(dashGeo, dashMat);
    dash.computeLineDistances();
    g.add(dash);
    content.add(g);
    this.meshRefs = { g, glass, screen, cathode, plates, beam, beamGeo, spot, dash, dashGeo };
  },
  update() {
    const st = this.state;
    const Va = st.Va_V, Vd = st.Vd_V;
    const l = st.plate_l_cm / 100, d = st.plate_d_cm / 100, L = st.screen_L_cm / 100;
    const e = 1.602e-19, m = 9.109e-31;
    const vx = Math.sqrt(2 * e * Va / m); // m/s
    const a = e * Vd / (m * d);
    const t1 = l / vx;
    const vy = a * t1;
    const tanA = vy / vx;
    const alpha = Math.atan(tanA);
    const De = (L * l * Vd) / (2 * d * Va); // meters
    const Se = De / Vd; // m/V
    const refs = this.meshRefs;

    // Scale scene: 1 unit = 1 cm roughly; CRT length ~6.2 units
    const scale = 100; // cm -> scene units? Actually scene uses ~cm units
    // Map physical positions: cathode at -2.9, plates centered at 0, screen at 3.1
    // Beam path: from cathode (-2.9) to plate entry (-0.5), curve inside (-0.5..0.5), then straight to screen (3.1)
    const yEntry = 0;
    const yExit = vy * t1 * scale * 0.5; // visual scaling
    const yScreen = De * scale * 0.5;
    const pts = refs.beamGeo.attributes.position.array;
    const N = 64;
    for (let i = 0; i < N; i++) {
      const u = i / (N - 1);
      let x, y;
      if (u < 0.25) {
        // cathode to plate entry
        const t = u / 0.25;
        x = -2.9 + t * 2.4;
        y = 0;
      } else if (u < 0.55) {
        // inside plates: parabolic
        const t = (u - 0.25) / 0.3;
        x = -0.5 + t * 1.0;
        y = 0.5 * a * (t * t1) * (t * t1) * scale * 0.5;
      } else {
        // straight to screen
        const t = (u - 0.55) / 0.45;
        x = 0.5 + t * 2.6;
        y = yExit + (yScreen - yExit) * t;
      }
      pts[i * 3] = x;
      pts[i * 3 + 1] = y;
      pts[i * 3 + 2] = 0;
    }
    refs.beamGeo.attributes.position.needsUpdate = true;
    refs.beamGeo.computeBoundingSphere();

    // Spot position
    refs.spot.position.set(3.1, yScreen, 0);

    // Plate colors based on voltage
    const intensity = Math.min(1, Math.abs(Vd) / 150);
    refs.plates.forEach((p, idx) => {
      if (idx < 2) {
        p.material.color.setHex(Vd >= 0 ? 0x7fd1ff : 0xff7f7f);
        p.material.emissive.setHex(Vd >= 0 ? 0x224466 : 0x662222);
        p.material.emissiveIntensity = 0.4 + intensity * 1.2;
      }
    });

    // Dashed line from plate center to screen spot
    const dashPts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(3.1, yScreen, 0)];
    refs.dashGeo.setFromPoints(dashPts);
    refs.dash.computeLineDistances();

    // Chart
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0a0f18';
    ctx.fillRect(0, 0, W, H);
    // Axes
    const pad = 40;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    ctx.strokeStyle = '#334455';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y0);
    ctx.moveTo(x0, y0); ctx.lineTo(x0, y1);
    ctx.stroke();
    // Grid
    ctx.strokeStyle = '#1a2535';
    for (let i = 0; i <= 6; i++) {
      const x = x0 + (x1 - x0) * i / 6;
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    }
    for (let i = 0; i <= 5; i++) {
      const y = y0 - (y0 - y1) * i / 5;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    // Deflection curves
    const VdMin = -150, VdMax = 150;
    const DeMax = Math.abs((L * l * VdMax) / (2 * d * Va)) * 1000; // mm
    const DeRefMax = Math.abs((L * l * VdMax) / (2 * d * 1000)) * 1000;
    const yMax = Math.max(DeMax, DeRefMax, 1);
    const mapX = v => x0 + (v - VdMin) / (VdMax - VdMin) * (x1 - x0);
    const mapY = v => y0 - (v / yMax) * (y0 - y1);
    // Reference curve Va=1000
    ctx.strokeStyle = '#ffaa44';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const v = VdMin + (VdMax - VdMin) * i / 100;
      const De = (L * l * v) / (2 * d * 1000) * 1000;
      const px = mapX(v), py = mapY(De);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // Current curve
    ctx.strokeStyle = '#66ffcc';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const v = VdMin + (VdMax - VdMin) * i / 100;
      const De = (L * l * v) / (2 * d * Va) * 1000;
      const px = mapX(v), py = mapY(De);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();
    // Highlight current point
    const DeNow = (L * l * Vd) / (2 * d * Va) * 1000;
    ctx.fillStyle = '#66ffcc';
    ctx.beginPath();
    ctx.arc(mapX(Vd), mapY(DeNow), 4, 0, Math.PI * 2);
    ctx.fill();
    // Labels
    ctx.fillStyle = '#aabbcc';
    ctx.font = '12px sans-serif';
    ctx.fillText('V_d (V)', x1 - 60, y0 + 20);
    ctx.fillText('D_e (mm)', x0 - 30, y1 + 10);
    ctx.fillStyle = '#ffaa44';
    ctx.fillText('V_a = 1000 V', x1 - 110, y1 + 20);
    ctx.fillStyle = '#66ffcc';
    ctx.fillText('V_a = ' + Va + ' V', x1 - 110, y1 + 38);

    setHud('CRT Electrostatic Deflection',
      'D_e = \\frac{L\\,l\\,V_d}{2\\,d\\,V_a},\\quad S_e = \\frac{D_e}{V_d} = \\frac{L\\,l}{2\\,d\\,V_a}',
      [
        { k: 'Beam speed v_x', v: (vx / 1e6).toFixed(2) + ' Mm/s' },
        { k: 'Exit angle alpha', v: (alpha * 180 / Math.PI).toFixed(2) + ' deg' },
        { k: 'Screen deflection D_e', v: (De * 1000).toFixed(2) + ' mm' },
        { k: 'Sensitivity S_e', v: (Se * 1000).toFixed(3) + ' mm/V' }
      ]);
  },
  tick(dt) {},
  lesson: `<p>The electron beam is accelerated by the anode potential \(V_a\), giving axial speed \(v_x=\sqrt{2eV_a/m_e}\). Inside the deflection plates of length \(l\) and separation \(d\), the transverse field \(V_d/d\) produces acceleration \(a_y=eV_d/(m_ed)\). The transit time is \(t_1=l/v_x\), so the exit slope is \(\tan\alpha=v_y/v_x=(V_d l)/(2dV_a)\).</p>
<p>After leaving the plates the beam travels straight. Extrapolating this straight line backward, it intersects the axis at the geometric center of the deflection plates (a distance \(l/2\) before the exit). Hence the screen deflection measured from the plate center is \(D_e=(LlV_d)/(2dV_a)\). The sensitivity \(S_e=D_e/V_d=(Ll)/(2dV_a)\) is independent of \(e/m_e\) because the same charge-to-mass ratio appears in both the accelerating and deflecting stages and cancels.</p>
<p>Increasing \(V_a\) speeds the electrons, reducing the time spent in the deflecting field and thus lowering sensitivity; it also raises beam energy and brightness. The deflection is linear in \(V_d\), which is why electrostatic deflection is used for fast, linear sweeps in oscilloscopes.</p>`,
  quiz: [
    { q: 'Why does the deflected beam appear to originate from the center of the deflection plates?', options: ['Because the beam is straight after the plates and its backward extrapolation meets the axis at the plate midpoint', 'Because the electric field is zero at the plate center', 'Because the electrons are accelerated only at the anode', 'Because the screen is placed at the plate center'], answer: 0 },
    { q: 'The deflection sensitivity S_e = D_e/V_d is independent of e/m_e because:', options: ['e/m_e cancels between the acceleration and deflection stages', 'e/m_e is zero for electrons', 'the plates are equipotential', 'the screen distance L is fixed'], answer: 0 },
    { q: 'Increasing the anode voltage V_a while keeping V_d fixed will:', options: ['Decrease the screen deflection and increase beam speed', 'Increase the screen deflection and decrease beam speed', 'Leave the deflection unchanged', 'Increase both deflection and beam speed'], answer: 0 }
  ]
});
modules.push({
  id: 'charged_particles_bfield',
  title: '6-4 Charged Particles Moving in a Static Magnetic Field (Radius & Gyrofrequency)',
  controls: [
    { id: 'particle', label: 'Particle', type: 'select', options: ['Electron (-e)', 'Proton (+e)', 'Deuteron (+e, 2u)'], value: 'Electron (-e)' },
    { id: 'B_mT', label: 'B_z (mT)', type: 'range', min: 1, max: 100, step: 1, value: 20 },
    { id: 'v_kms', label: 'Speed v (km/s)', type: 'range', min: 500, max: 10000, step: 250, value: 4000 },
    { id: 'pitch_deg', label: 'Pitch angle alpha (deg)', type: 'range', min: 15, max: 90, step: 5, value: 70 },
    { id: 'animate', label: 'Animate gyration', type: 'check', value: true }
  ],

  build() {
    const g = new THREE.Group();
    content.add(g);

    // Guiding-center axis (vertical B direction)
    const axisMat = new THREE.MeshStandardMaterial({ color: 0x2b6f9e, emissive: 0x123a55, metalness: 0.3, roughness: 0.6 });
    const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 4.2, 12), axisMat);
    axis.position.y = 0;
    g.add(axis);

    // B field arrows in a cylindrical volume
    const bArrows = addArrowField([], 0x7fd1ff);
    const bVecs = [];
    for (let i = 0; i < 5; i++) {
      for (let j = 0; j < 5; j++) {
        const ang = (i / 5) * Math.PI * 2;
        const r = 0.35 + (j / 4) * 0.9;
        bVecs.push({
          origin: new THREE.Vector3(r * Math.cos(ang), -1.8 + j * 0.9, r * Math.sin(ang)),
          dir: new THREE.Vector3(0, 1, 0),
          len: 0.55
        });
      }
    }
    bArrows.setVectors(bVecs);
    g.add(bArrows);

    // Helical trajectory tube (rebuilt in update)
    const helixMat = new THREE.MeshStandardMaterial({ color: 0x9fe8ff, emissive: 0x3aa6d8, metalness: 0.4, roughness: 0.35 });
    const helix = new THREE.Mesh(new THREE.BufferGeometry(), helixMat);
    g.add(helix);

    // Glowing particle
    const particleMat = new THREE.MeshStandardMaterial({ color: 0xffd36b, emissive: 0xff9a2e, metalness: 0.2, roughness: 0.3 });
    const particle = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 16), particleMat);
    g.add(particle);

    // Centripetal force arrow (rebuilt each frame)
    const forceArrow = addArrowField([], 0xff5a5a);
    g.add(forceArrow);

    // Guiding center marker
    const centerMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x88ccff, metalness: 0.2, roughness: 0.4 });
    const center = new THREE.Mesh(new THREE.SphereGeometry(0.035, 12, 10), centerMat);
    g.add(center);

    this.meshRefs = { g, axis, helix, particle, forceArrow, center, bArrows };
    this.phase = 0;
  },

  update() {
    const st = this.state;
    const B = st.B_mT * 1e-3; // Tesla
    const v = st.v_kms * 1e3; // m/s
    const alpha = st.pitch_deg * Math.PI / 180;

    // Particle properties
    let m, q, label;
    if (st.particle === 'Electron (-e)') { m = 9.109e-31; q = -1.602e-19; label = 'e-'; }
    else if (st.particle === 'Proton (+e)') { m = 1.673e-27; q = 1.602e-19; label = 'p+'; }
    else { m = 3.346e-27; q = 1.602e-19; label = 'd+'; }

    const vPerp = v * Math.sin(alpha);
    const vPar = v * Math.cos(alpha);
    const R = (m * vPerp) / (Math.abs(q) * B); // meters
    const omega = (Math.abs(q) * B) / m;       // rad/s
    const fc = omega / (2 * Math.PI);          // Hz
    const Tc = 1 / fc;                         // s
    const pitch = vPar * Tc;                   // m

    // Scale for display: map R to scene units (R in mm)
    const Rmm = R * 1e3;
    const sceneR = Math.min(1.25, Math.max(0.12, Rmm / 60));
    const scenePitch = Math.min(2.2, Math.max(0.15, pitch * 1e3 / 60));

    const refs = this.meshRefs;

    // Build helix geometry
    const turns = 3;
    const pts = [];
    const N = 160;
    for (let i = 0; i <= N; i++) {
      const t = i / N;
      const ang = t * turns * Math.PI * 2;
      pts.push(new THREE.Vector3(
        sceneR * Math.cos(ang),
        -scenePitch * 0.5 + t * scenePitch,
        sceneR * Math.sin(ang)
      ));
    }
    const curve = new THREE.CatmullRomCurve3(pts);
    refs.helix.geometry.dispose();
    refs.helix.geometry = new THREE.TubeGeometry(curve, 180, 0.018, 8, false);

    // Particle position along helix
    const phase = this.phase;
    const t = (phase % 1);
    const ang = t * turns * Math.PI * 2;
    const px = sceneR * Math.cos(ang);
    const py = -scenePitch * 0.5 + t * scenePitch;
    const pz = sceneR * Math.sin(ang);
    refs.particle.position.set(px, py, pz);

    // Guiding center at same y
    refs.center.position.set(0, py, 0);

    // Force arrow: points inward toward axis (centripetal)
    const dir = new THREE.Vector3(-px, 0, -pz).normalize();
    refs.forceArrow.setVectors([{
      origin: new THREE.Vector3(px, py, pz),
      dir: dir,
      len: Math.min(0.55, sceneR * 0.9)
    }]);

    // HUD
    setHud(
      'Cyclotron Gyration Radius & Gyrofrequency',
      'R = \\frac{m v_\\perp}{|q|B},\\quad f_c = \\frac{\\omega_c}{2\\pi} = \\frac{|q|B}{2\\pi m}',
      [
        { k: 'Particle', v: label },
        { k: 'Gyroradius R', v: Rmm.toFixed(2) + ' mm' },
        { k: 'Gyrofrequency f_c', v: (fc / 1e6).toFixed(3) + ' MHz' },
        { k: 'Period T_c', v: (Tc * 1e9).toFixed(2) + ' ns' },
        { k: 'Helical pitch p', v: (pitch * 1e3).toFixed(2) + ' mm' }
      ]
    );

    // 2D chart
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);

    const padL = 58, padR = 58, padT = 34, padB = 46;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // Background
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    // Grid
    ctx.strokeStyle = 'rgba(120,170,220,0.18)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const x = padL + (i / 5) * plotW;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
      const y = padT + (i / 5) * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    }

    // Axes
    ctx.strokeStyle = '#9fb8d6';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, padT + plotH); ctx.lineTo(padL + plotW, padT + plotH); ctx.stroke();

    // Compute traces
    const Bmin = 1, Bmax = 100;
    const Rvals = [], Fvals = [];
    let Rmax = 0, Fmax = 0;
    for (let i = 0; i <= 100; i++) {
      const bmT = Bmin + (i / 100) * (Bmax - Bmin);
      const b = bmT * 1e-3;
      const r = (m * vPerp) / (Math.abs(q) * b);
      const f = (Math.abs(q) * b) / (2 * Math.PI * m);
      Rvals.push(r * 1e3); // mm
      Fvals.push(f / 1e6); // MHz
      Rmax = Math.max(Rmax, r * 1e3);
      Fmax = Math.max(Fmax, f / 1e6);
    }

    // Draw R trace (cyan)
    ctx.strokeStyle = '#5fd0ff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const x = padL + (i / 100) * plotW;
      const y = padT + plotH - (Rvals[i] / Rmax) * plotH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Draw f trace (orange)
    ctx.strokeStyle = '#ffb45f';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const x = padL + (i / 100) * plotW;
      const y = padT + plotH - (Fvals[i] / Fmax) * plotH;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // Cursor at current B
    const cursorX = padL + ((st.B_mT - Bmin) / (Bmax - Bmin)) * plotW;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(cursorX, padT); ctx.lineTo(cursorX, padT + plotH); ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle = '#5fd0ff';
    ctx.font = '12px sans-serif';
    ctx.fillText('R (mm)', padL + 6, padT + 14);
    ctx.fillStyle = '#ffb45f';
    ctx.fillText('f_c (MHz)', padL + plotW - 78, padT + 14);

    ctx.fillStyle = '#cfe3ff';
    ctx.font = '13px sans-serif';
    ctx.fillText('B (mT)', padL + plotW / 2 - 22, H - 12);
    ctx.fillText('1', padL - 4, padT + plotH + 18);
    ctx.fillText('100', padL + plotW - 16, padT + plotH + 18);

    // Legend
    ctx.fillStyle = '#5fd0ff';
    ctx.fillRect(padL + 10, padT + plotH - 26, 14, 3);
    ctx.fillStyle = '#cfe3ff';
    ctx.fillText('R', padL + 30, padT + plotH - 20);
    ctx.fillStyle = '#ffb45f';
    ctx.fillRect(padL + 70, padT + plotH - 26, 14, 3);
    ctx.fillStyle = '#cfe3ff';
    ctx.fillText('f_c', padL + 90, padT + plotH - 20);
  },

  tick(dt) {
    if (this.state.animate) {
      this.phase += dt * 0.35;
    }
  },

  lesson: `<p>A charge q moving with velocity <b>v</b> in a static magnetic field <b>B</b> experiences <b>F</b> = q(<b>v</b> × <b>B</b>). The component perpendicular to <b>B</b>, v<sub>⊥</sub> = v sin α, is bent into a circle: m v<sub>⊥</sub><sup>2</sup>/R = |q| v<sub>⊥</sub> B, giving <b>R = m v<sub>⊥</sub>/(|q|B)</b>. The angular gyrofrequency is ω<sub>c</sub> = |q|B/m, so f<sub>c</sub> = |q|B/(2πm) depends only on the charge-to-mass ratio and B — not on speed. This is the operating principle of cyclotrons and magnetrons. The parallel component v<sub>∥</sub> = v cos α is unaffected, producing a helix with pitch p = v<sub>∥</sub>T<sub>c</sub> = 2πm v cos α/(|q|B). At α = 90° the motion collapses to a flat circle; at small α it becomes a long, tightly wound helix.</p>`,

  quiz: [
    { q: 'If the particle speed is doubled while B stays fixed, what happens to the gyrofrequency f_c?', options: ['It doubles', 'It halves', 'It stays the same', 'It quadruples'], answer: 2 },
    { q: 'For a fixed speed and pitch angle, increasing B makes the gyroradius R:', options: ['Larger', 'Smaller', 'Unchanged', 'Zero'], answer: 1 },
    { q: 'A deuteron has roughly twice the mass of a proton with the same charge. Compared with a proton in the same B, its gyrofrequency is:', options: ['Twice as large', 'The same', 'Half as large', 'Four times as large'], answer: 2 }
  ]
});
modules.push({
  id: 'crt_magnetic_deflection',
  title: '6-5 Cathode-Ray Tube; Magnetic Deflection',
  controls: [
    { id: 'Va_kV', label: 'Anode voltage V_a (kV)', type: 'range', min: 1, max: 25, step: 0.5, value: 10 },
    { id: 'B_mT', label: 'Yoke field B (mT)', type: 'range', min: -8, max: 8, step: 0.25, value: 3.0 },
    { id: 'yoke_l_cm', label: 'Yoke length l (cm)', type: 'range', min: 2, max: 6, step: 0.5, value: 4.0 },
    { id: 'screen_L_cm', label: 'Yoke-center to screen L (cm)', type: 'range', min: 15, max: 35, step: 1, value: 25 }
  ],

  build() {
    const g = new THREE.Group();
    content.add(g);
    this.group = g;

    // ---- CRT envelope (axis along +x) ----
    const glassMat = new THREE.MeshStandardMaterial({
      color: 0x9fd8ff, emissive: 0x1b4a66, emissiveIntensity: 0.55,
      transparent: true, opacity: 0.28, roughness: 0.15, metalness: 0.1,
      side: THREE.DoubleSide
    });
    const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 6.2, 28, 1, true), glassMat);
    neck.rotation.z = Math.PI / 2;
    neck.position.set(-3.1, 0, 0);
    g.add(neck);

    const cone = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 2.1, 3.4, 32, 1, true), glassMat);
    cone.rotation.z = -Math.PI / 2;
    cone.position.set(1.7, 0, 0);
    g.add(cone);

    // phosphor screen face
    const screenMat = new THREE.MeshStandardMaterial({
      color: 0x2b6b4a, emissive: 0x2fbf7a, emissiveIntensity: 0.9, roughness: 0.6
    });
    const screen = new THREE.Mesh(new THREE.CircleGeometry(2.1, 40), screenMat);
    screen.rotation.y = Math.PI / 2;
    screen.position.set(3.4, 0, 0);
    g.add(screen);

    // cathode / gun
    const gunMat = new THREE.MeshStandardMaterial({ color: 0xffb066, emissive: 0xff7a2a, emissiveIntensity: 0.8 });
    const gun = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.9, 16), gunMat);
    gun.rotation.z = Math.PI / 2;
    gun.position.set(-6.2, 0, 0);
    g.add(gun);

    // ---- deflection yoke coils (saddle coils, above & below neck) ----
    const coilMat = new THREE.MeshStandardMaterial({ color: 0xff8a3d, emissive: 0xd94a12, emissiveIntensity: 0.7, roughness: 0.4 });
    this.coils = [];
    for (let s = -1; s <= 1; s += 2) {
      const c = new THREE.Mesh(new THREE.TorusGeometry(0.78, 0.16, 12, 30), coilMat);
      c.rotation.y = Math.PI / 2;
      c.position.set(0, s * 0.72, 0);
      g.add(c);
      this.coils.push(c);
    }
    // yoke field region marker (translucent box)
    const yokeMat = new THREE.MeshStandardMaterial({
      color: 0x66ccff, emissive: 0x2a7fb8, emissiveIntensity: 0.35,
      transparent: true, opacity: 0.16, side: THREE.DoubleSide
    });
    this.yokeBox = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), yokeMat);
    g.add(this.yokeBox);

    // ---- B-field arrows inside yoke (persistent arrow field) ----
    this.bArrows = addArrowField([], 0x7fd1ff);

    // ---- electron trajectory (line, rebuilt each update) ----
    const trajMat = new THREE.LineBasicMaterial({ color: 0x7fffd4 });
    this.trajGeo = new THREE.BufferGeometry();
    this.traj = new THREE.Line(this.trajGeo, trajMat);
    g.add(this.traj);

    // ---- radius-of-curvature dashed indicator ----
    const dashMat = new THREE.LineDashedMaterial({ color: 0xffd166, dashSize: 0.18, gapSize: 0.12 });
    this.radGeo = new THREE.BufferGeometry();
    this.radLine = new THREE.Line(this.radGeo, dashMat);
    g.add(this.radLine);

    // ---- impact spot on screen ----
    const spotMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x9dffcf, emissiveIntensity: 2.0 });
    this.spot = new THREE.Mesh(new THREE.SphereGeometry(0.11, 16, 12), spotMat);
    g.add(this.spot);

    // ---- axis guide line ----
    const axisGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(-6.6, 0, 0), new THREE.Vector3(3.4, 0, 0)]);
    g.add(new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0x3a6a8a })));

    this.meshRefs = { neck, cone, screen, gun, yokeBox: this.yokeBox, traj: this.traj, radLine: this.radLine, spot: this.spot };
  },

  update() {
    const st = this.state;
    const Va = st.Va_kV * 1e3;          // volts
    const B = st.B_mT * 1e-3;           // tesla
    const l = st.yoke_l_cm * 1e-2;      // m
    const L = st.screen_L_cm * 1e-2;    // m
    const e = 1.602e-19, me = 9.109e-31;

    const vx = Math.sqrt(2 * e * Va / me);
    const R = (me * vx) / (e * Math.abs(B) || 1e-9);   // m
    const sinA = Math.min(1, l / R);
    const alpha = Math.asin(sinA);
    const tanA = Math.tan(alpha);
    const Dm = L * tanA;                                // m
    const sens = (Dm * 1e3) / (st.B_mT || 1e-9);        // mm/mT

    // ---- 3D scaling: 1 world unit = 1 cm ----
    const lw = st.yoke_l_cm;                 // yoke length in world units
    const Lw = st.screen_L_cm;               // yoke center -> screen
    const Rw = R * 100;                      // radius in cm
    const Dw = Dm * 100;                     // deflection in cm

    // yoke box
    this.yokeBox.scale.set(lw, 1.5, 1.5);
    this.yokeBox.position.set(0, 0, 0);

    // coils follow yoke length
    this.coils.forEach((c, i) => {
      c.position.x = 0;
      c.scale.set(1, 1, 1);
    });

    // ---- trajectory: straight from gun to yoke entry, arc inside yoke, straight to screen ----
    const pts = [];
    const x0 = -6.2, xIn = -lw / 2, xOut = lw / 2;
    pts.push(new THREE.Vector3(x0, 0, 0));
    pts.push(new THREE.Vector3(xIn, 0, 0));

    // arc: circle center at (xIn, 0, sgn*Rw) with radius Rw, bending in +z for B>0
    const sgn = B >= 0 ? 1 : -1;
    const cz = sgn * Rw;
    const a0 = Math.atan2(0 - cz, xIn - xIn); // start angle relative to center
    // parametrize by angle swept = alpha
    const steps = 40;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const ang = -sgn * alpha * t; // rotate about center
      const px = xIn + Rw * Math.sin(Math.abs(ang)) * 0; // placeholder
      // use proper rotation: point on circle starting at (xIn,0)
      const dx = Rw * Math.sin(alpha * t);
      const dz = sgn * Rw * (1 - Math.cos(alpha * t));
      pts.push(new THREE.Vector3(xIn + dx, 0, dz));
    }

    // exit point
    const exitX = xIn + Rw * Math.sin(alpha);
    const exitZ = sgn * Rw * (1 - Math.cos(alpha));
    // straight to screen at x = Lw (screen plane)
    const xScreen = Lw;
    const zScreen = exitZ + (xScreen - exitX) * Math.tan(alpha) * sgn;
    pts.push(new THREE.Vector3(xScreen, 0, zScreen));

    this.trajGeo.setFromPoints(pts);
    this.trajGeo.attributes.position.needsUpdate = true;

    // spot on screen
    this.spot.position.set(xScreen, 0, zScreen);

    // radius indicator: from arc center to arc midpoint
    const midT = 0.5;
    const mx = xIn + Rw * Math.sin(alpha * midT);
    const mz = sgn * Rw * (1 - Math.cos(alpha * midT));
    const center = new THREE.Vector3(xIn, 0, cz);
    this.radGeo.setFromPoints([center, new THREE.Vector3(mx, 0, mz)]);
    this.radLine.computeLineDistances();
    this.radGeo.attributes.position.needsUpdate = true;

    // ---- B-field arrows inside yoke ----
    const arrows = [];
    const nCols = 5, nRows = 3;
    for (let i = 0; i < nCols; i++) {
      for (let j = 0; j < nRows; j++) {
        const x = -lw / 2 + (i + 0.5) * (lw / nCols);
        const z = -0.55 + j * 0.55;
        arrows.push({
          origin: new THREE.Vector3(x, -0.55, z),
          dir: new THREE.Vector3(0, 1, 0),
          len: 0.9
        });
      }
    }
    this.bArrows.setVectors(arrows);

    // ---- 2D chart: D_m vs V_a (magnetic) and D_e vs V_a (electric) ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const padL = 62, padR = 22, padT = 34, padB = 46;
    const plotW = W - padL - padR, plotH = H - padT - padB;
    const Vmin = 1, Vmax = 25;

    // grid
    ctx.strokeStyle = '#1e2c44';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const x = padL + (i / 6) * plotW;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + plotH); ctx.stroke();
    }
    for (let i = 0; i <= 5; i++) {
      const y = padT + (i / 5) * plotH;
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    }

    // normalize both curves at Va = 5 kV
    const Vref = 5;
    const DmRef = (L * l * Math.abs(B)) / Math.sqrt(2 * me * (Vref * 1e3) / e);
    const DeRef = 1 / (Vref * 1e3); // arbitrary electric normalization

    const toX = v => padL + ((v - Vmin) / (Vmax - Vmin)) * plotW;
    const toY = d => padT + plotH - (d / 1.15) * plotH;

    // magnetic curve: Dm ∝ 1/sqrt(Va)
    ctx.strokeStyle = '#7fffd4';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const v = Vmin + (i / 200) * (Vmax - Vmin);
      const d = DmRef * Math.sqrt(Vref / v) / DmRef; // normalized to 1 at Vref
      const y = toY(d);
      if (i === 0) ctx.moveTo(toX(v), y); else ctx.lineTo(toX(v), y);
    }
    ctx.stroke();

    // electric curve: De ∝ 1/Va
    ctx.strokeStyle = '#ff9f6b';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const v = Vmin + (i / 200) * (Vmax - Vmin);
      const d = Vref / v;
      const y = toY(d);
      if (i === 0) ctx.moveTo(toX(v), y); else ctx.lineTo(toX(v), y);
    }
    ctx.stroke();

    // axes labels
    ctx.fillStyle = '#9fb6d4';
    ctx.font = '13px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Anode voltage V_a (kV)', padL + plotW / 2, H - 12);
    ctx.save();
    ctx.translate(16, padT + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Normalized deflection', 0, 0);
    ctx.restore();

    // legend
    ctx.textAlign = 'left';
    ctx.fillStyle = '#7fffd4';
    ctx.fillText('D_m ∝ V_a^{-1/2}  (magnetic)', padL + 12, padT + 18);
    ctx.fillStyle = '#ff9f6b';
    ctx.fillText('D_e ∝ V_a^{-1}  (electric)', padL + 12, padT + 36);

    // current operating point marker
    const vNow = st.Va_kV;
    const dNow = Math.sqrt(Vref / vNow);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(toX(vNow), toY(dNow), 4.5, 0, Math.PI * 2);
    ctx.fill();

    // ---- HUD ----
    setHud(
      'CRT Magnetic Deflection',
      'R = \\frac{1}{B}\\sqrt{\\frac{2 m_e V_a}{e}},\\quad D_m \\approx \\frac{L\\,l\\,B}{\\sqrt{2 m_e V_a / e}}',
      [
        { k: 'Arc radius R', v: (R * 100).toFixed(2) + ' cm' },
        { k: 'Deflection angle α', v: (alpha * 180 / Math.PI).toFixed(2) + '°' },
        { k: 'Screen deflection D_m', v: (Dm * 1e3).toFixed(2) + ' mm' },
        { k: 'Sensitivity D_m/B', v: sens.toFixed(3) + ' mm/mT' }
      ]
    );
  },

  tick(dt) {
    // gentle pulsing of the phosphor spot
    if (this.meshRefs && this.meshRefs.spot) {
      const t = performance.now() * 0.004;
      this.meshRefs.spot.material.emissiveIntensity = 1.6 + 0.6 * Math.sin(t);
    }
  },

  lesson: `<p>Inside the magnetic yoke the electron moves on a circular arc of radius
  <em>R = m_e v_x /(eB) = (1/B)√(2m_e V_a/e)</em>. The arc length is the yoke length <em>l</em>,
  so the exit angle satisfies <em>sin α = l/R</em> and the screen deflection is
  <em>D_m = L tan α ≈ L l B √(e/(2m_e V_a))</em>.</p>
  <p>Because <em>D_m ∝ V_a^{-1/2}</em> while electrostatic deflection falls as <em>V_a^{-1}</em>,
  magnetic deflection loses sensitivity far more slowly as the anode voltage rises — which is why
  high-voltage TV and radar CRTs use magnetic yokes. Magnetic deflection also depends on <em>√(e/m)</em>,
  so heavy positive ions are deflected much less than electrons; if the beam is misaligned they can
  strike the phosphor and cause ion burn.</p>`,

  quiz: [
    { q: 'Inside the yoke, the electron path is best described as:', options: ['a straight line', 'a circular arc of radius R = m v/(eB)', 'a parabola', 'an ellipse'], answer: 1 },
    { q: 'Compared with electrostatic deflection, magnetic deflection at high V_a scales as:', options: ['V_a^{-1}', 'V_a^{-1/2}', 'V_a^{+1/2}', 'independent of V_a'], answer: 1 },
    { q: 'Why can magnetically deflected CRTs suffer ion burn?', options: ['Ions have larger charge', 'Ions have much larger mass, so they deflect far less and hit the screen', 'The magnetic field accelerates ions', 'Ions are repelled by the yoke'], answer: 1 }
  ]
});
modules.push({
  id: 'rotary_motor_generator',
  title: '6-6 Rotary Motor or Generator',
  controls: [
    { id: 'mode', label: 'Mode', type: 'select', options: ['AC Generator (Slip Rings)', 'DC Motor (Commutator)'], value: 'AC Generator (Slip Rings)' },
    { id: 'B_T', label: 'Stator field B (T)', type: 'range', min: 0.1, max: 1.5, step: 0.05, value: 0.6 },
    { id: 'N_turns', label: 'Coil turns N', type: 'range', min: 10, max: 200, step: 10, value: 50 },
    { id: 'rpm', label: 'Shaft speed (RPM)', type: 'range', min: 100, max: 3000, step: 100, value: 1200 },
    { id: 'I_or_R', label: 'Load R_L (ohm) / Motor I (A)', type: 'range', min: 1, max: 20, step: 1, value: 10 },
    { id: 'animate', label: 'Animate', type: 'check', value: true }
  ],

  build() {
    const g = new THREE.Group();
    // stator pole pieces (curved, red N / blue S) with field along +x
    const poleGeo = new THREE.TorusGeometry(2.6, 0.55, 12, 40, Math.PI * 0.55);
    const nMat = new THREE.MeshStandardMaterial({ color: 0xff4a4a, emissive: 0x551010, metalness: 0.5, roughness: 0.4 });
    const sMat = new THREE.MeshStandardMaterial({ color: 0x4a7bff, emissive: 0x101a55, metalness: 0.5, roughness: 0.4 });
    const nPole = new THREE.Mesh(poleGeo, nMat);
    nPole.rotation.z = Math.PI * 0.5; nPole.position.set(0, 0, 0);
    const sPole = new THREE.Mesh(poleGeo, sMat);
    sPole.rotation.z = -Math.PI * 0.5;
    g.add(nPole, sPole);

    // shaft
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 6.4, 16),
      new THREE.MeshStandardMaterial({ color: 0xbfc6d0, metalness: 0.9, roughness: 0.25 }));
    shaft.rotation.x = Math.PI / 2; g.add(shaft);

    // armature: rectangular coil (width w along z, length l along x)
    const arm = new THREE.Group();
    const copper = new THREE.MeshStandardMaterial({ color: 0xd98a3a, emissive: 0x3a1d05, metalness: 0.85, roughness: 0.3 });
    const l = 3.2, w = 2.2;
    const bar = (len, rot, pos) => {
      const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.09, 0.09), copper);
      m.rotation.y = rot; m.position.copy(pos); return m;
    };
    arm.add(bar(l, 0, new THREE.Vector3(0, 0, w / 2)));
    arm.add(bar(l, 0, new THREE.Vector3(0, 0, -w / 2)));
    arm.add(bar(w, Math.PI / 2, new THREE.Vector3(l / 2, 0, 0)));
    arm.add(bar(w, Math.PI / 2, new THREE.Vector3(-l / 2, 0, 0)));
    // a few "turn" hints
    for (let i = 0; i < 4; i++) {
      const t = new THREE.Mesh(new THREE.TorusGeometry(0.05, 0.02, 6, 12), copper);
      t.position.set(-l / 2 + 0.4 + i * 0.8, 0, w / 2); arm.add(t);
    }
    g.add(arm);

    // slip rings / commutator
    const ringMat = new THREE.MeshStandardMaterial({ color: 0xe0b060, metalness: 0.9, roughness: 0.25 });
    const slipA = new THREE.Mesh(new THREE.TorusGeometry(0.28, 0.06, 8, 24), ringMat);
    slipA.position.set(-l / 2 - 0.55, 0, 0); slipA.rotation.y = Math.PI / 2;
    const slipB = slipA.clone(); slipB.position.x -= 0.35;
    g.add(slipA, slipB);
    // brushes
    const brushMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8 });
    const br1 = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.5, 0.12), brushMat);
    br1.position.set(-l / 2 - 0.55, 0.42, 0);
    const br2 = br1.clone(); br2.position.x -= 0.35;
    g.add(br1, br2);

    // output bulb indicator
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xffe08a, emissive: 0xffcc44, emissiveIntensity: 0.2 }));
    bulb.position.set(0, 2.4, 0); g.add(bulb);

    // field arrows (persistent)
    const fieldVecs = [];
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
      fieldVecs.push({ origin: new THREE.Vector3(-2.0, i * 0.9, j * 0.9), dir: new THREE.Vector3(1, 0, 0), len: 1.6 });
    }
    this.fieldArrows = addArrowField(fieldVecs, 0x7fd1ff);

    // force arrows (persistent, updated)
    this.forceArrows = addArrowField([
      { origin: new THREE.Vector3(0, 0, 1.1), dir: new THREE.Vector3(0, 1, 0), len: 1 },
      { origin: new THREE.Vector3(0, 0, -1.1), dir: new THREE.Vector3(0, -1, 0), len: 1 }
    ], 0xffd166);

    content.add(g);
    this.meshRefs = { g, arm, bulb, slipA, slipB, br1, br2, l, w };
    this.theta = 0;
  },

  update() {
    const st = this.state;
    const B = st.B_T, N = st.N_turns, rpm = st.rpm, val = st.I_or_R;
    const omega = 2 * Math.PI * rpm / 60;
    const l = this.meshRefs.l, w = this.meshRefs.w, A = l * w;
    const isGen = st.mode === 'AC Generator (Slip Rings)';

    const Vpeak = N * B * A * omega;
    const Rc = 2.0;
    const I = isGen ? Vpeak / (val + Rc) : val;
    const Tpeak = N * I * A * B;
    const Tavg = (2 / Math.PI) * Tpeak;
    const P = isGen ? I * I * val : Tavg * omega;

    // rotate armature
    this.meshRefs.arm.rotation.x = this.theta;
    // commutator visual: split ring halves
    this.meshRefs.slipA.rotation.x = this.theta;
    this.meshRefs.slipB.rotation.x = this.theta;

    // force arrows: tangential on the two active conductors (z = ±w/2)
    const s = Math.sin(this.theta), c = Math.cos(this.theta);
    const fMag = Math.min(1.6, 0.35 + 0.9 * Math.abs(s) * (isGen ? 1 : 1));
    const dirA = new THREE.Vector3(0, s >= 0 ? 1 : -1, 0);
    const dirB = new THREE.Vector3(0, s >= 0 ? -1 : 1, 0);
    const pA = new THREE.Vector3(0, 0, (w / 2) * c);
    const pB = new THREE.Vector3(0, 0, -(w / 2) * c);
    this.forceArrows.setVectors([
      { origin: pA, dir: dirA, len: fMag },
      { origin: pB, dir: dirB, len: fMag }
    ]);

    // bulb brightness
    const bright = isGen ? Math.abs(s) : Math.abs(s);
    this.meshRefs.bulb.material.emissiveIntensity = 0.15 + 1.6 * bright;

    // ---- 2D chart ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1020'; ctx.fillRect(0, 0, W, H);

    const pad = 46;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;

    // grid
    ctx.strokeStyle = '#1e2a44'; ctx.lineWidth = 1;
    for (let i = 0; i <= 8; i++) {
      const x = x0 + (x1 - x0) * i / 8;
      ctx.beginPath(); ctx.moveTo(x, y1); ctx.lineTo(x, y0); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const y = y1 + (y0 - y1) * i / 6;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    // zero axis
    ctx.strokeStyle = '#3a4a66'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();

    const scaleY = (y0 - y1) * 0.42;
    const norm = Math.max(Vpeak, Tpeak, 1e-6);

    // EMF curve
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#7fd1ff';
    ctx.beginPath();
    for (let i = 0; i <= 400; i++) {
      const th = (i / 400) * 4 * Math.PI;
      const v = Vpeak * Math.sin(th) / norm;
      const x = x0 + (x1 - x0) * (i / 400);
      const y = cy - v * scaleY;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // torque curve
    ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 400; i++) {
      const th = (i / 400) * 4 * Math.PI;
      let t;
      if (isGen) t = Tpeak * Math.sin(th);
      else t = Tpeak * Math.abs(Math.sin(th));
      const x = x0 + (x1 - x0) * (i / 400);
      const y = cy - (t / norm) * scaleY;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    // labels
    ctx.fillStyle = '#9fb4d6'; ctx.font = '13px sans-serif';
    ctx.fillText('0°', x0 - 6, y0 + 20);
    ctx.fillText('360°', cx - 14, y0 + 20);
    ctx.fillText('720°', x1 - 22, y0 + 20);
    ctx.fillStyle = '#7fd1ff'; ctx.fillText('EMF (V)', x0 + 6, y1 + 14);
    ctx.fillStyle = '#ffd166'; ctx.fillText('Torque (N·m)', x0 + 6, y1 + 30);

    setHud('Rotary Electromechanical Energy Conversion',
      '\\mathcal{E}(t) = N B A \\omega \\sin(\\omega t),\\quad \\tau(t) = N I A B \\sin\\theta',
      [
        { k: 'Peak EMF V_peak', v: Vpeak.toFixed(2) + ' V' },
        { k: 'Angular speed omega', v: omega.toFixed(1) + ' rad/s' },
        { k: 'Peak / Avg Torque', v: Tpeak.toFixed(2) + ' / ' + Tavg.toFixed(2) + ' N·m' },
        { k: 'Electrical Power', v: P.toFixed(1) + ' W' }
      ]);
  },

  tick(dt) {
    if (!this.state.animate) return;
    const omega = 2 * Math.PI * this.state.rpm / 60;
    this.theta += omega * dt;
    this.update();
  },

  lesson: `<p>A rotary machine is one device viewed two ways. In <b>generator mode</b>, the flux linkage through the N-turn coil is <em>Λ(t) = N B A cos(ωt)</em>; Faraday's law gives <em>ℰ = −dΛ/dt = N B A ω sin(ωt)</em>. The induced current, limited by load and coil resistance, produces a Lorentz torque <em>τ = N I A B sin θ</em> that opposes rotation (Lenz's law) — mechanical work is converted to electrical energy.</p>
  <p>In <b>motor mode</b>, an externally supplied current I experiences the same Lorentz torque <em>τ = N I A B sin θ</em>, driving the shaft. The rotating coil also generates a <b>back-EMF</b> <em>ℰ_back = N B A ω sin θ</em> that opposes the supply. A split-ring commutator reverses the coil connections every half turn, rectifying the torque so its average is <em>τ_avg = (2/π) N I A B</em> instead of zero.</p>
  <p>Limiting cases: at ω → 0 the generator EMF vanishes and the motor's back-EMF vanishes (stall current is limited only by resistance); at high ω the back-EMF nearly cancels the supply, so motor current and torque fall. Slip rings preserve the alternating waveform; the commutator produces a rectified, always-positive torque.</p>`,

  quiz: [

    { q: 'A commutator changes the average torque compared with slip rings because it:', options: ['Increases N', 'Rectifies the current direction each half turn', 'Removes the back-EMF', 'Doubles the field B'], answer: 1 }

modules.push({
  id: 'linear_motor',

  build() {

  update() {
    const st = this.state;
    const V0 = st.V0_V, B = st.B_T, l = st.rail_l_m, R = st.R_ohm, m = st.mass_kg;

    const vTerm = V0 / (B * l);
    const tau = (m * R) / (B * B * l * l);
    const I0 = V0 / R;
    const F0 = I0 * l * B;

    // Position rails
    this.railL.position.z = -l / 2;
    this.railR.position.z = l / 2;
    this.bar.scale.z = l;
    this.bar.position.z = 0;

    // Animate bar position (wrap continuously)
    const t = this._t || 0;
    const x = ((vTerm * t) % 5.5) - 2.75;
    this.bar.position.x = x;

    // Current at current position (based on v = vTerm*(1-e^-t/tau))
    const v = vTerm * (1 - Math.exp(-t / tau));
    const I = (V0 - B * l * v) / R;
    const F = I * l * B;

    // B field arrows
    const bVecs = [];
    for (let i = -2; i <= 2; i++) {
      for (let j = -1; j <= 1; j++) {
        bVecs.push({
          origin: new THREE.Vector3(i * 1.1, 0.05, j * l * 0.25),
          dir: new THREE.Vector3(0, 1, 0),
          len: 0.45
        });
      }
    }
    this.bArrows.setVectors(bVecs);

    // Current arrows around loop (left rail, bar, right rail, source)
    const iVecs = [];
    const dirSign = I >= 0 ? 1 : -1;
    const mag = Math.min(Math.abs(I) / Math.max(I0, 1e-6), 1.5);
    const seg = (a, b, n) => {
      for (let k = 0; k < n; k++) {
        const p = a.clone().lerp(b, (k + 0.5) / n);
        const d = b.clone().sub(a).normalize().multiplyScalar(dirSign);
        iVecs.push({ origin: p, dir: d, len: 0.22 * mag });
      }
    };
    seg(new THREE.Vector3(-3, 0.05, -l / 2), new THREE.Vector3(x, 0.05, -l / 2), 4);
    seg(new THREE.Vector3(x, 0.05, -l / 2), new THREE.Vector3(x, 0.05, l / 2), 2);
    seg(new THREE.Vector3(x, 0.05, l / 2), new THREE.Vector3(-3, 0.05, l / 2), 4);
    this.iArrows.setVectors(iVecs);

    // Force arrow on bar
    const fLen = Math.min(Math.abs(F) / Math.max(F0, 1e-6), 1.2) * 0.9;
    this.fArrow.setVectors([{
      origin: new THREE.Vector3(x, 0.18, 0),
      dir: new THREE.Vector3(dirSign, 0, 0),
      len: fLen
    }]);

    // 2D chart
    const W = chartEl.width, H = chartEl.height;
    const ctx = chartEl.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    const pad = 40;
    const x0 = pad, y0 = H - pad, x1 = W - pad, y1 = pad;
    ctx.strokeStyle = '#2a3a4a';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y0);
    ctx.moveTo(x0, y0); ctx.lineTo(x0, y1);
    ctx.stroke();

    // axes labels
    ctx.fillStyle = '#9fb3c8';
    ctx.font = '12px sans-serif';
    ctx.fillText('t / τ_m', x1 - 50, y0 + 22);
    ctx.fillText('normalized', x0 - 30, y1 - 8);

    // grid
    for (let k = 0; k <= 5; k++) {
      const xx = x0 + (x1 - x0) * k / 5;
      ctx.strokeStyle = '#1a2634';
      ctx.beginPath(); ctx.moveTo(xx, y0); ctx.lineTo(xx, y1); ctx.stroke();
      ctx.fillStyle = '#6b7f93';
      ctx.fillText(k.toString(), xx - 4, y0 + 16);
    }
    for (let k = 0; k <= 4; k++) {
      const yy = y0 - (y0 - y1) * k / 4;
      ctx.strokeStyle = '#1a2634';
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
      ctx.fillStyle = '#6b7f93';
      ctx.fillText((k / 4).toFixed(2), x0 - 34, yy + 4);
    }

    // velocity curve: v/vTerm = 1 - e^{-t/tau}
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let k = 0; k <= 100; k++) {
      const tt = 5 * k / 100;
      const val = 1 - Math.exp(-tt);
      const px = x0 + (x1 - x0) * tt / 5;
      const py = y0 - (y0 - y1) * val;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // current curve: I/I0 = 1 - (v/vTerm)
    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let k = 0; k <= 100; k++) {
      const tt = 5 * k / 100;
      const val = Math.exp(-tt);
      const px = x0 + (x1 - x0) * tt / 5;
      const py = y0 - (y0 - y1) * val;
      if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // legend
    ctx.fillStyle = '#7fd1ff';
    ctx.fillRect(x1 - 150, y1 + 8, 12, 12);
    ctx.fillStyle = '#9fb3c8';
    ctx.fillText('v / v_term', x1 - 132, y1 + 18);
    ctx.fillStyle = '#ffb347';
    ctx.fillRect(x1 - 150, y1 + 28, 12, 12);
    ctx.fillStyle = '#9fb3c8';
    ctx.fillText('I / I_0', x1 - 132, y1 + 38);

    setHud(
      'Linear Rail Motor & Back-EMF Dynamics',
      'F(v) = \\frac{l B}{R}(V_0 - B l v),\\quad v_{\\mathrm{term}} = \\frac{V_0}{B l},\\quad \\tau_m = \\frac{m R}{B^2 l^2}',
      [
        { k: 'Terminal speed v_term', v: vTerm.toFixed(2) + ' m/s' },
        { k: 'Start force F_0', v: F0.toFixed(2) + ' N' },
        { k: 'Start current I_0', v: I0.toFixed(2) + ' A' },
        { k: 'Time constant τ_m', v: tau.toFixed(3) + ' s' }
      ]
    );
  },

  tick(dt) {
    if (this.state.animate) this._t = (this._t || 0) + dt;
  },

  lesson: `<p>A conducting bar of length <em>l</em> slides on rails in a vertical field <em>B</em>. The battery drives current <em>I = (V₀ − B l v)/R</em>; the Lorentz force <em>F = I l B</em> accelerates the bar. As speed rises, motional back-EMF <em>B l v</em> cancels the supply, so current and force fall exponentially with time constant <em>τ_m = mR/(B²l²)</em>, approaching terminal speed <em>v_term = V₀/(B l)</em>.</p>
  <p>Mechanical power <em>P_mech = F v = V_emf I</em> and electrical input <em>P_elec = V₀ I</em>, so efficiency <em>η = v/v_term</em>. Efficiency approaches 100% only near no-load speed, where the transferred power itself tends to zero. Maximum power transfer occurs at <em>v = v_term/2</em>, where η = 50%.</p>`,

  quiz: [

    { q: 'At what speed is maximum mechanical power delivered?', options: ['v = v_term', 'v = v_term/2', 'v = 2 v_term', 'v = 0'], answer: 1 },

  ]
});
modules.push({
  id: 'hall_effect_generator',
  title: '6-8 Hall-Effect Generator',
  controls: [
    { id: 'material', label: 'Material', type: 'select', options: ['n-Type Semiconductor (e-)', 'p-Type Semiconductor (h+)', 'Copper Metal (e-)'], value: 'n-Type Semiconductor (e-)' },
    { id: 'Ix_mA', label: 'Current I_x (mA)', type: 'range', min: 1, max: 100, step: 1, value: 20 },
    { id: 'B_T', label: 'Magnetic field B_z (T)', type: 'range', min: -1.5, max: 1.5, step: 0.05, value: 0.5 },

  build() {
    const g = new THREE.Group();
    const L = 4.0, w = 1.6, t = 0.22;

    // Hall bar slab
    const slabMat = new THREE.MeshStandardMaterial({
      color: 0x2b6fa8, emissive: 0x0a2a44, emissiveIntensity: 0.6,
      transparent: true, opacity: 0.55, roughness: 0.35, metalness: 0.25,

    });

      new THREE.EdgesGeometry(new THREE.BoxGeometry(L, w, t)),

    );
    g.add(edges);

    // Current lead wires
    const leadMat = new THREE.MeshStandardMaterial({ color: 0xffb347, emissive: 0x552200, emissiveIntensity: 0.8 });
    for (const s of [-1, 1]) {
      const lead = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.9, 12), leadMat);
      lead.rotation.z = Math.PI / 2;
      lead.position.set(s * (L / 2 + 0.45), 0, 0);
      g.add(lead);
    }

    // Surface charge strips (two thin plates on +/- y faces)
    const stripGeo = new THREE.BoxGeometry(L * 0.92, 0.05, t * 1.05);
    const stripPos = new THREE.MeshStandardMaterial({ color: 0xff4d6d, emissive: 0xff2244, emissiveIntensity: 1.2, transparent: true, opacity: 0.85 });
    const stripNeg = new THREE.MeshStandardMaterial({ color: 0x4d9dff, emissive: 0x2266ff, emissiveIntensity: 1.2, transparent: true, opacity: 0.85 });
    const stripA = new THREE.Mesh(stripGeo, stripPos);
    const stripB = new THREE.Mesh(stripGeo, stripNeg);
    stripA.position.set(0, w / 2 + 0.03, 0);
    stripB.position.set(0, -w / 2 - 0.03, 0);
    g.add(stripA, stripB);

    // Voltmeter body
    const vm = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(0.9, 0.55, 0.18),
      new THREE.MeshStandardMaterial({ color: 0x1b1f27, emissive: 0x0a0d12, emissiveIntensity: 0.5, roughness: 0.5 })
    );
    vm.add(body);
    const screen = new THREE.Mesh(
      new THREE.PlaneGeometry(0.7, 0.32),
      new THREE.MeshBasicMaterial({ color: 0x0b3d2e })
    );
    screen.position.set(0, 0.02, 0.095);
    vm.add(screen);
    vm.position.set(0, 0, 1.35);
    g.add(vm);

    // Probe wires from slab faces to voltmeter
    const probeMat = new THREE.LineBasicMaterial({ color: 0xffd166 });
    const probePts = [
      new THREE.Vector3(0, w / 2 + 0.05, 0), new THREE.Vector3(0, w / 2 + 0.35, 0.9), new THREE.Vector3(-0.25, 0.15, 1.28),
      new THREE.Vector3(0, -w / 2 - 0.05, 0), new THREE.Vector3(0, -w / 2 - 0.35, 0.9), new THREE.Vector3(0.25, -0.15, 1.28)
    ];
    for (let i = 0; i < 2; i++) {
      const geo = new THREE.BufferGeometry().setFromPoints(probePts.slice(i * 3, i * 3 + 3));
      g.add(new THREE.Line(geo, probeMat));
    }

    // Carrier spheres
    const carriers = [];
    const carrierGeo = new THREE.SphereGeometry(0.055, 12, 10);
    const carrierMat = new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffaa00, emissiveIntensity: 1.4 });
    for (let i = 0; i < 14; i++) {
      const c = new THREE.Mesh(carrierGeo, carrierMat);
      c.userData.phase = Math.random() * Math.PI * 2;
      c.userData.y0 = (Math.random() - 0.5) * w * 0.7;
      carriers.push(c);
      g.add(c);
    }

    // Arrow fields
    const currentArrows = addArrowField([], 0xffb347);
    const bArrows = addArrowField([], 0x7fd1ff);
    const eArrows = addArrowField([], 0xff4d6d);
    g.add(currentArrows, bArrows, eArrows);

    content.add(g);
    this.meshRefs = { g, slab, stripA, stripB, carriers, currentArrows, bArrows, eArrows, screen, vm };
  },

  update() {
    const st = this.state;
    const R = this.meshRefs;
    const L = 4.0, w = 1.6, t = 0.22;

    const mat = st.material;
    const isN = mat.startsWith('n-Type');
    const isP = mat.startsWith('p-Type');
    const n = isN ? 1e21 : isP ? 1e21 : 8.5e28; // carrier density m^-3
    const q = 1.602e-19;
    const sign = isP ? 1 : -1; // sign of carrier charge
    const RH = 1 / (n * q * sign); // m^3/C (sign follows carrier)
    const Ix = st.Ix_mA * 1e-3;
    const Bz = st.B_T;
    const thick = st.thick_mm * 1e-3;
    const wm = 1.6e-3; // physical width for drift speed calc

    const vd = Ix / (n * Math.abs(q) * wm * thick);
    const EH = vd * Bz;
    const VH = RH * Ix * Bz / thick; // volts

    // Charge strip polarity: for electrons (n-type), B_z>0 deflects electrons to +y? 
    // F = q v x B; electrons v along +x, q<0, B +z => v x B = -y, q<0 => +y. So electrons accumulate +y.
    // For holes v along +x, q>0 => -y.
    const deflectSign = isP ? -1 : 1; // side where majority carriers accumulate (+y if +1)
    const chargeOnPlusY = deflectSign * Math.sign(Bz || 1); // +1 means +y face is negative for electrons
    // For electrons: +y face negative. For holes: +y face positive.
    const plusYIsNegative = isN ? (Bz >= 0) : (Bz < 0);

    R.stripA.material.color.set(plusYIsNegative ? 0x4d9dff : 0xff4d6d);
    R.stripA.material.emissive.set(plusYIsNegative ? 0x2266ff : 0xff2244);
    R.stripB.material.color.set(plusYIsNegative ? 0xff4d6d : 0x4d9dff);
    R.stripB.material.emissive.set(plusYIsNegative ? 0xff2244 : 0x2266ff);

    const stripOpacity = Math.min(0.95, 0.25 + Math.abs(VH) * 40);
    R.stripA.material.opacity = stripOpacity;
    R.stripB.material.opacity = stripOpacity;

    // Current arrows along +x
    const curVecs = [];
    for (let i = 0; i < 5; i++) {
      const y = (i - 2) * 0.28;
      curVecs.push({ origin: new THREE.Vector3(-L / 2 - 0.35, y, 0), dir: new THREE.Vector3(1, 0, 0), len: 0.55 });
    }
    R.currentArrows.setVectors(curVecs);

    // B field arrows along +z (or -z)
    const bVecs = [];
    for (let i = 0; i < 6; i++) {
      const x = (i - 2.5) * 0.65;
      bVecs.push({ origin: new THREE.Vector3(x, 0, 0.35), dir: new THREE.Vector3(0, 0, Math.sign(Bz || 1)), len: 0.55 });
    }
    R.bArrows.setVectors(bVecs);

    // E_H arrows across width (from + charge face to - charge face)
    const eVecs = [];
    const eDir = plusYIsNegative ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(0, -1, 0);
    for (let i = 0; i < 4; i++) {
      const x = (i - 1.5) * 0.8;
      eVecs.push({ origin: new THREE.Vector3(x, 0, 0.16), dir: eDir.clone(), len: 0.45 });
    }
    R.eArrows.setVectors(eVecs);

    // Voltmeter screen color
    R.screen.material.color.set(Math.abs(VH) > 1e-6 ? 0x0b3d2e : 0x1a1a1a);

    // Chart
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1018';
    ctx.fillRect(0, 0, W, H);

    const padL = 70, padR = 30, padT = 40, padB = 55;
    const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;
    const Bmin = -1.5, Bmax = 1.5;
    const Vmax = Math.max(1e-9, Math.abs(RH * Ix * Bmax / thick) * 1000);
    const Vlim = Math.max(Vmax * 1.15, 0.05);

    // grid
    ctx.strokeStyle = '#1e2a3a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 6; i++) {
      const x = x0 + (x1 - x0) * i / 6;
      ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
    }
    for (let i = 0; i <= 6; i++) {
      const y = y0 + (y1 - y0) * i / 6;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }

    // axes
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();

    // zero line
    const yZero = (y0 + y1) / 2;
    ctx.strokeStyle = '#3a4a5e';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, yZero); ctx.lineTo(x1, yZero); ctx.stroke();

    // labels
    ctx.fillStyle = '#9fe8ff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('B_z (T)', (x0 + x1) / 2, H - 18);
    ctx.save();
    ctx.translate(20, (y0 + y1) / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('V_H (mV)', 0, 0);
    ctx.restore();

    for (let i = 0; i <= 6; i++) {
      const b = Bmin + (Bmax - Bmin) * i / 6;
      const x = x0 + (x1 - x0) * i / 6;
      ctx.fillStyle = '#9fe8ff';
      ctx.font = '12px sans-serif';
      ctx.fillText(b.toFixed(1), x, y1 + 18);
    }
    for (let i = 0; i <= 6; i++) {
      const v = -Vlim + 2 * Vlim * i / 6;
      const y = y1 - (y1 - y0) * i / 6;
      ctx.fillStyle = '#9fe8ff';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(2), x0 - 8, y + 4);
    }

    // line
    const slope = RH * Ix / thick * 1000; // mV per T
    ctx.strokeStyle = isP ? '#ff8a5c' : '#7fd1ff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const b = Bmin + (Bmax - Bmin) * i / 100;
      const v = slope * b;
      const x = x0 + (x1 - x0) * (b - Bmin) / (Bmax - Bmin);
      const y = yZero - (v / Vlim) * (y1 - y0) / 2;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

  lesson: `<p>A conductor moving with velocity <b>v</b> through a static magnetic field <b>B</b> experiences a motional electric field <b>E<sub>m</sub> = v × B</b>. Charges inside the rod are pushed along it, producing an induced motional EMF <b>ℰ = ∫(v × B)·dl = B l v sin θ</b> for a straight rod of length <i>l</i> at angle θ to <b>v</b>.</p>

              mod.update();
            });
            row.appendChild(sel);
          } else if (c.type === "check") {
            const inp = document.createElement("input");
            inp.type = "checkbox";
            inp.checked = !!mod.state[c.id];
            inp.addEventListener("change", () => {
              mod.state[c.id] = inp.checked;
              mod.update();
            });
            row.appendChild(inp);
          } else {
            const inp = document.createElement("input");
            inp.type = "range";
            inp.min = c.min ?? 0;
            inp.max = c.max ?? 1;
            inp.step = c.step ?? 0.01;
            inp.value = mod.state[c.id];
            const val = document.createElement("span");
            val.className = "val";
            val.textContent = Number(mod.state[c.id]).toFixed(2);
            inp.addEventListener("input", () => {
              mod.state[c.id] = parseFloat(inp.value);
              val.textContent = Number(mod.state[c.id]).toFixed(2);
              mod.update();
            });
            row.appendChild(inp);
            row.appendChild(val);
          }
          controlsEl.appendChild(row);
        });
      }

      function buildLesson(mod) {
        const raw = mod.lesson || mod.blurb || "";
        lessonEl.innerHTML = raw.trim().startsWith("<")
          ? raw
          : `<h3>${mod.title}</h3><p>${raw}</p>`;
        renderAllMath(lessonEl);
      }

      function buildQuiz(mod) {
        quizEl.innerHTML = "<h3>Concept Check</h3>";
        const key = mod.id || String(activeIdx);
        progress[key] = progress[key] || {};
        (mod.quiz || []).forEach((q, qi) => {
          const card = document.createElement("div");
          card.className = "qcard";
          const qt = document.createElement("div");
          qt.className = "qtext";
          qt.textContent = `${qi + 1}. ${q.q}`;
          card.appendChild(qt);
          const opts = document.createElement("div");
          opts.className = "opts";
          const fb = document.createElement("div");
          fb.className = "fb";
          q.options.forEach((opt, oi) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = opt;
            btn.addEventListener("click", () => {
              progress[key][qi] = oi;
              opts.querySelectorAll("button").forEach((b, idx) => {
                b.classList.toggle("correct", idx === q.answer);
                b.classList.toggle("wrong", idx === oi && oi !== q.answer);
              });
              fb.textContent =
                oi === q.answer
                  ? "✓ " + (q.explain || "Correct")
                  : "✗ " + (q.explain || "Try again");
              updateBadge();
            });
            opts.appendChild(btn);
          });
          card.appendChild(opts);
          card.appendChild(fb);
          quizEl.appendChild(card);
        });
        updateBadge();
      }

      function updateBadge() {
        let correct = 0,
          total = 0;
        modules.forEach((m, i) => {
          const saved = progress[m.id || String(i)] || {};
          (m.quiz || []).forEach((q, qi) => {
            total++;
            if (saved[qi] === q.answer) correct++;
          });
        });
        badgeEl.textContent = `${correct} / ${total} CORRECT`;
      }

      function selectModule(idx) {
        if (!modules.length || idx < 0 || idx >= modules.length) return;
        activeIdx = idx;
        const mod = modules[idx];
        moduleList
          .querySelectorAll(".mod-btn")
          .forEach((b) =>
            b.classList.toggle("active", Number(b.dataset.idx) === idx),
          );
        buildControls(mod);
        buildLesson(mod);
        buildQuiz(mod);
        clearContent();
        camera.position.set(4.8, 3.6, 5.8);
        controls.target.set(0, 0, 0);
        controls.update();
        chartEl.style.display = "block";
        const _ctx2d = chartEl.getContext("2d");
        if (_ctx2d) _ctx2d.clearRect(0, 0, chartEl.width, chartEl.height);
        renderer.domElement.style.display = "block";
        if (typeof mod.build === "function") mod.build();
        mod._built = true;
        if (typeof mod.update === "function") mod.update();
        renderer.render(scene, camera);
      }

      function onResize() {
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width || stageEl.clientWidth));
        const h = Math.max(1, Math.round(rect.height || stageEl.clientHeight));
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const cw = Math.max(1, Math.round(chartEl.clientWidth || 310));
        const ch = Math.max(1, Math.round(chartEl.clientHeight || 225));
        chartEl.width = Math.round(cw * dpr);
        chartEl.height = Math.round(ch * dpr);
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.update === "function") {
          mod.update();
          renderer.render(scene, camera);
        }
      }

      buildModuleList();
      onResize();
      selectModule(0);
      window.addEventListener("resize", onResize);
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);

      let last = performance.now();
      function animate(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.tick === "function") mod.tick(dt);
        controls.update();
        if (
          !Number.isFinite(camera.position.x) ||
          !Number.isFinite(camera.position.y) ||
          !Number.isFinite(camera.position.z)
        ) {
          camera.position.set(4.8, 3.6, 5.8);
          controls.target.set(0, 0, 0);
          controls.update();
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    </script>
  </body>
</html>
