<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maxwell's Equations — Interactive 3D</title>

<style>
  :root {
    --bg: #0b0f19;
    --panel: rgba(15, 23, 42, 0.82);
    --border: rgba(56, 189, 248, 0.22);
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --e: #38bdf8;
    --b: #f472b6;
    --j: #fbbf24;
    --d: #34d399;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- Control panel ---------- */
  #panel {
    position: fixed; top: 16px; right: 16px; width: 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    font-size: 12px;
    overflow: hidden;
    z-index: 10;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(56,189,248,0.15);
    cursor: pointer;
    user-select: none;
  }
  .panel-header .title { font-weight: 600; letter-spacing: 0.02em; color: #f1f5f9; }
  .panel-header .title span { color: var(--accent); }
  #collapse-btn {
    background: transparent; border: 1px solid var(--border); color: var(--accent);
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer;
    font-size: 14px; line-height: 1; padding: 0;
  }
  #collapse-btn:hover { background: rgba(56,189,248,0.15); }
  .panel-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .panel-body.collapsed { display: none; }

  .group-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin-bottom: 4px;
  }
  select {
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: rgba(2, 6, 23, 0.7); color: var(--text);
    border: 1px solid rgba(56,189,248,0.25); font-size: 12px; outline: none;
  }
  select:focus { border-color: var(--accent); }

  .slider-row { display: flex; flex-direction: column; gap: 4px; }
  .slider-row .row-top { display: flex; justify-content: space-between; align-items: center; }
  .slider-row .row-top .name { color: var(--muted); font-size: 11px; }
  .slider-row .row-top .val { color: var(--accent); font-variant-numeric: tabular-nums; font-size: 11px; }
  input[type="range"] {
    width: 100%; height: 4px; border-radius: 2px;
    background: rgba(56,189,248,0.2); outline: none; -webkit-appearance: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(56,189,248,0.6);
  }
  input[type="range"]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--accent);
    cursor: pointer; border: none;
  }

  .btn-row { display: flex; gap: 8px; }
  button.action {
    flex: 1; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    background: rgba(56,189,248,0.12); color: var(--accent);
    border: 1px solid rgba(56,189,248,0.35); font-size: 12px; font-weight: 600;
  }
  button.action:hover { background: rgba(56,189,248,0.22); }
  button.action.active { background: rgba(56,189,248,0.3); color: #fff; }

  .check-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 11px; }
  .check-row input[type="checkbox"] { accent-color: var(--accent); }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; left: 16px; bottom: 16px; width: 400px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    padding: 14px 16px;
    font-size: 12px;
    z-index: 10;
  }
  #hud .hud-title { font-weight: 600; color: #f1f5f9; margin-bottom: 8px; font-size: 13px; }
  #hud .eq { margin: 6px 0; color: #cbd5e1; min-height: 22px; }
  #hud .eq .katex { font-size: 1.05em; }
  #hud .value-row {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    padding-top: 10px; border-top: 1px solid rgba(56,189,248,0.15);
  }
  #hud .value-label { color: var(--muted); font-size: 11px; }
  #hud .value {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 16px; color: var(--accent); font-variant-numeric: tabular-nums;
  }
  #hud .badge {
    padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
  }
  #hud .badge.zero { background: rgba(148,163,184,0.2); color: #cbd5e1; }
  #hud .badge.pos  { background: rgba(52,211,153,0.2); color: #34d399; }
  #hud .badge.neg  { background: rgba(248,113,113,0.2); color: #f87171; }
  #hud .note { margin-top: 8px; color: var(--muted); font-size: 11px; line-height: 1.4; }

  .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 10px; color: var(--muted); }
  .legend .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }

  @media (max-width: 720px) {
    #panel { width: 260px; }
    #hud { width: calc(100% - 32px); }
  }
</style>

<!-- ================= CONTROL PANEL ================= -->
<div id="panel">
  <div class="panel-header" id="panel-header">
    <div class="title">Maxwell <span>3D</span></div>
    <button id="collapse-btn" aria-label="Collapse panel">−</button>
  </div>

  <div class="panel-body" id="panel-body">
    <div>
      <div class="group-label">Equation / Preset</div>
      <select id="preset-select">
        <optgroup label="Gauss's Law for Electricity">
          <option value="A">A · Point Charge (+Q / −Q)</option>
          <option value="B">B · Infinite Line Charge</option>
          <option value="C">C · Parallel Plate Capacitor</option>
        </optgroup>
        <optgroup label="Gauss's Law for Magnetism">
          <option value="D">D · Magnetic Dipole / Bar Magnet</option>
        </optgroup>
        <optgroup label="Faraday's Law">
          <option value="E">E · Time-Varying Solenoid</option>
        </optgroup>
        <optgroup label="Ampère–Maxwell Law">
          <option value="F">F · Straight Current-Carrying Wire</option>
          <option value="G">G · Charging Capacitor</option>
        </optgroup>
      </select>
    </div>

    <div>
      <div class="group-label">Integration Surface / Contour</div>
      <select id="surface-select">
        <option value="none">None (Field Only)</option>
        <option value="sphere">Closed Sphere (Gaussian)</option>
        <option value="cylinder">Closed Cylinder / Pillbox</option>
        <option value="cube">Closed Cube / Box</option>
        <option value="sheet">Flat Rectangular Sheet</option>
        <option value="loop-circle">Circular Amperian Loop</option>
        <option value="loop-rect">Rectangular Amperian Loop</option>
      </select>
    </div>

    <div class="slider-row">
      <div class="row-top"><span class="name">Surface Scale / Radius R</span><span class="val" id="val-R">1.20</span></div>
      <input type="range" id="slider-R" min="0.4" max="2.5" step="0.01" value="1.2" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Position X</span><span class="val" id="val-X">0.00</span></div>
      <input type="range" id="slider-X" min="-2.5" max="2.5" step="0.01" value="0" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Position Y</span><span class="val" id="val-Y">0.00</span></div>
      <input type="range" id="slider-Y" min="-2.5" max="2.5" step="0.01" value="0" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Position Z</span><span class="val" id="val-Z">0.00</span></div>
      <input type="range" id="slider-Z" min="-2.5" max="2.5" step="0.01" value="0" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Tilt X (°)</span><span class="val" id="val-tiltX">0</span></div>
      <input type="range" id="slider-tiltX" min="-180" max="180" step="1" value="0" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Spin Y (°)</span><span class="val" id="val-spinY">0</span></div>
      <input type="range" id="slider-spinY" min="-180" max="180" step="1" value="0" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Field Density</span><span class="val" id="val-density">7</span></div>
      <input type="range" id="slider-density" min="3" max="10" step="1" value="7" />
    </div>
    <div class="slider-row">
      <div class="row-top"><span class="name">Frequency ω</span><span class="val" id="val-omega">1.50</span></div>
      <input type="range" id="slider-omega" min="0.2" max="5" step="0.05" value="1.5" />
    </div>

    <div class="btn-row">
      <button class="action active" id="btn-play">Pause</button>
      <button class="action" id="btn-reset">Reset</button>
    </div>

    <div class="check-row">
      <input type="checkbox" id="chk-normals" />
      <label for="chk-normals">Show surface normals (d𝐬)</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="chk-arrows" checked />
      <label for="chk-arrows">Show field arrows</label>
    </div>
    <div class="check-row">
      <input type="checkbox" id="chk-negative" />
      <label for="chk-negative">Negative charge (−Q) — Preset A</label>
    </div>
  </div>
</div>

<!-- ================= HUD ================= -->
<div id="hud">
  <div class="hud-title" id="hud-title">Gauss's Law for Electricity</div>
  <div class="eq" id="hud-integral"></div>
  <div class="eq" id="hud-differential"></div>
  <div class="value-row">
    <span class="value-label" id="hud-quantity-label">Φ_D</span>
    <span class="value" id="hud-value">—</span>
    <span class="badge zero" id="hud-badge">—</span>
  </div>

<!-- ================= APP ================= -->
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. STATE
   ============================================================ */
const state = {
  preset: 'A',
  surface: 'none',
  R: 1.2,
  pos: { x: 0, y: 0, z: 0 },
  tiltX: 0,
  spinY: 0,
  density: 7,
  omega: 1.5,
  playing: true,
  t: 0,
  chargeSign: 1,
  showNormals: false,
  showArrows: true,
};

/* ============================================================
   2. RENDERER / SCENE / CAMERA
   ============================================================ */
const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0b0f19, 1);
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0f19, 0.035);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(4.6, 3.6, 5.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 2;
controls.maxDistance = 22;

/* ============================================================
   3. LIGHTING
   ============================================================ */
scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
dirLight.position.set(5, 8, 6);
scene.add(dirLight);
const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.35);
rimLight.position.set(-6, -3, -5);
scene.add(rimLight);

/* ============================================================
   4. COORDINATE GRID + AXES + LABELS
   ============================================================ */
const grid = new THREE.GridHelper(8, 16, 0x1e293b, 0x1e293b);
grid.position.y = -2.2;
scene.add(grid);

function axisLine(color, from, to) {
  const geo = new THREE.BufferGeometry().setFromPoints([from, to]);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.85 });
  return new THREE.Line(geo, mat);
}
scene.add(axisLine(0xef4444, new THREE.Vector3(-3.2, 0, 0), new THREE.Vector3(3.2, 0, 0)));
scene.add(axisLine(0x22c55e, new THREE.Vector3(0, -3.2, 0), new THREE.Vector3(0, 3.2, 0)));
scene.add(axisLine(0x3b82f6, new THREE.Vector3(0, 0, -3.2), new THREE.Vector3(0, 0, 3.2)));

function makeLabel(text, color) {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 128, 64);
  ctx.fillStyle = color;
  ctx.font = 'bold 44px ui-sans-serif, system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 34);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
  const sprite = new THREE.Sprite(mat);
  sprite.scale.set(0.55, 0.275, 1);
  return sprite;
}
const labelX = makeLabel('X', '#ef4444'); labelX.position.set(3.45, 0, 0); scene.add(labelX);
const labelY = makeLabel('Y', '#22c55e'); labelY.position.set(0, 3.45, 0); scene.add(labelY);
const labelZ = makeLabel('Z', '#3b82f6'); labelZ.position.set(0, 0, 3.45); scene.add(labelZ);

/* ============================================================
   5. FIELD FUNCTIONS
   ============================================================ */
const V = (x, y, z) => new THREE.Vector3(x, y, z);

/* --- Gauss's Law for Electricity --- */

function fPointCharge(x, y, z, t) {
  const r2 = x * x + y * y + z * z;
  const r = Math.sqrt(r2);
  if (r < 0.18) return V(0, 0, 0);
  const q = state.chargeSign;
  const mag = q / r2;
  return V(x / r, y / r, z / r).multiplyScalar(mag);
}

function fLineCharge(x, y, z, t) {
  const r = Math.hypot(x, z);
  if (r < 0.14) return V(0, 0, 0);
  const mag = 0.9 / r;
  return V(x / r, 0, z / r).multiplyScalar(mag);
}

function fPlates(x, y, z, t) {
  const d = 0.55, hw = 1.0;
  const ay = Math.abs(y), ax = Math.abs(x), az = Math.abs(z);
  const inside = ay < d && ax < hw && az < hw;
  const fy = Math.exp(-Math.max(0, ay - d) * 3.0);
  const fx = Math.exp(-Math.max(0, ax - hw) * 3.0);
  const fz = Math.exp(-Math.max(0, az - hw) * 3.0);
  const base = inside ? 1.0 : 0.6 * fy * fx * fz;
  const ex = Math.sign(x) * Math.max(0, ax - hw) * 0.35;
  const ez = Math.sign(z) * Math.max(0, az - hw) * 0.35;
  const ey = Math.sign(y) * Math.max(0, ay - d) * 0.35;
  return V(ex, -base + ey, ez);
}

/* --- Gauss's Law for Magnetism --- */

function fDipole(x, y, z, t) {
  const r2 = x * x + y * y + z * z;
  const r = Math.sqrt(r2);
  if (r < 0.28) return V(0, 0, 0);
  const rh = V(x / r, y / r, z / r);
  const m = V(0, 1, 0);
  const dot = rh.y;
  return rh.clone().multiplyScalar(3 * dot).sub(m).multiplyScalar(1 / (r * r * r));
}

/* --- Faraday's Law --- */

function fSolenoidB(x, y, z, t) {
  const r = Math.hypot(x, z);
  const R = 0.7;
  if (r > R) return V(0, 0, 0);
  const val = Math.cos(state.omega * t);
  return V(0, val, 0);
}

function fSolenoidE(x, y, z, t) {
  const r = Math.hypot(x, z);
  if (r < 0.06) return V(0, 0, 0);
  const R = 0.7;
  const dBdt = -state.omega * Math.sin(state.omega * t);
  const Ephi = -dBdt * (r < R ? r / 2 : (R * R) / (2 * r));
  const phi = V(z, 0, -x).multiplyScalar(1 / r);
  return phi.multiplyScalar(Ephi);
}

/* --- Ampère–Maxwell Law --- */

function fWireB(x, y, z, t) {
  const r = Math.hypot(x, z);
  if (r < 0.14) return V(0, 0, 0);
  const mag = 0.8 / r;
  return V(z, 0, -x).multiplyScalar(mag / r);
}

function fCapE(x, y, z, t) {
  const d = 0.55, hw = 0.9;
  const ay = Math.abs(y), ax = Math.abs(x), az = Math.abs(z);
  if (ay < d && ax < hw && az < hw) {
    const val = Math.sin(state.omega * t);
    return V(0, -val, 0);
  }
  return V(0, 0, 0);
}

function fCapDdt(x, y, z, t) {
  const d = 0.55, hw = 0.9;
  const ay = Math.abs(y), ax = Math.abs(x), az = Math.abs(z);
  if (ay < d && ax < hw && az < hw) {
    const val = state.omega * Math.cos(state.omega * t);
    return V(0, -val, 0);
  }
  return V(0, 0, 0);
}

function fCapJ(x, y, z, t) {
  const r = Math.hypot(x, z);
  if (r < 0.09 && Math.abs(y) > 0.55) {
    return V(0, 1, 0);
  }
  return V(0, 0, 0);
}

function fCapB(x, y, z, t) {
  const r = Math.hypot(x, z);
  if (r < 0.14) return V(0, 0, 0);
  const mag = 0.6 / r;
  return V(z, 0, -x).multiplyScalar(mag / r);
}

/* ============================================================
   6. PRESETS
   ============================================================ */
const PRESETS = {
  A: {
    label: 'Point Charge',
    law: 'gaussE',
    primary: 'E',
    dynamic: false,
    fields: [{ key: 'E', color: 0x38bdf8, fn: fPointCharge }],
    extras: buildChargeExtras,
  },
  B: {
    label: 'Infinite Line Charge',
    law: 'gaussE',
    primary: 'E',
    dynamic: false,
    fields: [{ key: 'E', color: 0x38bdf8, fn: fLineCharge }],
    extras: buildLineChargeExtras,
  },
  C: {
    label: 'Parallel Plate Capacitor',
    law: 'gaussE',
    primary: 'E',
    dynamic: false,
    fields: [{ key: 'E', color: 0x38bdf8, fn: fPlates }],
    extras: buildPlatesExtras,
  },
  D: {
    label: 'Magnetic Dipole',
    law: 'gaussB',
    primary: 'B',
    dynamic: false,
    fields: [{ key: 'B', color: 0xf472b6, fn: fDipole }],
    extras: buildDipoleExtras,
  },
  E: {
    label: 'Time-Varying Solenoid',
    law: 'faraday',
    primary: 'E',
    dynamic: true,
    fields: [
      { key: 'B', color: 0xf472b6, fn: fSolenoidB },
      { key: 'E', color: 0x38bdf8, fn: fSolenoidE },
    ],
    extras: buildSolenoidExtras,
  },
  F: {
    label: 'Straight Current Wire',
    law: 'ampere',
    primary: 'B',
    dynamic: false,
    fields: [{ key: 'B', color: 0xf472b6, fn: fWireB }],
    extras: buildWireExtras,
  },
  G: {
    label: 'Charging Capacitor',
    law: 'ampere',
    primary: 'B',
    dynamic: true,
    fields: [
      { key: 'E', color: 0x38bdf8, fn: fCapE },
      { key: 'B', color: 0xf472b6, fn: fCapB },
      { key: 'J', color: 0xfbbf24, fn: fCapJ },
      { key: 'Ddt', color: 0x34d399, fn: fCapDdt },
    ],
    extras: buildCapacitorExtras,
  },
};

/* ============================================================
   7. LAWS / EQUATION METADATA
   ============================================================ */
const LAWS = {
  gaussE: {
    name: "Gauss's Law for Electricity",
    integral: "\\oint_{\\partial V} \\mathbf{D}\\cdot d\\mathbf{s} = Q_{\\text{enc}}",
    differential: "\\nabla\\cdot\\mathbf{D} = \\rho",
    quantity: "\\Phi_D",
    kind: "flux",
  },
  gaussB: {
    name: "Gauss's Law for Magnetism",
    integral: "\\oint_{\\partial V} \\mathbf{B}\\cdot d\\mathbf{s} = 0",
    differential: "\\nabla\\cdot\\mathbf{B} = 0",
    quantity: "\\Phi_B",
    kind: "flux",
  },
  faraday: {
    name: "Faraday's Law",
    integral: "\\oint_{\\partial S} \\mathbf{E}\\cdot d\\mathbf{L} = -\\dfrac{d\\Phi_B}{dt}",
    differential: "\\nabla\\times\\mathbf{E} = -\\dfrac{\\partial \\mathbf{B}}{\\partial t}",
    quantity: "\\Gamma_E",
    kind: "circulation",
  },
  ampere: {
    name: "Ampère–Maxwell Law",
    integral: "\\oint_{\\partial S} \\mathbf{H}\\cdot d\\mathbf{L} = I_{\\text{enc}} + \\dfrac{d\\Phi_D}{dt}",
    differential: "\\nabla\\times\\mathbf{H} = \\mathbf{J} + \\dfrac{\\partial \\mathbf{D}}{\\partial t}",
    quantity: "\\Gamma_H",
    kind: "circulation",

/* ============================================================
   9. FIELD ARROW SYSTEM (instanced cones + shafts)
   ============================================================ */
const arrowGroup = new THREE.Group();
scene.add(arrowGroup);

const MAX_ARROWS = 1400;
const shaftGeo = new THREE.CylinderGeometry(0.012, 0.012, 1, 6, 1, true);
shaftGeo.translate(0, 0.5, 0);
const headGeo = new THREE.ConeGeometry(0.045, 0.16, 8);
headGeo.translate(0, 0.08, 0);

const shaftMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.35,
  roughness: 0.5, metalness: 0.2, transparent: true, opacity: 0.9,
});
const headMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.55,
  roughness: 0.4, metalness: 0.2, transparent: true, opacity: 0.95,
});

const shaftMesh = new THREE.InstancedMesh(shaftGeo, shaftMat, MAX_ARROWS);
const headMesh = new THREE.InstancedMesh(headGeo, headMat, MAX_ARROWS);
shaftMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
headMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
shaftMesh.frustumCulled = false;
headMesh.frustumCulled = false;
arrowGroup.add(shaftMesh, headMesh);

const dummy = new THREE.Object3D();
const upY = new THREE.Vector3(0, 1, 0);

function updateArrows() {
  const preset = PRESETS[state.preset];
  const n = state.density;
  const half = 2.2;
  const step = (half * 2) / (n - 1);

  let idx = 0;
  const tmp = new THREE.Vector3();
  const dir = new THREE.Vector3();

  for (let i = 0; i < n; i++) {
    for (let j = 0; j < n; j++) {
      for (let k = 0; k < n; k++) {
        if (idx >= MAX_ARROWS) break;
        const x = -half + i * step;
        const y = -half + j * step;
        const z = -half + k * step;

        // pick the field to display
        let fieldObj = preset.fields[0];
        if (preset.fields.length > 1) {
          // choose dominant field by magnitude
          let best = -1;
          for (const f of preset.fields) {
            const v = f.fn(x, y, z, state.t);
            const m = v.length();
            if (m > best) { best = m; fieldObj = f; }
          }
        }
        const v = fieldObj.fn(x, y, z, state.t);
        const mag = v.length();
        if (mag < 1e-4) {
          dummy.position.set(x, y, z);
          dummy.scale.set(0, 0, 0);
          dummy.updateMatrix();
          shaftMesh.setMatrixAt(idx, dummy.matrix);
          headMesh.setMatrixAt(idx, dummy.matrix);
          idx++;
          continue;
        }

        dir.copy(v).normalize();
        const len = Math.min(0.55, 0.16 + Math.log1p(mag) * 0.16);

        // shaft
        dummy.position.set(x, y, z);
        dummy.quaternion.setFromUnitVectors(upY, dir);
        dummy.scale.set(1, len, 1);
        dummy.updateMatrix();
        shaftMesh.setMatrixAt(idx, dummy.matrix);

        // head at tip
        tmp.copy(dir).multiplyScalar(len);
        dummy.position.set(x + tmp.x, y + tmp.y, z + tmp.z);
        dummy.quaternion.setFromUnitVectors(upY, dir);
        dummy.scale.set(1, 1, 1);
        dummy.updateMatrix();
        headMesh.setMatrixAt(idx, dummy.matrix);

        idx++;
      }
    }
  }

  // hide unused instances
  for (let i = idx; i < MAX_ARROWS; i++) {
    dummy.position.set(0, 0, 0);
    dummy.scale.set(0, 0, 0);
    dummy.updateMatrix();
    shaftMesh.setMatrixAt(i, dummy.matrix);
    headMesh.setMatrixAt(i, dummy.matrix);
  }

  shaftMesh.count = idx;
  headMesh.count = idx;
  shaftMesh.instanceMatrix.needsUpdate = true;
  headMesh.instanceMatrix.needsUpdate = true;

  // color by field type
  const c = new THREE.Color(fieldColorFor(preset));
  shaftMat.color.copy(c);
  shaftMat.emissive.copy(c);
  headMat.color.copy(c);
  headMat.emissive.copy(c);
}

function fieldColorFor(preset) {
  // dominant field color
  if (preset.fields.length === 1) return preset.fields[0].color;
  return preset.fields[0].color;
}

/* ============================================================
   10. SURFACE / CONTOUR GEOMETRY
   ============================================================ */
const surfaceGroup = new THREE.Group();
scene.add(surfaceGroup);

const normalGroup = new THREE.Group();
scene.add(normalGroup);

let surfaceData = null; // { type, triangles:[{a,b,c,normal}], loop:[Vector3...], closed }

function disposeGroup(g) {
  g.traverse((o) => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  });
  while (g.children.length) g.remove(g.children[0]);
}

function buildSurface() {
  disposeGroup(surfaceGroup);
  disposeGroup(normalGroup);
  surfaceData = null;

  const type = state.surface;
  if (type === 'none') return;

  const R = state.R;
  const mat = new THREE.MeshStandardMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.12,
    side: THREE.DoubleSide,
    roughness: 0.6,
    metalness: 0.1,
    depthWrite: false,
  });
  const edgeMat = new THREE.LineBasicMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.85 });

  const group = new THREE.Group();

  if (type === 'sphere') {
    const geo = new THREE.SphereGeometry(R, 32, 24);
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);
    const wire = new THREE.Mesh(
      new THREE.SphereGeometry(R, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0x7dd3fc, wireframe: true, transparent: true, opacity: 0.25 })
    );
    group.add(wire);
    surfaceData = { type: 'closed', triangles: sphereTriangles(R, 24, 16), loop: null };
  } else if (type === 'cylinder') {
    const h = R * 1.4;
    const geo = new THREE.CylinderGeometry(R, R, h, 32, 1, false);
    group.add(new THREE.Mesh(geo, mat));
    const wire = new THREE.Mesh(
      new THREE.CylinderGeometry(R, R, h, 16, 1, true),
      new THREE.MeshBasicMaterial({ color: 0x7dd3fc, wireframe: true, transparent: true, opacity: 0.25 })
    );
    group.add(wire);
    surfaceData = { type: 'closed', triangles: cylinderTriangles(R, h, 32, 8), loop: null };
  } else if (type === 'cube') {
    const s = R * 1.6;
    const geo = new THREE.BoxGeometry(s, s, s);
    group.add(new THREE.Mesh(geo, mat));
    const wire = new THREE.Mesh(
      new THREE.BoxGeometry(s, s, s),
      new THREE.MeshBasicMaterial({ color: 0x7dd3fc, wireframe: true, transparent: true, opacity: 0.25 })
    );
    group.add(wire);
    surfaceData = { type: 'closed', triangles: boxTriangles(s), loop: null };
  } else if (type === 'sheet') {
    const s = R * 2.0;
    const geo = new THREE.PlaneGeometry(s, s, 16, 16);
    const mesh = new THREE.Mesh(geo, mat);
    group.add(mesh);
    const edges = new THREE.LineSegments(
      new THREE.EdgesGeometry(geo),
      edgeMat
    );
    group.add(edges);
    surfaceData = { type: 'open', triangles: planeTriangles(s, s, 16, 16), loop: null };
  } else if (type === 'loop-circle') {
    const pts = [];
    const seg = 96;
    for (let i = 0; i < seg; i++) {
      const a = (i / seg) * Math.PI * 2;
      pts.push(new THREE.Vector3(Math.cos(a) * R, 0, Math.sin(a) * R));
    }
    const curve = new THREE.CatmullRomCurve3(pts, true);
    const tube = new THREE.TubeGeometry(curve, 96, 0.02, 8, true);
    group.add(new THREE.Mesh(tube, new THREE.MeshStandardMaterial({
      color: 0x7dd3fc, emissive: 0x7dd3fc, emissiveIntensity: 0.5, roughness: 0.4,
    })));
    surfaceData = { type: 'loop', triangles: null, loop: pts };
    addTangentArrows(group, pts, 12);
  } else if (type === 'loop-rect') {
    const s = R * 1.6;
    const pts = [
      new THREE.Vector3(-s, 0, -s),
      new THREE.Vector3(s, 0, -s),
      new THREE.Vector3(s, 0, s),
      new THREE.Vector3(-s, 0, s),
    ];
    const curve = new THREE.CatmullRomCurve3(pts, true);
    const tube = new THREE.TubeGeometry(curve, 64, 0.02, 8, true);
    group.add(new THREE.Mesh(tube, new THREE.MeshStandardMaterial({
      color: 0x7dd3fc, emissive: 0x7dd3fc, emissiveIntensity: 0.5, roughness: 0.4,
    })));
    surfaceData = { type: 'loop', triangles: null, loop: pts };
    addTangentArrows(group, pts, 12);
  }

  // transform
  group.position.set(state.pos.x, state.pos.y, state.pos.z);
  group.rotation.x = THREE.MathUtils.degToRad(state.tiltX);
  group.rotation.y = THREE.MathUtils.degToRad(state.spinY);

  surfaceGroup.add(group);

  // normals
  if (state.showNormals && surfaceData && surfaceData.triangles) {
    buildNormals();
  }
}

function addTangentArrows(group, pts, count) {
  const n = pts.length;
  const mat = new THREE.MeshStandardMaterial({
    color: 0x34d399, emissive: 0x34d399, emissiveIntensity: 0.6, roughness: 0.4,
  });
  for (let i = 0; i < count; i++) {
    const idx = Math.floor((i / count) * n);
    const p = pts[idx];
    const q = pts[(idx + 1) % n];
    const dir = q.clone().sub(p).normalize();
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.035, 0.12, 8), mat);
    arrow.position.copy(p);
    arrow.quaternion.setFromUnitVectors(upY, dir);
    group.add(arrow);
  }
}

/* --- triangle generators (world-local, before transform) --- */
function sphereTriangles(R, segU, segV) {
  const tris = [];
  for (let i = 0; i < segU; i++) {
    for (let j = 0; j < segV; j++) {
      const u0 = (i / segU) * Math.PI * 2;
      const u1 = ((i + 1) / segU) * Math.PI * 2;
      const v0 = (j / segV) * Math.PI;
      const v1 = ((j + 1) / segV) * Math.PI;
      const p = (u, v) => new THREE.Vector3(
        R * Math.sin(v) * Math.cos(u),
        R * Math.cos(v),
        R * Math.sin(v) * Math.sin(u)
      );
      const a = p(u0, v0), b = p(u1, v0), c = p(u1, v1), d = p(u0, v1);
      tris.push({ a, b, c });
      tris.push({ a, c, d });
    }
  }
  return tris;
}

function cylinderTriangles(R, h, seg, segH) {
  const tris = [];
  const y0 = -h / 2, y1 = h / 2;
  // side
  for (let i = 0; i < seg; i++) {
    const u0 = (i / seg) * Math.PI * 2;
    const u1 = ((i + 1) / seg) * Math.PI * 2;
    for (let j = 0; j < segH; j++) {
      const yy0 = y0 + (j / segH) * h;
      const yy1 = y0 + ((j + 1) / segH) * h;
      const a = new THREE.Vector3(Math.cos(u0) * R, yy0, Math.sin(u0) * R);
      const b = new THREE.Vector3(Math.cos(u1) * R, yy0, Math.sin(u1) * R);
      const c = new THREE.Vector3(Math.cos(u1) * R, yy1, Math.sin(u1) * R);
      const d = new THREE.Vector3(Math.cos(u0) * R, yy1, Math.sin(u0) * R);
      // outward winding
      tris.push({ a, b, c: d });
      tris.push({ a, b: c, c: d });
    }
  }
  // caps
  for (let i = 0; i < seg; i++) {
    const u0 = (i / seg) * Math.PI * 2;
    const u1 = ((i + 1) / seg) * Math.PI * 2;
    const c0 = new THREE.Vector3(0, y1, 0);
    const c1 = new THREE.Vector3(0, y0, 0);
    tris.push({ a: c0, b: new THREE.Vector3(Math.cos(u1) * R, y1, Math.sin(u1) * R), c: new THREE.Vector3(Math.cos(u0) * R, y1, Math.sin(u0) * R) });
    tris.push({ a: c1, b: new THREE.Vector3(Math.cos(u0) * R, y0, Math.sin(u0) * R), c: new THREE.Vector3(Math.cos(u1) * R, y0, Math.sin(u1) * R) });
  }
  return tris;
}

function boxTriangles(s) {
  const h = s / 2;
  const v = [
    new THREE.Vector3(-h, -h, -h), new THREE.Vector3(h, -h, -h),
    new THREE.Vector3(h, h, -h), new THREE.Vector3(-h, h, -h),
    new THREE.Vector3(-h, -h, h), new THREE.Vector3(h, -h, h),
    new THREE.Vector3(h, h, h), new THREE.Vector3(-h, h, h),
  ];
  const faces = [
    [0, 3, 2, 1], [4, 5, 6, 7],
    [0, 1, 5, 4], [3, 7, 6, 2],
    [0, 4, 7, 3], [1, 2, 6, 5],
  ];
  const tris = [];
  for (const f of faces) {
    tris.push({ a: v[f[0]], b: v[f[1]], c: v[f[2]] });
    tris.push({ a: v[f[0]], b: v[f[2]], c: v[f[3]] });
  }
  return tris;
}

function planeTriangles(w, h, segX, segY) {
  const tris = [];
  for (let i = 0; i < segX; i++) {
    for (let j = 0; j < segY; j++) {
      const x0 = -w / 2 + (i / segX) * w;
      const x1 = -w / 2 + ((i + 1) / segX) * w;
      const y0 = -h / 2 + (j / segY) * h;
      const y1 = -h / 2 + ((j + 1) / segY) * h;
      const a = new THREE.Vector3(x0, y0, 0);
      const b = new THREE.Vector3(x1, y0, 0);
      const c = new THREE.Vector3(x1, y1, 0);
      const d = new THREE.Vector3(x0, y1, 0);
      tris.push({ a, b, c });
      tris.push({ a, c, d });
    }
  }
  return tris;
}

/* --- normals --- */
function buildNormals() {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({
    color: 0x7dd3fc, emissive: 0x7dd3fc, emissiveIntensity: 0.5, roughness: 0.4,
  });
  const tris = surfaceData.triangles;
  const step = Math.max(1, Math.floor(tris.length / 60));
  for (let i = 0; i < tris.length; i += step) {
    const { a, b, c } = tris[i];
    const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a)).normalize();
    const center = new THREE.Vector3().add(a).add(b).add(c).multiplyScalar(1 / 3);
    const arrow = new THREE.Mesh(new THREE.ConeGeometry(0.025, 0.09, 6), mat);
    arrow.position.copy(center);
    arrow.quaternion.setFromUnitVectors(upY, n);
    group.add(arrow);
  }
  group.position.copy(surfaceGroup.children[0].position);
  group.rotation.copy(surfaceGroup.children[0].rotation);
  normalGroup.add(group);
}

/* ============================================================
   11. FLUX / CIRCULATION INTEGRATION
   ============================================================ */
function fieldForLaw(law) {
  const preset = PRESETS[state.preset];
  if (law === 'gaussE') return preset.fields.find(f => f.key === 'E') || preset.fields[0];
  if (law === 'gaussB') return preset.fields.find(f => f.key === 'B') || preset.fields[0];
  if (law === 'faraday') return preset.fields.find(f => f.key === 'E') || preset.fields[0];
  if (law === 'ampere') return preset.fields.find(f => f.key === 'B') || preset.fields[0];
  return preset.fields[0];
}

function computeIntegral() {
  if (!surfaceData) return null;
  const law = PRESETS[state.preset].law;
  const field = fieldForLaw(law);

  const group = surfaceGroup.children[0];
  if (!group) return null;

  const pos = group.position;
  const rot = group.rotation;

  if (surfaceData.type === 'closed' || surfaceData.type === 'open') {
    let flux = 0;
    for (const tri of surfaceData.triangles) {
      const a = tri.a.clone().applyEuler(rot).add(pos);
      const b = tri.b.clone().applyEuler(rot).add(pos);
      const c = tri.c.clone().applyEuler(rot).add(pos);
      const n = new THREE.Vector3().subVectors(b, a).cross(new THREE.Vector3().subVectors(c, a));
      const area = n.length() * 0.5;
      if (area < 1e-9) continue;
      n.normalize();
      const center = new THREE.Vector3().add(a).add(b).add(c).multiplyScalar(1 / 3);
      const F = field.fn(center.x, center.y, center.z, state.t);
      flux += F.dot(n) * area;
    }
    return { value: flux, kind: 'flux' };
  }

  if (surfaceData.type === 'loop') {
    const pts = surfaceData.loop.map(p => p.clone().applyEuler(rot).add(pos));
    let circ = 0;
    const n = pts.length;
    for (let i = 0; i < n; i++) {
      const p0 = pts[i];
      const p1 = pts[(i + 1) % n];
      const mid = new THREE.Vector3().add(p0).add(p1).multiplyScalar(0.5);
      const dl = new THREE.Vector3().subVectors(p1, p0);
      const F = field.fn(mid.x, mid.y, mid.z, state.t);
      circ += F.dot(dl);
    }
    return { value: circ, kind: 'circulation' };
  }
  return null;
}

  if (window.katex) {
    try {
      katex.render(tex, el, { throwOnError: false, displayMode: true });
      return;
    } catch (e) { /* fall through */ }
  }
  el.textContent = tex.replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '');
}

function updateHUD() {
  const preset = PRESETS[state.preset];
  const law = LAWS[preset.law];

  hudTitle.textContent = law.name + ' — ' + preset.label;
  renderMath(hudIntegral, law.integral);
  renderMath(hudDifferential, law.differential);
  hudQuantityLabel.textContent = law.kind === 'flux' ? 'Φ' : 'Γ';

  const res = computeIntegral();
  if (!res) {
    hudValue.textContent = '—';
    hudBadge.textContent = 'no surface';
    hudBadge.className = 'badge zero';
    hudNote.textContent = 'Select an integration surface to compute flux or circulation.';
  } else {
    const v = res.value;
    hudValue.textContent = (v >= 0 ? '+' : '') + v.toFixed(4);
    const eps = 1e-3;
    if (Math.abs(v) < eps) {
      hudBadge.textContent = '≈ 0';
      hudBadge.className = 'badge zero';
    } else if (v > 0) {
      hudBadge.textContent = 'positive';
      hudBadge.className = 'badge pos';
    } else {
      hudBadge.textContent = 'negative';
      hudBadge.className = 'badge neg';
    }
    hudNote.textContent = res.kind === 'flux'
      ? 'Net flux through the surface (Σ F·n ΔA). Move the surface outside the source to see flux → 0.'
      : 'Circulation along the loop (Σ F·dL). Move the loop away from the source to see circulation → 0.';
  }

  // legend
  hudLegend.innerHTML = '';
  for (const f of preset.fields) {
    const span = document.createElement('span');
    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = '#' + f.color.toString(16).padStart(6, '0');
    span.appendChild(dot);
    span.appendChild(document.createTextNode(f.key === 'Ddt' ? '∂D/∂t' : f.key));
    hudLegend.appendChild(span);
  }
}

/* ============================================================
   13. PRESET SWITCHING
   ============================================================ */
const extrasGroup = new THREE.Group();
scene.add(extrasGroup);

function loadPreset(key) {
  state.preset = key;
  disposeGroup(extrasGroup);
  const preset = PRESETS[key];
  const extras = preset.extras();
  extrasGroup.add(extras);
  updateArrows();
  buildSurface();
  updateHUD();
}

});
sliderY.addEventListener('input', (e) => {
  state.pos.y = parseFloat(e.target.value);
  valY.textContent = state.pos.y.toFixed(2);
  buildSurface();
  updateHUD();
});
sliderZ.addEventListener('input', (e) => {
  state.pos.z = parseFloat(e.target.value);
  valZ.textContent = state.pos.z.toFixed(2);

  updateHUD();
});

});

/* ============================================================
   15. ANIMATION LOOP
   ============================================================ */
let lastTime = performance.now();

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (state.playing) {
    state.t += dt * state.omega;
  }

  // dynamic presets need arrow refresh
  const preset = PRESETS[state.preset];
  if (preset.dynamic) {
    updateArrows();
  }

  // live integral
  if (surfaceData) {
    updateHUD();
  }

  controls.update();
  renderer.render(scene, camera);
}

/* ============================================================
   16. RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   17. BOOT
   ============================================================ */
loadPreset('A');
animate();
