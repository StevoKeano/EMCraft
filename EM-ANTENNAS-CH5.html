    // color coding
    const col = closed ? 0x66ff99 : 0xff5566;
    this.targetMat.color.setHex(col);
    this.targetMat.emissive.setHex(closed ? 0x1a5533 : 0x551a1a);
    this.haloMat.color.setHex(col);
    this.linkLine.material.color.setHex(col);
    this.beamMat.color.setHex(closed ? 0x7fd1ff : 0xff8899);
    this.beamMat.opacity = closed ? 0.22 : 0.14;

    // atmospheric layer opacity from Latm
    this.atmMat.opacity = Math.min(0.45, 0.08 + Latm / 60);

    // ---- chart ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);

    // backdrop
    ctx.fillStyle = 'rgba(8,16,26,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,180,220,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    const padL = 42, padR = 14, padT = 26, padB = 30;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // range axis: 0.1R .. 2.0R
    const Rmin = 0.1 * st.R_km;
    const Rmax = 2.0 * st.R_km;

    // compute SNR curve
    const Npts = 160;
    const snrArr = [];
    let minS = 1e9, maxS = -1e9;
    for (let i = 0; i < Npts; i++) {
      const rk = Rmin + (Rmax - Rmin) * i / (Npts - 1);
      const r = rk * 1e3;
      let snr;
      if (isRadar) {
        const pr = (Pt * G * G * lam * lam * sigma) / (Math.pow(4 * Math.PI, 3) * Math.pow(r, 4));
        const latm = 0.004 * rk;
        snr = 10 * Math.log10(pr / N) - latm;
      } else {
        const latm = (st.scenario === '5G mmWave Urban Microcell') ? 0.35 * rk : 0.02 * rk;
        const pr = Pt * G * G * Math.pow(lam / (4 * Math.PI * r), 2) / Math.pow(10, latm / 10);
        snr = 10 * Math.log10(pr / N);
      }
      snrArr.push(snr);
      minS = Math.min(minS, snr);
      maxS = Math.max(maxS, snr);
    }
    // pad y range
    const yLo = Math.floor(minS / 10) * 10 - 10;
    const yHi = Math.ceil(maxS / 10) * 10 + 10;

    const xOf = rk => padL + (rk - Rmin) / (Rmax - Rmin) * plotW;
    const yOf = v => padT + (yHi - v) / (yHi - yLo) * plotH;

    // grid
    ctx.strokeStyle = 'rgba(120,180,220,0.18)';
    ctx.lineWidth = 1;
    for (let v = yLo; v <= yHi; v += 10) {
      const y = yOf(v);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
      ctx.fillStyle = 'rgba(180,210,235,0.75)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'right';
      ctx.fillText(v.toFixed(0), padL - 5, y + 3);
    }
    // x ticks
    const nTicks = 5;
    for (let i = 0; i <= nTicks; i++) {
      const rk = Rmin + (Rmax - Rmin) * i / nTicks;
      const x = xOf(rk);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = 'rgba(180,210,235,0.75)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(rk.toFixed(0), x, padT + plotH + 14);
    }

    // 10 dB threshold
    const yTh = yOf(10);
    ctx.strokeStyle = 'rgba(255,200,80,0.9)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(padL, yTh);
    ctx.lineTo(padL + plotW, yTh);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255,200,80,0.95)';
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('10 dB threshold', padL + 4, yTh - 5);

    // SNR curve
    ctx.strokeStyle = closed ? 'rgba(102,255,153,0.95)' : 'rgba(255,120,140,0.95)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < Npts; i++) {
      const rk = Rmin + (Rmax - Rmin) * i / (Npts - 1);
      const x = xOf(rk), y = yOf(snrArr[i]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // fill under curve
    ctx.fillStyle = closed ? 'rgba(102,255,153,0.10)' : 'rgba(255,120,140,0.10)';
    ctx.beginPath();
    ctx.moveTo(xOf(Rmin), yOf(snrArr[0]));
    for (let i = 1; i < Npts; i++) {
      const rk = Rmin + (Rmax - Rmin) * i / (Npts - 1);
      ctx.lineTo(xOf(rk), yOf(snrArr[i]));
    }
    ctx.lineTo(xOf(Rmax), padT + plotH);
    ctx.lineTo(xOf(Rmin), padT + plotH);
    ctx.closePath();
    ctx.fill();

    // max operational range (where SNR = 10 dB)
    let rMaxOp = null;
    for (let i = 1; i < Npts; i++) {
      if (snrArr[i - 1] >= 10 && snrArr[i] < 10) {
        const rk0 = Rmin + (Rmax - Rmin) * (i - 1) / (Npts - 1);
        const rk1 = Rmin + (Rmax - Rmin) * i / (Npts - 1);
        const t = (snrArr[i - 1] - 10) / (snrArr[i - 1] - snrArr[i]);
        rMaxOp = rk0 + t * (rk1 - rk0);
        break;
      }
    }
    if (rMaxOp !== null) {
      const x = xOf(rMaxOp);
      ctx.strokeStyle = 'rgba(255,200,80,0.85)';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = 'rgba(255,200,80,0.95)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('R_max ' + rMaxOp.toFixed(0) + ' km', x, padT - 6);
    }

    // current operating point
    const curX = xOf(st.R_km);
    const curY = yOf(SNRdB);
    ctx.fillStyle = closed ? '#66ff99' : '#ff5566';
    ctx.beginPath();
    ctx.arc(curX, curY, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // labels
    ctx.fillStyle = 'rgba(200,225,245,0.9)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('SNR (dB) vs Range (km)', padL, 16);
    ctx.textAlign = 'right';
    ctx.fillStyle = closed ? 'rgba(102,255,153,0.9)' : 'rgba(255,120,140,0.9)';
    ctx.fillText(closed ? 'LINK CLOSED' : 'LINK OUTAGE', W - padR, 16);

    if (!Number.isFinite(fspl)) {
      const lam_m = 0.299792458 / Math.max(1e-6, st.freq_GHz);
      const R_m = Math.max(1, st.R_km) * 1000;
      fspl = 20 * Math.log10((4 * Math.PI * R_m) / lam_m);
    }

    // ---- HUD ----
    setHud(
      'Ch. 5 Capstone — ' + modeLabel + ' Budget',
      '\\mathrm{SNR}_{\\mathrm{dB}} = P_{t,\\mathrm{dBm}} + G_t + G_r - \\mathrm{FSPL} - L_{\\mathrm{atm}} - 10\\log_{10}(k_B T_{\\mathrm{sys}} B)',
      [
        { k: 'Antenna Gain G', v: GdB.toFixed(1) + ' dBi' },
        { k: 'HPBW', v: hpbw.toFixed(2) + '°' },
        { k: 'FSPL', v: fspl.toFixed(1) + ' dB' },
        { k: 'Received P_r', v: PrdBm.toFixed(1) + ' dBm' },
        { k: 'System SNR', v: SNRdB.toFixed(1) + ' dB' },
        { k: 'Link Margin', v: margin.toFixed(1) + ' dB' },
        { k: 'Status', v: closed ? 'CLOSED ✓' : 'OUTAGE ✗' }
      ]
    );
  },

  tick(dt) {
    // gentle beam shimmer
    if (this.beamMat) {
      this.beamMat.opacity = 0.16 + 0.06 * Math.sin(performance.now() * 0.0015);
    }
    if (this.halo) {
      const s = 1 + 0.06 * Math.sin(performance.now() * 0.002);
      this.halo.scale.set(s, s, s);
    }
  },

  lesson: `<p>This capstone synthesizes Chapter 5: aperture gain, Friis free-space loss, atmospheric attenuation, thermal noise, and radar range equation.</p>
  <p><b>Aperture gain:</b> \(G = 0.65(\pi D/\lambda)^2\), with half-power beamwidth \(\\mathrm{HPBW} \approx 70\lambda/D\) degrees. Larger dishes concentrate power into a narrower beam.</p>
  <p><b>Link budget:</b> \(P_r = P_t G_t G_r (\lambda/4\pi R)^2 / L_{\\mathrm{atm}}\). Thermal noise is \(N = k_B T_{\\mathrm{sys}} B\), with \(T_{\\mathrm{sys}}=150\\,\\mathrm{K}\) and \(B=20\\,\\mathrm{MHz}\). A practical link requires \(\\mathrm{SNR} \\ge 10\\,\\mathrm{dB}\).</p>
  <p><b>Radar:</b> monostatic radar with target cross-section \(\sigma=10\\,\\mathrm{m}^2\) gives \(P_r = P_t G^2 \lambda^2 \sigma / ((4\pi)^3 R^4)\). The \(R^{-4}\) dependence makes radar range far more sensitive to distance than a one-way link (\(R^{-2}\)).</p>
  <p><b>Limiting cases:</b> doubling \(D\) quadruples gain and halves HPBW; doubling range costs 6 dB in a link but 12 dB in radar; mmWave urban links suffer much larger atmospheric/foliage loss than Ku-band SATCOM.</p>`,

  quiz: [
    { q: 'For a one-way link, doubling the range R increases free-space path loss by approximately:', options: ['3 dB', '6 dB', '12 dB', '20 dB'], answer: 1 },
    { q: 'For monostatic radar, doubling the range R increases the required SNR by approximately:', options: ['3 dB', '6 dB', '12 dB', '20 dB'], answer: 2 },
    { q: 'Doubling the dish diameter D (at fixed frequency) changes the aperture gain G and HPBW respectively as:', options: ['G ×2, HPBW ×2', 'G ×4, HPBW ÷2', 'G ×4, HPBW ×2', 'G ÷2, HPBW ÷2'], answer: 1 }
  ]
});
/* === UI CONTROLLER === */

      let activeIdx = 0;
      const progress = {};

      function buildModuleList() {
        moduleList.innerHTML = "";
        modules.forEach((m, i) => {
          const b = document.createElement("button");
          b.type = "button";
          b.className = "mod-btn";
          b.dataset.idx = String(i);
          b.innerHTML = `<span class="num">${i + 1}.</span>${m.title}`;
          b.addEventListener("click", () => selectModule(i));
          moduleList.appendChild(b);
        });
      }

      function buildControls(mod) {
        controlsEl.innerHTML = "";
        if (!mod.state) mod.state = {};
        (mod.controls || []).forEach((c) => {
          if (!(c.id in mod.state)) mod.state[c.id] = c.value;
          const row = document.createElement("div");
          row.className = "ctl";
          const lab = document.createElement("label");
          lab.textContent = c.label || c.id;
          row.appendChild(lab);
          if (c.type === "select") {
            const sel = document.createElement("select");
            (c.options || []).forEach((opt) => {
              const o = document.createElement("option");
              const val = opt && typeof opt === "object" ? opt.value : opt;
              const lbl = opt && typeof opt === "object" ? opt.label : opt;
              o.value = val;
              o.textContent = lbl;
              if (val === mod.state[c.id]) o.selected = true;
              sel.appendChild(o);
            });
            sel.addEventListener("change", () => {
              mod.state[c.id] = sel.value;
              mod.update();
            });
            row.appendChild(sel);
          } else if (c.type === "check") {
            const inp = document.createElement("input");
            inp.type = "checkbox";
            inp.checked = !!mod.state[c.id];
            inp.addEventListener("change", () => {
              mod.state[c.id] = inp.checked;
              mod.update();
            });
            row.appendChild(inp);
          } else {
            const inp = document.createElement("input");
            inp.type = "range";
            inp.min = c.min ?? 0;
            inp.max = c.max ?? 1;
            inp.step = c.step ?? 0.01;
            inp.value = mod.state[c.id];
            const val = document.createElement("span");
            val.className = "val";
            val.textContent = Number(mod.state[c.id]).toFixed(2);
            inp.addEventListener("input", () => {
              mod.state[c.id] = parseFloat(inp.value);
              val.textContent = Number(mod.state[c.id]).toFixed(2);
              mod.update();
            });
            row.appendChild(inp);
            row.appendChild(val);
          }
          controlsEl.appendChild(row);
        });
      }

      function buildLesson(mod) {
        const raw = mod.lesson || mod.blurb || "";
        lessonEl.innerHTML = raw.trim().startsWith("<")
          ? raw
          : `<h3>${mod.title}</h3><p>${raw}</p>`;
        renderAllMath(lessonEl);
      }

      function buildQuiz(mod) {
        quizEl.innerHTML = "<h3>Concept Check</h3>";
        const key = mod.id || String(activeIdx);
        progress[key] = progress[key] || {};
        (mod.quiz || []).forEach((q, qi) => {
          const card = document.createElement("div");
          card.className = "qcard";
          const qt = document.createElement("div");
          qt.className = "qtext";
          qt.textContent = `${qi + 1}. ${q.q}`;
          card.appendChild(qt);
          const opts = document.createElement("div");
          opts.className = "opts";
          const fb = document.createElement("div");
          fb.className = "fb";
          q.options.forEach((opt, oi) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = opt;
            btn.addEventListener("click", () => {
              progress[key][qi] = oi;
              opts.querySelectorAll("button").forEach((b, idx) => {
                b.classList.toggle("correct", idx === q.answer);
                b.classList.toggle("wrong", idx === oi && oi !== q.answer);
              });
              fb.textContent =
                oi === q.answer
                  ? "✓ " + (q.explain || "Correct")
                  : "✗ " + (q.explain || "Try again");
              updateBadge();
            });
            opts.appendChild(btn);
          });
          card.appendChild(opts);
          card.appendChild(fb);
          quizEl.appendChild(card);
        });
        updateBadge();
      }

      function updateBadge() {
        let correct = 0,
          total = 0;
        modules.forEach((m, i) => {
          const saved = progress[m.id || String(i)] || {};
          (m.quiz || []).forEach((q, qi) => {
            total++;
            if (saved[qi] === q.answer) correct++;
          });
        });
        badgeEl.textContent = `${correct} / ${total} CORRECT`;
      }

      function selectModule(idx) {
        if (!modules.length || idx < 0 || idx >= modules.length) return;
        activeIdx = idx;
        const mod = modules[idx];
        moduleList
          .querySelectorAll(".mod-btn")
          .forEach((b) =>
            b.classList.toggle("active", Number(b.dataset.idx) === idx),
          );
        buildControls(mod);
        buildLesson(mod);
        buildQuiz(mod);
        clearContent();
        camera.position.set(4.8, 3.6, 5.8);
        controls.target.set(0, 0, 0);
        controls.update();
        chartEl.style.display = "block";
        const _ctx2d = chartEl.getContext("2d");
        if (_ctx2d) _ctx2d.clearRect(0, 0, chartEl.width, chartEl.height);
        renderer.domElement.style.display = "block";
        if (typeof mod.build === "function") mod.build();
        mod._built = true;
        if (typeof mod.update === "function") mod.update();
        renderer.render(scene, camera);
      }

      function onResize() {
        const rect = stageEl.getBoundingClientRect();
        const w = Math.max(1, Math.round(rect.width || stageEl.clientWidth));
        const h = Math.max(1, Math.round(rect.height || stageEl.clientHeight));
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        chartEl.width = Math.round(
          w * Math.min(window.devicePixelRatio || 1, 2),
        );
        chartEl.height = Math.round(
          h * Math.min(window.devicePixelRatio || 1, 2),
        );
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.update === "function") {
          mod.update();
          renderer.render(scene, camera);
        }
      }

      buildModuleList();
      selectModule(0);
      window.addEventListener("resize", onResize);
      if (window.ResizeObserver) new ResizeObserver(onResize).observe(stageEl);
      onResize();

      let last = performance.now();
      function animate(now) {
        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;
        const mod = modules[activeIdx];
        if (mod && mod._built && typeof mod.tick === "function") mod.tick(dt);
        controls.update();
        if (
          !Number.isFinite(camera.position.x) ||
          !Number.isFinite(camera.position.y) ||
          !Number.isFinite(camera.position.z)
        ) {
          camera.position.set(4.8, 3.6, 5.8);
          controls.target.set(0, 0, 0);
          controls.update();
        }
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);
    </script>
  </body>
