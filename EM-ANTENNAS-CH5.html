<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EM-ANTENNAS-CH5 — Kraus &amp; Fleisch Ch. 5</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      crossorigin="anonymous"
    ></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <style>
      :root {
        --bg: #0b0f19;
        --panel: rgba(15, 23, 42, 0.86);
        --border: rgba(56, 189, 248, 0.22);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
        --ok: #68d391;
        --bad: #fc8181;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 13px;
      }
      #shell {
        display: grid;
        grid-template-rows: auto 1fr;
        height: 100%;
      }
      #topbar {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 10px 16px;
        border-bottom: 1px solid rgba(56, 189, 248, 0.15);
        background: rgba(2, 6, 23, 0.6);
      }
      #topbar h1 {
        margin: 0;
        font-weight: 700;
        letter-spacing: 0.04em;
        font-size: 15px;
        color: #f1f5f9;
      }
      #topbar .sub {
        color: var(--muted);
        font-size: 12px;
      }
      #topbar .badge {
        margin-left: auto;
        font-size: 11px;
        color: var(--accent);
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 3px 9px;
        border-radius: 999px;
        font-variant-numeric: tabular-nums;
      }
      #body {
        display: grid;
        grid-template-columns: 268px 1fr;
        min-height: 0;
      }
      #sidebar {
        border-right: 1px solid rgba(56, 189, 248, 0.12);
        background: rgba(2, 6, 23, 0.45);
        overflow-y: auto;
        padding: 10px 8px;
      }
      #sidebar h2 {
        margin: 0;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        color: var(--muted);
        padding: 6px 8px 10px;
        font-weight: 600;
      }
      #module-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mod-btn {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--text);
        font-size: 12px;
        line-height: 1.35;
        cursor: pointer;
      }
      .mod-btn:hover {
        background: rgba(56, 189, 248, 0.08);
      }
      .mod-btn.active {
        background: rgba(56, 189, 248, 0.16);
        border-color: rgba(56, 189, 248, 0.4);
      }
      .mod-btn .num {
        font-size: 10px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        min-width: 18px;
        margin-top: 1px;
      }
      #main {
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      #stage {
        flex: 1;
        position: relative;
        min-height: 0;
        overflow: hidden;
        background: #0a0e13;
      }
      #stage canvas.webgl,
      #chart-canvas {
        position: absolute;
        inset: 0;
        width: 100% !important;
        height: 100% !important;
        display: block;
      }
      #chart-canvas {
        display: none;
        z-index: 2;
        pointer-events: none;
      }
      #controls {
        position: absolute;
        top: 12px;
        right: 12px;
        width: 295px;
        max-height: calc(100% - 24px);
        overflow-y: auto;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(14px);
        padding: 12px 14px;
        font-size: 12px;
        z-index: 10;
      }
      .ctl {
        margin-bottom: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 4px;
      }
      .ctl:last-child {
        margin-bottom: 0;
      }
      .ctl label {
        color: var(--muted);
        font-size: 11px;
        flex: 1 1 auto;
      }
      .ctl .val {
        color: var(--accent);
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        min-width: 44px;
        text-align: right;
      }
      .ctl input[type="range"] {
        width: 100%;
        height: 4px;
        border-radius: 2px;
        order: 3;
        background: rgba(56, 189, 248, 0.2);
        outline: none;
        -webkit-appearance: none;
      }
      .ctl input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
        cursor: pointer;
        box-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      }
      .ctl input[type="checkbox"] {
        accent-color: var(--accent);
      }
      .ctl select {
        width: 100%;
        padding: 6px 8px;
        border-radius: 7px;
        background: rgba(2, 6, 23, 0.75);
        color: var(--text);
        border: 1px solid rgba(56, 189, 248, 0.25);
        font-size: 12px;
        outline: none;
      }
      #hud {
        position: absolute;
        left: 12px;
        bottom: 12px;
        width: 390px;
        max-width: calc(100% - 330px);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(14px);
        padding: 12px 14px;
        font-size: 12px;
        z-index: 10;
      }
      #hud-title {
        font-weight: 600;
        color: #f1f5f9;
        font-size: 12px;
        margin-bottom: 6px;
      }
      #hud-eq {
        color: #cbd5e1;
        min-height: 20px;
        margin-bottom: 8px;
      }
      #hud-eq .katex {
        font-size: 0.95em;
      }
      #hud-values {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 12px;
      }
      #hud-values .k {
        color: var(--muted);
        font-size: 11px;
      }
      #hud-values .v {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--accent);
        font-variant-numeric: tabular-nums;
        font-size: 12px;
        text-align: right;
      }
      #bottom {
        height: 31vh;
        min-height: 185px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-top: 1px solid rgba(56, 189, 248, 0.12);
        background: rgba(2, 6, 23, 0.5);
      }
      #lesson,
      #quiz {
        overflow-y: auto;
        padding: 14px 16px;
      }
      #lesson {
        border-right: 1px solid rgba(56, 189, 248, 0.12);
      }
      #lesson h3,
      #quiz h3 {
        margin: 0 0 8px;
        font-size: 13px;
        color: #f1f5f9;
      }
      #lesson p {
        margin: 0 0 8px;
        font-size: 12px;
        line-height: 1.55;
        color: #cbd5e1;
      }
      #lesson .eq,
      #lesson .eqblock {
        margin: 8px 0;
        color: #e2e8f0;
      }
      .qcard {
        margin-bottom: 12px;
      }
      .qcard .qtext {
        font-size: 12px;
        color: #e2e8f0;
        margin-bottom: 6px;
      }
      .qcard .opts {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .qcard .opts button {
        text-align: left;
        padding: 5px 9px;
        border-radius: 6px;
        cursor: pointer;
        background: rgba(15, 23, 42, 0.7);
        color: #cbd5e1;
        border: 1px solid rgba(56, 189, 248, 0.18);
        font-size: 11.5px;
      }
      .qcard .opts button:hover {
        background: rgba(56, 189, 248, 0.12);
      }
      .qcard .opts button.correct {
        border-color: var(--ok);
        background: rgba(104, 211, 145, 0.18);
        color: #f0fff4;
      }
      .qcard .opts button.wrong {
        border-color: var(--bad);
        background: rgba(252, 129, 129, 0.18);
        color: #fff5f5;
      }
      .qcard .fb {
        font-size: 11px;
        color: var(--muted);
        margin-top: 4px;
      }
      @media (max-width: 900px) {
        #body {
          grid-template-columns: 1fr;
        }
        #sidebar {
          display: none;
        }
        #controls {
          width: 240px;
        }
        #hud {
          width: calc(100% - 24px);
          max-width: none;
        }
        #bottom {
          grid-template-columns: 1fr;
          height: 40vh;
        }
        #lesson {
          border-right: none;
          border-bottom: 1px solid rgba(56, 189, 248, 0.12);
        }
      }
    </style>
  </head>
  <body>
    <div id="shell">
      <header id="topbar">
        <h1>EM-ANTENNAS-CH5</h1>
        <span class="sub"
          >John D. Kraus &amp; Daniel A. Fleisch · Electromagnetics with Applications · Ch. 5 Antennas, Radiation, and Wireless Systems</span
        >
        <span class="badge" id="status-badge">0 / 0</span>
      </header>
      <div id="body">
        <aside id="sidebar">
          <h2>Chapter 5 Modules</h2>
          <div id="module-list"></div>
        </aside>
        <section id="main">
          <div id="stage">
            <canvas id="chart-canvas"></canvas>
            <div id="controls"></div>
            <div id="hud">
              <div id="hud-title">—</div>
              <div id="hud-eq"></div>
              <div id="hud-values"></div>
            </div>
          </div>
          <div id="bottom">
            <div id="lesson"></div>
            <div id="quiz"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { OrbitControls } from "three/addons/controls/OrbitControls.js";

      const stageEl = document.getElementById("stage");
      const chartEl = document.getElementById("chart-canvas");
      const controlsEl = document.getElementById("controls");
      const hudTitle = document.getElementById("hud-title");
      const hudEq = document.getElementById("hud-eq");
      const hudValues = document.getElementById("hud-values");
      const lessonEl = document.getElementById("lesson");
      const quizEl = document.getElementById("quiz");
      const moduleList = document.getElementById("module-list");
      const badgeEl = document.getElementById("status-badge");

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      const initW = Math.max(1, stageEl.clientWidth || window.innerWidth - 268);
      const initH = Math.max(
        1,
        stageEl.clientHeight || Math.round(window.innerHeight * 0.6),
      );
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(initW, initH);
      renderer.setClearColor(0x0a0e13, 1);
      renderer.domElement.classList.add("webgl");
      renderer.domElement.style.outline = "none";
      stageEl.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x0a0e13, 0.025);
      const camera = new THREE.PerspectiveCamera(50, initW / initH, 0.1, 200);
      camera.position.set(4.8, 3.6, 5.8);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.08;
      controls.enableZoom = true;
      controls.enableRotate = true;
      controls.enablePan = true;
      controls.minDistance = 1.5;
      controls.maxDistance = 40;

      scene.add(new THREE.AmbientLight(0xffffff, 0.65));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 8, 6);
      scene.add(dirLight);

      const content = new THREE.Group();
      scene.add(content);
      const sharedArrowGeoms = new Set();

      function disposeObj(o) {
        o.traverse((n) => {
          const isShared =
            sharedArrowGeoms.has(n.geometry) ||
            n.isArrowHelper ||
            (n.parent && n.parent.isArrowHelper);
          if (!isShared && n.geometry) n.geometry.dispose();
          if (n.material) {
            if (Array.isArray(n.material))
              n.material.forEach((m) => m.dispose());
            else n.material.dispose();
          }
        });
      }

      function clearContent() {
        while (content.children.length) disposeObj(content.children.pop());
        sharedArrowGeoms.clear();
      }

      function addAxes(group, len = 3.2) {
        const mk = (color, a, b) =>
          new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([a, b]),
            new THREE.LineBasicMaterial({
              color,
              transparent: true,
              opacity: 0.75,
            }),
          );
        group.add(
          mk(
            0xef4444,
            new THREE.Vector3(-len, 0, 0),
            new THREE.Vector3(len, 0, 0),
          ),
        );
        group.add(
          mk(
            0x22c55e,
            new THREE.Vector3(0, -len, 0),
            new THREE.Vector3(0, len, 0),
          ),
        );
        group.add(
          mk(
            0x3b82f6,
            new THREE.Vector3(0, 0, -len),
            new THREE.Vector3(0, 0, len),
          ),
        );
      }

      function addGrid(group, size = 8, y = -2.2) {
        const g = new THREE.GridHelper(size, 16, 0x1e2a36, 0x1e2a36);
        g.position.y = y;
        group.add(g);
      }

      function addArrowField(vectors, color = 0x7fd1ff) {
        const g = new THREE.Group();
        const pool = [];

        const normalizeEntry = (v) => {
          if (!v) return null;
          if (v.isVector3) {
            return {
              origin: new THREE.Vector3(0, 0, 0),
              dir: v,
              len: v.length(),
              color,
            };
          }
          if (v.dir && v.origin) {
            const mag = v.dir.length();
            return {
              origin: v.origin,
              dir: v.dir,
              len: v.len !== undefined ? v.len : Math.min(mag, 2.0),
              color: v.color ?? color,
            };
          }
          return null;
        };

        g.setVectors = (newVectors) => {
          const list = newVectors || [];
          for (let i = 0; i < list.length; i++) {
            const item = normalizeEntry(list[i]);
            let arrow = pool[i];
            if (!arrow) {
              arrow = new THREE.ArrowHelper(
                new THREE.Vector3(0, 1, 0),
                new THREE.Vector3(0, 0, 0),
                0.5,
                color,
                0.12,
                0.07,
              );
              if (arrow.line && arrow.line.geometry)
                sharedArrowGeoms.add(arrow.line.geometry);
              if (arrow.cone && arrow.cone.geometry)
                sharedArrowGeoms.add(arrow.cone.geometry);
              pool.push(arrow);
              g.add(arrow);
            }
            if (!item || item.len < 1e-4 || item.dir.lengthSq() < 1e-12) {
              arrow.visible = false;
              continue;
            }
            arrow.visible = true;
            arrow.position.copy(item.origin);
            arrow.setDirection(item.dir.clone().normalize());
            arrow.setLength(
              item.len,
              Math.min(0.25, item.len * 0.35),
              Math.min(0.15, item.len * 0.22),
            );
            arrow.setColor(item.color);
          }
          for (let i = list.length; i < pool.length; i++) {
            pool[i].visible = false;
          }
        };

        g.setVectors(vectors);
        content.add(g);
        return g;
      }

      function renderMath(el, tex, display = true) {
        if (window.katex) {
          try {
            katex.render(tex, el, {
              throwOnError: false,
              displayMode: display,
            });
            return;
          } catch (e) {}
        }
        el.textContent = tex;
      }

      function renderAllMath(root) {
        root.querySelectorAll("[data-tex]").forEach((el) => {
          renderMath(
            el,
            el.getAttribute("data-tex"),
            el.classList.contains("eq") || el.classList.contains("eqblock"),
          );
        });
      }

      function setHud(title, eqTex, rows) {
        hudTitle.textContent = title;
        renderMath(hudEq, eqTex, true);
        hudValues.innerHTML = (rows || [])
          .map(
            (r) => `<span class="k">${r.k}</span><span class="v">${r.v}</span>`,
          )
          .join("");
      }

      function fmt(v, d = 3) {
        return isFinite(v) ? (v >= 0 ? "+" : "") + v.toFixed(d) : "—";
      }

      const modules = [];

      modules.push({
  id: 'intro_radiation_principles',
  title: '5-1 Introduction to Antennas & Radiation',
  controls: [
    { id: 'freq_MHz', label: 'Frequency f (MHz)', type: 'range', min: 50, max: 1000, step: 10, value: 300 },
    { id: 'I0', label: 'Feed current amplitude I0 (A)', type: 'range', min: 0.5, max: 5.0, step: 0.1, value: 2.0 },
    { id: 'mode', label: 'Reciprocity mode', type: 'select', options: ['Transmitting (Tx)', 'Receiving (Rx)'], value: 'Transmitting (Tx)' },
    { id: 'animate', label: 'Animate spherical wave shells', type: 'check', value: true }
  ],

  build() {
    this.group = new THREE.Group();
    content.add(this.group);

    // ---- antenna feed: two flared arms along +x / -x, center-fed ----
    const armMat = new THREE.MeshStandardMaterial({
      color: 0xbfc7d2, metalness: 0.85, roughness: 0.35
    });
    const feedMat = new THREE.MeshStandardMaterial({
      color: 0xffcc66, metalness: 0.7, roughness: 0.4,
      emissive: 0x442200, emissiveIntensity: 0.6
    });

    this.arms = [];
    const armLen = 1.6;
    for (const s of [-1, 1]) {
      const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.075, armLen, 16), armMat);
      arm.rotation.z = Math.PI / 2;
      arm.position.set(s * (armLen / 2 + 0.12), 0, 0);
      this.group.add(arm);
      this.arms.push(arm);

      // flared tip cone
      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.42, 18, 1, true), armMat);
      tip.rotation.z = s * Math.PI / 2;
      tip.position.set(s * (armLen + 0.33), 0, 0);
      this.group.add(tip);
    }

    // center feed gap / source
    const feed = new THREE.Mesh(new THREE.SphereGeometry(0.13, 20, 16), feedMat);
    this.group.add(feed);
    this.feed = feed;

    // small transmission-line stub behind the feed (guided mode)
    const stub = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1.1, 12), feedMat);
    stub.rotation.x = Math.PI / 2;
    stub.position.set(0, 0, -0.62);
    this.group.add(stub);

    // ---- spherical wavefront shells ----
    this.shells = [];
    const shellMat = new THREE.MeshBasicMaterial({
      color: 0x66ccff, transparent: true, opacity: 0.22,
      side: THREE.DoubleSide, depthWrite: false
    });
    for (let i = 0; i < 5; i++) {
      const sh = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 26), shellMat.clone());
      sh.userData.phase = i / 5;
      this.group.add(sh);
      this.shells.push(sh);
    }

    // ---- E_theta / H_phi arrow field ----
    this.arrowGroup = new THREE.Group();
    this.group.add(this.arrowGroup);

    // ---- polar pattern ring (radiation pattern hint) ----
    this.patternPts = [];
    for (let i = 0; i <= 96; i++) {
      const th = (i / 96) * Math.PI * 2;
      const r = 2.6 * Math.abs(Math.sin(th));
      this.patternPts.push(new THREE.Vector3(r * Math.cos(th), r * Math.sin(th), 0));
    }
    const patGeo = new THREE.BufferGeometry().setFromPoints(this.patternPts);
    const patMat = new THREE.LineBasicMaterial({ color: 0xff8844, transparent: true, opacity: 0.55 });
    this.patternLine = new THREE.Line(patGeo, patMat);
    this.group.add(this.patternLine);

    // ---- ground grid for scale ----
    const grid = new THREE.GridHelper(14, 28, 0x223344, 0x1a2633);
    grid.position.y = -2.2;
    this.group.add(grid);

    // ---- lights ----
    const l1 = new THREE.PointLight(0xffffff, 1.2, 30);
    l1.position.set(4, 6, 6);
    this.group.add(l1);
    const l2 = new THREE.PointLight(0x88bbff, 0.8, 30);
    l2.position.set(-5, -3, -4);
    this.group.add(l2);

    this.t = 0;
    this.arrowTimer = 0;
  },

  update() {
    const st = this.state;
    const f = st.freq_MHz * 1e6;
    const c = 2.998e8;
    const lambda = c / f;
    const beta = 2 * Math.PI / lambda;
    const Z0 = 376.73;
    const omega = 2 * Math.PI * f;
    const tx = st.mode === 'Transmitting (Tx)';
    const dirSign = tx ? 1 : -1;

    // scale scene so wavelength is visible: map lambda -> ~2.2 scene units
    const scale = 2.2 / lambda;
    const I0 = st.I0;

    // shells: radii grow with time (Tx) or shrink (Rx)
    const baseR = 1.0;
    const shellSpeed = 0.55;
    for (let i = 0; i < this.shells.length; i++) {
      const sh = this.shells[i];
      let ph = (this.t * shellSpeed + sh.userData.phase) % 1;
      let rNorm = tx ? ph : 1 - ph;
      const r = baseR + rNorm * 3.4;
      sh.scale.setScalar(r);
      sh.material.opacity = 0.26 * (1 - rNorm * 0.75);
      sh.material.color.setHex(tx ? 0x66ccff : 0x88ffcc);
    }

    // antenna glow proportional to current
    this.feed.material.emissiveIntensity = 0.35 + 0.5 * (I0 / 5);
    this.feed.scale.setScalar(1 + 0.12 * Math.sin(this.t * 6));

    // rebuild arrow field: transverse E_theta (orange) and H_phi (blue)
    this.arrowGroup.clear();
    const vectors = [];
    const nTheta = 9;
    const nPhi = 10;
    const rBase = 1.9;
    const amp = 0.55 * (I0 / 5);

    for (let it = 0; it < nTheta; it++) {
      const theta = (it + 0.5) / nTheta * Math.PI; // 0..pi
      const sinT = Math.sin(theta);
      const cosT = Math.cos(theta);
      for (let ip = 0; ip < nPhi; ip++) {
        const phi = (ip / nPhi) * Math.PI * 2;
        const r = rBase + 0.35 * Math.sin(phi * 2 + this.t);
        const x = r * sinT * Math.cos(phi);
        const y = r * cosT;
        const z = r * sinT * Math.sin(phi);
        const origin = new THREE.Vector3(x, y, z);

        // E_theta unit vector: (cosT cosPhi, -sinT, cosT sinPhi)
        const eDir = new THREE.Vector3(cosT * Math.cos(phi), -sinT, cosT * Math.sin(phi));
        // H_phi unit vector: (-sinPhi, 0, cosPhi)
        const hDir = new THREE.Vector3(-Math.sin(phi), 0, Math.cos(phi));

        const phase = Math.cos(omega * this.t * 0.0000002 - beta * r * 0.0);
        const envelope = Math.abs(sinT) / Math.max(r, 0.4);
        const mag = amp * envelope * (0.6 + 0.4 * Math.sin(this.t * 3 + it + ip));

        vectors.push({
          origin: origin.clone(),
          dir: eDir.clone().multiplyScalar(dirSign),
          len: mag * 1.4
        });
        vectors.push({
          origin: origin.clone(),
          dir: hDir.clone().multiplyScalar(dirSign),
          len: mag * 1.1
        });
      }
    }

    // Use helper for arrows (orange E, blue H) — helper takes one color, so draw two passes
    const eVecs = vectors.filter((_, i) => i % 2 === 0);
    const hVecs = vectors.filter((_, i) => i % 2 === 1);
    addArrowField(eVecs, 0xff5533);
    addArrowField(hVecs, 0x33aaff);

    // pattern line orientation: rotate with mode
    this.patternLine.rotation.z = tx ? 0 : Math.PI;

    // ---- chart: radial decay curves ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);

    // inset backdrop
    ctx.fillStyle = 'rgba(8,14,22,0.82)';
    ctx.fillRect(16, 16, 290, 210);
    ctx.strokeStyle = 'rgba(120,180,255,0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(16, 16, 290, 210);

    const px = 34, py = 34, pw = 254, ph = 168;
    // axes
    ctx.strokeStyle = 'rgba(200,220,255,0.55)';
    ctx.beginPath();
    ctx.moveTo(px, py + ph);
    ctx.lineTo(px + pw, py + ph);
    ctx.moveTo(px, py);
    ctx.lineTo(px, py + ph);
    ctx.stroke();

    // labels
    ctx.fillStyle = '#cfe6ff';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('Field magnitude vs r / lambda', px, py - 8);
    ctx.fillText('r / lambda', px + pw - 52, py + ph + 16);
    ctx.save();
    ctx.translate(px - 12, py + ph / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('|E| (normalized)', -46, 0);
    ctx.restore();

    // curves: 1/r (radiation), 1/r^2, 1/r^3
    const rMin = 0.15, rMax = 6.0;
    const curves = [
      { f: (r) => 1 / r, color: '#ff5533', label: '1/r  (radiation)' },
      { f: (r) => 1 / (r * r), color: '#33aaff', label: '1/r^2 (induction)' },
      { f: (r) => 1 / (r * r * r), color: '#88ffaa', label: '1/r^3 (static)' }
    ];

    const norm = 1 / rMin;
    for (const cv of curves) {
      ctx.beginPath();
      for (let i = 0; i <= 120; i++) {
        const r = rMin + (rMax - rMin) * (i / 120);
        const val = cv.f(r) / norm;
        const X = px + (r - rMin) / (rMax - rMin) * pw;
        const Y = py + ph - val * ph;
        if (i === 0) ctx.moveTo(X, Y); else ctx.lineTo(X, Y);
      }
      ctx.strokeStyle = cv.color;
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // legend
    let ly = py + 14;
    for (const cv of curves) {
      ctx.fillStyle = cv.color;
      ctx.fillRect(px + pw - 96, ly - 8, 10, 10);
      ctx.fillStyle = '#dbe9ff';
      ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
      ctx.fillText(cv.label, px + pw - 82, ly + 1);
      ly += 16;
    }

    // marker for current r/lambda
    const rMark = 1.0;
    const Xm = px + (rMark - rMin) / (rMax - rMin) * pw;
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(Xm, py);
    ctx.lineTo(Xm, py + ph);
    ctx.stroke();
    ctx.setLineDash([]);

    // ---- HUD ----
    setHud(
      'Antenna Radiation — Far-Field Launch',
      'E_\\theta(r,\\theta,t) \\propto \\frac{\\sin\\theta}{r}\\cos(\\omega t - \\beta r),\\quad Z_0 = \\sqrt{\\frac{\\mu_0}{\\varepsilon_0}} \\approx 377\\,\\Omega',
      [
        { k: 'lambda (m)', v: lambda.toFixed(3) },
        { k: 'beta (rad/m)', v: beta.toFixed(4) },
        { k: 'far-field Z_w (ohms)', v: Z0.toFixed(2) },
        { k: 'Mode', v: tx ? 'Tx (reciprocity)' : 'Rx (reciprocity)' }
      ]
    );
  },

  tick(dt) {
    if (!this.state.animate) return;
    this.t += dt;

  lesson: `<p>An antenna is a transducer between a guided wave (transmission line) and a free-space wave. A time-harmonic current <em>I(t)=I<sub>0</sub>cos(ωt)</em> on the conductor accelerates charge; the accelerated charge radiates. In the far zone (<em>r ≫ λ</em>) the fields are transverse and fall as <em>1/r</em>: <em>E<sub>θ</sub> ∝ (sinθ/r)cos(ωt−βr)</em>, with <em>H<sub>φ</sub> = E<sub>θ</sub>/Z<sub>0</sub></em> and <em>Z<sub>0</sub>=√(μ<sub>0</sub>/ε<sub>0</sub>)≈377 Ω</em>. Near the antenna the induction terms decay as <em>1/r<sup>2</sup></em> and the electrostatic term as <em>1/r<sup>3</sup></em>; only the <em>1/r</em> term carries energy away. The <em>sinθ</em> factor gives the familiar doughnut-shaped pattern of a short dipole. By reciprocity, the transmitting pattern equals the receiving effective-aperture pattern — the same antenna works identically in both directions. Increasing <em>f</em> shortens <em>λ=c/f</em> and raises <em>β=2π/λ</em>; increasing <em>I<sub>0</sub></em> raises the radiated field amplitude.</p>`,
  quiz: [

    },

      q: 'For a short dipole, the radiation pattern factor is proportional to:',
      options: ['cosθ', 'sinθ', 'sin²θ', '1'],
      answer: 1
    },
    {
      q: 'By reciprocity, the transmitting pattern of an antenna is:',
      options: [

      ],

    }
  ]
});
modules.push({
  id: 'basic_antenna_parameters',
  title: '5-2 Basic Antenna Parameters',

  controls: [
    { id: 'n_exp', label: 'Pattern exponent n', type: 'range', min: 1, max: 12, step: 0.5, value: 2 },
    { id: 'eta_rad', label: 'Radiation efficiency η_rad', type: 'range', min: 0.2, max: 1.0, step: 0.02, value: 0.90 },
    { id: 'freq_GHz', label: 'Frequency f (GHz)', type: 'range', min: 0.5, max: 10.0, step: 0.1, value: 2.4 },
    { id: 'show_omega_a', label: 'Show equivalent beam solid angle cone', type: 'check', value: true }
  ],

  build() {
    // ---------- 3D radiation pattern mesh ----------
    this.patternGroup = new THREE.Group();
    content.add(this.patternGroup);

    const segTheta = 96;
    const segPhi = 128;
    const geo = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const indices = [];

    // Pre-allocate arrays; we will rewrite positions/colors in update()
    for (let i = 0; i <= segTheta; i++) {
      for (let j = 0; j <= segPhi; j++) {
        positions.push(0, 0, 0);
        colors.push(0, 0, 0);
      }
    }
    for (let i = 0; i < segTheta; i++) {
      for (let j = 0; j < segPhi; j++) {
        const a = i * (segPhi + 1) + j;
        const b = a + 1;
        const c = a + (segPhi + 1);
        const d = c + 1;
        indices.push(a, c, b, b, c, d);
      }
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      vertexColors: true,
      side: THREE.DoubleSide,
      roughness: 0.55,
      metalness: 0.15,
      transparent: true,
      opacity: 0.92
    });

    this.patternMesh = new THREE.Mesh(geo, mat);
    this.patternGroup.add(this.patternMesh);

    // Wireframe overlay for structure
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0x2b6f9e,
      wireframe: true,
      transparent: true,
      opacity: 0.18
    });
    this.patternWire = new THREE.Mesh(geo, wireMat);
    this.patternGroup.add(this.patternWire);

    // ---------- Equivalent beam solid-angle cone ----------
    this.coneGroup = new THREE.Group();
    content.add(this.coneGroup);

    // Cone geometry: apex at origin, opening half-angle alpha, height h.
    // We rebuild it in update() because alpha depends on Omega_A.
    this.coneMat = new THREE.MeshStandardMaterial({
      color: 0xffd166,
      transparent: true,
      opacity: 0.22,
      side: THREE.DoubleSide,
      roughness: 0.8,
      metalness: 0.0,
      depthWrite: false
    });
    this.coneMesh = new THREE.Mesh(new THREE.ConeGeometry(1, 1, 64, 1, true), this.coneMat);
    this.coneGroup.add(this.coneMesh);

    // Cone rim ring
    this.rimMat = new THREE.MeshBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.75 });
    this.rimMesh = new THREE.Mesh(new THREE.TorusGeometry(1, 0.012, 8, 64), this.rimMat);
    this.coneGroup.add(this.rimMesh);

    // Cone axis line
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 1, 0)
    ]);
    this.axisLine = new THREE.Line(axisGeo, new THREE.LineBasicMaterial({ color: 0xffd166, transparent: true, opacity: 0.6 }));
    this.coneGroup.add(this.axisLine);

    // ---------- Coordinate axes / reference ----------
    const axes = new THREE.Group();
    const axMat = new THREE.LineBasicMaterial({ color: 0x4a6b8a, transparent: true, opacity: 0.55 });
    const axLen = 3.4;
    const mk = (a, b) => {
      const g = new THREE.BufferGeometry().setFromPoints([a, b]);
      return new THREE.Line(g, axMat);
    };
    axes.add(mk(new THREE.Vector3(-axLen, 0, 0), new THREE.Vector3(axLen, 0, 0)));
    axes.add(mk(new THREE.Vector3(0, -axLen, 0), new THREE.Vector3(0, axLen, 0)));
    axes.add(mk(new THREE.Vector3(0, 0, -axLen), new THREE.Vector3(0, 0, axLen)));
    content.add(axes);

    // Broadside reference ring (theta = 90 deg) in the x-z plane
    const ringPts = [];
    for (let k = 0; k <= 96; k++) {
      const a = (k / 96) * Math.PI * 2;
      ringPts.push(new THREE.Vector3(Math.cos(a) * 2.6, 0, Math.sin(a) * 2.6));
    }
    const ringGeo = new THREE.BufferGeometry().setFromPoints(ringPts);
    this.broadsideRing = new THREE.Line(ringGeo, new THREE.LineBasicMaterial({
      color: 0x7fd1ff, transparent: true, opacity: 0.35
    }));
    content.add(this.broadsideRing);

    // Small origin sphere
    const originSphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 16, 12),
      new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x335577, emissiveIntensity: 0.6 })
    );
    content.add(originSphere);

    // ---------- Cached geometry data ----------
    this.segTheta = segTheta;
    this.segPhi = segPhi;
    this.geo = geo;
    this.posAttr = geo.attributes.position;
    this.colAttr = geo.attributes.color;

    // Color ramp helper (blue -> cyan -> yellow -> red)
    this.colorRamp = (t) => {
      t = Math.max(0, Math.min(1, t));
      const c = new THREE.Color();
      if (t < 0.35) {
        c.setHSL(0.58 - 0.10 * (t / 0.35), 0.85, 0.42 + 0.18 * (t / 0.35));
      } else if (t < 0.7) {
        const u = (t - 0.35) / 0.35;
        c.setHSL(0.48 - 0.30 * u, 0.95, 0.55 + 0.10 * u);
      } else {
        const u = (t - 0.7) / 0.3;
        c.setHSL(0.18 - 0.18 * u, 1.0, 0.58 - 0.10 * u);
      }
      return c;
    };

    // ---------- Numerical integration cache ----------
    this._omegaCache = { n: null, val: null };
  },

  update() {
    const st = this.state;
    const n = st.n_exp;
    const eta = st.eta_rad;
    const fGHz = st.freq_GHz;
    const showCone = st.show_omega_a;

    // ---------- Physics ----------
    // Omega_A = 2*pi * integral_0^pi sin^(n+1)(theta) dtheta
    let omegaA;
    if (this._omegaCache.n === n) {
      omegaA = this._omegaCache.val;
    } else {
      const N = 2000;
      let sum = 0;
      for (let i = 0; i < N; i++) {
        const th = (i + 0.5) * Math.PI / N;
        sum += Math.pow(Math.sin(th), n + 1);
      }
      omegaA = 2 * Math.PI * sum * (Math.PI / N);
      this._omegaCache = { n, val: omegaA };
    }

    const D = 4 * Math.PI / omegaA;
    const DdBi = 10 * Math.log10(D);
    const G = eta * D;
    const GdBi = 10 * Math.log10(G);

    const lambda = 299792458 / (fGHz * 1e9); // meters
    const Ae_m2 = (lambda * lambda / (4 * Math.PI)) * G;
    const Ae_cm2 = Ae_m2 * 1e4;

    // HPBW = 2 * arccos(0.5^(1/n)) in degrees
    const hpbwRad = 2 * Math.acos(Math.pow(0.5, 1 / n));
    const hpbwDeg = hpbwRad * 180 / Math.PI;

    // ---------- 3D pattern mesh ----------
    const R0 = 2.6;
    const pos = this.posAttr.array;
    const col = this.colAttr.array;
    const segTheta = this.segTheta;
    const segPhi = this.segPhi;

    let idx = 0;
    for (let i = 0; i <= segTheta; i++) {
      const theta = (i / segTheta) * Math.PI;
      const s = Math.sin(theta);
      const pn = Math.pow(Math.max(s, 0), n);
      const r = R0 * pn;
      const y = r * Math.cos(theta);
      const rxz = r * s;
      for (let j = 0; j <= segPhi; j++) {
        const phi = (j / segPhi) * Math.PI * 2;
        const x = rxz * Math.cos(phi);
        const z = rxz * Math.sin(phi);
        pos[idx] = x;
        pos[idx + 1] = y;
        pos[idx + 2] = z;

        const c = this.colorRamp(pn);
        col[idx] = c.r;
        col[idx + 1] = c.g;
        col[idx + 2] = c.b;
        idx += 3;
      }
    }
    this.posAttr.needsUpdate = true;
    this.colAttr.needsUpdate = true;
    this.geo.computeVertexNormals();

    // ---------- Equivalent beam cone ----------
    // Solid angle of a cone with half-angle alpha: Omega = 2*pi*(1 - cos alpha)
    // => cos alpha = 1 - Omega_A/(2*pi)
    const cosAlpha = Math.max(-1, Math.min(1, 1 - omegaA / (2 * Math.PI)));
    const alpha = Math.acos(cosAlpha);
    const coneHeight = R0 * 0.95;

    this.coneGroup.visible = showCone;
    if (showCone) {
      const radius = coneHeight * Math.tan(alpha);
      // ConeGeometry is centered at origin with apex at +y/2; we want apex at origin pointing +y.
      this.coneMesh.geometry.dispose();
      this.coneMesh.geometry = new THREE.ConeGeometry(radius, coneHeight, 64, 1, true);
      this.coneMesh.position.set(0, coneHeight / 2, 0);

      this.rimMesh.geometry.dispose();
      this.rimMesh.geometry = new THREE.TorusGeometry(radius, 0.012, 8, 64);
      this.rimMesh.rotation.x = Math.PI / 2;
      this.rimMesh.position.set(0, coneHeight, 0);

      this.axisLine.geometry.dispose();
      this.axisLine.geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(0, 0, 0),
        new THREE.Vector3(0, coneHeight, 0)
      ]);
    }

    // ---------- 2D polar elevation cut ----------
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width;
    const H = chartEl.height;

    ctx.clearRect(0, 0, W, H);

    // Dark translucent backdrop
    ctx.fillStyle = 'rgba(8, 14, 24, 0.82)';
    ctx.fillRect(0, 0, W, H);

    // Inset box coordinates (chartEl is already the inset canvas)
    const cx = W * 0.5;
    const cy = H * 0.52;
    const R = Math.min(W, H) * 0.40;

    // Polar grid
    ctx.strokeStyle = 'rgba(120, 170, 210, 0.22)';
    ctx.lineWidth = 1;
    for (let k = 1; k <= 4; k++) {
      const rr = R * k / 4;
      ctx.beginPath();
      ctx.arc(cx, cy, rr, 0, Math.PI * 2);
      ctx.stroke();
    }
    // Radial spokes
    for (let k = 0; k < 12; k++) {
      const a = (k / 12) * Math.PI * 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + R * Math.cos(a), cy + R * Math.sin(a));
      ctx.stroke();
    }

    // Axis labels: theta measured from +y (up). In screen, up = -y.
    // We plot elevation cut in the y-x plane: theta from 0 (up) to pi (down).
    // Screen angle: theta=0 -> up (-90 deg), theta=pi -> down (+90 deg).
    // Use screen angle = theta - pi/2 (so theta=0 -> -pi/2, theta=pi/2 -> 0, theta=pi -> pi/2).
    // Actually we want a full polar cut: theta in [0,pi] gives a half-plane; mirror for symmetry.

    // Draw the pattern curve (both sides, symmetric about vertical axis)
    const drawCurve = (sign) => {
      ctx.beginPath();
      const steps = 240;
      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * Math.PI;
        const pn = Math.pow(Math.max(Math.sin(theta), 0), n);
        const rr = R * pn;
        const screenAngle = theta - Math.PI / 2; // theta=0 -> -pi/2 (up)
        const x = cx + sign * rr * Math.cos(screenAngle);
        const y = cy + rr * Math.sin(screenAngle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    };

    // Fill under curve
    ctx.beginPath();
    const steps = 240;
    for (let i = 0; i <= steps; i++) {
      const theta = (i / steps) * Math.PI;
      const pn = Math.pow(Math.max(Math.sin(theta), 0), n);
      const rr = R * pn;
      const screenAngle = theta - Math.PI / 2;
      const x = cx + rr * Math.cos(screenAngle);
      const y = cy + rr * Math.sin(screenAngle);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    for (let i = steps; i >= 0; i--) {
      const theta = (i / steps) * Math.PI;
      const pn = Math.pow(Math.max(Math.sin(theta), 0), n);
      const rr = R * pn;
      const screenAngle = theta - Math.PI / 2;
      const x = cx - rr * Math.cos(screenAngle);
      const y = cy + rr * Math.sin(screenAngle);
      ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(80, 190, 255, 0.16)';
    ctx.fill();

    // Curve stroke
    ctx.strokeStyle = 'rgba(120, 220, 255, 0.95)';
    ctx.lineWidth = 2;
    drawCurve(1);
    drawCurve(-1);

    // -3 dB HPBW markers
    // Half-power points at theta = pi/2 +/- hpbwRad/2
    const th1 = Math.PI / 2 - hpbwRad / 2;
    const th2 = Math.PI / 2 + hpbwRad / 2;
    const pnHalf = Math.pow(0.5, 1); // = 0.5 at half power
    const rHalf = R * 0.5;

    const marker = (theta, sign) => {
      const screenAngle = theta - Math.PI / 2;
      const x = cx + sign * rHalf * Math.cos(screenAngle);
      const y = cy + rHalf * Math.sin(screenAngle);
      ctx.beginPath();
      ctx.arc(x, y, 4.5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 209, 102, 0.95)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 209, 102, 0.9)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    };
    marker(th1, 1);
    marker(th1, -1);
    marker(th2, 1);
    marker(th2, -1);

    // HPBW arc annotation
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, rHalf * 0.55, -Math.PI / 2 - hpbwRad / 2, -Math.PI / 2 + hpbwRad / 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    ctx.fillStyle = 'rgba(200, 230, 255, 0.9)';
    ctx.font = '11px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('θ = 0° (broadside)', cx, cy - R - 8);
    ctx.fillText('θ = 180°', cx, cy + R + 14);

    ctx.fillStyle = 'rgba(255, 209, 102, 0.95)';
    ctx.font = 'bold 11px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('HPBW = ' + hpbwDeg.toFixed(1) + '°', cx, cy + R * 0.72);

    ctx.fillStyle = 'rgba(160, 200, 230, 0.75)';
    ctx.font = '10px ui-sans-serif, system-ui, sans-serif';
    ctx.fillText('P_n(θ) = sin^n θ', cx, cy + R + 30);

    // ---------- HUD ----------
    setHud(
      'Basic Antenna Parameters',
      'D = \\frac{4\\pi}{\\Omega_A},\\quad G = \\eta_{\\mathrm{rad}} D,\\quad A_e = \\frac{\\lambda^2}{4\\pi}G',
      [
        { k: 'Ω_A', v: omegaA.toFixed(4) + ' sr' },
        { k: 'Directivity D', v: D.toFixed(3) + '  (' + DdBi.toFixed(2) + ' dBi)' },
        { k: 'Gain G', v: G.toFixed(3) + '  (' + GdBi.toFixed(2) + ' dBi)' },
        { k: 'HPBW', v: hpbwDeg.toFixed(2) + '°' },
        { k: 'A_e', v: Ae_cm2.toFixed(2) + ' cm²' },
        { k: 'λ', v: (lambda * 100).toFixed(2) + ' cm' }
      ]
    );
  },

  tick(dt) {
    // Gentle rotation of the pattern for depth perception
    if (this.patternGroup) {
      this.patternGroup.rotation.y += dt * 0.18;
    }
    if (this.coneGroup) {
      this.coneGroup.rotation.y += dt * 0.18;
    }

  lesson: `<p>For a normalized power pattern <b>P<sub>n</sub>(θ) = sin<sup>n</sup>θ</b>, the beam solid angle is

  // ---------- physics helpers ----------
  _psi(thetaRad, dLambda, deltaRad) {
    return 2 * Math.PI * dLambda * Math.cos(thetaRad) + deltaRad;

  _weights(type, n) {
    if (type === 'Binomial Array (No Sidelobes)') {
      const w = [];
      for (let k = 0; k < n; k++) {
        // C(n-1, k)
        let c = 1;
        for (let j = 0; j < k; j++) c = c * (n - 1 - j) / (j + 1);

  _af(type, n, dLambda, deltaRad, thetaRad) {

    }

    if (Math.abs(s) < 1e-9) return 1;
    return Math.abs(Math.sin(n * psi / 2) / (n * s));

  _elem(thetaRad, useElem) {

    let bestSide = 0;
    const N = 1800;

    for (let i = 0; i <= N; i++) {
      const th = i * Math.PI / N;
      vals.push(this._total(type, n, dLambda, deltaRad, th, useElem));
    }
    for (let i = 1; i < N; i++) {

        const ang = i * 0.1;

    content.add(this.arrowGroup);
    this.arrowMeshes = [];
    const arrowMat = new THREE.MeshStandardMaterial({

    });

      shaft.position.y = 0.5;

      this.arrowGroup.add(g);
      this.arrowMeshes.push(g);

    // ---- Ground grid / reference plane ----
    const grid = new THREE.GridHelper(12, 24, 0x2a4a5e, 0x1b3346);

    grid.material.opacity = 0.35;
    content.add(grid);

    // ---- Axis helper (z axis emphasized) ----
    const zAxisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -1.6, 0), new THREE.Vector3(0, 2.2, 0)

  update() {
    const st = this.state;
    const c = this.c;
    const mu0 = this.mu0;
    const dl = this.dl;

    const f = st.freq_MHz * 1e6;
    const omega = 2 * Math.PI * f;
    const lambda = c / f;
    const R = st.R_obs;
    const I0 = st.I0;

    const tau = R / c;                 // seconds
    const tauNs = tau * 1e9;
    const betaR = omega * tau;         // rad
    const betaRDeg = betaR * 180 / Math.PI;
    const Rlambda = R / lambda;

    // retarded time
    const tr = this.t - tau;

    // A_z at observation point
    const Az = (mu0 * I0 * dl / (4 * Math.PI * R)) * Math.cos(omega * tr);
    const AzAmp = mu0 * I0 * dl / (4 * Math.PI * R);

    // ---- probe position ----
    this.probeGroup.position.set(0, 0, R);
    this.guide.geometry.setFromPoints([
      new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, R)
    ]);

    // ---- source current animation ----
    const Isrc = I0 * Math.cos(omega * this.t);
    const srcScale = 0.85 + 0.25 * (Isrc / Math.max(I0, 1e-6));
    this.srcRod.scale.y = srcScale;
    this.capTop.position.y = 0.275 * srcScale;
    this.capBot.position.y = -0.275 * srcScale;
    this.halo.scale.setScalar(1 + 0.12 * (Isrc / Math.max(I0, 1e-6)));

    // ---- wavefronts: expanding retarded shells ----
    // Each shell represents a wavefront emitted at an earlier time.
    // Radius = c * (t - t_emit). We cycle 5 shells over a period.
    const period = 1 / f;
    for (let i = 0; i < this.wavefronts.length; i++) {
      const wf = this.wavefronts[i];
      const frac = ((this.t / period) + i / this.wavefronts.length) % 1;
      const radius = 0.25 + frac * (lambda * 2.2);
      wf.scale.setScalar(radius);
      wf.material.opacity = 0.20 * (1 - frac) * (st.animate ? 1 : 0.55);
      wf.visible = radius > 0.05;
    }

    // ---- A_z arrows along radial path ----
    // Place arrows at several radii; amplitude follows retarded phase.
    const nArrows = this.arrowMeshes.length;
    for (let i = 0; i < nArrows; i++) {
      const r = 0.55 + (i / (nArrows - 1)) * (R - 0.55);
      const trLocal = this.t - r / c;
      const AzLocal = (mu0 * I0 * dl / (4 * Math.PI * Math.max(r, 0.05))) *
                      Math.cos(omega * trLocal);
      const norm = AzLocal / (mu0 * I0 * dl / (4 * Math.PI * 0.55) + 1e-12);
      const len = 0.18 + 0.55 * Math.abs(norm);
      const g = this.arrowMeshes[i];
      g.position.set(0, 0, r);
      g.scale.set(1, len, 1);
      // arrows point along +z when Az > 0, -z when Az < 0
      g.rotation.x = AzLocal >= 0 ? 0 : Math.PI;
      g.visible = true;
    }

    // ---- chart: I(t) vs A_z(R_obs, t) ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);

    // backdrop
    ctx.fillStyle = 'rgba(8, 18, 28, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120, 200, 255, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    const padL = 42, padR = 14, padT = 26, padB = 34;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // axes
    ctx.strokeStyle = 'rgba(160, 210, 240, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    // grid
    ctx.strokeStyle = 'rgba(120, 180, 220, 0.16)';
    ctx.lineWidth = 1;
    for (let k = 0; k <= 4; k++) {
      const y = padT + plotH * k / 4;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }
    for (let k = 0; k <= 4; k++) {
      const x = padL + plotW * k / 4;
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
    }

    // time window: 2 periods
    const T = 1 / f;
    const tStart = this.t - 2 * T;
    const tEnd = this.t;

    // current I(t) (normalized to I0)
    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const tt = tStart + (tEnd - tStart) * i / 200;
      const val = Math.cos(omega * tt);
      const x = padL + plotW * i / 200;
      const y = padT + plotH * (0.5 - 0.42 * val);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // retarded A_z (normalized to its amplitude)
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const tt = tStart + (tEnd - tStart) * i / 200;
      const val = Math.cos(omega * (tt - tau));
      const x = padL + plotW * i / 200;
      const y = padT + plotH * (0.5 - 0.42 * val);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // delay marker: vertical dashed line at t - tau
    const tMark = this.t - tau;
    if (tMark >= tStart && tMark <= tEnd) {
      const xm = padL + plotW * (tMark - tStart) / (tEnd - tStart);
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 1.2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(xm, padT);
      ctx.lineTo(xm, padT + plotH);
      ctx.stroke();
      ctx.setLineDash([]);

      // marker dot on A_z curve
      const val = Math.cos(omega * (tMark - tau));
      const ym = padT + plotH * (0.5 - 0.42 * val);
      ctx.fillStyle = '#7fd1ff';
      ctx.beginPath();
      ctx.arc(xm, ym, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    // labels
    ctx.fillStyle = 'rgba(220, 240, 255, 0.9)';
    ctx.font = '11px system-ui, sans-serif';
    ctx.fillText('I(t)', padL + 4, padT - 8);
    ctx.fillStyle = '#7fd1ff';
    ctx.fillText('A_z(R_obs, t)', padL + 70, padT - 8);

    ctx.fillStyle = 'rgba(180, 210, 230, 0.75)';
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillText('t (2 periods)', padL + plotW - 78, padT + plotH + 20);
    ctx.fillText('delay τ_d = R/c', padL + 4, padT + plotH + 20);

    // ---- HUD ----
    setHud(
      'Retarded Potentials',
      '\\mathbf{A}(\\mathbf{r},t)=\\frac{\\mu_0}{4\\pi}\\int\\frac{\\mathbf{J}(\\mathbf{r}^{\\prime},t-R/c)}{R}\\,dv^{\\prime}',
      [
        { k: 'Delay τ_d = R/c', v: tauNs.toFixed(2) + ' ns' },
        { k: 'Electrical length R/λ', v: Rlambda.toFixed(3) },
        { k: 'Phase lag βR', v: betaRDeg.toFixed(1) + '°' },
        { k: '|A_z|', v: (AzAmp * 1e9).toFixed(3) + ' nWb/m' }
      ]
    );
  },

  tick(dt) {

  },

  lesson: `<p>The retarded potentials express that electromagnetic influence propagates at finite speed <em>c</em>. The scalar and vector potentials at observation point <strong>r</strong> and time <em>t</em> depend on the source configuration at the <em>retarded time</em> <strong>t<sub>r</sub> = t − R/c</strong>, where <strong>R = |r − r′|</strong> is the distance from the source element to the observation point.</p>
<p>For a short z-directed current element <em>I₀ dl</em>, the magnetic vector potential is</p>
<p style="text-align:center">A<sub>z</sub>(R,t) = (μ₀ I₀ dl / 4πR) cos(ω(t − R/c)).</p>
<p>The propagation delay is <strong>τ<sub>d</sub> = R/c</strong>, the electrical phase lag is <strong>βR = ωR/c = 2πR/λ</strong>, and the electrical length is <strong>R/λ</strong>. In the Lorenz gauge, ∇·A + μ₀ε₀ ∂V/∂t = 0, and the fields follow from <strong>E = −∇V − ∂A/∂t</strong> and <strong>B = ∇×A</strong>. In the near zone (R ≪ λ) the delay is small and quasistatic behavior emerges; in the far zone (R ≫ λ) the phase lag dominates and radiation fields emerge.</p>`,

  quiz: [
    {
      q: 'The retarded time used in the potential integral is:',
      options: ['t + R/c', 't − R/c', 't − R²/c²', 't'],
      answer: 1
    },

      q: 'For a fixed observation distance R, increasing the source frequency f causes the electrical phase lag βR to:',

        '∇×A + μ₀ε₀ ∂V/∂t = 0',
        '∇V + ∂A/∂t = 0'
      ],
      answer: 1
    }
  ]
});
modules.push({
  id: 'short_dipole_radiation_resistance',
  title: '5-5 Short Dipole Antenna & Radiation Resistance',
  controls: [

  build() {
    const Z0 = 376.730313668;
    this.Z0 = Z0;

    // ---------- dipole conductor (z-axis) ----------
    const dipoleGroup = new THREE.Group();
    content.add(dipoleGroup);

    const matB = new THREE.MeshStandardMaterial({ color: 0xffb347, metalness: 0.6, roughness: 0.35, emissive: 0x3a1a00, emissiveIntensity: 0.5 });

    const gap = new THREE.Mesh(gapGeo, gapMat);

    const thetaSeg = 96, phiSeg = 96;

      for (let j = 0; j <= phiSeg; j++) {

    const patGeo = new THREE.BufferGeometry();

    patGeo.setIndex(idx);
    patGeo.computeVertexNormals();
    const patMat = new THREE.MeshStandardMaterial({
      vertexColors: true, transparent: true, opacity: 0.42,
      side: THREE.DoubleSide, roughness: 0.55, metalness: 0.1,

    });
    const patternMesh = new THREE.Mesh(patGeo, patMat);
    patternGroup.add(patternMesh);
    this.patternMesh = patternMesh;

    // wireframe outline of the pattern for clarity
    const wireMat = new THREE.MeshBasicMaterial({ color: 0x7fd1ff, wireframe: true, transparent: true, opacity: 0.12 });
    const wireMesh = new THREE.Mesh(patGeo, wireMat);
    patternGroup.add(wireMesh);

    // ---------- field vector arrows (E_theta, H_phi) ----------
    this.arrowGroup = new THREE.Group();
    content.add(this.arrowGroup);

    // ---------- ground plane / reference grid ----------
    const grid = new THREE.GridHelper(8, 16, 0x2a4a6a, 0x1a2a3a);

    // ---------- chart ----------

    // ---------- state ----------

  update() {
    const st = this.state;
    const Z0 = this.Z0;
    const lLam = st.l_lambda;
    const I0 = st.I0;
    const triangular = (st.current_dist === 'Triangular (Center-Fed Short)');

    // effective length
    const lEffLam = triangular ? lLam / 2 : lLam;
    const Rr = triangular
      ? 20 * Math.PI * Math.PI * lLam * lLam
      : 80 * Math.PI * Math.PI * lLam * lLam;
    const Prad = 0.5 * I0 * I0 * Rr;

    // ---------- dipole geometry scaling ----------
    // physical length in scene units: map l/lambda to a visible length
    const Lscene = 1.6 + 6.0 * lLam;   // grows with electrical length
    const half = Lscene / 2;
    this.upper.scale.set(1, half, 1);
    this.lower.scale.set(1, half, 1);
    this.upper.position.y = half / 2;
    this.lower.position.y = -half / 2;
    this.gap.position.y = 0;

    // current distribution dots
    const N = this.curDots.length;
    for (let i = 0; i < N; i++) {
      const u = (i / (N - 1)) * 2 - 1; // -1 .. 1
      const z = u * half;
      const m = this.curDots[i];
      m.position.set(0, z, 0);
      // normalized current magnitude
      let cur;
      if (triangular) {
        cur = 1 - Math.abs(u); // zero at ends, max at center
      } else {
        cur = 1; // uniform
      }
      const s = 0.35 + 0.9 * cur;
      m.scale.setScalar(s);
      const c = new THREE.Color().setHSL(0.55 - 0.25 * cur, 0.85, 0.35 + 0.45 * cur);
      m.material.color.copy(c);
      m.material.emissive.copy(c).multiplyScalar(0.55);

      if (c.geometry) c.geometry.dispose();

      const ePhi = new THREE.Vector3(-Math.sin(d.ph), 0, Math.cos(d.ph));

    }

    // ---------- chart ----------
    const ctx = this.chartCtx;
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);

    // backdrop
    ctx.fillStyle = 'rgba(8, 16, 28, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120, 180, 240, 0.35)';
    ctx.lineWidth = 1;

    ctx.moveTo(px, py);

    }

      ctx.beginPath(); ctx.moveTo(x, py); ctx.lineTo(x, py + ph); ctx.stroke();

    // max Rr for scaling: at l/lambda = 0.15
    const maxRr = 80 * Math.PI * Math.PI * 0.15 * 0.15; // ~17.76

  build() {

  // ---- helper: normalized far-field pattern F(theta) ----
  _F(theta, Llam) {
    const s = Math.sin(theta);
    if (Math.abs(s) < 1e-6) return 0;
    const a = Math.PI * Llam;
    return Math.abs((Math.cos(a * Math.cos(theta)) - Math.cos(a)) / s);
  },

  // ---- helper: radiation resistance via numerical integration ----
  _Rr(Llam) {
    // I_in = I_m * sin(beta*L/2)  (current at the feed terminals)
    const a = Math.PI * Llam;
    const Iin = Math.sin(a);           // normalized to I_m = 1
    const N = 400;
    let integral = 0;
    for (let i = 0; i < N; i++) {
      const th = (i + 0.5) * Math.PI / N;
      const F = this._F(th, Llam);
      integral += F * F * Math.sin(th) * (Math.PI / N);
    }
    const Prad = (this.Z0 / (4 * Math.PI)) * integral;   // I_m = 1
    if (Math.abs(Iin) < 1e-6) return Infinity;
    return 2 * Prad / (Iin * Iin);
  },

  // ---- helper: directivity ----
  _D(Llam) {
    const N = 400;
    let integral = 0;
    for (let i = 0; i < N; i++) {
      const th = (i + 0.5) * Math.PI / N;
      const F = this._F(th, Llam);
      integral += F * F * Math.sin(th) * (Math.PI / N);
    }
    // max of F^2 over theta
    let maxF2 = 0;
    for (let i = 0; i <= 2000; i++) {
      const th = i * Math.PI / 2000;
      const F = this._F(th, Llam);
      if (F * F > maxF2) maxF2 = F * F;
    }
    if (integral < 1e-9) return 0;
    return 4 * Math.PI * maxF2 / integral;
  },

  // ---- helper: count lobes (maxima of F^2 in 0..pi) ----
  _lobes(Llam) {
    const N = 1200;
    let count = 0;
    let prev = this._F(0.0001, Llam);
    let prevSign = 0;
    let vals = [];
    for (let i = 0; i <= N; i++) {
      const th = i * Math.PI / N;
      vals.push(this._F(th, Llam));
    }
    // count local maxima above a small threshold
    for (let i = 1; i < vals.length - 1; i++) {
      if (vals[i] > vals[i - 1] && vals[i] >= vals[i + 1] && vals[i] > 0.05) count++;
    }
    return Math.max(count, 1);
  },

  // ---- helper: HPBW (degrees) ----
  _hpbw(Llam) {
    // find global max direction
    const N = 2000;
    let bestTh = Math.PI / 2, bestF = 0;
    for (let i = 0; i <= N; i++) {
      const th = i * Math.PI / N;
      const F = this._F(th, Llam);
      if (F > bestF) { bestF = F; bestTh = th; }
    }
    if (bestF < 1e-6) return 0;
    const half = bestF / Math.sqrt(2);
    // search outward from bestTh
    let lo = bestTh, hi = bestTh;
    for (let i = 0; i <= N; i++) {
      const th = bestTh - i * Math.PI / N;
      if (th < 0) break;
      if (this._F(th, Llam) <= half) { lo = th; break; }
    }
    for (let i = 0; i <= N; i++) {
      const th = bestTh + i * Math.PI / N;
      if (th > Math.PI) break;
      if (this._F(th, Llam) <= half) { hi = th; break; }
    }
    return (hi - lo) * 180 / Math.PI;
  },

  update() {
    const st = this.state;

    const dLam = st.d_lambda;
    const d = dLam; // in units of lambda

    // phase delta in radians
    let delta = 0;
    let modeName = st.steer_mode;
    if (modeName === 'Broadside (δ = 0)') {
      delta = 0;
    } else if (modeName === 'Ordinary End-Fire (δ = −βd)') {
      delta = -2 * Math.PI * dLam;
    } else {
      delta = -(2 * Math.PI * dLam + Math.PI / N);

    // element positions along z, centered
    const L = (N - 1) * d;
    const z0 = -L / 2;
    for (let i = 0; i < 16; i++) {
      const s = this.spheres[i];

        s.visible = true;
        const z = z0 + i * d;

        // phase color: hue from excitation phase
        const ph = i * delta;
        const hue = ((ph / (2 * Math.PI)) % 1 + 1) % 1;
        const col = new THREE.Color().setHSL(hue, 0.85, 0.55);

    const betaD = 2 * Math.PI * dLam;
    const psi0 = delta;

    const af = (theta) => {
      const u = betaD * Math.cos(theta) + psi0;
      // sum of geometric series
      const s = Math.sin(N * u / 2) / Math.sin(u / 2);
      return Math.abs(s / N);

    // Build beam surface: radius proportional to |AF|^2 (power pattern), scaled

    const pos = this.beamGeo.attributes.position;

    let k = 0;
    for (let it = 0; it <= NT; it++) {

      const r = Rmax * Math.pow(a, 1.6);
      const sinT = Math.sin(th), cosT = Math.cos(th);
      for (let ip = 0; ip <= NP; ip++) {
        const ph = 2 * Math.PI * ip / NP;
        arr[k++] = r * sinT * Math.cos(ph);
        arr[k++] = r * sinT * Math.sin(ph);
        arr[k++] = r * cosT;
      }

    pos.needsUpdate = true;
    this.beamGeo.computeVertexNormals();
    this.beamGeo.computeBoundingSphere();

    // main beam direction

    if (modeName === 'Broadside (δ = 0)') {

      hpbwDeg = 2 * Math.acos(clamped) * 180 / Math.PI;
      Dlin = 4 * N * dLam;
    } else {
      // Hansen-Woodyard: HPBW ~ 2*arccos(1 - 1.391/(pi*N*d)) but with extra phase
      const arg = 1 - 1.391 / (Math.PI * N * dLam);
      const clamped = Math.max(-1, Math.min(1, arg));
      hpbwDeg = 2 * Math.acos(clamped) * 180 / Math.PI;
      Dlin = 7.2 * N * dLam;
    }

    const DdBi = 10 * Math.log10(Math.max(Dlin, 1e-6));

    // ---- 2D chart ----
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);

    // backdrop
    ctx.fillStyle = 'rgba(8, 16, 26, 0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120, 200, 255, 0.35)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    const padL = 44, padR = 14, padT = 26, padB = 34;
    const plotW = W - padL - padR;

    // grid

    ctx.lineWidth = 1;

    }
    for (let a = 0; a <= 180; a += 30) {
      const x = padL + plotW * (a / 180);
      ctx.beginPath();
      ctx.moveTo(x, padT);
      ctx.lineTo(x, padT + plotH);
      ctx.stroke();
      ctx.fillStyle = 'rgba(160, 210, 240, 0.75)';

    const steps = 360;
    for (let i = 0; i <= steps; i++) {
      const th = Math.PI * i / steps;
      const a = af(th);
      const db = 20 * Math.log10(Math.max(a, 1e-6));
      const clampedDb = Math.max(-30, db);
      const x = padL + plotW * (i / steps);
      const y = padT + plotH * (-clampedDb / 30);

      else ctx.lineTo(x, y);

    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // fill under curve
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.lineTo(padL, padT + plotH);
    ctx.closePath();
    ctx.fillStyle = 'rgba(80, 180, 255, 0.12)';
    ctx.fill();

    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xm, padT);
    ctx.lineTo(xm, padT + plotH);
    ctx.stroke();
    ctx.setLineDash([]);

    // HPBW bracket
    const half = hpbwDeg / 2;
    const lo = Math.max(0, mainDeg - half);
    const hi = Math.min(180, mainDeg + half);
    const x1 = padL + plotW * (lo / 180);
    const x2 = padL + plotW * (hi / 180);
    const yb = padT + plotH - 6;
    ctx.strokeStyle = 'rgba(255, 209, 102, 0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x1, yb);
    ctx.lineTo(x2, yb);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x1, yb - 4);
    ctx.lineTo(x1, yb + 4);
    ctx.moveTo(x2, yb - 4);
    ctx.lineTo(x2, yb + 4);
    ctx.stroke();

  lesson: `<p>An <b>N-element uniform linear array</b> along the z-axis has array factor

modules.push({

  build() {

    this.eRArrow = eRArrow;
    this.hPhiArrow = hPhiArrow;

    // ---------- coordinate axes ----------
    const axisMat = new THREE.LineBasicMaterial({ color: 0x3a4a63, transparent: true, opacity: 0.6 });
    const axisGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0, -1.6, 0), new THREE.Vector3(0, 1.6, 0)
    ]);
    content.add(new THREE.Line(axisGeo, axisMat));

    // ---------- chart ----------
    this.chartCtx = chartEl.getContext('2d');

  update() {
    const st = this.state;
    const Z0 = this.Z0;
    const lambda = 1.0;
    const beta = 2 * Math.PI / lambda;
    const r = st.r_lambda * lambda;
    const theta = st.theta_deg * Math.PI / 180;
    const I0 = st.I0;

    const sinT = Math.sin(theta);
    const cosT = Math.cos(theta);
    const sinT2 = sinT * sinT;

    // exact half-wave dipole field magnitudes
    const cosArg = Math.cos((Math.PI / 2) * cosT);
    const sinArg = Math.sin((Math.PI / 2) * cosT);

    const Hphi = (I0 / (2 * Math.PI * r * sinT)) * cosArg;
    const Etheta = (Z0 * I0 / (2 * Math.PI * r * sinT)) * cosArg;

    const Er = (Z0 * I0 / (2 * Math.PI * r * r)) *
      (sinArg / (beta * r) - cosT * cosArg / sinT2);

    const Zwave = Math.abs(Etheta / Hphi); // = Z0 exactly for this ideal form

    // ---------- observation point position ----------
    const px = r * sinT;
    const pz = r * cosT;
    const p = new THREE.Vector3(px, 0, pz);

    this.pt.position.copy(p);

    // shell radius
    this.shell.scale.setScalar(r);
    this.shellWire.scale.setScalar(r);

    // ---------- local basis vectors ----------
    // r-hat
    const rHat = new THREE.Vector3(sinT, 0, cosT);
    // theta-hat (in x-z plane, pointing toward increasing theta)
    const thetaHat = new THREE.Vector3(cosT, 0, -sinT);
    // phi-hat (azimuthal, here y direction)
    const phiHat = new THREE.Vector3(0, 1, 0);

    // ---------- arrow scaling ----------
    // Normalize so far-field E_theta arrow is a sensible length.
    const Efar = (Z0 * I0) / (2 * Math.PI * r);
    const scaleE = 0.55 / Math.max(Efar, 1e-6);
    const scaleH = 0.55 / Math.max(Efar / Z0, 1e-6);

  lesson: `<p>Section 5-9 surveys the major antenna families. Aperture antennas (pyramidal horn, parabolic dish, dielectric lens) obey <b>G = eta_a (pi D / lambda)^2</b> with HPBW ~ 70/(D/lambda) degrees. Small loops have radiation resistance <b>R_r = 31171 (A/lambda^2)^2</b> ohms, and Babinet's principle relates a slot to its complementary dipole by <b>Z_slot Z_dipole = Z_0^2/4</b>. Opened-out coaxial (discone) and two-conductor (V/rhombic) structures are broadband travelling-wave radiators. End-fire Yagi-Uda arrays use a driven element, reflector and directors; axial-mode helices radiate circularly polarized end-fire beams with <b>G ~ 15 N S C^2 / lambda^3</b>. Log-periodic and conical-spiral antennas are frequency-independent because their geometry scales by <b>tau = R_(n+1)/R_n</b>. Microstrip patches resonate at <b>L ~ 0.49 lambda_0 / sqrt(eps_r)</b> with broadside hemispherical patterns (6-8 dBi). Frequency selective surfaces are periodic dipole/slot arrays that reflect at resonance f_0 and transmit off-resonance, acting as spatial filters.</p>`,

  lesson: `<p>The Friis transmission formula links transmit power, antenna gains, wavelength and range to the power captured by the receiving antenna:</p>
  <p><b>P<sub>r</sub> = P<sub>t</sub> G<sub>t</sub> G<sub>r</sub> (λ / 4πR)²</b></p>
  <p>The factor (λ/4πR)² is the spreading loss of an isotropic wave: power density falls as 1/R², and the effective capture area of an isotropic antenna is λ²/4π. In decibels this becomes the free-space path loss</p>
  <p><b>FSPL<sub>dB</sub> = 20 log₁₀(4πR/λ) = 20 log₁₀(4πRf/c)</b></p>

    const yTop = -20, yBot = -140;
    const mapY = (v) => ly + lh * (1 - (v - yBot) / (yTop - yBot));
    const mapX = (Rm) => lx + lw * (Math.log10(Rm) - Math.log10(Rmin)) / (Math.log10(RmaxPlot) - Math.log10(Rmin));

    // observer ray

  update() {
    const st = this.state;
    const Dl = st.D_lambda;
    const Rff = 2 * Dl * Dl; // in lambda units
    const R1 = 0.62 * Math.sqrt(Dl * Dl * Dl);
    const r = st.r_ratio * Rff;

    // aperture width in scene units (scale lambda = 1)
    const D = Dl;
    this.plate.scale.x = D;
    this.strip.scale.x = D;
    this.edgeL.position.set(-D / 2, 0.06, 0);
    this.edgeR.position.set(D / 2, 0.06, 0);

    // rings at fractions of Rff
    const ringFracs = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5];
    this.ringMeshes.forEach((ring, i) => {
      const rr = ringFracs[i] * Rff;
      ring.position.set(0, 0, rr);
      ring.scale.set(rr, rr, 1);
      ring.material.opacity = i === 3 ? 0.7 : 0.25;
      ring.material.color.setHex(i === 3 ? 0xffb347 : 0x4a7fb5);
    });

    // far-field pattern lobes: compute F(u) for u = sin theta
    const taper = st.taper;
    const N = 9;
    const lobeData = [];
    for (let i = 0; i < N; i++) {
      const theta = (i - (N - 1) / 2) * (Math.PI / 18); // -40..40 deg
      const u = Math.sin(theta);
      let F;
      if (taper === 'Uniform (sinc pattern)') {
        F = Math.abs(Math.sin(Math.PI * D * u) / (Math.PI * D * u + 1e-12));
      } else if (taper === 'Cosine Taper (low sidelobes)') {
        const a = Math.PI * D * u;
        F = Math.abs(Math.cos(a / 2) / (1 - (a / Math.PI) ** 2 + 1e-12));
      } else {
        const a = Math.PI * D * u;
        F = Math.abs((Math.sin(a / 2) / (a / 2 + 1e-12)) ** 2);
      }
      lobeData.push({ theta, F });
    }

    const maxF = Math.max(...lobeData.map(d => d.F), 1e-6);
    this.lobeMeshes.forEach((lobe, i) => {
      const d = lobeData[i];
      const amp = d.F / maxF;
      const len = 0.3 + 1.2 * amp;
      lobe.scale.set(0.6 + 0.4 * amp, len, 0.6 + 0.4 * amp);
      lobe.position.set(0, len / 2, 0);
      lobe.rotation.z = -d.theta;
      lobe.material.color.setHex(amp > 0.5 ? 0x7fd1ff : 0x3a6a9a);
      lobe.material.emissiveIntensity = 0.3 + 0.7 * amp;
    });

    // observer position along z at distance r
    this.observer.position.set(0, 0, r);
    this.rayLine.geometry.setFromPoints([new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, r)]);

    // HUD values
    const hpbw = taper === 'Uniform (sinc pattern)' ? 50.8 / Dl : taper === 'Cosine Taper (low sidelobes)' ? 68.0 / Dl : 73.0 / Dl;
    const sidelobe = taper === 'Uniform (sinc pattern)' ? -13.2 : taper === 'Cosine Taper (low sidelobes)' ? -23.0 : -26.5;

    setHud(
      'Far Field / Near Field & Fourier Transform',
      'R_{\\mathrm{ff}} = \\frac{2D^2}{\\lambda},\\quad F(\\sin\\theta) = \\int_{-D/2}^{D/2} E_a(x) e^{j\\beta x \\sin\\theta}\\,dx',
      [
        { k: 'Aperture D/λ', v: Dl.toFixed(1) },
        { k: 'Reactive R₁/λ', v: R1.toFixed(2) },
        { k: 'Far-Field R_ff/λ', v: Rff.toFixed(2) },
        { k: 'HPBW (deg)', v: hpbw.toFixed(1) },
        { k: 'First Sidelobe (dB)', v: sidelobe.toFixed(1) }
      ]
    );

    // chart
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(8,14,24,0.82)';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(120,180,230,0.25)';
    ctx.lineWidth = 1;
    ctx.strokeRect(0.5, 0.5, W - 1, H - 1);

    const padL = 42, padR = 14, padT = 26, padB = 34;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    // axes
    ctx.strokeStyle = 'rgba(160,200,240,0.5)';
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    // x axis: aperture coordinate x / (D/2) from -1 to 1
    const xMin = -1.2, xMax = 1.2;
    const mapX = x => padL + (x - xMin) / (xMax - xMin) * plotW;

    // aperture illumination curve (normalized)
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const x = xMin + (xMax - xMin) * i / 200;
      const xn = x; // normalized to D/2
      let Ea;
      if (taper === 'Uniform (sinc pattern)') Ea = Math.abs(xn) <= 1 ? 1 : 0;
      else if (taper === 'Cosine Taper (low sidelobes)') Ea = Math.abs(xn) <= 1 ? Math.cos(Math.PI * xn / 2) : 0;
      else Ea = Math.abs(xn) <= 1 ? 1 - Math.abs(xn) : 0;
      const y = padT + plotH - Ea * plotH * 0.55;
      if (i === 0) ctx.moveTo(mapX(x), y); else ctx.lineTo(mapX(x), y);
    }
    ctx.stroke();

    // far-field pattern in dB vs sin theta
    const uMin = -1.0, uMax = 1.0;
    const mapU = u => padL + (u - uMin) / (uMax - uMin) * plotW;
    const dbMin = -40, dbMax = 0;
    const mapDb = db => padT + plotH - (db - dbMin) / (dbMax - dbMin) * plotH;

    ctx.strokeStyle = '#ffb347';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 300; i++) {
      const u = uMin + (uMax - uMin) * i / 300;
      let F;
      if (taper === 'Uniform (sinc pattern)') {
        const a = Math.PI * Dl * u;
        F = Math.abs(Math.sin(a) / (a + 1e-12));
      } else if (taper === 'Cosine Taper (low sidelobes)') {
        const a = Math.PI * Dl * u;
        F = Math.abs(Math.cos(a / 2) / (1 - (a / Math.PI) ** 2 + 1e-12));
      } else {
        const a = Math.PI * Dl * u;
        F = Math.abs((Math.sin(a / 2) / (a / 2 + 1e-12)) ** 2);
      }
      const db = 20 * Math.log10(Math.max(F, 1e-6));
      const y = mapDb(Math.max(db, dbMin));
      if (i === 0) ctx.moveTo(mapU(u), y); else ctx.lineTo(mapU(u), y);
    }
    ctx.stroke();

    // grid lines
    ctx.strokeStyle = 'rgba(120,180,230,0.15)';
    ctx.lineWidth = 1;
    for (let db = -30; db <= 0; db += 10) {
      const y = mapDb(db);
      ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL + plotW, y); ctx.stroke();
    }

    // labels
    ctx.fillStyle = '#9fc7e8';
    ctx.font = '11px monospace';
    ctx.fillText('E_a(x)', padL + 4, padT + 12);
    ctx.fillStyle = '#ffb347';
    ctx.fillText('|F(sinθ)| dB', padL + plotW - 92, padT + 12);
    ctx.fillStyle = '#9fc7e8';
    ctx.fillText('x/(D/2)', padL + plotW - 52, padT + plotH + 20);
    ctx.fillText('sinθ', padL + plotW - 30, padT + plotH + 20);
  },

  lesson: `<p>The aperture field <b>E_a(x)</b> radiates into space. Close to the aperture the field is <b>reactive</b> (stored energy, non-radiating) out to <b>R₁ = 0.62√(D³/λ)</b>. Beyond that, the <b>Fresnel</b> region has curved phase fronts; the <b>Fraunhofer far field</b> begins when the phase curvature across the aperture is small, at <b>R_ff = 2D²/λ</b>.</p>
<p>In the far field the angular distribution is the Fourier transform of the aperture illumination: <b>F(sinθ) = ∫ E_a(x) e^{jβx sinθ} dx</b>. A uniform aperture gives a <b>sinc</b> pattern with first sidelobe −13.2 dB and HPBW ≈ 50.8/(D/λ)°. Cosine and triangular tapers broaden the main beam but suppress sidelobes (−23 dB and ≈−26.5 dB respectively).</p>
<p>Limiting cases: small D/λ → broad diffraction beam; large D/λ → narrow beam and far-field boundary pushed farther out. The Fourier transform is exact only in the Fraunhofer region; in the near field the pattern is not simply the aperture transform.</p>`,
