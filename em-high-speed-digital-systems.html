<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const viewport = document.getElementById('viewport');
const chartEl  = document.getElementById('chartEl');
const chartCtx = chartEl.getContext('2d');

const renderer = new THREE.WebGLRenderer({ canvas: viewport, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(viewport.clientWidth, viewport.clientHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1020);

const camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 200);
camera.position.set(6, 5, 9);
camera.lookAt(0, 0, 0);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.zoomSpeed = 0.05;

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 1.1);
key.position.set(6, 10, 8);
scene.add(key);
const rim = new THREE.DirectionalLight(0x7fd1ff, 0.6);
rim.position.set(-8, 4, -6);
scene.add(rim);

const grid = new THREE.GridHelper(20, 20, 0x2b3f66, 0x1a2540);
grid.position.y = -0.01;
scene.add(grid);

const content = new THREE.Group();
scene.add(content);

/* ---------- arrow field helper (with setVectors) ---------- */
function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const shaftGeo = new THREE.CylinderGeometry(0.035, 0.035, 1, 8);
  const headGeo  = new THREE.ConeGeometry(0.09, 0.22, 10);

  function buildOne(v) {
    const dir = v.dir.clone().normalize();
    const len = v.len ?? 1;
    const shaft = new THREE.Mesh(shaftGeo, mat);
    shaft.scale.y = len;
    shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.copy(v.origin).addScaledVector(dir, len);
    head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    group.add(shaft, head);
  }

  vectors.forEach(buildOne);

  group.setVectors = function (nextVecs) {
    while (group.children.length) {
      const c = group.children.pop();
      if (c.geometry) c.geometry.dispose();
    }
    nextVecs.forEach(buildOne);
  };
  return group;
}

/* ---------- HUD ---------- */
const hudTitle = document.getElementById('hudTitle');
const hudEq    = document.getElementById('hudEq');
const hudRows  = document.getElementById('hudRows');

function setHud(titleStr, latexEqStr, rowsArray) {
  hudTitle.textContent = titleStr;
  hudEq.innerHTML = latexEqStr;
  if (window.renderMathInElement) {
    renderMathInElement(hudEq, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false, strict: false });
  }
  hudRows.innerHTML = '';
  (rowsArray || []).forEach(r => {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.className = 'v'; v.textContent = r.v;
    hudRows.appendChild(k); hudRows.appendChild(v);
  });
}

/* ---------- module registry ---------- */
const modules = [];

modules.push({
  id: 'intro_reset_signal',
  title: '1. Scene I: A Strangely Behaving Reset Signal on a PC Card',

  controls: [
    { type: 'range', id: 'Rs', label: 'Source resistance Rs (ohm)', min: 10, max: 200, step: 1, value: 50 },
    { type: 'range', id: 'RL', label: 'Load resistance RL (ohm)', min: 10, max: 200, step: 1, value: 100 },
    { type: 'range', id: 'L', label: 'Trace length L (m)', min: 0.05, max: 0.5, step: 0.01, value: 0.25 },
    { type: 'range', id: 'Cp', label: "Distributed capacitance C' (pF/m)", min: 50, max: 200, step: 5, value: 100 },
    { type: 'range', id: 'Lp', label: "Distributed inductance L' (nH/m)", min: 200, max: 600, step: 10, value: 400 },
    { type: 'select', id: 'mode', label: 'Model', options: ['lumped', 'distributed'], value: 'distributed' }
  ],

  build() {
    const st = this.state;

    // ---------- PCB card ----------
    const board = new THREE.Mesh(
      new THREE.BoxGeometry(3.4, 0.06, 1.9),
      new THREE.MeshStandardMaterial({ color: 0x1d4a2e, roughness: 0.75, metalness: 0.15 })
    );
    board.position.set(0, -0.03, 0);
    content.add(board);

    // copper return plane (thin, slightly above board)
    const plane = new THREE.Mesh(
      new THREE.BoxGeometry(3.2, 0.012, 1.7),
      new THREE.MeshStandardMaterial({ color: 0xb98a3a, roughness: 0.35, metalness: 0.85 })
    );
    plane.position.set(0, 0.012, 0);
    content.add(plane);

    // ---------- trace ----------
    const traceMat = new THREE.MeshStandardMaterial({ color: 0xd9b25a, roughness: 0.3, metalness: 0.9 });
    const trace = new THREE.Mesh(new THREE.BoxGeometry(1, 0.035, 0.09), traceMat);
    trace.position.set(0, 0.055, 0);
    content.add(trace);

    // ---------- driver & load ----------
    const driver = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.34, 0.34),
      new THREE.MeshStandardMaterial({ color: 0x4f7fd6, roughness: 0.4, metalness: 0.5 })
    );
    driver.position.set(-1.55, 0.18, 0);
    content.add(driver);

    const load = new THREE.Mesh(
      new THREE.BoxGeometry(0.34, 0.34, 0.34),
      new THREE.MeshStandardMaterial({ color: 0xd65a4f, roughness: 0.4, metalness: 0.5 })
    );
    load.position.set(1.55, 0.18, 0);
    content.add(load);

    // labels via small emissive markers
    const driverGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0x9fc4ff })
    );
    driverGlow.position.set(-1.55, 0.38, 0);
    content.add(driverGlow);

    const loadGlow = new THREE.Mesh(
      new THREE.SphereGeometry(0.05, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffb0a0 })
    );
    loadGlow.position.set(1.55, 0.38, 0);
    content.add(loadGlow);

    // ---------- E-field arrows (trace -> return plane) ----------
    const arrows = [];
    for (let i = 0; i < 9; i++) {
      const x = -1.2 + i * 0.3;
      arrows.push({
        origin: new THREE.Vector3(x, 0.055, 0),
        dir: new THREE.Vector3(0, -1, 0),
        len: 0.045
      });
    }
    addArrowField(arrows, 0x7fd1ff);

    // ---------- chart ----------
    this.chartCtx = chartEl.getContext('2d');
    this.chartW = chartEl.width;
    this.chartH = chartEl.height;

    // ---------- state ----------
    Object.assign(st, {
      Rs: 50, RL: 100, L: 0.25, Cp: 100, Lp: 400, mode: 'distributed',
      tMax: 8e-9
    });

    // geometry update helper
    this.updateGeometry = () => {
      const Lm = st.L;
      const half = Lm / 2;
      // scale trace to length (board is 3.4 wide, so map L to visual width)
      const visLen = 0.6 + (Lm / 0.5) * 2.2;
      trace.scale.x = visLen;
      trace.position.x = 0;
      driver.position.x = -visLen / 2 - 0.22;
      load.position.x = visLen / 2 + 0.22;
      driverGlow.position.x = driver.position.x;
      loadGlow.position.x = load.position.x;
    };
    this.updateGeometry();
  },

  update() {
    const st = this.state;
    const Rs = st.Rs, RL = st.RL, L = st.L;
    const Cp = st.Cp * 1e-12;   // F/m
    const Lp = st.Lp * 1e-9;    // H/m

    // lumped RC
    const C = Cp * L;
    const tau = (Rs + RL) * C;  // seconds
    // distributed line
    const Z0 = Math.sqrt(Lp / Cp);
    const v = 1 / Math.sqrt(Lp * Cp); // m/s
    const tFlight = L / v;
    const GammaS = (Rs - Z0) / (Rs + Z0);
    const GammaL = (RL - Z0) / (RL + Z0);
    const rho = GammaS * GammaL;

    // rise time estimate (10-90%) for lumped
    const tr = 2.2 * tau;

    // overshoot estimate for distributed (first reflection)
    const overshoot = Math.abs(GammaL) * 100;

    // HUD
    setHud(
      'Reset Signal Response',
      String.raw`$v_L(t)=V_0\left(1-e^{-t/\tau}\right)$`,
      [
        { k: 'tau', v: (tau * 1e9).toFixed(2) + ' ns' },
        { k: 'Z0', v: Z0.toFixed(1) + ' ohm' },
        { k: 't_r', v: (tr * 1e9).toFixed(2) + ' ns' },
        { k: 'overshoot', v: overshoot.toFixed(1) + ' %' }
      ]
    );

    // ---------- chart ----------
    const ctx = this.chartCtx;
    const W = this.chartW, H = this.chartH;
    ctx.clearRect(0, 0, W, H);

    // background
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, W, H);

    // axes
    const padL = 55, padR = 20, padT = 30, padB = 45;
    const x0 = padL, x1 = W - padR;
    const y0 = H - padB, y1 = padT;

    ctx.strokeStyle = '#2a3a55';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, y0); ctx.lineTo(x1, y0);
    ctx.moveTo(x0, y0); ctx.lineTo(x0, y1);
    ctx.stroke();

    // grid
    ctx.strokeStyle = '#16233a';
    for (let i = 0; i <= 5; i++) {
      const yy = y0 - (i / 5) * (y0 - y1);
      ctx.beginPath(); ctx.moveTo(x0, yy); ctx.lineTo(x1, yy); ctx.stroke();
    }

    // time axis range
    const tMax = Math.max(6 * tau, 4 * tFlight, 1e-9);
    const tMin = 0;

    const mapX = (t) => x0 + (t - tMin) / (tMax - tMin) * (x1 - x0);
    const mapY = (val) => y0 - (val / 1.6) * (y0 - y1); // y range 0..1.6

    // lumped RC curve
    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    const N = 400;
    for (let i = 0; i <= N; i++) {
      const t = tMin + (i / N) * (tMax - tMin);
      const val = 1 - Math.exp(-t / tau);
      const px = mapX(t), py = mapY(val);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // distributed curve (simple lossless line with reflections)
    ctx.strokeStyle = '#ff9a76';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= N; i++) {
      const t = tMin + (i / N) * (tMax - tMin);
      let val = 0;
      if (t < tFlight) {
        val = 0;
      } else {
        // sum of reflections
        let sum = 0;
        for (let k = 0; k < 8; k++) {
          const tk = tFlight + 2 * k * tFlight;
          if (t >= tk) {
            sum += Math.pow(rho, k) * (1 + GammaL);
          }
        }
        val = sum;
      }
      const px = mapX(t), py = mapY(val);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    // overshoot marker
    if (overshoot > 0.5) {
      ctx.fillStyle = '#ff9a76';
      ctx.font = '12px monospace';
      ctx.fillText('overshoot ' + overshoot.toFixed(1) + '%', x0 + 10, y1 + 18);
    }

    // labels
    ctx.fillStyle = '#9fb3d1';
    ctx.font = '12px monospace';
    ctx.fillText('t (ns)', x1 - 50, y0 + 28);
    ctx.fillText('v_L / V0', x0 - 45, y1 + 12);

    // legend
    ctx.fillStyle = '#7fd1ff';
    ctx.fillRect(x1 - 150, y1 + 8, 12, 4);
    ctx.fillStyle = '#9fb3d1';
    ctx.fillText('lumped RC', x1 - 132, y1 + 14);

    ctx.fillStyle = '#ff9a76';
    ctx.fillRect(x1 - 150, y1 + 24, 12, 4);
    ctx.fillStyle = '#9fb3d1';
    ctx.fillText('distributed', x1 - 132, y1 + 30);

    // update geometry
    this.updateGeometry();
  },

  tick(dt) {
    // gentle pulse animation on the driver glow
    const t = performance.now() * 0.001;
    const st = this.state;
    const pulse = 0.5 + 0.5 * Math.sin(t * 3);
    // no direct access to glow meshes here; keep static
  },

  lesson: String.raw`
A reset line on a PC card looks like a simple DC connection: a driver with source resistance $R_s$ drives a load $R_L$ through a trace of length $L$. At low speed, the whole trace can be treated as a single lumped capacitor $C = C' L$, giving the familiar first-order step response

$$v_L(t)=V_0\left(1-e^{-t/\tau}\right),\qquad \tau=(R_s+R_L)C.$$

This lumped model is valid only when the trace is electrically short: $L \ll c\,t_r$, where $t_r$ is the signal rise time. When the board is fast, the trace becomes a distributed transmission line with per-unit-length inductance $L'$ and capacitance $C'$. Its characteristic impedance is

$$Z_0=\sqrt{\frac{L'}{C'}},$$

and signals propagate at $v=1/\sqrt{L'C'}$. Reflections occur at the driver and load whenever $R_s \ne Z_0$ or $R_L \ne Z_0$, with reflection coefficients

$$\Gamma_s=\frac{R_s-Z_0}{R_s+Z_0},\qquad \Gamma_L=\frac{R_L-Z_0}{R_L+Z_0}.$$

The product $\rho=\Gamma_s\Gamma_L$ controls the ringing: a reset edge that is clean at DC can overshoot and ring at high speed because the lumped RC assumption ignores propagation delay and impedance mismatch. The fix is to match $R_s$ and $R_L$ to $Z_0$, shorten the trace, or slow the edge.
`,

  quiz: [
    {
      q: 'When is the lumped RC model of a trace valid?',
      options: [
        'When the trace length is much shorter than the signal rise-time distance',
        'When the trace length is much longer than the signal rise-time distance',
        'When the load resistance equals the source resistance',
        'When the trace capacitance is zero'
      ],
      answer: 0
    },
    {
      q: 'What causes overshoot and ringing on a fast reset line?',
      options: [
        'Impedance mismatch at the driver and load producing reflections',
        'The DC resistance of the trace being too low',
        'The load capacitance being too small',
        'The driver voltage being too high'
      ],
      answer: 0
    }
  ]
});
modules.push({
  id: 'intro_cd_airplane',
  title: '2. Scene II: CD Player on Airplane Interferes with Navigation',
  controls: [
    { type: 'range', id: 'I', label: 'Loop current I (A)', min: 0.01, max: 1, step: 0.01, value: 0.2 },
    { type: 'range', id: 'A', label: 'Loop area A (m^2)', min: 1e-4, max: 1e-2, step: 1e-4, value: 2e-3 },
    { type: 'range', id: 'f', label: 'Frequency f (MHz)', min: 1, max: 100, step: 1, value: 30 },
    { type: 'range', id: 'r', label: 'Separation r (m)', min: 1, max: 20, step: 0.5, value: 6 },
    { type: 'select', id: 'mode', label: 'Field regime', options: ['near', 'far'], value: 'far' }
  ],

  build() {
    const st = this.state;
    Object.assign(st, { I: 0.2, A: 2e-3, f: 30, r: 6, mode: 'far' });

    // ---- aircraft fuselage outline (wireframe-ish tube) ----
    const fuselage = new THREE.Group();
    const bodyGeo = new THREE.CylinderGeometry(1.6, 1.6, 14, 24, 1, true);
    bodyGeo.rotateZ(Math.PI / 2);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: 0x9fb6cc, metalness: 0.55, roughness: 0.45,
      side: THREE.DoubleSide, transparent: true, opacity: 0.35
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    fuselage.add(body);

    const noseGeo = new THREE.SphereGeometry(1.6, 20, 14, 0, Math.PI * 2, 0, Math.PI / 2);
    noseGeo.rotateZ(-Math.PI / 2);
    const nose = new THREE.Mesh(noseGeo, bodyMat);
    nose.position.x = 7;
    fuselage.add(nose);

    const tailGeo = new THREE.ConeGeometry(1.6, 3.2, 20, 1, true);
    tailGeo.rotateZ(Math.PI / 2);
    const tail = new THREE.Mesh(tailGeo, bodyMat);
    tail.position.x = -8.6;
    fuselage.add(tail);

    // wings
    const wingMat = new THREE.MeshStandardMaterial({
      color: 0x8fa8c0, metalness: 0.5, roughness: 0.5,
      transparent: true, opacity: 0.4, side: THREE.DoubleSide
    });
    const wingGeo = new THREE.BoxGeometry(3.2, 0.18, 9);
    const wingL = new THREE.Mesh(wingGeo, wingMat);
    wingL.position.set(1.5, 0, 5.2);
    fuselage.add(wingL);
    const wingR = new THREE.Mesh(wingGeo, wingMat);
    wingR.position.set(1.5, 0, -5.2);
    fuselage.add(wingR);

    // fuselage edge lines
    const edgePts = [];
    for (let i = 0; i <= 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      edgePts.push(new THREE.Vector3(-7, 1.6 * Math.sin(a), 1.6 * Math.cos(a)));
      edgePts.push(new THREE.Vector3(7, 1.6 * Math.sin(a), 1.6 * Math.cos(a)));
    }
    const edgeGeo = new THREE.BufferGeometry().setFromPoints(edgePts);
    fuselage.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({ color: 0x6f8ea8 })));

    content.add(fuselage);

    // ---- CD player box with radiating loop ----
    const cdGroup = new THREE.Group();
    cdGroup.position.set(2.5, -0.9, 0.9);

    const box = new THREE.Mesh(
      new THREE.BoxGeometry(1.1, 0.28, 1.1),
      new THREE.MeshStandardMaterial({ color: 0x2b3440, metalness: 0.7, roughness: 0.35 })
    );
    cdGroup.add(box);

    const loopMat = new THREE.MeshStandardMaterial({
      color: 0xffb347, emissive: 0xff8a1f, emissiveIntensity: 0.9,
      metalness: 0.6, roughness: 0.3
    });
    const loop = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.035, 10, 40), loopMat);
    loop.rotation.x = Math.PI / 2;
    loop.position.y = 0.16;
    cdGroup.add(loop);

    // little "disc" hint
    const disc = new THREE.Mesh(
      new THREE.CylinderGeometry(0.34, 0.34, 0.02, 32),
      new THREE.MeshStandardMaterial({ color: 0xbfd8ee, metalness: 0.9, roughness: 0.15 })
    );

      ]
    );

    // scale arrows by field strength (log-ish)
    const scale = Math.min(2.2, Math.max(0.25, Math.log10(E / 1e-8) * 0.35));
    for (const a of this._arrows) {
      a.len = scale;
    }

    // ---- chart: E vs f (log-log) ----
    const ctx = this._ctx;
    const W = this._chartW, H = this._chartH;
    ctx.clearRect(0, 0, W, H);

    const x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB;

    const eMin = 1e-9, eMax = 1e1;
    const lx = (f) => x0 + (Math.log10(f) - Math.log10(fMin)) / (Math.log10(fMax) - Math.log10(fMin)) * (x1 - x0);
    const ly = (e) => y1 - (Math.log10(e) - Math.log10(eMin)) / (Math.log10(eMax) - Math.log10(eMin)) * (y1 - y0);

      ctx.textAlign = 'center';
      ctx.fillText('10^' + d, x, y1 + 16);

      const y = ly(Math.pow(10, d));
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
      ctx.fillStyle = '#7f93a8';
      ctx.textAlign = 'right';
      ctx.fillText('10^' + d, x0 - 6, y + 4);
    }

    ctx.strokeStyle = '#4a6a88';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.lineTo(x1, y1); ctx.stroke();

    // threshold line

    ctx.strokeStyle = '#ff6b6b';
    ctx.setLineDash([6, 5]);
    ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(x0, yT); ctx.lineTo(x1, yT); ctx.stroke();

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 1;

    ctx.font = '12px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('E (V/m) vs f (Hz)', x0 + 4, y0 - 8);

    });

  lesson: String.raw`
## Two viewpoints: lumped or distributed

A wire is not "just a wire". Whether you may treat it as a lumped element (a single node with $V = IR$ and $Q = CV$) or as a distributed transmission line (telegrapher's equations) depends on how the line's length compares with the distance a signal travels during its rise time.

Define the **electrical length**

$$\ell = \frac{L}{v_p\, t_r}$$

where $L$ is the physical length, $v_p$ the propagation speed (typically $0.5c$ to $0.9c$ for PCB traces), and $t_r$ the rise time of the signal.

- If $\ell \ll 1$, the signal's edge is much longer than the line: the line charges almost uniformly and the lumped model ($V=IR$, $Q=CV$) is adequate.
- If $\ell \gtrsim 1$, the line is electrically long: the wavefront travels along the line and reflections, delay, and ringing appear. You need the distributed view.

**Rule of thumb:** treat the interconnect as distributed when

$$L > \frac{v_p\, t_r}{6}$$

i.e. when $\ell > 1/6$. The factor $1/6$ comes from requiring the rise time to be at least about six times the one-way delay for the lumped approximation to hold within a few percent.

In the distributed picture the voltage and current obey

$$\frac{\partial V}{\partial x} = -L' \frac{\partial I}{\partial t}, \qquad
\frac{\partial I}{\partial x} = -C' \frac{\partial V}{\partial t}$$

with $L'$, $C'$ per-unit-length values, and $v_p = 1/\sqrt{L'C'}$. A step launched at $x=0$ arrives at $x=L$ after a delay $L/v_p$; the wavefront is visible as a traveling edge in the voltage-vs-position snapshot.

The lumped view is a *low-frequency / long-rise-time limit* of the distributed view: when $t_r \gg L/v_p$, the distributed line behaves like a single capacitor to ground plus a series resistance.

  lesson: String.raw`
### Propagation speed on a transmission line

A signal does not travel at the speed of light in vacuum along a PCB trace. The trace plus its surrounding dielectric form a transmission line with per-unit-length inductance $L'$ and capacitance $C'$. The wavefront moves at

$$v_p=\frac{1}{\sqrt{L'C'}}$$

For a homogeneous dielectric of relative permittivity $\varepsilon_r$, the line is filled with that dielectric and

$$v_p=\frac{c}{\sqrt{\varepsilon_r}},\qquad c=2.998\times10^{8}\ \mathrm{m/s}$$

### Microstrip: effective dielectric constant

In a microstrip the field is partly in the substrate ($\varepsilon_r$) and partly in air ($\varepsilon_r=1$). The result is an *effective* dielectric constant $\varepsilon_{r,\mathrm{eff}}$ between 1 and $\varepsilon_r$, roughly

$$\varepsilon_{r,\mathrm{eff}}\approx\frac{\varepsilon_r+1}{2}$$

so the propagation speed lies between $c$ and $c/\sqrt{\varepsilon_r}$. For FR-4 ($\varepsilon_r\approx4.2$), $\varepsilon_{r,\mathrm{eff}}\approx2.6$ and $v_p\approx0.62c\approx1.86\times10^{8}\ \mathrm{m/s}$.

### Distance traveled during a rise time

The edge of a digital signal is not instantaneous. During the rise time $t_r$ the wavefront covers

$$d=v_p\,t_r$$

This is the *spatial extent* of the edge. If $d$ is comparable to the trace length $L$, the line must be treated as distributed (transmission-line) rather than lumped.

### Propagation delay

The delay per unit length is

$$\frac{1}{v_p}=\frac{\sqrt{\varepsilon_{r,\mathrm{eff}}}{c}$$

and the total one-way delay over a trace of length $L$ is

$$t_d=\frac{L}{v_p}=L\sqrt{\varepsilon_{r,\mathrm{eff}}}/c$$

Typical numbers: about $6\ \mathrm{ps/mm}$ for an inner-layer FR-4 stripline, and about $7\ \mathrm{ps/mm}$ for a microstrip. A $30\ \mathrm{cm}$ trace therefore delays the signal by roughly $2\ \mathrm{ns}$.

### Practical rule of thumb

Compare $d=v_p t_r$ with $L$. If $d \ll L$ the line is electrically short and lumped analysis is fine; if $d \gtrsim L$ you must match impedances and account for reflections.
`,

  lesson: String.raw`
### Rise time, length, and the 1/6 rule

A wire is *lumped* when the signal's rise time is long compared with the time it takes the wave to traverse the wire. In that case the whole trace charges roughly uniformly and a simple RC / lumped model is adequate. When the rise time is short compared with the traversal time, the trace behaves as a *distributed* transmission line: the wavefront propagates, and reflections at the ends matter.

The traversal time is $t_d = L/v_p$. The criterion is usually written as

$$L_c = \frac{v_p\, t_r}{6}$$

where $v_p$ is the propagation velocity (often $v_p = c/\sqrt{\varepsilon_r}$, i.e. a velocity factor between about 0.4 and 0.9). If $L < L_c$ the circuit is treated as lumped; if $L > L_c$ it must be treated as distributed.

### Where does the 1/6 come from?

Consider a step of rise time $t_r$ launched into a line of length $L$ terminated in a mismatched load. The reflection coefficient is $\Gamma$. The reflected wave arrives back at the source after $2t_d$. If $2t_d$ is small compared with $t_r$, the reflection is absorbed into the rising edge and the source sees only a small perturbation. A common engineering criterion is that the reflection-induced error be below roughly 10 percent of the step amplitude. For a first-order edge, the fraction of the edge that has already been "used up" by the round trip is about $2t_d/t_r$; requiring this to be small gives $2t_d \lesssim t_r/3$, i.e. $t_d \lesssim t_r/6$, hence $L_c = v_p t_r/6$.

The looser $t_r/2$ criterion corresponds to allowing a larger reflection error (roughly a factor of three more), and is used when a cruder approximation is acceptable.

### Practical reading

- $L/L_c \ll 1$: lumped, reflections negligible, use ordinary circuit theory.
- $L/L_c \approx 1$: borderline; both models give comparable answers.
- $L/L_c \gg 1$: distributed; use transmission-line theory, match terminations, and watch for ringing.

The chart shows $L_c$ versus $t_r$ for both criteria. The blue curve is the conservative $t_r/6$ rule; the orange curve is the looser $t_r/2$ rule. The dashed yellow line is your current trace length $L$; the operating point is where your $t_r$ meets the selected criterion curve.
`,

  lesson: String.raw`
### Transmission Line Theory

A transmission line is described by the **telegrapher's equations**:

$$ \frac{\partial V}{\partial z} = -L^\prime \frac{\partial I}{\partial t}, \qquad
   \frac{\partial I}{\partial z} = -C^\prime \frac{\partial V}{\partial t} $$

For a lossless line the characteristic impedance and propagation constant are

$$ Z_0 = \sqrt{\frac{L^\prime}{C^\prime}}, \qquad \beta = \omega\sqrt{L^\prime C^\prime} = \frac{2\pi}{\lambda} $$

The **reflection coefficient** at the load is

$$ \Gamma = \frac{Z_L - Z_0}{Z_L + Z_0} $$

Three important cases:

- **Matched load** ($Z_L = Z_0$): $\Gamma = 0$, no reflection, VSWR $= 1$, return loss $= \infty$.
- **Open circuit** ($Z_L \to \infty$): $\Gamma = +1$, full reflection, VSWR $\to \infty$.
- **Short circuit** ($Z_L = 0$): $\Gamma = -1$, full reflection with a phase inversion.

The **voltage standing-wave ratio** is

$$ \mathrm{VSWR} = \frac{1 + |\Gamma|}{1 - |\Gamma|} $$

and the **return loss** in dB is

$$ \mathrm{RL} = -20\log_{10}|\Gamma| $$

Along the line the incident and reflected waves superpose, producing a standing-wave envelope with maxima $1+|\Gamma|$ and minima $1-|\Gamma|$ spaced by $\lambda/2$. The input impedance seen at distance $d$ from the load is

$$ Z_{\mathrm{in}}(d) = Z_0 \frac{Z_L + Z_0 \tan(\beta d)}{Z_0 + Z_L \tan(\beta d)} $$

which repeats every half wavelength.
`,

  lesson: String.raw`
When a step edge reaches a capacitor at the end of a transmission line, the capacitor initially looks like a short circuit. The instantaneous reflection coefficient is therefore $\rho = -1$, so the reflected wave has the opposite sign of the incident wave.

The capacitor then charges through the line impedance $Z_0$. The load voltage obeys
$$V_L(t) = V_0\left(1 - e^{-t/\tau}\right), \qquad \tau = Z_0 C.$$
The reflected wave amplitude decays as $V_{\text{ref}}(t) = -V_0 e^{-t/\tau}$.

- A capacitive discontinuity acts as a low-pass filter on the edge: the load voltage rises slowly with time constant $\tau = Z_0 C$.
- The reflected wave is negative at the leading edge and decays as the capacitor charges.
- If the line is long compared with $\tau$, the reflection returns to the source and can cause ringing or overshoot in systems with multiple discontinuities.
- Settling to within a few percent takes roughly $5\tau$.

  lesson: String.raw`
Terminations are the deliberate placement of resistors at the ends of a transmission line so that the line is "matched" and reflections are suppressed.

The reflection coefficient at any interface is
$$\Gamma=\frac{Z_L-Z_0}{Z_L+Z_0}$$
where $Z_0$ is the line's characteristic impedance and $Z_L$ is the impedance seen at the termination. Perfect matching requires $Z_L=Z_0$, giving $\Gamma=0$.

Three common schemes:

1. Parallel termination: a resistor $R$ is placed across the line at the load. The line sees $Z_L\approx R$, so $\Gamma=(R-Z_0)/(R+Z_0)$. Matching needs $R=Z_0$. This draws DC current from the source, so it costs power.

2. Series termination: a resistor $R$ is placed in series at the source (driver) end. The driver's output impedance plus $R$ should equal $Z_0$; the load is left high-impedance. The wave launched into the line is attenuated, and the reflection at the load is absorbed by the series resistor on the return trip. Matching needs $R\approx Z_0-Z_{out}$.

3. Thevenin termination: the matching resistance is split between the two ends, typically $R/2$ at the source and $R/2$ at the load. The effective termination seen by the line is $R$, so $\Gamma=(R-Z_0)/(R+Z_0)$ again. This halves the DC current compared with a single parallel resistor and biases the line at mid-supply.

In all three cases the reflection coefficient has the same functional form; what differs is where the resistor sits, how much DC power it burns, and whether the line is biased. The chart plots $|\Gamma|$ versus $R$ for each scheme: the curve passes through zero exactly at $R=Z_0$, and rises toward 1 as $R\to 0$ or $R\to\infty$.
`,

    },
    {
      q: 'Which termination scheme places the matching resistor in series at the source end?',
      options: ['Parallel termination', 'Series termination', 'Thevenin termination', 'None of these'],
      answer: 1
    }
  ]
});

      head.position.copy(a.origin).addScaledVector(a.dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), a.dir.clone().normalize());
      this.arrowGroup.add(head);
    }

    // ---- 2D chart: Z0 vs w/h for several er ----
    const ctx = this.chartCtx;
    const cw = chartEl.width, ch = chartEl.height;
    ctx.clearRect(0, 0, cw, ch);

    // background
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(0, 0, cw, ch);

    const padL = 55, padR = 20, padT = 30, padB = 45;
    const plotW = cw - padL - padR;
    const plotH = ch - padT - padB;

    // axes
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(padL, padT);
    ctx.lineTo(padL, padT + plotH);
    ctx.lineTo(padL + plotW, padT + plotH);
    ctx.stroke();

    // grid
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const y = padT + plotH * (i / 5);
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(padL + plotW, y);
      ctx.stroke();
    }

    // labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('w / h', padL + plotW / 2, ch - 12);
    ctx.save();
    ctx.translate(14, padT + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('Z0 (ohm)', 0, 0);
    ctx.restore();

    // curves for er = 1, 2, 4, 6
    const ers = [1, 2, 4, 6];
    const colors = ['#7fd1ff', '#a78bfa', '#f472b6', '#fbbf24'];
    const uMin = 0.1, uMax = 20;
    const zMin = 0, zMax = 400;

    for (let k = 0; k < ers.length; k++) {
      const e = ers[k];
      ctx.strokeStyle = colors[k];
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i <= 200; i++) {
        const uu = uMin + (uMax - uMin) * (i / 200);
        const ee = (e + 1) / 2 + (e - 1) / 2 * (1 / Math.sqrt(1 + 12 / uu));
        const Cc = ee * eps0 * uu;
        const Ll = mu0 / uu;
        const z = Math.sqrt(Ll / Cc);
        const px = padL + plotW * (uu - uMin) / (uMax - uMin);
        const py = padT + plotH * (1 - Math.min(z, zMax) / zMax);
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      }
      ctx.stroke();
    }

    // legend
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'left';
    for (let k = 0; k < ers.length; k++) {
      ctx.fillStyle = colors[k];
      ctx.fillRect(padL + plotW - 90, padT + 8 + k * 16, 10, 10);
      ctx.fillStyle = '#cbd5e1';
      ctx.fillText('er = ' + ers[k], padL + plotW - 76, padT + 17 + k * 16);
    }

    // current operating point marker
    const uNow = w / h;
    const eeNow = (er + 1) / 2 + (er - 1) / 2 * (1 / Math.sqrt(1 + 12 / uNow));
    const Cnow = eeNow * eps0 * uNow;
    const Lnow = mu0 / uNow;
    const zNow = Math.sqrt(Lnow / Cnow);
    const mx = padL + plotW * (Math.min(uNow, uMax) - uMin) / (uMax - uMin);
    const my = padT + plotH * (1 - Math.min(zNow, zMax) / zMax);
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(mx, my, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // ---- HUD ----
    setHud(
      'Trace L\' and C\'',
      String.raw`$Z_0=\sqrt{L^{\prime}/C^{\prime}}\quad,\quad t_d=\sqrt{L^{\prime}C^{\prime}}$`,
      [
        { k: 'L\' (nH/mm)', v: (L * 1e9 / 1000).toFixed(3) },
        { k: 'C\' (pF/mm)', v: (C * 1e12 / 1000).toFixed(3) },
        { k: 'Z0 (ohm)', v: Z0.toFixed(1) },
        { k: 'delay (ps/mm)', v: (delay * 1e12 / 1000).toFixed(2) }
      ]
    );
  },

  tick(dt) {
    // gentle rotation of the cross-section for depth perception
    if (this.group) this.group.rotation.y += dt * 0.15;
  },

  lesson: String.raw`
Microstrip transmission line: a metal trace of width $w$ separated from a ground plane by a dielectric of height $h$ and relative permittivity $\varepsilon_r$.

Per-unit-length quantities:
$$L^{\prime}\approx \mu_0\frac{h}{w},\qquad C^{\prime}\approx \varepsilon_{\mathrm{eff}}\,\varepsilon_0\frac{w}{h}$$
where the effective permittivity is
$$\varepsilon_{\mathrm{eff}}=\frac{\varepsilon_r+1}{2}+\frac{\varepsilon_r-1}{2}\frac{1}{\sqrt{1+12h/w}}.$$

Then
$$Z_0=\sqrt{\frac{L^{\prime}}{C^{\prime}}},\qquad t_d=\sqrt{L^{\prime}C^{\prime}}.$$

Why narrow traces have higher $Z_0$: reducing $w$ raises $L^{\prime}$ (less area for flux linkage per unit length) and lowers $C^{\prime}$ (less plate area). Since $Z_0=\sqrt{L^{\prime}/C^{\prime}}$, both effects push $Z_0$ up. Widening the trace lowers $Z_0$; increasing $h$ raises $Z_0$; increasing $\varepsilon_r$ raises $C^{\prime}$ and therefore lowers $Z_0$ and slows the delay.
`,

  quiz: [
    {
      q: 'If the trace width w is halved while h and er stay fixed, what happens to Z0?',
      options: ['It roughly doubles', 'It roughly increases by sqrt(2)', 'It stays the same', 'It decreases'],
      answer: 1
    },
    {
      q: 'Increasing the dielectric constant er mainly affects the line by:',
      options: ['Raising Z0 and speeding the signal', 'Lowering Z0 and slowing the signal', 'Leaving Z0 unchanged', 'Only changing L\''],
      answer: 1
    }
  ]
});
/* === UI CONTROLLER === */

const moduleList = document.getElementById('moduleList');
const controlsEl = document.getElementById('controls');
const lessonEl   = document.getElementById('lesson');
const quizEl     = document.getElementById('quiz');

let activeModule = null;

function buildControls(mod) {
  controlsEl.innerHTML = '';
  (mod.controls || []).forEach(c => {
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    const label = document.createElement('label');
    label.textContent = c.label;
    wrap.appendChild(label);

    let input;
    if (c.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step ?? 0.01;
      input.value = c.value;
      input.addEventListener('input', () => {
        mod.state[c.id] = parseFloat(input.value);
        mod.update();
      });
    } else if (c.type === 'select') {
      input = document.createElement('select');
      (c.options || []).forEach(o => {
        const opt = document.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        input.appendChild(opt);
      });
      input.value = c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.value;
        mod.update();
      });
    } else if (c.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  });
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  (mod.quiz || []).forEach(item => {
    const q = document.createElement('div');
    q.className = 'q';
    const p = document.createElement('p');
    p.textContent = item.q;
    q.appendChild(p);
    item.options.forEach((optText, i) => {
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.textContent = optText;
      opt.addEventListener('click', () => {
        if (i === item.answer) opt.classList.add('right');
        else opt.classList.add('wrong');
      });
      q.appendChild(opt);
    });
    quizEl.appendChild(q);
  });
}

function disposeNode(node) {
  node.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material];
      mats.forEach(m => {
        for (const k in m) {
          if (m[k] && m[k].isTexture) m[k].dispose();
        }
        m.dispose();
      });
    }
  });
}

function loadModule(mod) {
  activeModule = mod;
  disposeNode(content);
  content.clear();
  renderer.renderLists.dispose();
  mod.state = mod.state || {};
  mod.build();
  lessonEl.innerHTML = mod.lesson || '';
  if (window.renderMathInElement) {
    renderMathInElement(lessonEl, { delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}, {left: '\\(', right: '\\)', display: false}, {left: '\\[', right: '\\]', display: true}], throwOnError: false, strict: false });
  }
  buildControls(mod);
  buildQuiz(mod);
  mod.update();
  document.querySelectorAll('#moduleList li').forEach(li => {
    li.classList.toggle('active', li.dataset.id === mod.id);
  });
}

modules.forEach(mod => {
  const li = document.createElement('li');
  li.textContent = mod.title;
  li.dataset.id = mod.id;
  li.addEventListener('click', () => loadModule(mod));
  moduleList.appendChild(li);
});

if (modules.length) loadModule(modules[0]);

/* ---------- render loop ---------- */
let last = performance.now();
function animate(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (activeModule && typeof activeModule.tick === 'function') activeModule.tick(dt);
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  const w = viewport.clientWidth, h = viewport.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
});
</script>
</body>
