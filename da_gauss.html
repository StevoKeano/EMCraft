<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 80;
controls.enableZoom = false;

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = Math.sign(e.deltaY);
  if (!dir) return;
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * (dir > 0 ? 1.12 : 0.89)));
  offset.setLength(dist);
  camera.position.copy(controls.target).add(offset);
}, { passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 6);
scene.add(key);

const content = new THREE.Group();
scene.add(content);

const chartEl = document.getElementById('chart');
const chartCtx = chartEl.getContext('2d');

function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const nextVecs = [];
  function rebuild(vecs) {
    while (group.children.length) {
      const c = group.children.pop();
      c.geometry?.dispose?.();
      group.remove(c);
    }
    for (const v of vecs) {
      const len = v.len ?? v.dir.length();
      const dir = v.dir.clone().normalize();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
      head.position.copy(v.origin).addScaledVector(dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, head);
    }
  }
  rebuild(vectors);
  group.setVectors = (vecs) => { nextVecs.length = 0; nextVecs.push(...vecs); rebuild(vecs); };
  return group;
}

function renderTex(el, opts) {
  if (window.renderMathInElement) window.renderMathInElement(el, opts);
}
const KATEX_OPTS = {
  delimiters: [
    { left: '$$', right: '$$', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true }
  ],
  throwOnError: false,
  strict: false
};

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr;
  const eq = document.getElementById('hudEq');
  const trimmedEq = (latexEqStr || '').trim();
  eq.innerHTML = (trimmedEq && !trimmedEq.startsWith('$') && !trimmedEq.startsWith('\\(') && !trimmedEq.startsWith('\\['))
    ? `$${trimmedEq}$`
    : trimmedEq;
  renderTex(eq, KATEX_OPTS);
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  for (const r of rows) {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.textContent = r.v;
    rowsEl.appendChild(k); rowsEl.appendChild(v);
  }
}

function gcd(a, b) { a = Math.abs(Math.trunc(a)); b = Math.abs(Math.trunc(b)); while (b) { const t = b; b = a % b; a = t; } return a; }
const modules = [];

modules.push({
  id: 'sec1_congruences',
  title: '1. Section I: Congruent Numbers in General (Arts. 1-12)',
  controls: [
    { type: 'range', id: 'm', label: 'modulus m', min: 3, max: 24, step: 1, value: 12 },
    { type: 'range', id: 'a', label: 'integer a', min: -30, max: 30, step: 1, value: 17 },
    { type: 'range', id: 'b', label: 'integer b', min: -30, max: 30, step: 1, value: 5 },
    { type: 'select', id: 'conv', label: 'residue convention', options: ['least positive', 'absolutely least'], value: 'least positive' }
  ],
  build() {
    Object.assign(this.state, { m: 12, a: 17, b: 5, conv: 'least positive' });
    this.group = new THREE.Group();
    content.add(this.group);

    // ring
    const ringGeo = new THREE.TorusGeometry(3, 0.06, 8, 96);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x2a4a6a, metalness: 0.4, roughness: 0.5 }));
    ring.rotation.x = Math.PI / 2;
    this.group.add(ring);

    // tick marks
    this.ticks = new THREE.Group();
    this.group.add(this.ticks);

    // pointers
    const pMatA = new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x1a4a6a });
    const pMatB = new THREE.MeshStandardMaterial({ color: 0xffb86b, emissive: 0x6a3a1a });
    this.pointerA = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.1, 12), pMatA);
    this.pointerB = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.1, 12), pMatB);
    this.group.add(this.pointerA, this.pointerB);

    // wrap arc
    this.arc = new THREE.Mesh(
      new THREE.TorusGeometry(2.55, 0.035, 6, 48, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0x5a1a1a })
    );
    this.arc.rotation.x = Math.PI / 2;
    this.group.add(this.arc);

    // center hub
    const hub = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0x9fb8d0 }));
    this.group.add(hub);

    // lights
    const l1 = new THREE.DirectionalLight(0xffffff, 1.2); l1.position.set(5, 8, 5); content.add(l1);
    const l2 = new THREE.PointLight(0x7fd1ff, 0.8, 20); l2.position.set(-4, 3, -4); content.add(l2);

    this.rebuildTicks();
  },
  rebuildTicks() {
    const st = this.state;
    while (this.ticks.children.length) {
      const c = this.ticks.children.pop();
      c.geometry?.dispose?.();
      if (c.material?.map) c.material.map.dispose();
      c.material?.dispose?.();
    }
    const m = st.m;
    const conv = st.conv;
    for (let i = 0; i < m; i++) {
      const ang = (i / m) * Math.PI * 2;
      const isZero = i === 0;

      // Full radial pie spoke from hub (r=0.22) to outer ring (r=3.05)
      const spokeLen = 2.83;
      const spokeMid = 0.22 + spokeLen / 2;
      const spoke = new THREE.Mesh(
        new THREE.BoxGeometry(spokeLen, isZero ? 0.045 : 0.025, isZero ? 0.055 : 0.03),
        new THREE.MeshStandardMaterial({
          color: isZero ? 0xffe08a : 0x3b6288,
          emissive: isZero ? 0x4a3800 : 0x0d1b2a
        })
      );
      spoke.position.set(Math.cos(ang) * spokeMid, 0, Math.sin(ang) * spokeMid);
      spoke.rotation.y = -ang;
      this.ticks.add(spoke);

      // Outer rim notch
      const tick = new THREE.Mesh(
        new THREE.BoxGeometry(0.28, 0.07, 0.06),
        new THREE.MeshStandardMaterial({ color: isZero ? 0xffe08a : 0x8fb8d8 })
      );
      tick.position.set(Math.cos(ang) * 3.0, 0, Math.sin(ang) * 3.0);
      tick.rotation.y = -ang;
      this.ticks.add(tick);

      // Residue number sprite around the outside of each division
      const labelVal = (conv === 'absolutely least' && i > m / 2) ? (i - m) : i;
      const cv = document.createElement('canvas');
      cv.width = 64; cv.height = 64;
      const c2 = cv.getContext('2d');
      c2.fillStyle = isZero ? '#ffe08a' : '#a8c7e6';
      c2.font = 'bold 28px monospace';
      c2.textAlign = 'center';
      c2.textBaseline = 'middle';
      c2.fillText(String(labelVal), 32, 32);
      const sp = new THREE.Sprite(
        new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), transparent: true })
      );
      sp.position.set(Math.cos(ang) * 3.45, 0.12, Math.sin(ang) * 3.45);
      sp.scale.set(0.45, 0.45, 1);
      this.ticks.add(sp);
    }
  },
  residue(x, m, conv) {
    let r = ((x % m) + m) % m;
    if (conv === 'absolutely least' && r > m / 2) r -= m;
    return r;
  },
  update() {
    const st = this.state;
    const m = st.m;
    this.rebuildTicks();

    const ra = this.residue(st.a, m, st.conv);
    const rb = this.residue(st.b, m, st.conv);
    const congruent = ((st.a - st.b) % m + m) % m === 0;

    const angA = (ra / m) * Math.PI * 2;
    const angB = (rb / m) * Math.PI * 2;

    this.pointerA.position.set(Math.cos(angA) * 2.2, 0.55, Math.sin(angA) * 2.2);
    this.pointerA.rotation.set(Math.PI / 2, 0, -angA + Math.PI / 2);
    this.pointerB.position.set(Math.cos(angB) * 2.2, 0.55, Math.sin(angB) * 2.2);
    this.pointerB.rotation.set(Math.PI / 2, 0, -angB + Math.PI / 2);

    // wrap arc between residues along true shortest modular path in XZ plane
    const diff = (((rb - ra) % m) + m) % m;
    const shortSteps = diff <= m / 2 ? diff : m - diff;
    const startAng = diff <= m / 2 ? angA : angB;
    this.arc.geometry.dispose();
    this.arc.geometry = new THREE.TorusGeometry(2.55, 0.04, 6, 48, Math.max(0.05, (shortSteps / m) * Math.PI * 2));
    this.arc.rotation.order = 'YXZ';
    this.arc.rotation.set(Math.PI / 2, -startAng, 0);
    this.arc.visible = shortSteps > 0;

    setHud('Congruence', 'a \\equiv b \\pmod{m} \\iff m \\mid (a-b)', [
      { k: 'm', v: String(m) },
      { k: 'a mod m', v: String(ra) },
      { k: 'b mod m', v: String(rb) },
      { k: 'congruent', v: congruent ? 'yes' : 'no' }
    ]);

    this.drawChart(ra, rb, congruent);
  },
  drawChart(ra, rb, congruent) {
    const st = this.state;
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);

    const m = st.m;
    const pad = 40;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const N = 12;
    const vals = [];
    for (let k = 0; k <= N; k++) vals.push(st.a + k * m);
    const minV = Math.min(...vals), maxV = Math.max(...vals);
    const sx = (k) => x0 + (k / N) * (x1 - x0);
    const sy = (v) => y0 - ((v - minV) / (maxV - minV || 1)) * (y0 - y1);

    // axes
    ctx.strokeStyle = '#2a4a6a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();

    // staircase
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k <= N; k++) {
      const x = sx(k), y = sy(vals[k]);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // points
    for (let k = 0; k <= N; k++) {
      const x = sx(k), y = sy(vals[k]);
      const isWrap = k > 0 && vals[k] % m === vals[0] % m;
      ctx.fillStyle = isWrap ? '#ff6b6b' : '#ffb86b';
      ctx.beginPath(); ctx.arc(x, y, isWrap ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
    }

    // labels
    ctx.fillStyle = '#9fb8d0'; ctx.font = '12px monospace';
    ctx.fillText('a + k m, k = 0..12', x0 + 6, y1 + 14);
    ctx.fillStyle = congruent ? '#7fffa0' : '#ff8a8a';
    ctx.fillText(congruent ? 'congruent: wrap hits a' : 'not congruent', x1 - 150, y1 + 14);
  },
  tick(dt) {
    this.group.rotation.y += dt * 0.15;
  },
  lesson: String.raw`<b>Congruence.</b> For integers $a,b$ and modulus $m>0$, we say $a \equiv b \pmod{m}$ iff $m \mid (a-b)$. Equivalently, $a$ and $b$ leave the same remainder upon division by $m$.

<b>Residue classes.</b> Every integer has a unique least positive residue $r$ with $0 \le r < m$, and a unique absolutely least residue in $(-m/2, m/2]$. The set of all integers congruent to $r$ is the residue class $r + m\mathbb{Z}$.

<b>Arithmetic compatibility.</b> If $a \equiv b \pmod{m}$ and $c \equiv d \pmod{m}$, then
$a+c \equiv b+d$, $a-c \equiv b-d$, and $ac \equiv bd \pmod{m}$.
Thus congruences may be added, subtracted, and multiplied just like equations.

<b>Clock picture.</b> The modular clock has $m$ tick marks. A pointer at residue $a$ and another at residue $b$ coincide exactly when $a \equiv b \pmod{m}$. The staircase $a + km$ wraps around the clock at each multiple of $m$.`,
  quiz: [
    { q: 'Which condition is equivalent to $a \\equiv b \\pmod{m}$?', options: ['$m \\mid (a-b)$', '$a+b$ is divisible by $m$', '$a$ and $b$ are both prime', '$m \\mid ab$'], answer: 0 },
    { q: 'If $a \\equiv b \\pmod{m}$ and $c \\equiv d \\pmod{m}$, which is always true?', options: ['$ac \\equiv bd \\pmod{m}$', '$a/c \\equiv b/d \\pmod{m}$', '$a^b \\equiv c^d \\pmod{m}$', '$a-b = m$'], answer: 0 }
  ]
});
modules.push({
  id: 'sec2_linear_crt',
  title: '2. Section II: Linear Congruences & CRT (Arts. 13-44)',
  controls: [
    { id: 'a', type: 'range', label: 'a', min: 1, max: 20, step: 1, value: 6 },
    { id: 'b', type: 'range', label: 'b', min: 0, max: 20, step: 1, value: 8 },
    { id: 'm', type: 'range', label: 'm', min: 2, max: 24, step: 1, value: 10 },
    { id: 'm1', type: 'range', label: 'm1', min: 2, max: 12, step: 1, value: 5 },
    { id: 'm2', type: 'range', label: 'm2', min: 2, max: 12, step: 1, value: 7 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { a: 6, b: 8, m: 10, m1: 5, m2: 7 });
    this.group = new THREE.Group();
    content.add(this.group);

    // Ring 1: residues mod m1 in the XZ plane
    this.ring1 = new THREE.Group();
    this.ring1.position.set(0, 0, 0);
    this.group.add(this.ring1);
    this.ring1Dots = [];
    for (let i = 0; i < 12; i++) {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x7fd1ff })
      );
      this.ring1.add(dot);
      this.ring1Dots.push(dot);
    }
    const torus1 = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.035, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0x3a6f9a })
    );
    torus1.rotation.x = Math.PI / 2;
    this.ring1.add(torus1);

    // Ring 2: residues mod m2 in the XY plane (orthogonal)
    this.ring2 = new THREE.Group();
    this.group.add(this.ring2);
    this.ring2Dots = [];
    for (let i = 0; i < 12; i++) {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffb86b })
      );
      this.ring2.add(dot);
      this.ring2Dots.push(dot);
    }

$$\Phi_n(x)=\prod_{\gcd(k,n)=1}(x-\zeta^{k})$$

function buildControls(mod) {
  controlsEl.innerHTML = '';
  for (const c of mod.controls) {
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    const label = document.createElement('label');
    label.textContent = c.label;
    wrap.appendChild(label);
    let input;
    if (c.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step; input.value = c.value;
      input.addEventListener('input', () => {
        mod.state[c.id] = parseFloat(input.value);
        mod.update();
      });
    } else if (c.type === 'select') {
      input = document.createElement('select');
      for (const o of c.options) {
        const opt = document.createElement('option');
        opt.value = (typeof o === 'object' && o !== null) ? o.value : o;
        opt.textContent = (typeof o === 'object' && o !== null) ? (o.label ?? o.value) : o;
        input.appendChild(opt);
      }
      input.value = c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.value;
        mod.update();
      });
    } else if (c.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  for (const item of mod.quiz) {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = item.q;
    const opts = document.createElement('div');
    opts.className = 'opts';
    item.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', () => {
        if (i === item.answer) b.classList.add('correct');
        else b.classList.add('wrong');
      });
      opts.appendChild(b);
    });
    q.appendChild(opts);
    quizEl.appendChild(q);
  }
  renderTex(quizEl, KATEX_OPTS);
}

    qa: "<b>Wait—why do negative numbers turn positive?</b> When 'least positive' is selected, -1 on a 12-hour clock wraps backward 1 step from 12 to land on 11. Switch to 'absolutely least' to let numbers sit on the negative half (-5 to +6) instead."
  },
  sec2_linear_crt: {
    title: "2. Cracking Secret Lockers (Chinese Remainder Theorem)",
    idea: "This screen actually solves TWO puzzles at once using the same sliders:<br>• <b>Top puzzle (Linear Congruence):</b> Solve a·x ≡ b (mod m), where <b>a multiplies x</b>.<br>• <b>Bottom puzzle (CRT):</b> Reconstruct a mystery number x from two remainders, where <b>a and b act as the target remainders</b>: x ≡ a (mod m1) and x ≡ b (mod m2).",
    view3d: "Two interlocking rings—horizontal clock m1 and vertical clock m2. Red dots mark the target remainders (a mod m1 and b mod m2), and the floating red beacon shows where both clues lock together in 3D.",
    tryIt: "Set <b>m1 = 5, m2 = 7, a = 1, b = 2</b>. Here a and b mean 'remainder 1 when divided by 5' and 'remainder 2 when divided by 7':<br>• Clue 1 (÷5 leaves 1): 1, 6, 11, <b>16</b>, 21, 26, 31<br>• Clue 2 (÷7 leaves 2): 2, 9, <b>16</b>, 23, 30<br>The ONLY number under 5×7 = 35 on both lists is <b>16</b> (16 = 3×5 + 1 and 16 = 2×7 + 2), so the HUD reports <b>CRT x: 16 (mod 35)</b>!",
    qa: "<b>Why did m1 = 6, m2 = 8 say 'none'?</b> Keep a = 1, b = 2 and set m1 = 6, m2 = 8: Clue 1 demands an odd number (1 mod 6), while Clue 2 demands an even number (2 mod 8). Because 6 and 8 share a factor of 2, those clues clash!"

  sec3_power_residues: {

    idea: "Instead of stepping +1 around a clock, you multiply by g each turn (g¹, g², g³... mod p). A 'primitive root' is a super-generator whose powers hit EVERY single number 1 to p-1 before looping back to 1.",
    view3d: "Numbers 1 to p-1 arranged in a circle. The orange laser path traces every jump as you keep multiplying by g.",
    tryIt: "Keep p = 11 and test <b>g = 2</b> (the orange web visits all 10 spots—primitive!) vs. <b>g = 10</b> (it just bounces back and forth between 1 and 10 forever).",
    qa: "<b>Why is 0 missing from the circle?</b> Multiplying by 0 traps you at 0 forever, and for any prime p, multiplying non-zero numbers mod p never hits 0. Also notice '(p-1)! mod p' is always p-1 (which equals -1 mod p)—that's Wilson's Theorem!"

    qa: "<b>How can 4 have TWO square roots (x = 2, 3) mod 5?</b> Because 2² = 4 and 3² = 9 ≡ 4 (mod 5)! Just like +2 and -2 both square to 4 in normal math, 3 is the same as -2 on a 5-hour clock."

  sec5a_binary_forms: {

    view3d: "An ellipse (closed loop) or hyperbola (two open curves) drawn over a 3D grid, with gold dots marking exact whole-number hits where f(x,y) = 1.",
    tryIt: "Drag a, b, and c around and notice how the HUD's 'reduced' triple stays locked on the simplest version, or switch 'form type' to indefinite to snap the loop open into a hyperbola.",

    qa: "<b>Why did D skip -22 or -21 when I dragged the slider?</b> Valid discriminants for ax² + bxy + cy² must leave remainder 0 or 1 when divided by 4 (since b² is always 0 or 1 mod 4), so the lab automatically snaps to the nearest valid D."
  },
  sec6_factoring_sieve: {
    title: "6. Gauss's Factor-Hunting Machine (Sieve Exclusions)",
    idea: "Factoring huge numbers by testing every divisor is super slow. Instead, rewrite N = x² - y² and use prime clocks (3, 5, 7, 11, 13, 17) as filters to instantly eliminate ~50% of bad x guesses per prime—like a mechanical coin sorter!",
    view3d: "A 10×10 board of the first 100 candidate numbers x ≥ √N. Increasing 'sieve depth' drops eliminated tiles down into the dark while a true factor match shoots up in bright green.",

    view3d: "17 points around a circle connected by glowing colored webs (Gaussian periods) lifted into 3D layers, with diamond markers at each group's center of mass.",
    tryIt: "Keep n = 17 and step the period size down from <b>8 → 4 → 2 → 1</b> to watch Gauss split the 16 points in half over and over until every single corner is unlocked.",
    qa: "<b>Why isn't the top point (1) connected to the colored webs?</b> Point 1 is the trivial root (x = 1). Gauss's symmetry trick groups the remaining n - 1 = 16 roots using powers of a primitive root (g = 3 mod 17)."

let helpMode = null; // null | 'plain' | 'teen'
let helpShowAll = false;
const helpPanelEl = document.getElementById('helpPanel');
const helpToggleBtn = document.getElementById('helpToggleBtn');
const teenToggleBtn = document.getElementById('teenToggleBtn');
const helpAllBtn = document.getElementById('helpAllBtn');

function renderHelp() {
  if (!helpPanelEl) return;
  const isOpen = helpMode !== null;
  helpPanelEl.classList.toggle('open', isOpen);
  helpPanelEl.style.borderColor = helpMode === 'teen' ? '#ffd166' : 'var(--accent)';
  if (helpAllBtn) {
    helpAllBtn.style.display = isOpen ? 'inline-block' : 'none';
    helpAllBtn.textContent = helpShowAll ? 'Current Section Only' : 'Show All 8 Sections';
  }
  if (helpToggleBtn) {
    helpToggleBtn.textContent = helpMode === 'plain' ? '✕ Close Guide' : '? Plain-English Guide';
  }
  if (teenToggleBtn) {
    teenToggleBtn.textContent = helpMode === 'teen' ? '✕ Close Teen Guide' : '🎓 Teen / Student Guide';
  }
  if (!isOpen) return;

  const book = helpMode === 'teen' ? TEEN_GUIDES : PLAIN_GUIDES;
  const titleCol = helpMode === 'teen' ? '#ffd166' : 'var(--accent)';
  const renderOne = (g, isExtra = false) => `
    <div class="${isExtra ? 'all-item' : ''}">
      <h3 style="color:${titleCol};">${g.title}</h3>
      <div class="hsec"><b>The Big Idea:</b> ${g.idea}</div>
      <div class="hsec"><b>What You See in 3D:</b> ${g.view3d}</div>
      <div class="hsec" style="${g.qa ? '' : 'margin-bottom:0;'}"><b>Try This:</b> ${g.tryIt}</div>
      ${g.qa ? `<div class="hsec" style="margin-bottom:0; color:#b9d4f2;">${g.qa}</div>` : ''}
    </div>`;

  if (helpShowAll) {
    helpPanelEl.innerHTML = Object.values(book).map((g, i) => renderOne(g, i > 0)).join('');
  } else {
    const g = (active && book[active.id]) || Object.values(book)[0];
    helpPanelEl.innerHTML = renderOne(g, false);
  }
}

if (helpToggleBtn) {
  helpToggleBtn.addEventListener('click', () => {
    helpMode = (helpMode === 'plain') ? null : 'plain';
    if (!helpMode) helpShowAll = false;
    renderHelp();
  });
}
if (teenToggleBtn) {
  teenToggleBtn.addEventListener('click', () => {
    helpMode = (helpMode === 'teen') ? null : 'teen';
    if (!helpMode) helpShowAll = false;
    renderHelp();
  });
}
if (helpAllBtn) {
  helpAllBtn.addEventListener('click', () => {
    helpShowAll = !helpShowAll;
    renderHelp();
  });
}

function loadModule(mod) {
  active = mod;
  renderHelp();
  controls.target.set(0, 0, 0);
  if (Number.isNaN(camera.position.x)) camera.position.set(6, 5, 8);
  content.clear();
  mod.state = mod.state || {};
  for (const c of mod.controls) {
    if (!(c.id in mod.state)) {
      mod.state[c.id] = c.type === 'range' ? parseFloat(c.value) : (c.type === 'check' ? !!c.value : c.value);
    }
  }
  mod.build();
  mod.update();
  lessonEl.innerHTML = mod.lesson;
  renderTex(lessonEl, KATEX_OPTS);
  buildControls(mod);
  buildQuiz(mod);
  if (selectEl) selectEl.value = mod.id;
}

for (const mod of modules) {
  const opt = document.createElement('option');
  opt.value = mod.id;
  opt.textContent = mod.title;
  selectEl.appendChild(opt);
}
selectEl.addEventListener('change', () => {
  const mod = modules.find(m => m.id === selectEl.value);
  if (mod) loadModule(mod);
});
if (modules.length) loadModule(modules[0]);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  if (chartEl) {
    const cw = Math.round((chartEl.clientWidth || 320) * Math.min(window.devicePixelRatio || 1, 2));
    const ch = Math.round((chartEl.clientHeight || 200) * Math.min(window.devicePixelRatio || 1, 2));
    if (cw > 0 && ch > 0 && (chartEl.width !== cw || chartEl.height !== ch)) {
      chartEl.width = cw;
      chartEl.height = ch;
    }
  }
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
const sliderTip = document.getElementById('sliderTip');
const controlsContainer = document.getElementById('controls');
function showSliderTip(inp, clientX) {
  if (!sliderTip || !inp || inp.type !== 'range') return;
  const r = inp.getBoundingClientRect();
  const min = parseFloat(inp.min || '0');
  const max = parseFloat(inp.max || '100');
  const val = parseFloat(inp.value);
  const ratio = max > min ? (val - min) / (max - min) : 0;
  const thumbX = r.left + 8 + ratio * Math.max(0, r.width - 16);
  const x = Number.isFinite(clientX) ? Math.max(r.left, Math.min(r.right, clientX)) : thumbX;
  sliderTip.textContent = inp.value;
  sliderTip.style.left = `${x}px`;
  sliderTip.style.top = `${r.top}px`;
  sliderTip.style.display = 'block';
}
if (controlsContainer) {
  controlsContainer.addEventListener('pointermove', (e) => {
    const inp = e.target.closest('input[type=range]');
    if (inp) showSliderTip(inp, e.clientX);
  });
  controlsContainer.addEventListener('input', (e) => {
    const inp = e.target.closest('input[type=range]');
    if (inp) showSliderTip(inp);
  });
  controlsContainer.addEventListener('pointerout', (e) => {
    const inp = e.target.closest('input[type=range]');
    if (inp && sliderTip) sliderTip.style.display = 'none';
  });
}

window.addEventListener('resize', resize);
const hudEl = document.getElementById('hud');
const hideBtn = document.getElementById('hideBtn');
const unhideBtn = document.getElementById('unhideBtn');
if (hideBtn && unhideBtn && hudEl) {
  hideBtn.addEventListener('click', () => {
    hudEl.classList.add('hud-hidden');
    unhideBtn.classList.add('visible');
  });
  unhideBtn.addEventListener('click', () => {
    hudEl.classList.remove('hud-hidden');
    unhideBtn.classList.remove('visible');
  });
    renderTex(lessonEl, KATEX_OPTS);
    renderTex(quizEl, KATEX_OPTS);
  }
});
requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (active && typeof active.tick === 'function') {
    try { active.tick(dt); } catch (e) { console.error('tick error:', e); active.tick = null; }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
<div id="sliderTip"></div>
</body>
</html>
