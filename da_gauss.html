<style>

  #hudRows { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-size:12px; }

<div id="app">

    <h1>Disquisitiones Arithmeticae (1801)</h1>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 80;
controls.enableZoom = false;

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = Math.sign(e.deltaY);
  if (!dir) return;
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * (dir > 0 ? 1.12 : 0.89)));
  offset.setLength(dist);
  camera.position.copy(controls.target).add(offset);
}, { passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 6);
scene.add(key);

const content = new THREE.Group();
scene.add(content);

const chartEl = document.getElementById('chart');
const chartCtx = chartEl.getContext('2d');

function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const nextVecs = [];
  function rebuild(vecs) {
    while (group.children.length) {
      const c = group.children.pop();
      c.geometry?.dispose?.();
      group.remove(c);
    }
    for (const v of vecs) {
      const len = v.len ?? v.dir.length();
      const dir = v.dir.clone().normalize();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
      head.position.copy(v.origin).addScaledVector(dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, head);
    }
  }
  rebuild(vectors);
  group.setVectors = (vecs) => { nextVecs.length = 0; nextVecs.push(...vecs); rebuild(vecs); };
  return group;
}

function renderTex(el, opts) {
  if (window.renderMathInElement) window.renderMathInElement(el, opts);
}
const KATEX_OPTS = {
  delimiters: [
    { left: '$$', right: '$$', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true }
  ],
  throwOnError: false,
  strict: false
};

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr;
  const eq = document.getElementById('hudEq');
  const trimmedEq = (latexEqStr || '').trim();
  eq.innerHTML = (trimmedEq && !trimmedEq.startsWith('$') && !trimmedEq.startsWith('\\(') && !trimmedEq.startsWith('\\['))
    ? `$${trimmedEq}$`
    : trimmedEq;
  renderTex(eq, KATEX_OPTS);
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  for (const r of rows) {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.textContent = r.v;
    rowsEl.appendChild(k); rowsEl.appendChild(v);
  }
}

const modules = [];

modules.push({
  id: 'sec1_congruences',
  title: '1. Section I: Congruent Numbers in General (Arts. 1-12)',
  controls: [
    { type: 'range', id: 'm', label: 'modulus m', min: 3, max: 24, step: 1, value: 12 },
    { type: 'range', id: 'a', label: 'integer a', min: -30, max: 30, step: 1, value: 17 },
    { type: 'range', id: 'b', label: 'integer b', min: -30, max: 30, step: 1, value: 5 },
    { type: 'select', id: 'conv', label: 'residue convention', options: ['least positive', 'absolutely least'], value: 'least positive' }
  ],
  build() {
    Object.assign(this.state, { m: 12, a: 17, b: 5, conv: 'least positive' });
    this.group = new THREE.Group();
    content.add(this.group);

    // ring
    const ringGeo = new THREE.TorusGeometry(3, 0.06, 8, 96);
    const ring = new THREE.Mesh(ringGeo, new THREE.MeshStandardMaterial({ color: 0x2a4a6a, metalness: 0.4, roughness: 0.5 }));
    ring.rotation.x = Math.PI / 2;
    this.group.add(ring);

    // tick marks
    this.ticks = new THREE.Group();
    this.group.add(this.ticks);

    // pointers
    const pMatA = new THREE.MeshStandardMaterial({ color: 0x7fd1ff, emissive: 0x1a4a6a });
    const pMatB = new THREE.MeshStandardMaterial({ color: 0xffb86b, emissive: 0x6a3a1a });
    this.pointerA = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.1, 12), pMatA);
    this.pointerB = new THREE.Mesh(new THREE.ConeGeometry(0.18, 1.1, 12), pMatB);
    this.group.add(this.pointerA, this.pointerB);

    // wrap arc
    this.arc = new THREE.Mesh(
      new THREE.TorusGeometry(2.55, 0.035, 6, 48, Math.PI),
      new THREE.MeshStandardMaterial({ color: 0xff6b6b, emissive: 0x5a1a1a })
    );
    this.arc.rotation.x = Math.PI / 2;
    this.group.add(this.arc);

    // center hub
    const hub = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), new THREE.MeshStandardMaterial({ color: 0x9fb8d0 }));
    this.group.add(hub);

    // lights
    const l1 = new THREE.DirectionalLight(0xffffff, 1.2); l1.position.set(5, 8, 5); content.add(l1);
    const l2 = new THREE.PointLight(0x7fd1ff, 0.8, 20); l2.position.set(-4, 3, -4); content.add(l2);

    this.rebuildTicks();
  },
  rebuildTicks() {
    const st = this.state;
    while (this.ticks.children.length) this.ticks.remove(this.ticks.children[0]);
    const m = st.m;
    for (let i = 0; i < m; i++) {
      const ang = (i / m) * Math.PI * 2;
      const r = 3.0;
      const tick = new THREE.Mesh(
        new THREE.BoxGeometry(0.05, 0.05, 0.28),
        new THREE.MeshStandardMaterial({ color: i === 0 ? 0xffe08a : 0x8fb8d8 })
      );
      tick.position.set(Math.cos(ang) * r, 0, Math.sin(ang) * r);
      tick.rotation.y = -ang;
      this.ticks.add(tick);
    }
  },
  residue(x, m, conv) {
    let r = ((x % m) + m) % m;
    if (conv === 'absolutely least' && r > m / 2) r -= m;
    return r;
  },
  update() {
    const st = this.state;
    const m = st.m;
    this.rebuildTicks();

    const ra = this.residue(st.a, m, st.conv);
    const rb = this.residue(st.b, m, st.conv);
    const congruent = ((st.a - st.b) % m + m) % m === 0;

    const angA = (ra / m) * Math.PI * 2;
    const angB = (rb / m) * Math.PI * 2;

    this.pointerA.position.set(Math.cos(angA) * 2.2, 0.55, Math.sin(angA) * 2.2);
    this.pointerA.rotation.set(Math.PI / 2, 0, -angA + Math.PI / 2);
    this.pointerB.position.set(Math.cos(angB) * 2.2, 0.55, Math.sin(angB) * 2.2);
    this.pointerB.rotation.set(Math.PI / 2, 0, -angB + Math.PI / 2);

    // wrap arc between residues (short way)
    let d = Math.abs(ra - rb);
    if (d > m / 2) d = m - d;
    this.arc.geometry.dispose();
    this.arc.geometry = new THREE.TorusGeometry(2.55, 0.035, 6, 48, Math.max(0.05, (d / m) * Math.PI * 2));
    this.arc.rotation.set(Math.PI / 2, 0, Math.min(angA, angB));
    this.arc.visible = d > 0;

    setHud('Congruence', 'a \\equiv b \\pmod{m} \\iff m \\mid (a-b)', [
      { k: 'm', v: String(m) },
      { k: 'a mod m', v: String(ra) },
      { k: 'b mod m', v: String(rb) },
      { k: 'congruent', v: congruent ? 'yes' : 'no' }
    ]);

    this.drawChart(ra, rb, congruent);
  },
  drawChart(ra, rb, congruent) {
    const st = this.state;
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);

    const m = st.m;
    const pad = 40;
    const x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const N = 12;
    const vals = [];
    for (let k = 0; k <= N; k++) vals.push(st.a + k * m);
    const minV = Math.min(...vals), maxV = Math.max(...vals);
    const sx = (k) => x0 + (k / N) * (x1 - x0);
    const sy = (v) => y0 - ((v - minV) / (maxV - minV || 1)) * (y0 - y1);

    // axes
    ctx.strokeStyle = '#2a4a6a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();

    // staircase
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let k = 0; k <= N; k++) {
      const x = sx(k), y = sy(vals[k]);
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();

    // points
    for (let k = 0; k <= N; k++) {
      const x = sx(k), y = sy(vals[k]);
      const isWrap = k > 0 && vals[k] % m === vals[0] % m;
      ctx.fillStyle = isWrap ? '#ff6b6b' : '#ffb86b';
      ctx.beginPath(); ctx.arc(x, y, isWrap ? 5 : 3.5, 0, Math.PI * 2); ctx.fill();
    }

    // labels
    ctx.fillStyle = '#9fb8d0'; ctx.font = '12px monospace';
    ctx.fillText('a + k m, k = 0..12', x0 + 6, y1 + 14);
    ctx.fillStyle = congruent ? '#7fffa0' : '#ff8a8a';
    ctx.fillText(congruent ? 'congruent: wrap hits a' : 'not congruent', x1 - 150, y1 + 14);
  },
  tick(dt) {
    this.group.rotation.y += dt * 0.15;
  },
  lesson: String.raw`<b>Congruence.</b> For integers $a,b$ and modulus $m>0$, we say $a \equiv b \pmod{m}$ iff $m \mid (a-b)$. Equivalently, $a$ and $b$ leave the same remainder upon division by $m$.

<b>Residue classes.</b> Every integer has a unique least positive residue $r$ with $0 \le r < m$, and a unique absolutely least residue in $(-m/2, m/2]$. The set of all integers congruent to $r$ is the residue class $r + m\mathbb{Z}$.

<b>Arithmetic compatibility.</b> If $a \equiv b \pmod{m}$ and $c \equiv d \pmod{m}$, then
$a+c \equiv b+d$, $a-c \equiv b-d$, and $ac \equiv bd \pmod{m}$.
Thus congruences may be added, subtracted, and multiplied just like equations.

<b>Clock picture.</b> The modular clock has $m$ tick marks. A pointer at residue $a$ and another at residue $b$ coincide exactly when $a \equiv b \pmod{m}$. The staircase $a + km$ wraps around the clock at each multiple of $m$.`,
  quiz: [
    { q: 'Which condition is equivalent to $a \\equiv b \\pmod{m}$?', options: ['$m \\mid (a-b)$', '$a+b$ is divisible by $m$', '$a$ and $b$ are both prime', '$m \\mid ab$'], answer: 0 },
    { q: 'If $a \\equiv b \\pmod{m}$ and $c \\equiv d \\pmod{m}$, which is always true?', options: ['$ac \\equiv bd \\pmod{m}$', '$a/c \\equiv b/d \\pmod{m}$', '$a^b \\equiv c^d \\pmod{m}$', '$a-b = m$'], answer: 0 }
  ]
});
modules.push({
  id: 'sec2_linear_crt',
  title: '2. Section II: Linear Congruences & CRT (Arts. 13-44)',
  controls: [
    { id: 'a', type: 'range', label: 'a', min: 1, max: 20, step: 1, value: 6 },
    { id: 'b', type: 'range', label: 'b', min: 0, max: 20, step: 1, value: 8 },
    { id: 'm', type: 'range', label: 'm', min: 2, max: 24, step: 1, value: 10 },
    { id: 'm1', type: 'range', label: 'm1', min: 2, max: 12, step: 1, value: 5 },
    { id: 'm2', type: 'range', label: 'm2', min: 2, max: 12, step: 1, value: 7 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { a: 6, b: 8, m: 10, m1: 5, m2: 7 });
    this.group = new THREE.Group();
    content.add(this.group);

    // Ring 1: residues mod m1 in the XZ plane
    this.ring1 = new THREE.Group();
    this.ring1.position.set(0, 0, 0);
    this.group.add(this.ring1);
    this.ring1Dots = [];
    for (let i = 0; i < 12; i++) {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0x7fd1ff })
      );
      this.ring1.add(dot);
      this.ring1Dots.push(dot);
    }
    const torus1 = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.035, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0x3a6f9a })
    );
    torus1.rotation.x = Math.PI / 2;
    this.ring1.add(torus1);

    // Ring 2: residues mod m2 in the XY plane (orthogonal)
    this.ring2 = new THREE.Group();
    this.group.add(this.ring2);
    this.ring2Dots = [];
    for (let i = 0; i < 12; i++) {
      const dot = new THREE.Mesh(
        new THREE.SphereGeometry(0.09, 12, 12),
        new THREE.MeshBasicMaterial({ color: 0xffb86b })
      );
      this.ring2.add(dot);
      this.ring2Dots.push(dot);
    }
    const torus2 = new THREE.Mesh(
      new THREE.TorusGeometry(2.2, 0.035, 8, 64),
      new THREE.MeshBasicMaterial({ color: 0x9a6a3a })
    );
    this.ring2.add(torus2);

    // CRT solution marker
    this.marker = new THREE.Mesh(
      new THREE.SphereGeometry(0.16, 16, 16),
      new THREE.MeshBasicMaterial({ color: 0xff5d5d })
    );
    this.group.add(this.marker);

    // Lattice grid of CRT solutions mod M
    this.lattice = new THREE.Group();
    this.group.add(this.lattice);
    this.latticeDots = [];
    for (let i = 0; i < 144; i++) {
      const d = new THREE.Mesh(
        new THREE.SphereGeometry(0.045, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0x8fe388 })
      );
      this.lattice.add(d);
      this.latticeDots.push(d);
    }

    // Linear congruence solution markers along a line
    this.solLine = new THREE.Group();
    this.group.add(this.solLine);
    this.solDots = [];
    for (let i = 0; i < 24; i++) {
      const d = new THREE.Mesh(
        new THREE.SphereGeometry(0.07, 10, 10),
        new THREE.MeshBasicMaterial({ color: 0xd8a0ff })
      );
      this.solLine.add(d);
      this.solDots.push(d);
    }
    const lineGeo = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-3.2, -2.6, 0),
      new THREE.Vector3(3.2, -2.6, 0)
    ]);
    this.solLine.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: 0x6a4a8a })));

    camera.position.set(5.5, 4.5, 6.5);
    camera.lookAt(0, 0, 0);
  },
  update() {
    const st = this.state;
    const a = st.a, b = st.b, m = st.m, m1 = st.m1, m2 = st.m2;
    const gcd = (x, y) => { while (y) { const t = x % y; x = y; y = t; } return x; };
    const g = gcd(a, m);
    const solvable = b % g === 0;
    const M = m1 * m2;
    const coprime = gcd(m1, m2) === 1;

    // Euler totient
    let phi = 0;
    for (let k = 1; k <= m; k++) if (gcd(k, m) === 1) phi++;

    // CRT solution: brute force mod M
    let crt = -1;
    if (coprime) {
      for (let x = 0; x < M; x++) {
        if (x % m1 === 1 && x % m2 === 2) { crt = x; break; }
      }
    }

    // Ring 1 dots
    for (let i = 0; i < 12; i++) {
      const d = this.ring1Dots[i];
      if (i < m1) {
        const ang = (i / m1) * Math.PI * 2;
        d.position.set(2.2 * Math.cos(ang), 0, 2.2 * Math.sin(ang));
        d.visible = true;
        d.material.color.setHex(i === 1 % m1 ? 0xff5d5d : 0x7fd1ff);
      } else d.visible = false;
    }
    // Ring 2 dots
    for (let i = 0; i < 12; i++) {
      const d = this.ring2Dots[i];
      if (i < m2) {
        const ang = (i / m2) * Math.PI * 2;
        d.position.set(2.2 * Math.cos(ang), 2.2 * Math.sin(ang), 0);
        d.visible = true;
        d.material.color.setHex(i === 2 % m2 ? 0xff5d5d : 0xffb86b);
      } else d.visible = false;
    }

    // Marker at CRT intersection (projected)
    if (coprime && crt >= 0) {
      const t = crt / M;
      this.marker.position.set(2.2 * Math.cos(t * Math.PI * 2), 2.2 * Math.sin(t * Math.PI * 2), 0);
      this.marker.visible = true;
    } else this.marker.visible = false;

    // Lattice grid: CRT solutions mod M (only one if coprime)
    let li = 0;
    for (let x = 0; x < M && li < 144; x++) {
      if (x % m1 === 1 && x % m2 === 2) {
        const d = this.latticeDots[li++];
        const row = Math.floor(x / 12), col = x % 12;
        d.position.set(-3 + col * 0.5, -3.5 + row * 0.5, -1.5);
        d.visible = true;
      }
    }
    for (let i = li; i < 144; i++) this.latticeDots[i].visible = false;

    // Linear congruence solutions mod m
    let si = 0;
    if (solvable) {
      for (let x = 0; x < m && si < 24; x++) {
        if ((a * x - b) % m === 0) {
          const d = this.solDots[si++];
          d.position.set(-3 + (x / Math.max(m - 1, 1)) * 6, -2.6, 0);
          d.visible = true;
        }
      }
    }

  lesson: String.raw`Fermat's little theorem states that for a prime $p$ and any integer $a$ not divisible by $p$, $a^{p-1} \equiv 1 \pmod{p}$. The nonzero residues modulo $p$ form a multiplicative group of order $p-1$. This group is cyclic: there exists a primitive root $g$ such that every residue is a power $g^k$. The exponent $k$ is the index (discrete logarithm) of the residue, $k = \mathrm{ind}_g(a)$, satisfying $g^k \equiv a \pmod{p}$. The order of $a$ is the smallest positive $k$ with $a^k \equiv 1$. Wilson's theorem gives $(p-1)! \equiv -1 \pmod{p}$, a companion congruence to Fermat's theorem. The 3D ring shows the $p-1$ residues as vertices of a regular polygon; the generator steps around the ring, and the chart displays the index table and the orbit of powers.`,

  update() {

    const N = 240, verts = [];

          C = C - 2 * m * B + m * m * A;
          B = B - m * A;
          const t = A; A = C; C = t; B = -B;
        } else break;
      }
    }
    setHud('Binary quadratic forms',
      'f(x,y)=a x^{2}+2 b x y+c y^{2},\\quad D=b^{2}-a c',
      [{ k: 'a', v: a }, { k: 'b', v: b }, { k: 'c', v: c }, { k: 'D', v: D }]);
    this.drawChart(a, b, c, D, posdef);
  },
  drawChart(a, b, c, D, posdef) {
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1118'; ctx.fillRect(0, 0, W, H);
    // left: level curve
    const cx = W * 0.28, cy = H * 0.5, R = Math.min(W, H) * 0.32;
    ctx.strokeStyle = '#2a3a4a'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();
    ctx.strokeStyle = posdef ? '#7fd1ff' : '#ff9f6b'; ctx.lineWidth = 2;
    ctx.beginPath();
    let first = true;
    for (let i = 0; i <= 360; i++) {
      const t = i * Math.PI / 180;
      const x = Math.cos(t), y = Math.sin(t);
      const q = a * x * x + 2 * b * x * y + c * y * y;
      if (q <= 1e-9) { first = true; continue; }
      const s = 1 / Math.sqrt(q);
      const px = cx + x * s * R * 0.5, py = cy - y * s * R * 0.5;
      if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
    ctx.stroke();
    ctx.fillStyle = '#ffe08a';
    for (let x = -6; x <= 6; x++) for (let y = -6; y <= 6; y++) {
      const f = a * x * x + 2 * b * x * y + c * y * y;
      if (f > 0 && f <= 1.05) {
        ctx.beginPath(); ctx.arc(cx + x * R * 0.5, cy - y * R * 0.5, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.fillStyle = '#9fb3c8'; ctx.font = '12px monospace';
    ctx.fillText('f(x,y)=1', cx - 30, cy - R * 0.55);
    // right: reduced coefficients vs step
    const ox = W * 0.62, oy = H * 0.5, sx = W * 0.32, sy = H * 0.32;
    ctx.strokeStyle = '#2a3a4a'; ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ox + sx, oy); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy - sy); ctx.stroke();
    const cols = ['#7fd1ff', '#ff9f6b', '#a0e08a'];
    const names = ['a', 'b', 'c'];
    const maxv = Math.max(1, ...this.reduced.flat().map(Math.abs));
    for (let j = 0; j < 3; j++) {
      ctx.strokeStyle = cols[j]; ctx.lineWidth = 2; ctx.beginPath();
      this.reduced.forEach((r, i) => {
        const px = ox + (i / Math.max(1, this.reduced.length - 1)) * sx;
        const py = oy - (r[j] / maxv) * sy;
        if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
      });
      ctx.stroke();
      ctx.fillStyle = cols[j]; ctx.fillText(names[j], ox + sx + 6, oy - sy + 14 + j * 16);
    }
    ctx.fillStyle = '#9fb3c8'; ctx.fillText('reduction steps', ox + sx * 0.25, oy + 18);
    ctx.fillStyle = '#9fb3c8'; ctx.fillText('D = ' + D, ox + 8, oy - sy - 8);
  },
  tick(dt) { this.group.rotation.z += dt * 0.05; },
  lesson: String.raw`A binary quadratic form is $f(x,y)=a x^{2}+2 b x y+c y^{2}$ with discriminant $D=b^{2}-a c$. Two forms are equivalent if one is obtained from the other by an $SL_2(\mathbb{Z})$ change of variables, which preserves $D$. For positive definite forms ($a>0$, $D<0$) Gauss reduction requires $|b|\le a\le c$, with $b\ge 0$ when $a=c$; this gives a canonical reduced form. For indefinite forms ($D>0$) reduction is periodic: the reduced forms repeat in a cycle. The level curve $f(x,y)=1$ is an ellipse for definite forms and a hyperbola for indefinite forms.`,
  quiz: [
    { q: 'For f(x,y)=3x^2+2xy+5y^2, the discriminant D=b^2-ac is:', options: ['-14', '1', '-4', '14'], answer: 0 },
    { q: 'Gauss reduction of a positive definite form requires:', options: ['|b| <= a <= c', 'a <= b <= c', 'D > 0', 'b = 0 always'], answer: 0 }
  ]
});
/* === UI CONTROLLER === */

let active = null;
const listEl = document.getElementById('moduleList');
const controlsEl = document.getElementById('controls');
const lessonEl = document.getElementById('lesson');
const quizEl = document.getElementById('quiz');

function buildControls(mod) {
  controlsEl.innerHTML = '';
  for (const c of mod.controls) {
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    const label = document.createElement('label');
    label.textContent = c.label;
    wrap.appendChild(label);
    let input;
    if (c.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step; input.value = c.value;
      input.addEventListener('input', () => {
        mod.state[c.id] = parseFloat(input.value);
        mod.update();
      });
    } else if (c.type === 'select') {
      input = document.createElement('select');
      for (const o of c.options) {
        const opt = document.createElement('option');
        opt.value = (typeof o === 'object' && o !== null) ? o.value : o;
        opt.textContent = (typeof o === 'object' && o !== null) ? (o.label ?? o.value) : o;
        input.appendChild(opt);
      }
      input.value = c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.value;
        mod.update();
      });
    } else if (c.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  for (const item of mod.quiz) {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = item.q;
    const opts = document.createElement('div');
    opts.className = 'opts';
    item.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', () => {
        if (i === item.answer) b.classList.add('correct');
        else b.classList.add('wrong');
      });
      opts.appendChild(b);
    });
    q.appendChild(opts);
    quizEl.appendChild(q);
  }
}

function loadModule(mod) {
  active = mod;
  controls.target.set(0, 0, 0);
  if (Number.isNaN(camera.position.x)) camera.position.set(6, 5, 8);
  content.clear();
  mod.state = mod.state || {};
  for (const c of mod.controls) {
    if (!(c.id in mod.state)) {
      mod.state[c.id] = c.type === 'range' ? parseFloat(c.value) : (c.type === 'check' ? !!c.value : c.value);
    }
  }
  mod.build();
  mod.update();
  lessonEl.innerHTML = mod.lesson;
  renderTex(lessonEl, KATEX_OPTS);
  buildControls(mod);
  buildQuiz(mod);
  listEl.querySelectorAll('li').forEach(li => li.classList.toggle('active', li.dataset.id === mod.id));
}

for (const mod of modules) {
  const li = document.createElement('li');
  li.textContent = mod.title;
  li.dataset.id = mod.id;
  li.addEventListener('click', () => loadModule(mod));
  listEl.appendChild(li);
}
if (modules.length) loadModule(modules[0]);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (active && typeof active.tick === 'function') {
    try { active.tick(dt); } catch (e) { console.error('tick error:', e); active.tick = null; }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
