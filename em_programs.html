<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Appendix: Computer Programs — Kraus &amp; Fleisch, Electromagnetics and Applications</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<style>
  :root { --bg:#0b1220; --panel:#111a2b; --ink:#e6edf7; --muted:#8fa3bf; --accent:#7fd1ff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { display:grid; grid-template-columns: 340px 1fr; height:100%; }
  #sidebar { background:var(--panel); border-right:1px solid #1e2a3d; padding:14px; overflow:auto; }
  #sidebar h1 { font-size:16px; margin:0 0 4px; }
  #sidebar .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  #moduleList { list-style:none; padding:0; margin:0 0 12px; }
  #moduleList li { padding:8px 10px; border-radius:8px; cursor:pointer; font-size:13px;
                   border:1px solid transparent; margin-bottom:4px; }
  #moduleList li:hover { background:#16233a; }
  #moduleList li.active { background:#1b2c47; border-color:var(--accent); }
  #controls { display:flex; flex-direction:column; gap:8px; margin-bottom:12px; }
  .ctrl { display:flex; flex-direction:column; gap:4px; font-size:12px; }
  .ctrl label { color:var(--muted); }
  .ctrl input[type=range] { width:100%; accent-color:var(--accent); }
  .ctrl select, .ctrl input[type=text] { background:#0e1726; color:var(--ink);
        border:1px solid #24344d; border-radius:6px; padding:4px 6px; }
  #hud { background:#0e1726; border:1px solid #24344d; border-radius:8px; padding:10px; margin-bottom:12px; }
  #hudTitle { font-weight:600; font-size:13px; margin-bottom:6px; }
  #hudEq { font-size:13px; margin-bottom:8px; }
  #hudRows { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-size:12px; }
  #hudRows .k { color:var(--muted); }
  #lesson { font-size:12px; line-height:1.5; color:#c9d6e8; margin-bottom:12px; }
  #quiz { font-size:12px; }
  #quiz .q { margin-bottom:8px; }
  #quiz .opts { display:flex; flex-direction:column; gap:4px; }
  #quiz button { background:#16233a; color:var(--ink); border:1px solid #24344d;
                 border-radius:6px; padding:6px 8px; text-align:left; cursor:pointer; }
  #quiz button.correct { border-color:#3ddc84; }
  #quiz button.wrong { border-color:#ff6b6b; }
  #stage { position:relative; }
  #stage > canvas:not(#chart) { width:100%; height:100%; display:block; touch-action:none; outline:none; }
  #chart { position:absolute; right:12px; bottom:12px; width:320px; height:200px;
           background:#0e1726; border:1px solid #24344d; border-radius:8px; }
  #chartLabel { position:absolute; right:12px; bottom:216px; font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <h1>Appendix: Computer Programs</h1>
    <div class="sub">Kraus &amp; Fleisch — Electromagnetics and Applications</div>
    <ul id="moduleList"></ul>
    <div id="controls"></div>
    <div id="hud">
      <div id="hudTitle"></div>
      <div id="hudEq"></div>
      <div id="hudRows"></div>
    </div>
    <div id="lesson"></div>
    <div id="quiz"></div>
  </aside>
  <main id="stage">
    <canvas id="chart"></canvas>
    <div id="chartLabel">2D analytical plot</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 80;
controls.enableZoom = false;

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = Math.sign(e.deltaY);
  if (!dir) return;
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * (dir > 0 ? 1.12 : 0.89)));
  offset.setLength(dist);
  camera.position.copy(controls.target).add(offset);
}, { passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 6);
scene.add(key);

const content = new THREE.Group();
scene.add(content);

const chartEl = document.getElementById('chart');
const chartCtx = chartEl.getContext('2d');

function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const nextVecs = [];
  function rebuild(vecs) {
    while (group.children.length) {
      const c = group.children.pop();
      c.geometry?.dispose?.();
      group.remove(c);
    }
    for (const v of vecs) {
      const len = v.len ?? v.dir.length();
      const dir = v.dir.clone().normalize();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
      head.position.copy(v.origin).addScaledVector(dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, head);
    }
  }
  rebuild(vectors);
  group.setVectors = (vecs) => { nextVecs.length = 0; nextVecs.push(...vecs); rebuild(vecs); };
  return group;
}

function renderTex(el, opts) {
  if (window.renderMathInElement) window.renderMathInElement(el, opts);
}
const KATEX_OPTS = {
  delimiters: [
    { left: '$$', right: '$$', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true }
  ],
  throwOnError: false,
  strict: false
};

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr;
  const eq = document.getElementById('hudEq');
  const trimmedEq = (latexEqStr || '').trim();
  eq.innerHTML = (trimmedEq && !trimmedEq.startsWith('$') && !trimmedEq.startsWith('\\(') && !trimmedEq.startsWith('\\['))
    ? `$${trimmedEq}$`
    : trimmedEq;
  renderTex(eq, KATEX_OPTS);
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  for (const r of rows) {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.textContent = r.v;
    rowsEl.appendChild(k); rowsEl.appendChild(v);
  }
}

const modules = [];

modules.push({
  id: 'coax',
  title: '1. COAX: Coaxial Transmission Line Parameters',
  controls: [
    { id: 'ratio', type: 'range', label: 'b/a ratio', min: 1.5, max: 6, step: 0.1, value: 3 },
    { id: 'epsr', type: 'range', label: 'eps_r', min: 1, max: 6, step: 0.1, value: 2.2 },
    { id: 'f', type: 'range', label: 'f (GHz)', min: 0.1, max: 10, step: 0.1, value: 2 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { ratio: 3, epsr: 2.2, f: 2, a: 0.5 });
    const g = new THREE.Group();
    // outer conductor (open cylinder)
    const outer = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1, 4, 48, 1, true),
      new THREE.MeshStandardMaterial({ color: 0x9aa7b4, metalness: 0.9, roughness: 0.35, side: THREE.DoubleSide })
    );
    outer.rotation.x = Math.PI / 2;
    g.add(outer);
    // dielectric
    const die = new THREE.Mesh(
      new THREE.CylinderGeometry(0.95, 0.95, 3.9, 40),
      new THREE.MeshStandardMaterial({ color: 0x2f6f8f, transparent: true, opacity: 0.35, roughness: 0.6 })
    );
    die.rotation.x = Math.PI / 2;
    g.add(die);
    // inner conductor
    const inner = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 4.2, 32),
      new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 1, roughness: 0.25 })
    );
    inner.rotation.x = Math.PI / 2;
    g.add(inner);
    g.position.y = 0;
    content.add(g);
    this.group = g; this.inner = inner; this.die = die; this.outer = outer;
    this.arrows = new THREE.Group(); content.add(this.arrows);
    this.buildArrows();
  },
  buildArrows() {
    const st = this.state, a = st.a, b = st.a * st.ratio;
    this.arrows.clear();
    const vecs = [];
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const z = -1.5 + (i % 3) * 1.5;
      const o = new THREE.Vector3(a * Math.cos(ang), a * Math.sin(ang), z);
      const d = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0);
      vecs.push({ origin: o, dir: d, len: b - a });
    }
    addArrowField(vecs, 0x7fd1ff);
    // rebuild arrow field into our group via scene-level helper (already added to content)
  },
  update() {
    const st = this.state;
    const a = st.a, b = st.a * st.ratio;
    this.inner.scale.set(1, 1, 1);
    this.inner.geometry.dispose();
    this.inner.geometry = new THREE.CylinderGeometry(a, a, 4.2, 32);
    this.die.geometry.dispose();
    this.die.geometry = new THREE.CylinderGeometry(b * 0.98, b * 0.98, 3.9, 40);
    this.outer.geometry.dispose();
    this.outer.geometry = new THREE.CylinderGeometry(b, b, 4, 48, 1, true);
    this.buildArrows();

    const mu0 = 4 * Math.PI * 1e-7, eps0 = 8.8541878128e-12;
    const eps = st.epsr * eps0;
    const Z0 = (1 / (2 * Math.PI)) * Math.sqrt(mu0 / eps) * Math.log(b / a);
    const c = 299792458;
    const fc = c / (Math.PI * (a + b) * Math.sqrt(st.epsr)) / 1e9; // GHz (a,b in "units" -> treat as meters scaled)
    const fcGHz = (c / (Math.PI * (a + b) * Math.sqrt(st.epsr))) / 1e9;
    const C = 2 * Math.PI * eps / Math.log(b / a);
    const L = (mu0 / (2 * Math.PI)) * Math.log(b / a);
    st.Z0 = Z0; st.fc = fcGHz; st.C = C; st.L = L;
    setHud('Coaxial line', 'Z_0=\\frac{1}{2\\pi}\\sqrt{\\frac{\\mu}{\\varepsilon}}\\ln\\frac{b}{a}', [
      { k: 'b/a', v: st.ratio.toFixed(2) },
      { k: 'Z0 (ohm)', v: Z0.toFixed(1) },
      { k: 'fc TE11 (GHz)', v: fcGHz.toFixed(2) },
      { k: 'f (GHz)', v: st.f.toFixed(2) }
    ]);
    this.drawChart();
  },
  drawChart() {
    const st = this.state, ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    const mu0 = 4 * Math.PI * 1e-7, eps0 = 8.8541878128e-12;
    const eps = st.epsr * eps0, a = st.a;
    const rMin = 1.5, rMax = 6;
    const Z = r => (1 / (2 * Math.PI)) * Math.sqrt(mu0 / eps) * Math.log(r);
    const Fc = r => (299792458 / (Math.PI * a * (1 + r) * Math.sqrt(st.epsr))) / 1e9;
    const pad = 40, x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const zMax = 200, fMax = 100;
    ctx.strokeStyle = '#243447'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = y0 + (y1 - y0) * i / 4;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    // Z0 curve
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const r = rMin + (rMax - rMin) * i / 100;
      const x = x0 + (x1 - x0) * (r - rMin) / (rMax - rMin);
      const y = y0 - (y0 - y1) * (Z(r) / zMax);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    // fc curve
    ctx.strokeStyle = '#ff9f6b'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const r = rMin + (rMax - rMin) * i / 100;
      const x = x0 + (x1 - x0) * (r - rMin) / (rMax - rMin);
      const y = y0 - (y0 - y1) * (Fc(r) / fMax);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    // markers
    const xm = x0 + (x1 - x0) * (st.ratio - rMin) / (rMax - rMin);
    ctx.fillStyle = '#7fd1ff'; ctx.beginPath(); ctx.arc(xm, y0 - (y0 - y1) * (Z(st.ratio) / zMax), 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff9f6b'; ctx.beginPath(); ctx.arc(xm, y0 - (y0 - y1) * (Fc(st.ratio) / fMax), 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#9fb3c8'; ctx.font = '12px sans-serif';
    ctx.fillText('b/a', x1 - 20, y0 + 18);
    ctx.fillStyle = '#7fd1ff'; ctx.fillText('Z0 (ohm)', x0 + 4, y1 + 14);
    ctx.fillStyle = '#ff9f6b'; ctx.fillText('fc TE11 (GHz)', x0 + 4, y1 + 30);
  },
  tick(dt) {
    if (this.group) this.group.rotation.z += dt * 0.15;
  },
  lesson: String.raw`Coaxial line: inner radius $a$, outer radius $b$, dielectric $\varepsilon=\varepsilon_r\varepsilon_0$.

Capacitance per unit length: $C'=\frac{2\pi\varepsilon}{\ln(b/a)}$.
Inductance per unit length: $L'=\frac{\mu}{2\pi}\ln\frac{b/a}$.

Then $Z_0=\sqrt{L'/C'}=\frac{1}{2\pi}\sqrt{\frac{\mu}{\varepsilon}}\ln\frac{b}{a}$.
So $Z_0$ grows only logarithmically with $b/a$; doubling $b/a$ adds about $0.69$ to the log.

The dominant TEM mode holds until the first higher-order mode, TE11, whose cutoff is
$f_c=\frac{c}{\pi(a+b)\sqrt{\varepsilon_r}}$.
Below $f_c$ the line is single-mode; above it, TE11 propagates and the line becomes multimode.`,
  quiz: [
    { q: 'If b/a is doubled, Z0 changes by roughly:', options: ['a factor of 2', 'an additive term ~0.69 in the log', 'a factor of 4', 'no change'], answer: 1 },
    { q: 'The TE11 cutoff frequency scales as:', options: ['1/(a+b)', 'a+b', '1/(ab)', 'ln(b/a)'], answer: 0 }
  ]
});
/* === UI CONTROLLER === */

let active = null;
const listEl = document.getElementById('moduleList');
const controlsEl = document.getElementById('controls');
const lessonEl = document.getElementById('lesson');
const quizEl = document.getElementById('quiz');

function buildControls(mod) {
  controlsEl.innerHTML = '';
  for (const c of mod.controls) {
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    const label = document.createElement('label');
    label.textContent = c.label;
    wrap.appendChild(label);
    let input;
    if (c.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step; input.value = c.value;
      input.addEventListener('input', () => {
        mod.state[c.id] = parseFloat(input.value);
        mod.update();
      });
    } else if (c.type === 'select') {
      input = document.createElement('select');
      for (const o of c.options) {
        const opt = document.createElement('option');
        opt.value = (typeof o === 'object' && o !== null) ? o.value : o;
        opt.textContent = (typeof o === 'object' && o !== null) ? (o.label ?? o.value) : o;
        input.appendChild(opt);
      }
      input.value = c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.value;
        mod.update();
      });
    } else if (c.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  for (const item of mod.quiz) {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = item.q;
    const opts = document.createElement('div');
    opts.className = 'opts';
    item.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', () => {
        if (i === item.answer) b.classList.add('correct');
        else b.classList.add('wrong');
      });
      opts.appendChild(b);
    });
    q.appendChild(opts);
    quizEl.appendChild(q);
  }
}

function loadModule(mod) {
  active = mod;
  controls.target.set(0, 0, 0);
  if (Number.isNaN(camera.position.x)) camera.position.set(6, 5, 8);
  content.clear();
  mod.state = mod.state || {};
  for (const c of mod.controls) {
    if (!(c.id in mod.state)) {
      mod.state[c.id] = c.type === 'range' ? parseFloat(c.value) : (c.type === 'check' ? !!c.value : c.value);
    }
  }
  mod.build();
  mod.update();
  lessonEl.innerHTML = mod.lesson;
  renderTex(lessonEl, KATEX_OPTS);
  buildControls(mod);
  buildQuiz(mod);
  listEl.querySelectorAll('li').forEach(li => li.classList.toggle('active', li.dataset.id === mod.id));
}

for (const mod of modules) {
  const li = document.createElement('li');
  li.textContent = mod.title;
  li.dataset.id = mod.id;
  li.addEventListener('click', () => loadModule(mod));
  listEl.appendChild(li);
}
if (modules.length) loadModule(modules[0]);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (active && typeof active.tick === 'function') {
    try { active.tick(dt); } catch (e) { console.error('tick error:', e); active.tick = null; }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
</body>
</html>
