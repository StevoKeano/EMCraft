<style>
  :root { --bg:#0b1220; --panel:#111a2b; --ink:#e6edf7; --muted:#8fa3bf; --accent:#7fd1ff; }

  #hudRows .k { color:var(--muted); }

<body>
<div id="app">
  <aside id="sidebar">
    <h1>Appendix: Computer Programs</h1>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);

const camera = new THREE.PerspectiveCamera(45, stage.clientWidth / stage.clientHeight, 0.1, 200);
camera.position.set(6, 5, 8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 0.8;
controls.maxDistance = 80;
controls.enableZoom = false;

renderer.domElement.addEventListener('wheel', (e) => {
  e.preventDefault();
  const dir = Math.sign(e.deltaY);
  if (!dir) return;
  const offset = camera.position.clone().sub(controls.target);
  const dist = Math.max(controls.minDistance, Math.min(controls.maxDistance, offset.length() * (dir > 0 ? 1.12 : 0.89)));
  offset.setLength(dist);
  camera.position.copy(controls.target).add(offset);
}, { passive: false });

scene.add(new THREE.AmbientLight(0xffffff, 0.55));
const key = new THREE.DirectionalLight(0xffffff, 0.9);
key.position.set(6, 10, 6);
scene.add(key);

const content = new THREE.Group();
scene.add(content);

const chartEl = document.getElementById('chart');
const chartCtx = chartEl.getContext('2d');

function addArrowField(vectors, color = 0x7fd1ff) {
  const group = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color });
  const nextVecs = [];
  function rebuild(vecs) {
    while (group.children.length) {
      const c = group.children.pop();
      c.geometry?.dispose?.();
      group.remove(c);
    }
    for (const v of vecs) {
      const len = v.len ?? v.dir.length();
      const dir = v.dir.clone().normalize();
      const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), mat);
      shaft.position.copy(v.origin).addScaledVector(dir, len / 2);
      shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      const head = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.16, 8), mat);
      head.position.copy(v.origin).addScaledVector(dir, len);
      head.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      group.add(shaft, head);
    }
  }
  rebuild(vectors);
  group.setVectors = (vecs) => { nextVecs.length = 0; nextVecs.push(...vecs); rebuild(vecs); };
  return group;
}

function renderTex(el, opts) {
  if (window.renderMathInElement) window.renderMathInElement(el, opts);
}
const KATEX_OPTS = {
  delimiters: [
    { left: '$$', right: '$$', display: true },
    { left: '$', right: '$', display: false },
    { left: '\\(', right: '\\)', display: false },
    { left: '\\[', right: '\\]', display: true }
  ],
  throwOnError: false,
  strict: false
};

function setHud(titleStr, latexEqStr, rows) {
  document.getElementById('hudTitle').textContent = titleStr;
  const eq = document.getElementById('hudEq');
  const trimmedEq = (latexEqStr || '').trim();
  eq.innerHTML = (trimmedEq && !trimmedEq.startsWith('$') && !trimmedEq.startsWith('\\(') && !trimmedEq.startsWith('\\['))
    ? `$${trimmedEq}$`
    : trimmedEq;
  renderTex(eq, KATEX_OPTS);
  const rowsEl = document.getElementById('hudRows');
  rowsEl.innerHTML = '';
  for (const r of rows) {
    const k = document.createElement('div'); k.className = 'k'; k.textContent = r.k;
    const v = document.createElement('div'); v.textContent = r.v;
    rowsEl.appendChild(k); rowsEl.appendChild(v);
  }
}

const modules = [];

modules.push({
  id: 'coax',
  title: '1. COAX: Coaxial Transmission Line Parameters',
  controls: [
    { id: 'ratio', type: 'range', label: 'b/a ratio', min: 1.5, max: 6, step: 0.1, value: 3 },
    { id: 'epsr', type: 'range', label: 'eps_r', min: 1, max: 6, step: 0.1, value: 2.2 },
    { id: 'f', type: 'range', label: 'f (GHz)', min: 0.1, max: 10, step: 0.1, value: 2 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { ratio: 3, epsr: 2.2, f: 2, a: 0.5 });
    const g = new THREE.Group();
    // outer conductor (open cylinder)
    const outer = new THREE.Mesh(
      new THREE.CylinderGeometry(1, 1, 4, 48, 1, true),
      new THREE.MeshStandardMaterial({ color: 0x9aa7b4, metalness: 0.9, roughness: 0.35, side: THREE.DoubleSide })
    );
    outer.rotation.x = Math.PI / 2;
    g.add(outer);
    // dielectric
    const die = new THREE.Mesh(
      new THREE.CylinderGeometry(0.95, 0.95, 3.9, 40),
      new THREE.MeshStandardMaterial({ color: 0x2f6f8f, transparent: true, opacity: 0.35, roughness: 0.6 })
    );
    die.rotation.x = Math.PI / 2;
    g.add(die);
    // inner conductor
    const inner = new THREE.Mesh(
      new THREE.CylinderGeometry(0.5, 0.5, 4.2, 32),
      new THREE.MeshStandardMaterial({ color: 0xd9a441, metalness: 1, roughness: 0.25 })
    );
    inner.rotation.x = Math.PI / 2;
    g.add(inner);
    g.position.y = 0;
    content.add(g);
    this.group = g; this.inner = inner; this.die = die; this.outer = outer;
    this.arrows = new THREE.Group(); content.add(this.arrows);
    this.buildArrows();
  },
  buildArrows() {
    const st = this.state, a = st.a, b = st.a * st.ratio;
    this.arrows.clear();
    const vecs = [];
    for (let i = 0; i < 12; i++) {
      const ang = (i / 12) * Math.PI * 2;
      const z = -1.5 + (i % 3) * 1.5;
      const o = new THREE.Vector3(a * Math.cos(ang), a * Math.sin(ang), z);
      const d = new THREE.Vector3(Math.cos(ang), Math.sin(ang), 0);
      vecs.push({ origin: o, dir: d, len: b - a });
    }
    addArrowField(vecs, 0x7fd1ff);
    // rebuild arrow field into our group via scene-level helper (already added to content)
  },
  update() {
    const st = this.state;
    const a = st.a, b = st.a * st.ratio;
    this.inner.scale.set(1, 1, 1);
    this.inner.geometry.dispose();
    this.inner.geometry = new THREE.CylinderGeometry(a, a, 4.2, 32);
    this.die.geometry.dispose();
    this.die.geometry = new THREE.CylinderGeometry(b * 0.98, b * 0.98, 3.9, 40);
    this.outer.geometry.dispose();
    this.outer.geometry = new THREE.CylinderGeometry(b, b, 4, 48, 1, true);
    this.buildArrows();

    const mu0 = 4 * Math.PI * 1e-7, eps0 = 8.8541878128e-12;
    const eps = st.epsr * eps0;
    const Z0 = (1 / (2 * Math.PI)) * Math.sqrt(mu0 / eps) * Math.log(b / a);
    const c = 299792458;
    const fc = c / (Math.PI * (a + b) * Math.sqrt(st.epsr)) / 1e9; // GHz (a,b in "units" -> treat as meters scaled)
    const fcGHz = (c / (Math.PI * (a + b) * Math.sqrt(st.epsr))) / 1e9;
    const C = 2 * Math.PI * eps / Math.log(b / a);
    const L = (mu0 / (2 * Math.PI)) * Math.log(b / a);
    st.Z0 = Z0; st.fc = fcGHz; st.C = C; st.L = L;
    setHud('Coaxial line', 'Z_0=\\frac{1}{2\\pi}\\sqrt{\\frac{\\mu}{\\varepsilon}}\\ln\\frac{b}{a}', [
      { k: 'b/a', v: st.ratio.toFixed(2) },
      { k: 'Z0 (ohm)', v: Z0.toFixed(1) },
      { k: 'fc TE11 (GHz)', v: fcGHz.toFixed(2) },
      { k: 'f (GHz)', v: st.f.toFixed(2) }
    ]);
    this.drawChart();
  },
  drawChart() {
    const st = this.state, ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    const mu0 = 4 * Math.PI * 1e-7, eps0 = 8.8541878128e-12;
    const eps = st.epsr * eps0, a = st.a;
    const rMin = 1.5, rMax = 6;
    const Z = r => (1 / (2 * Math.PI)) * Math.sqrt(mu0 / eps) * Math.log(r);
    const Fc = r => (299792458 / (Math.PI * a * (1 + r) * Math.sqrt(st.epsr))) / 1e9;
    const pad = 40, x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    const zMax = 200, fMax = 100;
    ctx.strokeStyle = '#243447'; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = y0 + (y1 - y0) * i / 4;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    }
    // Z0 curve
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const r = rMin + (rMax - rMin) * i / 100;
      const x = x0 + (x1 - x0) * (r - rMin) / (rMax - rMin);
      const y = y0 - (y0 - y1) * (Z(r) / zMax);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    // fc curve
    ctx.strokeStyle = '#ff9f6b'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const r = rMin + (rMax - rMin) * i / 100;
      const x = x0 + (x1 - x0) * (r - rMin) / (rMax - rMin);
      const y = y0 - (y0 - y1) * (Fc(r) / fMax);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    // markers
    const xm = x0 + (x1 - x0) * (st.ratio - rMin) / (rMax - rMin);
    ctx.fillStyle = '#7fd1ff'; ctx.beginPath(); ctx.arc(xm, y0 - (y0 - y1) * (Z(st.ratio) / zMax), 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff9f6b'; ctx.beginPath(); ctx.arc(xm, y0 - (y0 - y1) * (Fc(st.ratio) / fMax), 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#9fb3c8'; ctx.font = '12px sans-serif';
    ctx.fillText('b/a', x1 - 20, y0 + 18);
    ctx.fillStyle = '#7fd1ff'; ctx.fillText('Z0 (ohm)', x0 + 4, y1 + 14);
    ctx.fillStyle = '#ff9f6b'; ctx.fillText('fc TE11 (GHz)', x0 + 4, y1 + 30);
  },
  tick(dt) {
    if (this.group) this.group.rotation.z += dt * 0.15;
  },
  lesson: String.raw`Coaxial line: inner radius $a$, outer radius $b$, dielectric $\varepsilon=\varepsilon_r\varepsilon_0$.

Capacitance per unit length: $C'=\frac{2\pi\varepsilon}{\ln(b/a)}$.
Inductance per unit length: $L'=\frac{\mu}{2\pi}\ln\frac{b/a}$.

Then $Z_0=\sqrt{L'/C'}=\frac{1}{2\pi}\sqrt{\frac{\mu}{\varepsilon}}\ln\frac{b}{a}$.
So $Z_0$ grows only logarithmically with $b/a$; doubling $b/a$ adds about $0.69$ to the log.

The dominant TEM mode holds until the first higher-order mode, TE11, whose cutoff is
$f_c=\frac{c}{\pi(a+b)\sqrt{\varepsilon_r}}$.
Below $f_c$ the line is single-mode; above it, TE11 propagates and the line becomes multimode.`,
  quiz: [
    { q: 'If b/a is doubled, Z0 changes by roughly:', options: ['a factor of 2', 'an additive term ~0.69 in the log', 'a factor of 4', 'no change'], answer: 1 },
    { q: 'The TE11 cutoff frequency scales as:', options: ['1/(a+b)', 'a+b', '1/(ab)', 'ln(b/a)'], answer: 0 }
  ]
});
modules.push({
  id: 'vswr',
  title: '2. VSWR: Voltage Standing Wave Ratio',
  controls: [
    { type: 'range', id: 'ratio', label: 'ZL / Z0', min: 0.1, max: 10, step: 0.1, value: 2 },
    { type: 'range', id: 'len', label: 'Electrical length (lambda)', min: 1, max: 10, step: 0.1, value: 4 },
    { type: 'range', id: 'freq', label: 'Frequency (relative)', min: 0.1, max: 10, step: 0.1, value: 1 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { ratio: 2, len: 4, freq: 1, phase: 0 });

    const lineGeo = new THREE.CylinderGeometry(0.045, 0.045, 1, 12);
    lineGeo.rotateX(Math.PI / 2);
    const line = new THREE.Mesh(lineGeo, new THREE.MeshStandardMaterial({ color: 0x9fb6c9, metalness: 0.6, roughness: 0.35 }));
    line.position.z = 0.5;
    content.add(line);

    const load = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.22, 0.12), new THREE.MeshStandardMaterial({ color: 0xffb347, metalness: 0.4, roughness: 0.4 }));
    load.position.set(0, 0, 1.06);
    content.add(load);

    const src = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 0.1), new THREE.MeshStandardMaterial({ color: 0x7fd1ff, metalness: 0.5, roughness: 0.4 }));
    src.position.set(0, 0, -0.06);
    content.add(src);

    const incMat = new THREE.MeshStandardMaterial({ color: 0x7fd1ff, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
    const refMat = new THREE.MeshStandardMaterial({ color: 0xff6b8a, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
    const inc = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), incMat);
    const ref = new THREE.Mesh(new THREE.PlaneGeometry(1, 1, 1, 1), refMat);
    content.add(inc, ref);

    const envMat = new THREE.LineBasicMaterial({ color: 0xffe066 });
    const envGeo = new THREE.BufferGeometry();
    envGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(2 * 121 * 3), 3));
    const env = new THREE.Line(envGeo, envMat);
    content.add(env);

    st.inc = inc; st.ref = ref; st.env = env; st.envGeo = envGeo;
    st.line = line; st.load = load;
  },
  update() {
    const st = this.state;
    const r = st.ratio;
    const g = (r - 1) / (r + 1);
    const ag = Math.abs(g);
    const swr = (1 + ag) / (1 - ag);
    const L = st.len;
    const k = 2 * Math.PI * st.freq;

    const inc = st.inc, ref = st.ref;
    inc.scale.set(0.28, 1, L);
    inc.position.set(0, 0.16, L / 2);
    ref.scale.set(0.28 * ag, 1, L);
    ref.position.set(0, -0.16, L / 2);

    const pos = st.envGeo.attributes.position.array;
    const N = 121;
    for (let i = 0; i < N; i++) {
      const z = (i / (N - 1)) * L;
      const v = Math.sqrt(1 + ag * ag + 2 * ag * Math.cos(2 * k * z + Math.PI));
      pos[i * 3] = 0;
      pos[i * 3 + 1] = 0.16 + 0.22 * v;
      pos[i * 3 + 2] = z;
      pos[(N + i) * 3] = 0;
      pos[(N + i) * 3 + 1] = -0.16 - 0.22 * v;
      pos[(N + i) * 3 + 2] = z;
    }
    st.envGeo.attributes.position.needsUpdate = true;
    st.envGeo.computeBoundingSphere();

    st.load.position.z = L + 0.06;
    st.line.scale.z = L;
    st.line.position.z = L / 2;

    setHud('Voltage standing wave ratio', '\\mathrm{SWR}=\\frac{1+|\\Gamma|}{1-|\\Gamma|}', [
      { k: '|Gamma|', v: ag.toFixed(3) },
      { k: 'SWR', v: swr.toFixed(3) }
    ]);

    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    const pad = 40, x0 = pad, x1 = W - pad, y0 = H - pad, y1 = pad;
    ctx.strokeStyle = '#2a3a52'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.moveTo(x0, y0); ctx.lineTo(x0, y1); ctx.stroke();

    const vmax = 1 + ag, vmin = 1 - ag;
    const yOf = v => y0 - (v / (vmax + 0.15)) * (y0 - y1);
    ctx.strokeStyle = '#ffe066'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const z = (i / 200) * L;
      const v = Math.sqrt(1 + ag * ag + 2 * ag * Math.cos(2 * k * z + Math.PI));
      const x = x0 + (z / L) * (x1 - x0);
      if (i === 0) ctx.moveTo(x, yOf(v)); else ctx.lineTo(x, yOf(v));
    }
    ctx.stroke();

    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = '#7fd1ff';
    ctx.beginPath(); ctx.moveTo(x0, yOf(vmax)); ctx.lineTo(x1, yOf(vmax)); ctx.stroke();
    ctx.strokeStyle = '#ff6b8a';
    ctx.beginPath(); ctx.moveTo(x0, yOf(vmin)); ctx.lineTo(x1, yOf(vmin)); ctx.stroke();
    ctx.setLineDash([]);

    ctx.fillStyle = '#7fd1ff'; ctx.font = '12px monospace';
    ctx.fillText('Vmax = ' + vmax.toFixed(2), x0 + 6, yOf(vmax) - 6);
    ctx.fillStyle = '#ff6b8a';
    ctx.fillText('Vmin = ' + vmin.toFixed(2), x0 + 6, yOf(vmin) + 14);
    ctx.fillStyle = '#9fb6c9';
    ctx.fillText('|V(z)| envelope', x0 + 6, y1 + 14);
    ctx.fillText('z / lambda', x1 - 70, y0 + 22);
  },
  tick(dt) {
    const st = this.state;
    st.phase += dt * st.freq * 2;
    if (st.inc) {
      st.inc.rotation.z = Math.sin(st.phase) * 0.12;
      st.ref.rotation.z = -Math.sin(st.phase) * 0.12;
    }
  },
  lesson: String.raw`A transmission line of characteristic impedance $Z_0$ terminated by a load $Z_L$ reflects part of the incident wave. The reflection coefficient is $\Gamma=(Z_L-Z_0)/(Z_L+Z_0)$, and the voltage standing wave ratio is $\mathrm{SWR}=(1+|\Gamma|)/(1-|\Gamma|)$.

For a matched load $Z_L=Z_0$, $\Gamma=0$ and $\mathrm{SWR}=1$: no standing wave, only the forward wave. For a short or open circuit, $|\Gamma|=1$ and $\mathrm{SWR}\to\infty$: total reflection and a pure standing wave with $V_{\min}=0$.

The total voltage is $V(z)=V^+ e^{-jkz}+V^- e^{+jkz}$, so $|V(z)|$ oscillates between $V_{\max}=|V^+|(1+|\Gamma|)$ and $V_{\min}=|V^+|(1-|\Gamma|)$. Adjacent maxima and minima are separated by $\lambda/4$, and successive maxima by $\lambda/2$. The ratio $V_{\max}/V_{\min}=\mathrm{SWR}$ measures the mismatch.`,
  quiz: [

  lesson: String.raw`A phasor is a complex number $V = |V|e^{j\phi}$ representing amplitude and phase. Along a line, a forward wave is $V^{+}e^{-\gamma z}$ and a backward wave is $V^{-}e^{+\gamma z}$, with $\gamma=\alpha+j\beta$.

    // |sum e^{j n psi}| = |sin(N psi/2) / sin(psi/2)|
    const s = Math.sin(psi / 2);
    if (Math.abs(s) < 1e-9) return N;
    return Math.abs(Math.sin(N * psi / 2) / s);
  },

  update() {
    const st = this.state;
    const N = Math.round(st.N), d = st.d, delta = st.delta * Math.PI / 180;
    const kd = 2 * Math.PI * d;

    // place elements
    const span = (N - 1) * d * 2.0;
    for (let n = 0; n < 16; n++) {
      const s = this.spheres[n];
      s.visible = n < N;
      s.position.set((n - (N - 1) / 2) * d * 2.0, 0, 0);
    }
    this.elems.children[this.elems.children.length - 1].geometry.dispose?.();
    // rebuild feed line to match span
    const lg = new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(-span / 2 - 0.2, 0, 0), new THREE.Vector3(span / 2 + 0.2, 0, 0)
    ]);
    this.elems.children[this.elems.children.length - 1].geometry = lg;

    // pattern surface: revolve |AF(theta)| about x-axis
    const NT = 96, NP = 48;
    const pos = [], idx = [];
    for (let i = 0; i <= NT; i++) {
      const th = i / NT * Math.PI;
      const r = this.af(th, N, d, delta) / N; // normalized 0..1
      for (let j = 0; j <= NP; j++) {
        const ph = j / NP * Math.PI * 2;
        const y = r * Math.sin(th) * Math.cos(ph) * 2.2;
        const z = r * Math.sin(th) * Math.sin(ph) * 2.2;
        const x = r * Math.cos(th) * 2.2;
        pos.push(x, y, z);
      }
    }
    for (let i = 0; i < NT; i++) for (let j = 0; j < NP; j++) {
      const a = i * (NP + 1) + j, b = a + NP + 1;
      idx.push(a, b, a + 1, b, b + 1, a + 1);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setIndex(idx);
    g.computeVertexNormals();
    this.pattern.geometry.dispose();
    this.pattern.geometry = g;

    // chart: polar plot of |AF(theta)| vs theta (0..pi)
    const ctx = this.ctx, W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, R = Math.min(W, H) * 0.42;

    // grid rings
    ctx.strokeStyle = '#22334a'; ctx.lineWidth = 1;
    for (let k = 1; k <= 4; k++) {
      ctx.beginPath(); ctx.arc(cx, cy, R * k / 4, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(cx - R, cy); ctx.lineTo(cx + R, cy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy - R); ctx.lineTo(cx, cy + R); ctx.stroke();

    // pattern curve (theta measured from +x axis, drawn as polar)
    ctx.strokeStyle = '#7fd1ff'; ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i <= 360; i++) {
      const th = i / 360 * Math.PI * 2;
      const r = this.af(th, N, d, delta) / N;
      const x = cx + R * r * Math.cos(th);
      const y = cy - R * r * Math.sin(th);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.stroke();

    // main beam direction marker
    const thMax = Math.acos(Math.max(-1, Math.min(1, -delta / kd)));
    ctx.fillStyle = '#ffd27f';
    ctx.beginPath();
    ctx.arc(cx + R * Math.cos(thMax), cy - R * R * 0 + cy - R * Math.sin(thMax) * 1, 4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#9fb6d0'; ctx.font = '12px monospace';
    ctx.fillText('|AF(theta)| polar plot', 10, 18);

    setHud('Array pattern',
      'AF(\\theta)=\\sum_{n=0}^{N-1}e^{j n(k d\\cos\\theta+\\delta)}',
      [{ k: 'N', v: String(N) }, { k: 'd/lambda', v: d.toFixed(2) }, { k: 'delta', v: st.delta.toFixed(0) + ' deg' }]);
  },

  tick(dt) {
    this.elems.rotation.y += dt * 0.15;
  },

  lesson: String.raw`For an $N$-element uniform linear array the array factor is
$AF(\theta)=\sum_{n=0}^{N-1}e^{j n(k d\cos\theta+\delta)}$, which sums to
$|AF|=\left|\frac{\sin(N\psi/2)}{\sin(\psi/2)}\right|$ with $\psi=k d\cos\theta+\delta$.
The broadside maximum occurs when $\psi=0$, i.e. $\cos\theta=-\delta/(k d)$: a progressive phase $\delta$ steers the main beam off broadside. Grating lobes (extra maxima of the same height) appear when $d>\lambda$, since $\psi$ then spans more than $2\pi$ across $\theta\in[0,\pi]$; keeping $d\le\lambda$ (ideally $d=\lambda/2$) guarantees a single main lobe. The directivity gain grows roughly as $N$ for a fixed spacing.`,

    { q: 'Grating lobes appear in a uniform linear array when:', options: ['d > lambda', 'd < lambda/2', 'delta = 0', 'N is even'], answer: 0 },
    { q: 'The main beam is steered off broadside by:', options: ['a progressive phase delta between elements', 'changing N only', 'reducing d below lambda/2', 'removing the feed line'], answer: 0 }

  lesson: String.raw`The 5-point stencil discretizes $\nabla^2 V = 0$ on a square grid:

  solve() {
    const st = this.state, N = st.N, L = st.L, d = st.d, V0 = st.V0;
    const dx = L / N, xs = [], sig = [];
    for (let i = 0; i < N; i++) xs.push(-L / 2 + (i + 0.5) * dx);
    // Green's function matrix: potential at plate i due to charge on plate j (both plates)
    const A = [], b = [];
    const eps0 = 1;
    for (let i = 0; i < N; i++) {
      A.push(new Array(N).fill(0));
      for (let j = 0; j < N; j++) {
        const dxij = xs[i] - xs[j];
        const r1 = Math.sqrt(dxij * dxij + d * d);
        const r2 = Math.sqrt(dxij * dxij + 1e-8);
        // self term regularized by sub-area width
        const self = (i === j) ? (dx / (2 * Math.PI * eps0)) * Math.log(dx / (2 * Math.max(dx, 1e-6))) : 0;

      }
      b.push(V0 / 2);
    }
    // solve linear system (Gaussian elimination)
    const M = A.map((row, i) => row.concat(b[i]));
    for (let k = 0; k < N; k++) {
      let p = k;
      for (let i = k + 1; i < N; i++) if (Math.abs(M[i][k]) > Math.abs(M[p][k])) p = i;
      [M[k], M[p]] = [M[p], M[k]];
      const piv = M[k][k] || 1e-12;
      for (let j = k; j <= N; j++) M[k][j] /= piv;
      for (let i = 0; i < N; i++) if (i !== k) {
        const f = M[i][k];
        for (let j = k; j <= N; j++) M[i][j] -= f * M[k][j];

  },
  lesson: String.raw`<b>Method of moments (MoM)</b> discretizes each finite plate into $N$ sub-areas of width $\Delta x = L/N$. The unknown is the charge density $\sigma(x)$ on each sub-area, expanded in pulse basis functions $\phi_n(x)$: $\sigma(x)=\sum_n a_n\phi_n(x)$.

The Green's-function matrix couples sub-areas: $A_{ij}=\frac{\Delta x}{2\pi\epsilon_0}\left(\frac{1}{r_{ij}}-\frac{1}{r_{ij}^{\prime}}\right)$, where $r_{ij}$ is the distance between sub-areas on opposite plates and $r_{ij}^{\prime}$ the in-plane distance. Solving $A\mathbf a=\mathbf b$ with $\mathbf b=V_0/2$ gives the charge distribution.

      { k: 'x/a', v: x.toFixed(2) },
      { k: '|S11|', v: s11.toFixed(3) }
    ]);

    this.drawChart(r, x, f);
  },

  drawChart(r, x, f) {
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1220'; ctx.fillRect(0, 0, W, H);

    const pad = 40;
    const plotW = W - 2 * pad, plotH = H - 2 * pad;
    ctx.strokeStyle = '#2a4a66'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.lineTo(W - pad, H - pad); ctx.stroke();

    ctx.fillStyle = '#9fb3c8'; ctx.font = '12px monospace';
    ctx.fillText('|S| vs r/a', pad, pad - 12);
    ctx.fillText('r/a', W - pad - 20, H - pad + 20);
    ctx.fillText('1.0', pad - 25, pad + 5);
    ctx.fillText('0.0', pad - 25, H - pad + 5);

    const rMin = 0.02, rMax = 0.3;
    const s11 = [], s21 = [];
    for (let i = 0; i <= 100; i++) {
      const rr = rMin + (rMax - rMin) * i / 100;
      const c = Math.sin(Math.PI * x) * (rr / 0.3);
      const re = (x < 0.5 ? 1 : -1) * c * 1.6;
      const a11 = Math.min(0.95, Math.abs(re) * 0.55 + 0.05 * rr);
      s11.push(a11);
      s21.push(Math.sqrt(Math.max(0, 1 - a11 * a11)));
    }

    const px = rr => pad + (rr - rMin) / (rMax - rMin) * plotW;
    const py = v => H - pad - v * plotH;

    ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const rr = rMin + (rMax - rMin) * i / 100;
      const X = px(rr), Y = py(s11[i]);
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.stroke();

    ctx.strokeStyle = '#4ecdc4'; ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const rr = rMin + (rMax - rMin) * i / 100;
      const X = px(rr), Y = py(s21[i]);
      i === 0 ? ctx.moveTo(X, Y) : ctx.lineTo(X, Y);
    }
    ctx.stroke();

    const curR = r;
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(px(curR), py(Math.min(0.95, Math.abs(Math.sin(Math.PI * x) * (curR / 0.3) * 1.6) * 0.55 + 0.05 * curR)), 4, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#ff6b6b'; ctx.fillText('|S11|', W - pad - 80, pad + 15);
    ctx.fillStyle = '#4ecdc4'; ctx.fillText('|S21|', W - pad - 80, pad + 32);
  },

  tick(dt) {
    const st = this.state;
    const t = performance.now() * 0.001;
    this.fieldGroup.rotation.z = 0.05 * Math.sin(t * 1.5);
  },

  lesson: String.raw`A metallic post in a rectangular waveguide is a classic **scattering obstacle**. The incident $TE_{10}$ mode induces currents on the post; the post reradiates a scattered field, producing reflection $S_{11}$ and transmission $S_{21}$.

**Equivalent circuit.** A thin post can be modeled as a shunt reactance across the guide. Its sign depends on position:
- Near the side wall ($x/a \to 0$ or $1$), the post is mainly **inductive** ($X>0$).
- Near the center ($x/a \to 0.5$), where the electric field is maximum, it behaves **capacitively** ($X<0$).

The post radius controls the coupling strength: larger $r/a$ gives stronger scattering. Energy conservation requires $|S_{11}|^{2}+|S_{21}|^{2}=1$ for a lossless post.

**Matching application.** A post placed at the right offset and radius can cancel a mismatch, acting as a waveguide **matching element** (similar to a shunt susceptance in transmission-line matching).`,

  quiz: [
    { q: 'A thin metallic post near the center of a rectangular waveguide (maximum E-field) is best modeled as:', options: ['A shunt inductive reactance', 'A shunt capacitive reactance', 'A series resistor', 'An ideal open circuit'], answer: 1 },
    { q: 'For a lossless post, increasing the post radius generally causes:', options: ['|S11| to decrease and |S21| to increase', '|S11| to increase and |S21| to decrease', 'No change in scattering', '|S11| and |S21| both to increase'], answer: 1 }
  ]
});
modules.push({
  id: 'lossy_line',
  title: '10. Lossy Line: Attenuation & Complex Impedance',
  controls: [
    { id: 'alpha', label: 'alpha (Np/m)', type: 'range', min: 0, max: 0.2, step: 0.005, value: 0.05 },
    { id: 'beta', label: 'beta (rad/m)', type: 'range', min: 1, max: 10, step: 0.1, value: 4 },
    { id: 'length', label: 'length (m)', type: 'range', min: 0.1, max: 5, step: 0.1, value: 3 }
  ],
  build() {
    const st = this.state;
    Object.assign(st, { alpha: 0.05, beta: 4, length: 3 });

    const g = new THREE.Group();
    content.add(g);

    // line axis
    const axisGeo = new THREE.CylinderGeometry(0.035, 0.035, 5, 16);
    axisGeo.rotateZ(Math.PI / 2);
    const axis = new THREE.Mesh(axisGeo, new THREE.MeshStandardMaterial({ color: 0x334455, metalness: 0.6, roughness: 0.4 }));
    axis.position.set(2.5, 0, 0);
    g.add(axis);

    // decaying wave envelope (two mirrored curves)
    const envMat = new THREE.LineBasicMaterial({ color: 0x7fd1ff });
    const envGeo = new THREE.BufferGeometry();
    const envPts = [];
    for (let i = 0; i <= 120; i++) {
      const z = (i / 120) * 5;
      envPts.push(new THREE.Vector3(z, 0.55 * Math.exp(-st.alpha * z), 0));
    }
    envGeo.setFromPoints(envPts);
    const envTop = new THREE.Line(envGeo, envMat);
    g.add(envTop);
    const envBot = new THREE.Line(envGeo.clone(), envMat);
    envBot.scale.y = -1;
    g.add(envBot);

    // oscillating wave inside envelope
    const waveMat = new THREE.LineBasicMaterial({ color: 0xffb347 });
    const waveGeo = new THREE.BufferGeometry();
    const wavePts = [];
    for (let i = 0; i <= 240; i++) {
      const z = (i / 240) * 5;
      wavePts.push(new THREE.Vector3(z, 0.55 * Math.exp(-st.alpha * z) * Math.cos(st.beta * z), 0));
    }
    waveGeo.setFromPoints(wavePts);
    const wave = new THREE.Line(waveGeo, waveMat);
    g.add(wave);

    // complex impedance spiral in the y-z plane (real -> y, imag -> z)
    const spiralMat = new THREE.LineBasicMaterial({ color: 0xff6b9d });
    const spiralGeo = new THREE.BufferGeometry();
    const spiralPts = [];
    const Z0 = 50;
    for (let i = 0; i <= 200; i++) {
      const z = (i / 200) * st.length;
      const th = 2 * st.beta * z;
      const r = Z0 * Math.exp(-2 * st.alpha * z);
      spiralPts.push(new THREE.Vector3(z, r * Math.cos(th) * 0.02, r * Math.sin(th) * 0.02));
    }
    spiralGeo.setFromPoints(spiralPts);
    const spiral = new THREE.Line(spiralGeo, spiralMat);
    g.add(spiral);

    // markers
    const markerMat = new THREE.MeshStandardMaterial({ color: 0xff6b9d, emissive: 0x441122 });
    const marker = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 12), markerMat);
    g.add(marker);

    this.group = g;
    this.envTop = envTop;
    this.envBot = envBot;
    this.wave = wave;
    this.spiral = spiral;
    this.marker = marker;
    this.Z0 = Z0;

    g.position.set(-2.5, 0, 0);
  },
  update() {
    const st = this.state;
    const a = st.alpha, b = st.beta, L = st.length;

    // envelope
    const envPts = [];
    for (let i = 0; i <= 120; i++) {
      const z = (i / 120) * 5;
      envPts.push(new THREE.Vector3(z, 0.55 * Math.exp(-a * z), 0));
    }
    this.envTop.geometry.setFromPoints(envPts);
    this.envBot.geometry.setFromPoints(envPts.map(p => new THREE.Vector3(p.x, -p.y, 0)));

    // wave
    const wavePts = [];
    for (let i = 0; i <= 240; i++) {
      const z = (i / 240) * 5;
      wavePts.push(new THREE.Vector3(z, 0.55 * Math.exp(-a * z) * Math.cos(b * z), 0));
    }
    this.wave.geometry.setFromPoints(wavePts);

    // spiral
    const spiralPts = [];
    for (let i = 0; i <= 200; i++) {
      const z = (i / 200) * L;
      const th = 2 * b * z;
      const r = this.Z0 * Math.exp(-2 * a * z);
      spiralPts.push(new THREE.Vector3(z, r * Math.cos(th) * 0.02, r * Math.sin(th) * 0.02));
    }
    this.spiral.geometry.setFromPoints(spiralPts);

    // marker at end of spiral
    const zEnd = L;
    const thEnd = 2 * b * zEnd;
    const rEnd = this.Z0 * Math.exp(-2 * a * zEnd);
    this.marker.position.set(zEnd, rEnd * Math.cos(thEnd) * 0.02, rEnd * Math.sin(thEnd) * 0.02);

    // HUD
    const zin = this.Z0 * Math.exp(-2 * a * L) * Math.cos(2 * b * L);
    setHud('Lossy line', '\\gamma=\\alpha+j\\beta,\\quad V(z)=V_0 e^{-\\alpha z}', [
      { k: 'alpha', v: a.toFixed(3) + ' Np/m' },
      { k: 'beta', v: b.toFixed(2) + ' rad/m' },
      { k: 'Z_in', v: zin.toFixed(1) + ' \u03a9' }
    ]);

    // chart
    const ctx = chartEl.getContext('2d');
    const W = chartEl.width, H = chartEl.height;
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);

    // envelope plot (left half)
    const pad = 30;
    const plotW = W * 0.55 - pad;
    const plotH = H - 2 * pad;
    ctx.strokeStyle = '#2a3a55';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad, pad);
    ctx.lineTo(pad, H - pad);
    ctx.lineTo(W * 0.55 - pad, H - pad);
    ctx.stroke();

    ctx.strokeStyle = '#7fd1ff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 100; i++) {
      const z = (i / 100) * 5;
      const y = 0.55 * Math.exp(-a * z);
      const px = pad + (z / 5) * plotW;
      const py = H - pad - (y / 0.55) * plotH;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.strokeStyle = '#ffb347';
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const z = (i / 200) * 5;
      const y = 0.55 * Math.exp(-a * z) * Math.cos(b * z);
      const px = pad + (z / 5) * plotW;
      const py = H - pad - (y / 0.55) * plotH;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = '#9fb3d1';
    ctx.font = '12px monospace';
    ctx.fillText('V(z) envelope', pad, pad - 8);

    // impedance spiral (right half)
    const cx = W * 0.55 + pad + (W * 0.45 - 2 * pad) / 2;
    const cy = H / 2;
    const R = Math.min(W * 0.45 - 2 * pad, H - 2 * pad) / 2;
    ctx.strokeStyle = '#2a3a55';
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#ff6b9d';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const z = (i / 200) * L;
      const th = 2 * b * z;
      const r = this.Z0 * Math.exp(-2 * a * z);
      const px = cx + (r / this.Z0) * R * Math.cos(th);
      const py = cy - (r / this.Z0) * R * Math.sin(th);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = '#9fb3d1';
    ctx.fillText('Z_in spiral', cx - 40, pad - 8);
  },
  tick(dt) {
    this.group.rotation.y += dt * 0.15;
  },
  lesson: String.raw`A lossy transmission line has propagation constant $\gamma=\alpha+j\beta$. The attenuation constant $\alpha$ (Np/m) comes from conductor and dielectric loss, while the phase constant $\beta$ (rad/m) sets the wavelength $\lambda=2\pi/\beta$. A wave decays as $V(z)=V_0 e^{-\alpha z}$ and its phase rotates by $\beta z$. The characteristic impedance is complex, $Z_0=R_0+jX_0$, and the input impedance spirals in the complex plane as the line length grows: $Z_{in}(L)=Z_0\tanh(\gamma L)$ for a terminated line. Larger $\alpha$ shrinks the spiral radius, while larger $\beta$ tightens the spiral pitch. This is dispersion plus loss: the signal both attenuates and changes phase.`,
  quiz: [
    { q: 'Which parameter controls how quickly the wave amplitude decays with distance?', options: ['beta', 'alpha', 'length', 'Z_0'], answer: 1 },
    { q: 'As line length increases, the input impedance in the complex plane:', options: ['moves in a straight line', 'spirals inward', 'stays fixed', 'spirals outward'], answer: 1 }
  ]
});
/* === UI CONTROLLER === */

let active = null;
const listEl = document.getElementById('moduleList');
const controlsEl = document.getElementById('controls');
const lessonEl = document.getElementById('lesson');
const quizEl = document.getElementById('quiz');

function buildControls(mod) {
  controlsEl.innerHTML = '';
  for (const c of mod.controls) {
    const wrap = document.createElement('div');
    wrap.className = 'ctrl';
    const label = document.createElement('label');
    label.textContent = c.label;
    wrap.appendChild(label);
    let input;
    if (c.type === 'range') {
      input = document.createElement('input');
      input.type = 'range';
      input.min = c.min; input.max = c.max; input.step = c.step; input.value = c.value;
      input.addEventListener('input', () => {
        mod.state[c.id] = parseFloat(input.value);
        mod.update();
      });
    } else if (c.type === 'select') {
      input = document.createElement('select');
      for (const o of c.options) {
        const opt = document.createElement('option');
        opt.value = (typeof o === 'object' && o !== null) ? o.value : o;
        opt.textContent = (typeof o === 'object' && o !== null) ? (o.label ?? o.value) : o;
        input.appendChild(opt);
      }
      input.value = c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.value;
        mod.update();
      });
    } else if (c.type === 'check') {
      input = document.createElement('input');
      input.type = 'checkbox';
      input.checked = !!c.value;
      input.addEventListener('change', () => {
        mod.state[c.id] = input.checked;
        mod.update();
      });
    }
    wrap.appendChild(input);
    controlsEl.appendChild(wrap);
  }
}

function buildQuiz(mod) {
  quizEl.innerHTML = '';
  for (const item of mod.quiz) {
    const q = document.createElement('div');
    q.className = 'q';
    q.textContent = item.q;
    const opts = document.createElement('div');
    opts.className = 'opts';
    item.options.forEach((opt, i) => {
      const b = document.createElement('button');
      b.textContent = opt;
      b.addEventListener('click', () => {
        if (i === item.answer) b.classList.add('correct');
        else b.classList.add('wrong');
      });
      opts.appendChild(b);
    });
    q.appendChild(opts);
    quizEl.appendChild(q);
  }
}

function loadModule(mod) {
  active = mod;
  controls.target.set(0, 0, 0);
  if (Number.isNaN(camera.position.x)) camera.position.set(6, 5, 8);
  content.clear();
  mod.state = mod.state || {};
  for (const c of mod.controls) {
    if (!(c.id in mod.state)) {
      mod.state[c.id] = c.type === 'range' ? parseFloat(c.value) : (c.type === 'check' ? !!c.value : c.value);
    }
  }
  mod.build();
  mod.update();
  lessonEl.innerHTML = mod.lesson;
  renderTex(lessonEl, KATEX_OPTS);
  buildControls(mod);
  buildQuiz(mod);
  listEl.querySelectorAll('li').forEach(li => li.classList.toggle('active', li.dataset.id === mod.id));
}

for (const mod of modules) {
  const li = document.createElement('li');
  li.textContent = mod.title;
  li.dataset.id = mod.id;
  li.addEventListener('click', () => loadModule(mod));
  listEl.appendChild(li);
}
if (modules.length) loadModule(modules[0]);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

let last = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (active && typeof active.tick === 'function') {
    try { active.tick(dt); } catch (e) { console.error('tick error:', e); active.tick = null; }
  }
  controls.update();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);
</script>
